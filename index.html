<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<style>
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --border: #e5e2d9;
    --border-strong: #d3cfc2;
    --text: #2c2c2a;
    --text-muted: #77766f;
    --accent: #1a1a18;
    --land-default: #f1efe8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .hidden { display: none !important; }

  /* --- Login gate --- */
  #login-gate-backdrop { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; align-items: center; justify-content: center; }
  #login-gate-backdrop.hidden { display: none; }
  #login-gate-box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 30px; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
  #login-gate-box h2 { margin: 0 0 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-align: center; color: var(--text); }
  .login-gate-field { margin-bottom: 14px; }
  .login-gate-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .login-gate-field input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; font-family: inherit;
  }
  #login-gate-error, #login-gate-pw-error { color: #a3312a; font-size: 12.5px; min-height: 16px; margin: 2px 0 12px; }
  #login-gate-submit, #login-gate-pw-submit {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  #login-gate-submit:hover, #login-gate-pw-submit:hover { background: #000000; }
  #login-gate-pw-fields.hidden { display: none; }
  #login-gate-pw-intro { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin: 0 0 16px; }

  /* --- App shell --- */
  #app { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }
  #app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  #app-title { font-size: 19px; font-weight: 700; margin: 0; }
  #app-header-actions { display: flex; align-items: center; gap: 10px; }
  #cloud-status { font-size: 11.5px; color: var(--text-muted); }
  .header-btn {
    border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .header-btn:hover { background: var(--land-default); }

  #tasks-subnav { display: flex; gap: 6px; margin-bottom: 16px; }
  .tasks-subnav-btn {
    border: 1px solid var(--border); background: #fff; color: var(--text-muted); border-radius: 7px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .tasks-subnav-btn:hover { background: var(--land-default); color: var(--text); }
  .tasks-subnav-btn.active { background: var(--text); border-color: var(--text); color: #fff; }

  /* --- Tasks table --- */
  #tasks-table { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .tasks-col-name, .tasks-col-status, .tasks-col-date, .tasks-col-assignee { position: relative; }
  .tasks-fill-handle {
    display: none;
    position: absolute;
    right: 3px;
    bottom: 4px;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border: 1px solid #ffffff;
    box-shadow: 0 0 0 1px var(--accent);
    border-radius: 2px;
    cursor: crosshair;
    z-index: 5;
  }
  .tasks-name-input:focus ~ .tasks-fill-handle,
  .tasks-status-select:focus ~ .tasks-fill-handle,
  .tasks-date-input:focus ~ .tasks-fill-handle,
  .tasks-assignee-input:focus ~ .tasks-fill-handle,
  .tasks-fill-handle.dragging {
    display: block;
  }
  .tasks-fill-target { box-shadow: inset 0 0 0 2px var(--accent); background: rgba(90,53,194,0.08); }
  body.tasks-fill-active { user-select: none; }

  .tasks-header-row, .tasks-row {
    display: grid;
    grid-template-columns: minmax(240px, 2.4fr) 150px 130px 130px 200px 140px 90px;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  .tasks-header-row { background: var(--land-default); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .tasks-row:last-child { border-bottom: none; }
  .tasks-row:hover { background: #fbfaf7; }

  .tasks-col-name { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .tasks-toggle { border: none; background: none; cursor: pointer; font-size: 10px; color: var(--text-muted); width: 16px; flex-shrink: 0; }
  .tasks-toggle.empty { visibility: hidden; }
  .tasks-row-icon { flex-shrink: 0; font-size: 13px; }
  .tasks-name-input {
    border: none; background: transparent; font-size: 13.5px; color: var(--text); flex: 1 1 0; min-width: 0; padding: 4px 4px; border-radius: 4px;
  }
  .tasks-name-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tasks-name-top { font-weight: 700; }
  .tasks-comments-btn {
    position: relative; border: none; background: transparent; cursor: pointer; font-size: 12px; line-height: 1; padding: 4px 5px; border-radius: 6px; flex-shrink: 0; opacity: 0.28;
  }
  .tasks-comments-btn:hover { opacity: 0.75; background: var(--land-default); }
  .tasks-comments-btn.has-comments { opacity: 1; background: #eef2fb; }
  .tasks-comments-count {
    position: absolute; top: -4px; right: -4px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; border-radius: 8px; min-width: 13px; height: 13px; line-height: 13px; text-align: center; padding: 0 2px;
  }

  .tasks-status-select { border: none; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; }
  .tasks-date-input { border: none; background: transparent; font-size: 12.5px; color: var(--text); width: 100%; padding: 6px 4px; border-radius: 4px; }
  .tasks-date-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tasks-assignee-input { border: none; background: transparent; font-size: 12.5px; color: var(--text); width: 100%; padding: 6px 4px; border-radius: 4px; }
  .tasks-assignee-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tasks-rowtype-select { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 5px 6px; font-size: 11.5px; width: 100%; }
  .tasks-row-actions { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .tasks-row-actions button { border: none; background: transparent; cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 5px; color: var(--text-muted); }
  .tasks-row-actions button:hover { background: var(--land-default); color: var(--text); }
  .tasks-row-actions .tasks-delete-btn:hover { background: #fcebeb; color: #a3312a; }
  .tasks-row input[type="checkbox"].tasks-select-checkbox { margin-right: 8px; accent-color: var(--accent); }

  #tasks-footer { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
  #tasks-add-btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  #tasks-add-btn:hover { background: var(--land-default); }
  #tasks-bulk-bar { display: none; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); }
  #tasks-bulk-bar.visible { display: flex; }
  #tasks-bulk-delete { border: 1px solid #a3312a; background: #fff; color: #a3312a; border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  #tasks-bulk-delete:hover { background: #fcebeb; }

  #tasks-late-list { display: flex; flex-direction: column; gap: 8px; }
  .tasks-late-row {
    display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; font-size: 13px; border-left: 3px solid #a3312a;
  }
  .tasks-late-info { flex: 1 1 0; min-width: 0; }
  .tasks-late-parent { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .tasks-late-name { color: var(--text); }
  .tasks-late-meta { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
  #tasks-late-empty { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }

  /* --- Task comments modal --- */
  #task-comments-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #task-comments-modal-backdrop.hidden { display: none; }
  #task-comments-modal { background: #fff; border-radius: 12px; width: 560px; max-width: 92vw; max-height: 84vh; min-height: 380px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  #task-comments-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); gap: 12px; }
  #task-comments-modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #task-comments-modal-close { background: transparent; border: none; font-size: 15px; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; }
  #task-comments-modal-close:hover { background: var(--land-default); color: var(--text); }
  #task-comments-modal-body { padding: 16px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 220px; max-height: 50vh; display: flex; flex-direction: column; gap: 12px; }
  .tc-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .tc-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tc-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .tc-block-meta { font-size: 11px; color: var(--text-muted); }
  .tc-block-delete { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
  .tc-block-delete:hover { background: #fcebeb; color: #a3312a; }
  .tc-text-body { font-size: 13.5px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .tc-checklist-title-input { width: 100%; border: none; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--text); padding: 4px 2px; margin-bottom: 8px; border-radius: 4px; }
  .tc-checklist-title-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tc-checklist-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .tc-checklist-item input[type="checkbox"] { flex-shrink: 0; accent-color: var(--accent); width: 15px; height: 15px; }
  .tc-checklist-item-text { font-size: 13px; color: var(--text); flex: 1 1 0; }
  .tc-checklist-item.done .tc-checklist-item-text { color: var(--text-muted); text-decoration: line-through; }
  .tc-checklist-item-delete { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; opacity: 0.5; }
  .tc-checklist-item-delete:hover { opacity: 1; background: #fcebeb; color: #a3312a; }
  .tc-checklist-add-row { display: flex; gap: 6px; margin-top: 6px; }
  .tc-checklist-add-row input { flex: 1 1 0; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; font-family: inherit; }
  .tc-checklist-add-row button { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 6px 11px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .tc-checklist-add-row button:hover { background: var(--land-default); }
  #task-comments-composer { border-top: 1px solid var(--border); padding: 14px 18px 16px; flex-shrink: 0; }
  #tc-text-input { width: 100%; min-height: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; font-family: inherit; resize: vertical; margin-bottom: 8px; }
  #task-comments-composer-actions { display: flex; gap: 8px; }
  #tc-add-text-btn, #tc-add-checklist-btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  #tc-add-text-btn:hover, #tc-add-checklist-btn:hover { background: var(--land-default); }

  /* --- Settings (login/password only) --- */
  #settings-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; max-width: 560px; }
  #settings-panel h2 { font-size: 15px; margin: 0 0 16px; }
  #settings-panel h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 22px 0 10px; }
  #settings-panel h3:first-of-type { margin-top: 0; }
  .settings-field { margin-bottom: 12px; }
  .settings-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .settings-field input, .settings-field select { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .settings-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .settings-btn:hover { background: var(--land-default); }
  .settings-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .settings-btn.primary:hover { background: #000000; }
  #settings-users-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  .settings-user-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .settings-user-row input { flex: 1 1 0; min-width: 0; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; }
  .settings-user-row select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; flex-shrink: 0; }
  .settings-user-row button { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 5px; flex-shrink: 0; }
  .settings-user-row button:hover { background: #fcebeb; color: #a3312a; }
  #settings-msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div id="login-gate-backdrop">
  <div id="login-gate-box">
    <div id="login-gate-login-fields">
      <div class="login-gate-field">
        <label for="login-gate-username">Usuário</label>
        <input type="text" id="login-gate-username" autocomplete="username">
      </div>
      <div class="login-gate-field">
        <label for="login-gate-password">Senha</label>
        <input type="password" id="login-gate-password" autocomplete="current-password">
      </div>
      <div id="login-gate-error"></div>
      <button id="login-gate-submit" type="button">Entrar</button>
    </div>
    <div id="login-gate-pw-fields" class="hidden">
      <p id="login-gate-pw-intro">Essa senha é provisória. Defina uma nova senha só sua pra continuar.</p>
      <div class="login-gate-field">
        <label for="login-gate-new-password">Nova senha</label>
        <input type="password" id="login-gate-new-password">
      </div>
      <div class="login-gate-field">
        <label for="login-gate-new-password-confirm">Confirmar nova senha</label>
        <input type="password" id="login-gate-new-password-confirm">
      </div>
      <div id="login-gate-pw-error"></div>
      <button id="login-gate-pw-submit" type="button">Definir senha</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="app-header">
    <h1 id="app-title">Tasks</h1>
    <div id="app-header-actions">
      <span id="cloud-status"></span>
      <button class="header-btn" id="nav-settings-btn" type="button">Settings</button>
      <button class="header-btn" id="logout-btn" type="button">Sair</button>
    </div>
  </div>

  <div id="tasks-view">
    <div id="tasks-subnav">
      <button class="tasks-subnav-btn active" id="tasks-nav-list" type="button">Lista</button>
      <button class="tasks-subnav-btn" id="tasks-nav-late" type="button">Atrasadas</button>
    </div>

    <div id="tasks-table">
      <div class="tasks-header-row">
        <div>Nome</div>
        <div>Tipo</div>
        <div>Status</div>
        <div>Início</div>
        <div>Fim</div>
        <div>Responsáveis</div>
        <div></div>
      </div>
      <div id="tasks-table-body"></div>
    </div>

    <div id="tasks-late-view" class="hidden">
      <div id="tasks-late-list"></div>
    </div>

    <div id="tasks-footer">
      <button id="tasks-add-btn" type="button">+ Nova task</button>
      <div id="tasks-bulk-bar">
        <span id="tasks-bulk-count"></span>
        <button id="tasks-bulk-delete" type="button">Excluir selecionadas</button>
      </div>
    </div>
  </div>

  <div id="settings-view" class="hidden">
    <div id="settings-panel">
      <h2>Settings</h2>

      <h3>Minha senha</h3>
      <div class="settings-field">
        <label for="settings-my-new-password">Nova senha</label>
        <input type="password" id="settings-my-new-password">
      </div>
      <button class="settings-btn primary" id="settings-change-my-password-btn" type="button">Salvar nova senha</button>

      <div id="settings-admin-section" class="hidden">
        <h3>Usuários</h3>
        <div id="settings-users-list"></div>
        <button class="settings-btn" id="settings-add-user-btn" type="button">+ Novo usuário</button>
      </div>

      <div id="settings-msg"></div>
    </div>
  </div>
</div>

<div id="task-comments-modal-backdrop" class="hidden">
  <div id="task-comments-modal">
    <div id="task-comments-modal-header">
      <h3 id="task-comments-modal-title"></h3>
      <button id="task-comments-modal-close" type="button">✕</button>
    </div>
    <div id="task-comments-modal-body"></div>
    <div id="task-comments-composer">
      <textarea id="tc-text-input" placeholder="Escreva um comentário..."></textarea>
      <div id="task-comments-composer-actions">
        <button id="tc-add-text-btn" type="button">+ Comentário</button>
        <button id="tc-add-checklist-btn" type="button">+ Checklist</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// SUPABASE — fill these in with YOUR new project's values
// (Settings → API in your Supabase dashboard)
// ══════════════════════════════════════════════════════════
const SUPABASE_URL = "https://ersknlnoeixddjczqlki.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyc2tubG5vZWl4ZGRqY3pxbGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODk5OTcsImV4cCI6MjEwMTk2NTk5N30.2n72bIMTpYpe49MJsclYEWB6njEwg0z0zP_CFkl2jtI";
const SUPABASE_TABLE_URL = `${SUPABASE_URL}/rest/v1/wpf_dashboard_data`;
const SUPABASE_HEADERS = {
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
  "Content-Type": "application/json"
};
const CLOUD_SECTIONS = ["tasks", "users"];

const TASKS_STORAGE_KEY = "tasks_std_data";
const USERS_STORAGE_KEY = "tasks_std_users";
const REVISION_KEY = "tasks_std_revision";

const TASK_STATUS_OPTIONS = ["Not Started", "In Progress", "Late", "Done", "On Hold", "Cancelled"];
const TASK_STATUS_COLORS = {
  "Not Started": { bg: "#f1efe8", text: "#444441" },
  "In Progress": { bg: "#e6f1fb", text: "#0c447c" },
  "Late":        { bg: "#fcebeb", text: "#791f1f" },
  "Done":        { bg: "#eaf3de", text: "#173404" },
  "On Hold":     { bg: "#fdf3d6", text: "#7a5b06" },
  "Cancelled":   { bg: "#efefec", text: "#6b6a63" }
};
const ROW_TYPE_ICONS = { goal: "🎯", milestone: "🚩", task: "✅" };
const ROW_TYPE_LABELS = { goal: "Goal", milestone: "Milestone", task: "Task" };

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}/${m}/${y}`;
}

// --- Seed data ---
const TASKS_SEED = [
  { id: "t-1", name: "Exemplo de Goal", rowType: "goal", status: "In Progress", startDate: "", endDate: "", assignees: [], comments: [], subtasks: [
    { id: "t-1-1", name: "Exemplo de Milestone", rowType: "milestone", status: "In Progress", startDate: "", endDate: "", assignees: [], comments: [], subtasks: [
      { id: "t-1-1-1", name: "Exemplo de Task", rowType: "task", status: "Not Started", startDate: "", endDate: todayISO(), assignees: ["Você"], comments: [], subtasks: [] }
    ]}
  ]}
];
const USERS_SEED = [
  { username: "karina", login: "karina", password: "nossaempresa", role: "adm", mustChangePassword: true }
];

function ensureTaskDefaults(t, depth) {
  depth = depth || 0;
  t.id = t.id || ("t-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7));
  t.name = t.name || "";
  if (t.rowType !== "goal" && t.rowType !== "milestone" && t.rowType !== "task") {
    t.rowType = depth > 0 ? "task" : "milestone";
  }
  if (!TASK_STATUS_OPTIONS.includes(t.status)) t.status = "Not Started";
  if (t.startDate === undefined) t.startDate = "";
  if (t.endDate === undefined) t.endDate = "";
  if (!Array.isArray(t.assignees)) t.assignees = [];
  if (!Array.isArray(t.comments)) t.comments = [];
  if (!Array.isArray(t.subtasks)) t.subtasks = [];
  t.subtasks.forEach(sub => ensureTaskDefaults(sub, depth + 1));
  return t;
}

let tasksData = [];
try {
  const stored = JSON.parse(localStorage.getItem(TASKS_STORAGE_KEY) || "null");
  tasksData = (Array.isArray(stored) && stored.length) ? stored : TASKS_SEED.map(t => JSON.parse(JSON.stringify(t)));
} catch (e) {
  tasksData = TASKS_SEED.map(t => JSON.parse(JSON.stringify(t)));
}
tasksData = tasksData.map(t => ensureTaskDefaults(t, 0));

function ensureUserDefaults(u) {
  return { ...u, login: u.login || u.username, mustChangePassword: !!u.mustChangePassword };
}
let usersList = [];
try {
  const stored = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || "null");
  usersList = (Array.isArray(stored) && stored.length) ? stored : USERS_SEED.map(u => ({ ...u }));
} catch (e) {
  usersList = USERS_SEED.map(u => ({ ...u }));
}
usersList = usersList.map(ensureUserDefaults);

let currentUser = null;
function isAdm() { return !!currentUser && currentUser.role === "adm"; }

let localRevision = parseInt(localStorage.getItem(REVISION_KEY) || "0", 10) || 0;
function bumpLocalRevision() { localRevision++; localStorage.setItem(REVISION_KEY, String(localRevision)); return localRevision; }

function saveTasksData() {
  localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasksData));
  bumpLocalRevision();
  scheduleCloudSave();
}
function saveUsersList() {
  localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(usersList));

}

// --- Cloud sync (Supabase) ---
let cloudSyncTimer = null;
let cloudUsersLoaded = false;
let initialCloudLoadPromise = null;

function setCloudStatus(state) {
  const el = document.getElementById("cloud-status");
  if (!el) return;
  const labels = { loading: "☁️ Carregando…", saving: "☁️ Salvando…", synced: "☁️ Sincronizado", error: "⚠️ Só salvo neste navegador" };
  const colors = { loading: "#77766f", saving: "#8a6d1f", synced: "#0f6e56", error: "#a3312a" };
  el.textContent = labels[state] || "";
  el.style.color = colors[state] || "";
}

function scheduleCloudSave() {
  clearTimeout(cloudSyncTimer);
  setCloudStatus("saving");
  cloudSyncTimer = setTimeout(() => {
    pushAllSectionsToCloud().then(() => setCloudStatus("synced")).catch(err => {
      console.warn("Cloud save failed:", err);
      setCloudStatus("error");
    });
  }, 800);
}

async function pushAllSectionsToCloud() {
  const rows = [
    { section: "tasks", data: tasksData, revision: localRevision, updated_at: new Date().toISOString() },
    { section: "users", data: usersList, revision: localRevision, updated_at: new Date().toISOString() }
  ];
  const res = await fetch(SUPABASE_TABLE_URL, {
    method: "POST",
    headers: { ...SUPABASE_HEADERS, "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(rows)
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    throw new Error(`HTTP ${res.status}${detail ? " — " + detail.slice(0, 200) : ""}`);
  }
}

async function loadFromCloud() {
  setCloudStatus("loading");
  try {
    const res = await fetch(`${SUPABASE_TABLE_URL}?section=in.(tasks,users)&select=*`, { headers: SUPABASE_HEADERS });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    const cloudRevision = rows.reduce((max, r) => Math.max(max, r.revision || 0), 0);
    if (cloudRevision > localRevision) {
      rows.forEach(r => {
        if (r.section === "tasks" && Array.isArray(r.data)) tasksData = r.data.map(t => ensureTaskDefaults(t, 0));
        if (r.section === "users" && Array.isArray(r.data) && r.data.length) usersList = r.data.map(ensureUserDefaults);
      });
      localRevision = cloudRevision;
      localStorage.setItem(REVISION_KEY, String(localRevision));
      localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasksData));
      localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(usersList));
    } else if (localRevision > cloudRevision) {
      await pushAllSectionsToCloud();
    }
    setCloudStatus("synced");
  } catch (err) {
    console.warn("Cloud load failed, using local data:", err);
    setCloudStatus("error");
  }
  cloudUsersLoaded = true;
  if (typeof renderTasksTable === "function") renderTasksTable();
  if (typeof renderSettingsUsersList === "function") renderSettingsUsersList();
}
initialCloudLoadPromise = loadFromCloud();

function hideLoginGate() {
  document.getElementById("login-gate-backdrop").classList.add("hidden");

}
let pendingPasswordChangeUsername = null;

async function attemptLogin() {
  const login = document.getElementById("login-gate-username").value.trim();
  const password = document.getElementById("login-gate-password").value;
  if (!cloudUsersLoaded) {
    document.getElementById("login-gate-error").textContent = "Carregando dados… um instante.";
    await initialCloudLoadPromise.catch(() => {});
  }
  const match = usersList.find(u => (u.login || u.username || "").toLowerCase() === login.toLowerCase() && u.password === password);
  if (!match) {
    document.getElementById("login-gate-error").textContent = "Usuário ou senha incorretos.";
    return;
  }
  if (match.mustChangePassword) {
    pendingPasswordChangeUsername = match.username;
    document.getElementById("login-gate-login-fields").classList.add("hidden");
    document.getElementById("login-gate-pw-fields").classList.remove("hidden");
    document.getElementById("login-gate-pw-error").textContent = "";
    document.getElementById("login-gate-new-password").value = "";
    document.getElementById("login-gate-new-password-confirm").value = "";
    document.getElementById("login-gate-new-password").focus();
    return;
  }
  currentUser = { username: match.username, role: match.role };
  hideLoginGate();
  afterLogin();
}

function submitPasswordChange() {
  const pw1 = document.getElementById("login-gate-new-password").value;
  const pw2 = document.getElementById("login-gate-new-password-confirm").value;
  const errEl = document.getElementById("login-gate-pw-error");
  if (!pw1 || pw1.length < 4) { errEl.textContent = "A senha precisa ter pelo menos 4 caracteres."; return; }
  if (pw1 !== pw2) { errEl.textContent = "As senhas não coincidem."; return; }
  const u = usersList.find(x => x.username === pendingPasswordChangeUsername);
  if (!u) { errEl.textContent = "Sessão expirada — tenta entrar de novo."; return; }
  u.password = pw1;
  u.mustChangePassword = false;
  saveUsersList();
  currentUser = { username: u.username, role: u.role };
  hideLoginGate();
  afterLogin();
}

// --- Tasks: find/walk helpers ---
function findTaskById(list, id) {
  for (const t of list) {
    if (t.id === id) return t;
    const found = findTaskById(t.subtasks, id);
    if (found) return found;
  }
  return null;
}
function findParentTaskName(id) {
  function search(list, parentName) {
    for (const t of list) {
      if (t.id === id) return parentName;
      const found = search(t.subtasks, t.name);
      if (found !== undefined) return found;
    }
    return undefined;
  }
  return search(tasksData, null) || null;
}
function removeTaskById(list, id) {
  const idx = list.findIndex(t => t.id === id);
  if (idx !== -1) { list.splice(idx, 1); return true; }
  for (const t of list) {
    if (removeTaskById(t.subtasks, id)) return true;
  }
  return false;
}
function walkAllTasks(list, fn) {
  list.forEach(t => { fn(t); walkAllTasks(t.subtasks, fn); });
}

// Overdue = not Done/Cancelled, has an end date in the past. Auto-flips
// status to "Late" (mirrors the big dashboard's behavior) unless it's
// already Done/Cancelled/On Hold.
function autoSyncLateStatuses() {
  const today = todayISO();
  let changed = false;
  walkAllTasks(tasksData, t => {
    const overdue = t.endDate && t.endDate < today && t.status !== "Done" && t.status !== "Cancelled" && t.status !== "On Hold";
    if (overdue && t.status !== "Late") { t.status = "Late"; changed = true; }
  });
  if (changed) { localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasksData)); }
}

// --- Fill handle: click a cell (name/status/dates/assignees) to select it,
// then drag the little square at its corner up or down to copy that one
// value onto every row the drag passes over — like a spreadsheet's autofill.
let tasksFill = null; // { field, value, startIndex, ids } while a drag is in progress

function tasksFlatRowIds() {
  return [...document.querySelectorAll("#tasks-table-body .tasks-row")].map(el => el.dataset.id);
}
function tasksClearFillPreview() {
  document.querySelectorAll(".tasks-fill-target").forEach(el => el.classList.remove("tasks-fill-target"));
}
function tasksFindFieldCell(rowEl, field) {
  const input = rowEl.querySelector(`[data-field="${field}"]`);
  return input ? input.closest(".tasks-row > div") : null;
}
function wireFillHandles(body) {
  body.querySelectorAll(".tasks-fill-handle").forEach(handle => {
    handle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const ids = tasksFlatRowIds();
      const startIndex = ids.indexOf(handle.dataset.id);
      const t = findTaskById(tasksData, handle.dataset.id);
      if (startIndex === -1 || !t) return;
      const raw = t[handle.dataset.field];
      tasksFill = { field: handle.dataset.field, value: Array.isArray(raw) ? [...raw] : raw, startIndex, ids };
      handle.classList.add("dragging");
      document.body.classList.add("tasks-fill-active");
    });
  });
}
document.addEventListener("mousemove", (e) => {
  if (!tasksFill) return;
  tasksClearFillPreview();
  const rowEl = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tasks-row");
  if (!rowEl) return;
  const targetIndex = tasksFill.ids.indexOf(rowEl.dataset.id);
  if (targetIndex === -1) return;
  const [from, to] = targetIndex > tasksFill.startIndex
    ? [tasksFill.startIndex + 1, targetIndex]
    : [targetIndex, tasksFill.startIndex - 1];
  if (from > to) return;
  const rows = [...document.querySelectorAll("#tasks-table-body .tasks-row")];
  for (let i = from; i <= to; i++) {
    const cell = tasksFindFieldCell(rows[i], tasksFill.field);
    if (cell) cell.classList.add("tasks-fill-target");
  }
});
document.addEventListener("mouseup", (e) => {
  if (!tasksFill) return;
  const { field, value, startIndex, ids } = tasksFill;
  const rowEl = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tasks-row");
  tasksClearFillPreview();
  document.querySelectorAll(".tasks-fill-handle.dragging").forEach(h => h.classList.remove("dragging"));
  document.body.classList.remove("tasks-fill-active");
  tasksFill = null;
  if (!rowEl) return;
  const targetIndex = ids.indexOf(rowEl.dataset.id);
  if (targetIndex === -1 || targetIndex === startIndex) return;
  const [from, to] = targetIndex > startIndex ? [startIndex + 1, targetIndex] : [targetIndex, startIndex - 1];
  if (from > to) return;
  for (let i = from; i <= to; i++) {
    const t = findTaskById(tasksData, ids[i]);
    if (t) t[field] = Array.isArray(value) ? [...value] : value;
  }
  saveTasksData();
  renderTasksTable();
});

// --- Late view ---
function getAllOverdueTasks() {
  const today = todayISO();
  const list = [];
  function isOverdue(t) { return t.status !== "Done" && t.status !== "Cancelled" && t.endDate && t.endDate < today; }
  function walk(items) {
    items.forEach(t => {
      if (t.rowType === "task" && isOverdue(t)) list.push(t);
      walk(t.subtasks);
    });
  }
  walk(tasksData);
  return list.sort((a, b) => (a.endDate < b.endDate ? -1 : 1));
}
function renderTasksLateView() {
  const items = getAllOverdueTasks();
  const el = document.getElementById("tasks-late-list");
  if (!items.length) { el.innerHTML = `<div id="tasks-late-empty">Nenhuma task atrasada 🎉</div>`; return; }
  el.innerHTML = items.map(t => {
    const parentName = findParentTaskName(t.id);
    const assignees = (t.assignees || []).join(", ");
    return `<div class="tasks-late-row">
      ${ROW_TYPE_ICONS[t.rowType] || ""}
      <div class="tasks-late-info">
        ${parentName ? `<div class="tasks-late-parent">↳ ${esc(parentName)}</div>` : ""}
        <div class="tasks-late-name">${esc(t.name)}</div>
      </div>
      ${assignees ? `<span class="tasks-late-meta">${esc(assignees)}</span>` : ""}
      <span class="tasks-late-meta">Venceu em ${formatDate(t.endDate)}</span>
    </div>`;
  }).join("");
}

function tcRenderBlock(comment) {
  const when = comment.at ? new Date(comment.at).toLocaleString("pt-BR") : "";
  const who = comment.author || "—";
  if (comment.type === "text") {
    return `<div class="tc-block" data-cid="${comment.id}">
      <div class="tc-block-head">
        <span class="tc-block-meta">${esc(who)} · ${esc(when)}</span>
        <button class="tc-block-delete" data-cid="${comment.id}" title="Excluir">🗑</button>
      </div>
      <div class="tc-text-body">${esc(comment.text)}</div>
    </div>`;
  }
  const doneCount = comment.items.filter(i => i.done).length;
  return `<div class="tc-block" data-cid="${comment.id}">
    <div class="tc-block-head">
      <span class="tc-block-meta">${esc(who)} · ${esc(when)} · ${doneCount}/${comment.items.length}</span>
      <button class="tc-block-delete" data-cid="${comment.id}" title="Excluir checklist">🗑</button>
    </div>
    <input class="tc-checklist-title-input" data-cid="${comment.id}" value="${escAttr(comment.title || "Checklist")}">
    <div class="tc-checklist-items">
      ${comment.items.map(item => `
        <div class="tc-checklist-item ${item.done ? "done" : ""}">
          <input type="checkbox" class="tc-checklist-checkbox" data-cid="${comment.id}" data-iid="${item.id}" ${item.done ? "checked" : ""}>
          <span class="tc-checklist-item-text">${esc(item.text)}</span>
          <button class="tc-checklist-item-delete" data-cid="${comment.id}" data-iid="${item.id}" title="Excluir item">✕</button>
        </div>
      `).join("")}
    </div>
    <div class="tc-checklist-add-row">
      <input type="text" class="tc-checklist-new-item" data-cid="${comment.id}" placeholder="Novo item...">
      <button class="tc-checklist-add-item-btn" data-cid="${comment.id}" type="button">+ Item</button>
    </div>
  </div>`;
}
function renderTaskCommentsModalBody() {
  const t = findTaskById(tasksData, tcCurrentTaskId);
  const body = document.getElementById("task-comments-modal-body");
  if (!t) { body.innerHTML = ""; return; }
  body.innerHTML = t.comments.length ? t.comments.map(c => tcRenderBlock(c)).join("") : `<div class="tc-empty">Nenhum comentário ainda.</div>`;
}
function tcSaveAndRefresh() {
  saveTasksData();
  renderTaskCommentsModalBody();
  renderTasksTable();
}
document.getElementById("tc-add-text-btn").addEventListener("click", () => {
  const input = document.getElementById("tc-text-input");
  const text = input.value.trim();
  if (!text) return;
  const t = findTaskById(tasksData, tcCurrentTaskId);
  if (!t) return;
  t.comments.push({ id: "cmt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), type: "text", text, author: currentUser ? currentUser.username : "—", at: new Date().toISOString() });
  input.value = "";
  tcSaveAndRefresh();
});
document.getElementById("tc-add-checklist-btn").addEventListener("click", () => {
  const t = findTaskById(tasksData, tcCurrentTaskId);
  if (!t) return;
  t.comments.push({ id: "cmt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), type: "checklist", title: "Checklist", items: [], author: currentUser ? currentUser.username : "—", at: new Date().toISOString() });
  tcSaveAndRefresh();
});
document.getElementById("task-comments-modal-body").addEventListener("click", e => {
  const t = findTaskById(tasksData, tcCurrentTaskId);
  if (!t) return;
  const delBlockBtn = e.target.closest(".tc-block-delete");
  if (delBlockBtn) { t.comments = t.comments.filter(c => c.id !== delBlockBtn.dataset.cid); tcSaveAndRefresh(); return; }
  const delItemBtn = e.target.closest(".tc-checklist-item-delete");
  if (delItemBtn) {
    const c = t.comments.find(c => c.id === delItemBtn.dataset.cid);
    if (c) c.items = c.items.filter(i => i.id !== delItemBtn.dataset.iid);
    tcSaveAndRefresh(); return;
  }
  const addItemBtn = e.target.closest(".tc-checklist-add-item-btn");
  if (addItemBtn) {
    const cid = addItemBtn.dataset.cid;
    const inputEl = document.querySelector(`.tc-checklist-new-item[data-cid="${cid}"]`);
    const text = inputEl ? inputEl.value.trim() : "";
    if (!text) return;
    const c = t.comments.find(c => c.id === cid);
    if (c) c.items.push({ id: "item-" + Date.now() + "-" + Math.random().toString(36).slice(2, 5), text, done: false });
    tcSaveAndRefresh();
  }
});
document.getElementById("task-comments-modal-body").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("tc-checklist-new-item")) {
    e.preventDefault();
    const btn = document.querySelector(`.tc-checklist-add-item-btn[data-cid="${e.target.dataset.cid}"]`);
    if (btn) btn.click();
  }
});
document.getElementById("task-comments-modal-body").addEventListener("change", e => {
  const t = findTaskById(tasksData, tcCurrentTaskId);
  if (!t) return;
  if (e.target.classList.contains("tc-checklist-checkbox")) {
    const c = t.comments.find(c => c.id === e.target.dataset.cid);
    const item = c && c.items.find(i => i.id === e.target.dataset.iid);
    if (item) item.done = e.target.checked;
    tcSaveAndRefresh();
  } else if (e.target.classList.contains("tc-checklist-title-input")) {
    const c = t.comments.find(c => c.id === e.target.dataset.cid);
    if (c) c.title = e.target.value;
    tcSaveAndRefresh();
  }
});

// --- Settings: users (login/password only — no permission checkboxes) ---
function renderSettingsUsersList() {
  const el = document.getElementById("settings-users-list");
  if (!el) return;
  el.innerHTML = usersList.map(u => `
    <div class="settings-user-row" data-username="${escAttr(u.username)}">
      <input type="text" class="settings-user-login" value="${escAttr(u.login || u.username)}" placeholder="login">
      <input type="text" class="settings-user-password" value="${escAttr(u.password || "")}" placeholder="senha">
      <select class="settings-user-role">
        <option value="colab" ${u.role === "colab" ? "selected" : ""}>Colab</option>
        <option value="adm" ${u.role === "adm" ? "selected" : ""}>Adm</option>
      </select>
      <button class="settings-user-delete" title="Remover usuário" type="button">🗑</button>
    </div>
  `).join("");
  el.querySelectorAll(".settings-user-row").forEach(row => {
    const username = row.dataset.username;
    row.querySelector(".settings-user-login").addEventListener("change", e => {
      const u = usersList.find(x => x.username === username);
      if (u) { u.login = e.target.value.trim(); saveUsersList(); }
    });
    row.querySelector(".settings-user-password").addEventListener("change", e => {
      const u = usersList.find(x => x.username === username);
      if (u) { u.password = e.target.value; u.mustChangePassword = false; saveUsersList(); }
    });
    row.querySelector(".settings-user-role").addEventListener("change", e => {
      const u = usersList.find(x => x.username === username);
      if (u) { u.role = e.target.value; saveUsersList(); }
    });
    row.querySelector(".settings-user-delete").addEventListener("click", () => {
      if (usersList.length <= 1) { alert("Precisa manter pelo menos um usuário."); return; }
      if (!confirm(`Remover o usuário "${username}"?`)) return;
      usersList = usersList.filter(x => x.username !== username);
      saveUsersList();
      renderSettingsUsersList();
    });
  });
}
document.getElementById("settings-add-user-btn").addEventListener("click", () => {
  const login = prompt("Login do novo usuário:");
  if (!login) return;
  const username = login.trim().toLowerCase().replace(/\s+/g, "-") + "-" + Date.now().toString(36).slice(-4);
  usersList.push({ username, login: login.trim(), password: "trocar123", role: "colab", mustChangePassword: true });
  saveUsersList();
  renderSettingsUsersList();
  document.getElementById("settings-msg").textContent = `Usuário criado. Senha provisória: trocar123`;
});
document.getElementById("settings-change-my-password-btn").addEventListener("click", () => {
  const pw = document.getElementById("settings-my-new-password").value;
  const msgEl = document.getElementById("settings-msg");
  if (!pw || pw.length < 4) { msgEl.textContent = "A senha precisa ter pelo menos 4 caracteres."; msgEl.style.color = "#a3312a"; return; }
  const u = usersList.find(x => x.username === currentUser.username);
  if (!u) return;
  u.password = pw;
  u.mustChangePassword = false;
  saveUsersList();
  document.getElementById("settings-my-new-password").value = "";
  msgEl.textContent = "Senha atualizada.";
  msgEl.style.color = "#0f6e56";
});
</script>
