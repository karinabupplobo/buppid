<!DOCTYPE html>
<!--
  LOGIN — porta de entrada da plataforma (index.html = página inicial)
  ====================================================================
  Login por e-mail e senha. Toda conta nasce com a senha padrão bupp2026
  (criada pelo gatilho `criar_conta_auth` assim que o e-mail é preenchido na
  aba Usuários) e a coluna `usuarios.senha_provisoria` marcada — o primeiro
  acesso obriga a trocar antes de liberar a dash.

  Depois de entrar, vai pra dash do papel (tabela `usuarios`, coluna `papel`):

    aluno         -> aluno.html
    teacher       -> plataforma.html
    interno       -> interna.html
    gestor        -> manager.html
    aluno_gestor  -> aluno.html (o selo lá troca pra manager)

  Só entra quem já está cadastrado em `usuarios` com e-mail. Não há
  auto-cadastro: a conta de login nasce do cadastro na aba Usuários, nunca
  de alguém digitando um e-mail aqui.

  Os formulários públicos (nova-turma.html, nivel-test.html) ficam de fora
  do login de propósito: são preenchidos por quem ainda não tem conta.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp Idiomas — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-escuro: #54402F;
    --amarelo-neon: #A8D5F2;
    --limao-claro: #E4F1FA;
    --bg-dash: #F7F5F2;
    --azul-intermediario: #8A7767;
    --branco: #FFFFFF;
    --texto: #54402F;
    --cinza-texto: #8A7F76;
    --borda: #E7E1DA;
    --erro: #B3423C;
    --ok: #2E7D46;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; min-height:100vh; background: var(--teal-escuro);
    font-family:'Inter',system-ui,sans-serif; color: var(--texto); }
  body{ display:flex; align-items:center; justify-content:center; padding: 24px; }
  .caixa{ width:100%; max-width: 380px; }
  .logo{ display:flex; justify-content:center; margin-bottom: 22px; }
  .logo img{ height: 54px; width:auto; }
  .card{ background: var(--branco); border-radius: 14px; padding: 26px 24px; }
  h1{ font-size: 17px; font-weight: 800; margin: 0 0 6px; }
  .sub{ font-size: 13px; color: var(--cinza-texto); line-height:1.5; margin: 0 0 18px; }
  label{ display:block; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
  input{
    width:100%; border:1px solid var(--borda); border-radius: 8px; padding: 11px 12px;
    font-family:inherit; font-size: 14px; color: var(--texto); background: var(--branco);
  }
  input:focus{ outline: 2px solid var(--amarelo-neon); border-color: var(--azul-intermediario); }
  button{
    width:100%; margin-top: 14px; background: var(--teal-escuro); color:#fff; border:none;
    border-radius: 9px; padding: 12px; font-family:inherit; font-weight: 800; font-size: 14px; cursor:pointer;
  }
  button:hover{ background: var(--azul-intermediario); }
  button:disabled{ opacity:.55; cursor:not-allowed; }
  #msg{ font-size: 12.5px; font-weight: 600; line-height:1.5; margin-top: 12px; }
  #msg.erro{ color: var(--erro); }
  #msg.ok{ color: var(--ok); }
  .rodape{ text-align:center; font-size: 11.5px; color: rgba(255,255,255,.6); margin-top: 16px; }
</style>
</head>
<body>

<div class="caixa">
  <div class="logo"><img src="assets/logo-bupp-marrom-azul-claro.png" alt="Bupp Idiomas"></div>

  <div class="card">
    <h1 id="titulo">Entrar</h1>
    <p class="sub" id="sub">Use o e-mail cadastrado na Bupp.</p>

    <div id="form-area">
      <label for="f-email">E-mail</label>
      <input id="f-email" type="email" autocomplete="email" placeholder="seu@empresa.com.br">
      <div style="height:12px"></div>
      <label for="f-senha">Senha</label>
      <input id="f-senha" type="password" autocomplete="current-password" placeholder="sua senha">
      <button type="button" id="btn-entrar">Entrar</button>
    </div>

    <div id="troca-area" style="display:none;">
      <label for="f-nova">Nova senha</label>
      <input id="f-nova" type="password" autocomplete="new-password" placeholder="mínimo 8 caracteres">
      <div style="height:12px"></div>
      <label for="f-nova2">Repita a nova senha</label>
      <input id="f-nova2" type="password" autocomplete="new-password">
      <button type="button" id="btn-trocar">Salvar e entrar</button>
    </div>

    <div id="msg"></div>
  </div>

  <div class="rodape">Bupp Idiomas</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gajvcgrfljyxgahzfjfp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhanZjZ3JmbGp5eGdhaHpmamZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTMxMjcsImV4cCI6MjEwMjgyOTEyN30.e2vNn_QaPCyra2w842VPBncEN6nc7d8tSx68EQ1u-xA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Onde cada papel entra. Mantido junto ao guarda-de-rota das dashes
// (auth-guard.js) — mudar aqui exige mudar lá.
const DESTINO = {
  aluno: "aluno.html",
  aluno_gestor: "aluno.html",
  teacher: "plataforma.html",
  interno: "interna.html",
  gestor: "manager.html"
};

const msg = document.getElementById("msg");
function aviso(texto, tipo){ msg.textContent = texto; msg.className = tipo || ""; }

// Consulta pelo cliente do Supabase, não por fetch com a chave anônima:
// desde que as regras de acesso entraram (RLS), a chave anônima não lê
// `usuarios` — só o próprio registro do usuário logado. O cliente manda o
// token da sessão automaticamente. Por isso esta função só funciona DEPOIS
// do login, nunca antes.
async function usuarioLogado(authUserId){
  // Filtra pelo id da sessão, não só `limit(1)`: quem é da Bupp enxerga
  // todos os usuários, então sem o filtro viria a primeira linha da tabela
  // em vez do próprio registro.
  const { data, error } = await sb
    .from("usuarios")
    .select("id,nome,papel,senha_provisoria")
    .eq("auth_user_id", authUserId)
    .limit(1);
  if (error) throw new Error(error.message);
  return (data && data[0]) || null;
}

// Guardado entre entrar e trocar a senha: depois da troca é ele que diz
// pra onde ir, sem precisar consultar de novo.
let usuarioAtual = null;

function entrarNaDash(u){
  document.getElementById("form-area").style.display = "none";
  document.getElementById("troca-area").style.display = "none";
  aviso(`Entrando como ${u.nome}...`, "ok");
  location.replace(DESTINO[u.papel] || "aluno.html");
}

function pedirNovaSenha(u){
  usuarioAtual = u;
  document.getElementById("form-area").style.display = "none";
  document.getElementById("troca-area").style.display = "block";
  document.getElementById("titulo").textContent = "Crie sua senha";
  document.getElementById("sub").textContent = "Você entrou com a senha padrão. Escolha uma senha só sua para continuar.";
  aviso("");
  document.getElementById("f-nova").focus();
}

// Sessão que sobrou de antes: não faz sentido pedir login de novo. Mas se
// a senha ainda for a provisória, a troca continua obrigatória.
async function redirecionarSeLogado(){
  const { data } = await sb.auth.getSession();
  const sessao = data && data.session;
  if (!sessao) return false;
  const u = await usuarioLogado(sessao.user.id);
  if (!u){
    await sb.auth.signOut();
    aviso("Esse e-mail não está cadastrado na plataforma. Fale com a Bupp.", "erro");
    return false;
  }
  if (u.senha_provisoria){ pedirNovaSenha(u); return true; }
  entrarNaDash(u);
  return true;
}

document.getElementById("btn-entrar").onclick = async () => {
  const email = document.getElementById("f-email").value.trim().toLowerCase();
  const senha = document.getElementById("f-senha").value;
  const btn = document.getElementById("btn-entrar");
  if (!email || !senha){ aviso("Preencha e-mail e senha.", "erro"); return; }

  btn.disabled = true;
  aviso("Entrando...", "");
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error){
      // Mensagem única pros dois casos (e-mail inexistente e senha errada):
      // dizer qual dos dois errou entrega quem tem conta na plataforma.
      aviso("E-mail ou senha incorretos.", "erro");
      btn.disabled = false; return;
    }
    const u = await usuarioLogado(data.user.id);
    if (!u){
      await sb.auth.signOut();
      aviso("Esse e-mail não está cadastrado na plataforma. Fale com a Bupp.", "erro");
      btn.disabled = false; return;
    }
    if (u.senha_provisoria) return pedirNovaSenha(u);
    entrarNaDash(u);
  } catch(err){
    aviso("Não deu para entrar: " + (err.message || err), "erro");
    btn.disabled = false;
  }
};

document.getElementById("btn-trocar").onclick = async () => {
  const nova = document.getElementById("f-nova").value;
  const nova2 = document.getElementById("f-nova2").value;
  const btn = document.getElementById("btn-trocar");
  if (nova.length < 8){ aviso("A senha precisa ter pelo menos 8 caracteres.", "erro"); return; }
  if (nova !== nova2){ aviso("As duas senhas não são iguais.", "erro"); return; }
  if (nova === "bupp2026"){ aviso("Escolha uma senha diferente da padrão.", "erro"); return; }

  btn.disabled = true;
  aviso("Salvando...", "");
  try{
    const { error } = await sb.auth.updateUser({ password: nova });
    if (error) throw error;
    // Só depois da senha trocar de fato é que a marca sai — se gravasse
    // antes e a troca falhasse, a pessoa ficaria com a senha padrão sem
    // ser mais avisada.
    const r = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id=eq.${usuarioAtual.id}`, {
      method: "PATCH",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ senha_provisoria: false })
    });
    if (!r.ok) throw new Error(await r.text());
    entrarNaDash(usuarioAtual);
  } catch(err){
    aviso("Não deu para salvar a senha: " + (err.message || err), "erro");
    btn.disabled = false;
  }
};

document.getElementById("f-senha").onkeydown = e => {
  if (e.key === "Enter") document.getElementById("btn-entrar").click();
};
document.getElementById("f-email").onkeydown = e => {
  if (e.key === "Enter") document.getElementById("f-senha").focus();
};
document.getElementById("f-nova2").onkeydown = e => {
  if (e.key === "Enter") document.getElementById("btn-trocar").click();
};

redirecionarSeLogado();
</script>
</body>
</html>
