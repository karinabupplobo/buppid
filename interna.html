<!DOCTYPE html>
<!--
  DASH INTERNA DA BUPP
  ====================
  Mesma linguagem visual da plataforma do professor (plataforma.html), mesmo
  arquivo de dados (dados-mock.js). A diferença é o QUE se vê:

    · o professor vê as turmas dele;
    · a dash interna vê TODOS os professores, TODAS as turmas, TODAS as aulas,
      e as ANOTAÇÕES INTERNAS por aluno — que nem o aluno nem o RH do cliente
      têm acesso.

  A tela central é uma PLANILHA: uma linha por aluno por aula, com presença,
  engajamento, desempenho na trilha e a anotação do professor. Filtros por
  professor, empresa e busca livre, mais exportação em CSV.

  Selo de papel: "internal" (ver regra de idioma em docs/plataforma.md).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp — Interna</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* COMB 2 — MARROM #54402F + AZUL-BEBÊ #A8D5F2 + branco.
       Comb 1 (limão + cinza): git checkout comb-1-limao-cinza
       Comb 3 (cinza + azul):  git checkout comb-3-cinza-azul

       Azul-bebê é acento de PREENCHIMENTO: sobre branco tem 1,56:1, nunca
       é texto. Texto sobre azul é sempre o marrom (6,3:1).
       O fundo da página é levemente quente, para acompanhar o marrom. */
    --teal-escuro: #54402F;         /* cor escura: marrom */
    --amarelo-neon: #A8D5F2;        /* acento: azul-bebê */
    --limao-claro: #E4F1FA;         /* azul lavado, para fundos suaves */
    --bg-dash: #F7F5F2;             /* fundo levemente quente */
    --azul-intermediario: #8A7767;  /* apoio: marrom claro */
    --branco: #FFFFFF;
    --texto: #54402F;
    --cinza-texto: #8A7F76;
    --borda: #E7E1DA;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: rgba(60,110,120,0.45); }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-dash);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Topo ===== */
  /* Faixa do logo em teal — devolve ao logo a aplicação padrão do manual
     (limão sobre teal escuro), sem perder a sidebar branca. */
  /* Faixa de topo: largura total, logo ao centro, aplicação padrão do
     manual — limão sobre teal escuro. */
  /* O PNG foi recortado nas margens brancas, então a borda esquerda da imagem
     é a borda esquerda do "b" — alinha com o nome do professor abaixo. */
  .logo{ display: block; width: 118px; height: auto; flex-shrink: 0; }

  /* Sidebar inteira em marrom: logo, usuário e abas sobre fundo escuro.
     Voltar ao topo marrom com abas claras:
     git checkout v-20260821-1415-ANTES-sidebar-toda-marrom */
  .topo-sidebar{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,.14);
  }

  /* Nome do usuário. REGRA DE IDIOMA (21/08): a plataforma inteira é em
     português — abas, botões, rótulos — para os quatro papéis. As únicas
     exceções são a saudação "Hi, Nome" e o selo de papel, que ficam em inglês
     como aceno ao produto. Todo o resto: português.

     Selos por papel:
       professor      -> teacher
       aluno          -> student
       RH do cliente  -> manager
       equipe Bupp    -> internal                                             */
  .whoami{
    font-size: 11.5px; color: rgba(255,255,255,.7); font-weight: 500;
    line-height: 1.3; text-align: right; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  }
  .whoami strong{
    color: #fff; display: block; font-weight: 700; font-size: 13px;
    letter-spacing: -0.01em;
  }
  .whoami span{
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--teal-escuro);
    background: var(--amarelo-neon); padding: 2px 7px; border-radius: 999px;
  }

  /* Link pequeno "N turmas", logo abaixo do selo do usuário */
  .link-turmas{
    background: none; border: none; padding: 2px 0 0; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--azul-intermediario); white-space: nowrap;
  }
  .link-turmas{ color: rgba(255,255,255,.72); }
  .link-turmas b{ font-weight: 800; color: #fff; }
  .link-turmas:hover{ color: #fff; text-decoration: underline; }

  /* item de turma no pop-up */
  .turma-item{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #fafbf7; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: background .13s, border-color .13s;
  }
  .turma-item:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .ti-esq{ display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ti-nome{ font-size: 13.5px; font-weight: 700; color: var(--texto); }
  .ti-meta{ font-size: 11.5px; color: var(--cinza-texto); }
  .ti-dir{ display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ti-grade{ font-size: 11.5px; font-weight: 700; color: var(--azul-intermediario); white-space: nowrap; }

  /* ===== Abas: sobre a sidebar escura ===== */
  .tabs{
    display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.08); border: 1px solid transparent;
    color: rgba(255,255,255,.78);
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 10px 14px; border-radius: 9px;
    transition: background .14s, color .14s;
  }
  .tab:hover{ background: rgba(255,255,255,.16); color: #fff; }
  .tab.active{
    background: var(--amarelo-neon); border-color: var(--amarelo-neon);
    color: var(--teal-escuro);
    box-shadow: none;
  }
  .tab-grupo{
    flex-shrink: 0; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: rgba(255,255,255,.4);
    padding: 12px 14px 2px; white-space: nowrap;
  }

  /* ===== Conteúdo ===== */
  main{ padding: 18px 18px 60px; }
  .pane{ display: none; }
  .pane.active{ display: block; }

  .card{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 14px; padding: 18px;
    margin-bottom: 14px; color: var(--texto);
  }
  .card-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--azul-intermediario); margin-bottom: 8px;
  }
  .card h2{ margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card p{ margin: 0; font-size: 13.5px; color: var(--cinza-texto); line-height: 1.5; }

  .btn{
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; margin-top: 14px; border: none; border-radius: 10px;
    background: var(--teal-escuro); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .btn:hover{ background: var(--azul-intermediario); color: #fff; }
  .btn.lime{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .btn.ghost{
    background: transparent; color: var(--azul-intermediario);
    border: 1.5px solid var(--borda); font-weight: 600;
  }

  .pill{
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .section-title{
    color: var(--teal-escuro); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; margin: 4px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before{
    content: ""; width: 14px; height: 3px; border-radius: 2px;
    background: var(--amarelo-neon); flex-shrink: 0;
  }

  /* ===== Trilha & performance ===== */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #5a635f; padding: 9px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .switch button.active{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .switch button:hover:not(.active){ color: var(--teal-escuro); }

  .grid-wrap{ overflow-x: auto; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 4px; }
  table{ border-collapse: collapse; width: 100%; font-size: 12.5px; color: var(--texto); }
  th, td{ padding: 10px 8px; text-align: center; white-space: nowrap; }
  th{
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--azul-intermediario);
    border-bottom: 1.5px solid var(--borda);
  }
  td.aluno-nome, th.aluno-nome{
    text-align: left; position: sticky; left: 0; background: var(--branco);
    font-weight: 600; padding-left: 12px;
  }
  tbody tr{ border-bottom: 1px solid #f2f4f0; cursor: pointer; }
  tbody tr:last-child{ border-bottom: none; }
  tbody tr:hover td{ background: #fafbf7; }
  tbody tr:hover td.aluno-nome{ background: #fafbf7; }

  .st{ display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; }
  .st.ok{ background: #dff0d8; color: #3f6b45; }
  .st.err{ background: #fbe0de; color: #a3312a; }
  .st.pend{ background: #eef0ec; color: #9aa39f; }
  .nota{ font-weight: 800; }
  .nota.alta{ color: #3f6b45; }
  .nota.media{ color: #8a6d1f; }
  .nota.baixa{ color: #a3312a; }

  /* Perfil do aluno */
  .aluno-lista .card{ display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .aluno-lista .card:hover{ outline: 2px solid var(--amarelo-neon); }
  .aluno-lista h3{ margin: 0; font-size: 15.5px; font-weight: 700; }
  .aluno-lista .sub{ font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }
  .barra{ height: 6px; border-radius: 3px; background: #eef0ec; overflow: hidden; margin-top: 9px; }
  .barra i{ display: block; height: 100%; background: var(--azul-intermediario); }

  .voltar{
    background: none; border: none; color: var(--azul-intermediario); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 0 12px;
  }
  .kv{ display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f4f0; font-size: 13.5px; }
  .kv:last-child{ border-bottom: none; }
  .kv span:first-child{ color: var(--cinza-texto); }
  .kv span:last-child{ font-weight: 700; }

  /* ===== Linhas expansíveis do resumo ===== */
  .exp{ border-bottom: 1px solid #f2f4f0; }
  .exp:last-child{ border-bottom: none; }
  .exp-cab{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 11px 0; text-align: left; transition: color .13s;
  }
  .exp-rot{ font-size: 13.5px; color: var(--cinza-texto); }
  .exp-cab:hover .exp-rot{ color: var(--texto); }
  .exp-val{
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .seta{
    width: 7px; height: 7px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario);
    transform: rotate(45deg) translate(-1px,-1px); transition: transform .18s;
  }
  .exp.aberta .seta{ transform: rotate(-135deg) translate(-2px,-2px); }
  .exp-corpo{ display: none; padding: 2px 0 12px; }
  .exp.aberta .exp-corpo{ display: block; }

  .mini{
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; background: #fafbf7; border-radius: 8px; margin-bottom: 6px;
  }
  .mini:last-child{ margin-bottom: 0; }
  .mini b{ font-size: 13px; font-weight: 700; color: var(--texto); }
  .mini span{ font-size: 12px; color: var(--cinza-texto); line-height: 1.45; }
  .mini.obj{ flex-direction: row; gap: 8px; align-items: flex-start; }
  .mini.obj b{ color: var(--azul-intermediario); flex-shrink: 0; }

  .mini.linha-acao{ flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .trilha-linha .tl-topo{ display: flex; align-items: center; justify-content: space-between; }
  .trilha-linha .tl-bolas{ display: flex; gap: 4px; margin: 6px 0 3px; flex-wrap: wrap; }
  .trilha-linha .tl-sub{ font-size: 11px; }

  .estrelas{ display: flex; gap: 2px; }
  .estrela{
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 17px; line-height: 1; color: #d8dcd2; transition: color .12s, transform .12s;
  }
  .estrela:hover{ transform: scale(1.15); }
  .estrela.on{ color: var(--amarelo-neon); text-shadow: 0 0 1px var(--azul-intermediario); }

  /* Aula e pontos de atenção num card só: retângulo horizontal no desktop,
     vertical no celular. */
  .par{ margin-bottom: 16px; }
  .card.unico{ padding: 0; overflow: hidden; margin-bottom: 0; }
  .lado-aula{ padding: 18px; }
  .lado-pontos{ padding: 18px; border-top: 1px solid var(--borda); background: #fcfcfa; }

  /* aula do dia / histórico */
  .aula-topo{
    display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
    flex-wrap: wrap; min-width: 0;
  }
  .aula-topo .pill{ white-space: nowrap; margin-bottom: 0; flex-shrink: 0; }
  .aula-topo .ident{ margin-bottom: 0; }

  /* ===== Chip do resumo da turma ===== */

  /* ===== Vocabulário e alertas ===== */
  .vocs{ display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
  .tagv{
    font-size: 12.5px; font-weight: 600; color: var(--teal-escuro);
    background: var(--limao-claro); padding: 5px 10px; border-radius: 7px;
  }

  .aluno-alerta{
    width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-alerta:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .aluno-alerta .an{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--texto);
  }
  .seta-r{
    width: 5px; height: 5px; border-right: 2px solid var(--azul-intermediario);
    border-top: 2px solid var(--azul-intermediario); transform: rotate(45deg);
  }
  .ats{ display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-al{
    font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
  }
  .tag-al.vermelho{ background: #fbe0de; color: #a3312a; }
  .tag-al.ambar{ background: #fbf0d8; color: #8a6d1f; }
  .tag-al.lavanda{ background: #ece9f0; color: var(--azul-intermediario); }

  /* ===== Pop-up ===== */
  .modal{
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(24,16,26,0.5);
  }
  .modal.on{ display: flex; }
  .modal-cx{
    background: var(--branco); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(24,16,26,0.3);
  }
  .modal-topo{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 20px 20px 14px; border-bottom: 1px solid var(--borda);
  }
  .modal-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 3px;
  }
  .modal-topo h3{ margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--texto); }
  .modal-x{
    background: none; border: none; cursor: pointer; font-size: 24px; line-height: 1;
    color: var(--cinza-texto); padding: 0 2px; flex-shrink: 0;
  }
  .modal-x:hover{ color: var(--texto); }
  .modal-corpo{ padding: 16px 20px 22px; overflow-y: auto; }
  .modal-corpo .bloco{ margin-bottom: 18px; }
  .modal-corpo .bloco:last-child{ margin-bottom: 0; }
  .modal-corpo .bt{
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 8px;
  }

  /* linha do tempo do aluno */
  .ev{
    border-left: 3px solid var(--borda); padding: 0 0 14px 13px; position: relative;
  }
  .ev:last-child{ padding-bottom: 0; }
  .ev.pendente{ border-left-color: var(--amarelo-neon); }
  .ev-topo{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .ev-data{ font-size: 11px; font-weight: 800; color: var(--azul-intermediario); letter-spacing: .04em; }
  .ev-de{ font-size: 11px; font-weight: 700; color: var(--cinza-texto); }
  .ev-txt{ font-size: 13.5px; color: var(--texto); line-height: 1.5; }
  .ev.pendente .ev-txt{
    background: var(--limao-claro); padding: 8px 10px; border-radius: 8px; font-weight: 500;
  }
  .selo-pend{
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    background: var(--amarelo-neon); color: var(--teal-escuro);
    padding: 3px 7px; border-radius: 999px;
  }
  /* botão de aluno no resumo da turma */
  .aluno-link{
    width: 100%; display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 11px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-link:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .al-nome{
    display: flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .al-cargo{ font-size: 12px; color: var(--cinza-texto); }
  .aluno-link .tag-al{ margin-top: 4px; }

  /* números consolidados da ficha */
  .nums{
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px;
  }
  .num{
    background: #fafbf7; border-radius: 10px; padding: 11px 10px;
    display: flex; flex-direction: column; gap: 1px; text-align: center;
  }
  .nv{ font-size: 20px; font-weight: 800; color: var(--texto); letter-spacing: -0.02em; }
  .nv.alta{ color: #3f6b45; } .nv.media{ color: #8a6d1f; } .nv.baixa{ color: #a3312a; }
  .nr{ font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--azul-intermediario); }
  .nd{ font-size: 10.5px; color: var(--cinza-texto); }
  .pres-rot{ font-size: 12px; color: var(--cinza-texto); }

  .voltar-turma{
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--azul-intermediario);
    padding: 0 0 12px;
  }
  .voltar-turma:hover{ color: var(--teal-escuro); }

  /* Identificação da aula: Empresa · Nível · Dia · Horário · [+] */
  .ident{
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    margin-bottom: 9px; font-size: 12px; min-width: 0;
  }
  .id-emp{
    font-weight: 800; color: var(--teal-escuro); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-turma{
    font-weight: 600; color: var(--cinza-texto); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-niv{
    font-size: 10px; font-weight: 800; letter-spacing: .06em; flex-shrink: 0;
    background: var(--limao-claro); color: var(--teal-escuro);
    padding: 2px 7px; border-radius: 999px;
  }
  /* identificação dentro do card de trilha */
  .ident-tr{ margin: 2px 0 1px; font-size: 11.5px; }
  .id-dia, .id-hora{
    font-weight: 700; color: var(--cinza-texto); white-space: nowrap; flex-shrink: 0;
  }
  .id-hora{ color: var(--azul-intermediario); }
  .id-mais{
    flex-shrink: 0;

     sincronia. Quando o index for aposentado, o conteúdo migra para cá e
     estas três abas passam a ser nativas. */
  .pane.emb{ padding: 0; }
  .pane.emb.active{ display: flex; flex-direction: column; }
  /* A tabela de Tasks do crm.html vira modo cartão abaixo de ~1140px de

  @media (min-width: 900px){

    .pane.emb .emb-frame{ border-radius: 0; border-left: none; border-right: none; }

  table.ra-tabela th{
    background: #faf9f7; color: var(--azul-intermediario);
    font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    padding: 10px 12px; text-align: left; white-space: nowrap;

    padding: 11px 12px; border-bottom: 1px solid #f4f2f0;

  }
  table.ra-tabela tbody tr:last-child td{ border-bottom: none; }

  /* Alinhamento por CLASSE, não por posição: as tabelas de Média, Usuários e
     Docs têm número de colunas diferente, e alinhar por nth-child fazia o
     cabeçalho e o valor caírem em lados opostos. */
  table.ra-tabela th.col-num, table.ra-tabela td.col-num{ text-align: right; }
  table.ra-tabela th:first-child, table.ra-tabela td:first-child{ text-align: left; }

<script>
// ══════════════════════════════════════════════════════════
//  LINHAS DA PLANILHA
//  Uma linha por ALUNO por AULA JÁ DADA. É o menor grão que existe: tudo o
//  que o professor registra acontece nesse cruzamento.
// ══════════════════════════════════════════════════════════
function partesIdent(t){
  const jaTem = t.nome.toLowerCase().startsWith(t.empresa.toLowerCase());
  const resto = jaTem ? t.nome.slice(t.empresa.length).replace(/^\s*[—\-·]\s*/, "") : t.nome;
  return { empresa: t.empresa, turma: resto, nivel: t.nivel };
}

// ── Onde o aluno errou nesta trilha ──
// Cruza o resultado de cada lição com o TEMA daquela lição. Se o mesmo tema
// já tinha sido errado antes, marca como recorrente — é o sinal que separa
// "escorregou" de "não aprendeu".
function analisarErros(a, t, h){
  const st = (h.progresso && h.progresso[a.id]) || [];
  const temas = h.temas || [];
  const errouAgora = [];
  st.forEach((x, i) => {
    if (x === "err" && temas[i] && !errouAgora.includes(temas[i])) errouAgora.push(temas[i]);
  });
  if (!errouAgora.length){
    const naoFez = st.filter(x => x === "pend").length;
    if (naoFez === st.length && st.length) return [{ tema:"Não fez a trilha", vezes:0, tipo:"pend" }];
    return [];
  }

  // quantas vezes o aluno já errou cada tema, em todas as trilhas
  const contagem = {};
  (t.historico || []).forEach(hh => {
    const s2 = (hh.progresso && hh.progresso[a.id]) || [];
    (hh.temas || []).forEach((tema, i) => {
      if (s2[i] === "err") contagem[tema] = (contagem[tema] || 0) + 1;
    });
  });

  return errouAgora.map(tema => ({
    tema, vezes: contagem[tema] || 1,
    tipo: (contagem[tema] || 1) >= 2 ? "recorrente" : "isolado"
  })).sort((x, y) => y.vezes - x.vezes);
}

function montarLinhas(){
  const linhas = [];
  TURMAS.forEach(t => {
    const p = partesIdent(t);
    const prof = professorDe(t);
    (t.historico || []).forEach(h => {
      t.alunos.forEach(a => {
        const st   = (h.progresso && h.progresso[a.id]) || [];
        const feit = st.filter(x => x !== "pend").length;
        const acer = st.filter(x => x === "ok").length;
        const erro = st.filter(x => x === "err").length;
        const nota = st.length ? Math.round(acer / st.length * 100) : null;
        linhas.push({
          data: h.data, dia: h.dia || "", empresa: p.empresa, turma: p.turma,
          nivel: t.nivel, prof: prof.nome, aula: h.titulo,
          aluno: a.nome, cargo: a.cargo,
          presenca: (PRESENCA[h.id] || {})[a.id] || "",
          eng: (ENGAJAMENTO[h.id] || {})[a.id] || 0,
          licoes: st.length, feitas: feit, acertos: acer, erros: erro, nota,
          atencao: analisarErros(a, t, h),
          anot: (NOTAS_ALUNO[h.id] || {})[a.id] || "",
          alunoId: a.id, turmaId: t.id, aulaId: h.id
        });
      });
    });
  });
  const chave = d => { const [dd,mm] = (d||"").split("/"); return (mm||"") + (dd||""); };
  return linhas.sort((x,y) =>
    chave(y.data).localeCompare(chave(x.data)) || x.aluno.localeCompare(y.aluno));
}

const LINHAS = montarLinhas();

// ── Filtros ──
// ══════════════════════════════════════════════════════════
//  FILTRO ÚNICO
//  Um campo só, que reconhece a que categoria pertence o que se digita:
//  empresa, turma, aula, dia, aluno ou professor. Cada escolha vira um chip;
//  chips de categorias diferentes se somam (E), da mesma categoria são
//  alternativas (OU) — é o que se espera de "Sertrading e Tirolez".
// ══════════════════════════════════════════════════════════
const CATEGORIAS = [
  { k:"empresa",   rot:"Empresa",   campo: l => l.empresa },
  { k:"turma",     rot:"Turma",     campo: l => l.turma },
  { k:"aula",      rot:"Aula",      campo: l => l.aula },
  { k:"dia",       rot:"Dia",       campo: l => `${l.dia} ${l.data}`.trim() },
  { k:"aluno",     rot:"Aluno",     campo: l => l.aluno },
  { k:"professor", rot:"Professor", campo: l => l.prof }
];

// [{ k, rot, valor }]
const CHIPS = [];

function passaFiltrosBasicos(l){
  return CATEGORIAS.every(c => {
    const doTipo = CHIPS.filter(ch => ch.k === c.k);
    if (!doTipo.length) return true;
    return doTipo.some(ch => c.campo(l) === ch.valor);
  });
}

// ── Painel "+ Filtro": escolhe a categoria, depois os valores ──
let catAberta = null;

function abrirPainelFiltro(){
  catAberta = null;
  pintarPainel();
  document.getElementById("af-painel").classList.add("on");
}
function fecharPainelFiltro(){
  document.getElementById("af-painel").classList.remove("on");
  catAberta = null;
}

function contarValor(c, v){
  return LINHAS.filter(x =>
    c.campo(x) === v && passaFiltrosColuna(x) && passaChipsExceto(x, c.k)).length;
}

function passaChipsExceto(l, katual){
  return CATEGORIAS.every(c => {
    if (c.k === katual) return true;
    const doTipo = CHIPS.filter(ch => ch.k === c.k);
    if (!doTipo.length) return true;
    return doTipo.some(ch => c.campo(l) === ch.valor);
  });
}

function pintarPainel(){
  const p = document.getElementById("af-painel");

  // ── passo 1: escolher a categoria ──
  if (!catAberta){
    p.innerHTML = `
      <div class="af-tit">Filtrar por</div>
      ${CATEGORIAS.map(c => {
        const usados = CHIPS.filter(ch => ch.k === c.k).length;
        const total = new Set(LINHAS.map(l => c.campo(l)).filter(Boolean)).size;
        return `<button class="af-cat" data-k="${c.k}">
          <span class="af-rot">${c.rot}</span>
          <span class="af-n">${usados ? `${usados} de ${total}` : total}</span>
          <span class="af-seta"></span>
        </button>`;
      }).join("")}`;
    p.querySelectorAll(".af-cat").forEach(b => {
      b.onclick = e => { e.stopPropagation(); catAberta = b.dataset.k; pintarPainel(); };
    });
    return;
  }

  // ── passo 2: escolher os valores ──
  const c = CATEGORIAS.find(x => x.k === catAberta);
  const marcados = new Set(CHIPS.filter(ch => ch.k === c.k).map(ch => ch.valor));
  const vals = [...new Set(LINHAS.map(l => c.campo(l)).filter(Boolean))]
    .map(v => ({ v, n: contarValor(c, v) }))
    .filter(x => x.n || marcados.has(x.v))
    .sort((a,b) => b.n - a.n || a.v.localeCompare(b.v, "pt-BR", { numeric:true }));

  p.innerHTML = `
    <div class="af-topo">
      <button class="af-voltar" data-voltar>&lsaquo;</button>
      <span class="af-tit">${c.rot}</span>
    </div>
    <div class="af-busca-cx">
      <input class="af-busca" type="search" placeholder="Buscar ${c.rot.toLowerCase()}…">
    </div>
    <div class="af-lista">
      ${vals.map(x => `
        <label class="af-item">
          <input type="checkbox" value="${x.v.replace(/"/g,'&quot;')}" ${marcados.has(x.v) ? "checked" : ""}>
          <span class="af-val">${x.v}</span>
          <span class="af-n">${x.n}</span>
        </label>`).join("") || '<div class="af-vazio">Nada disponível com os filtros atuais</div>'}
    </div>
    <div class="af-rodape">
      <button class="af-ok" data-aplicar>Aplicar</button>
    </div>`;

  const busca = p.querySelector(".af-busca");
  busca.oninput = () => {
    const q = busca.value.trim().toLowerCase();
    p.querySelectorAll(".af-item").forEach(it => {
      it.style.display = it.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  };
  p.querySelector("[data-voltar]").onclick = e => { e.stopPropagation(); catAberta = null; pintarPainel(); };
  p.querySelector("[data-aplicar]").onclick = e => {
    e.stopPropagation();
    const escolhidos = [...p.querySelectorAll(".af-item input")].filter(i => i.checked).map(i => i.value);
    // troca os chips desta categoria pelos novos
    for (let i = CHIPS.length - 1; i >= 0; i--) if (CHIPS[i].k === c.k) CHIPS.splice(i, 1);
    escolhidos.forEach(v => CHIPS.push({ k:c.k, rot:c.rot, valor:v }));
    fecharPainelFiltro();
    renderChips();
    renderTabela();
  };
  setTimeout(() => busca.focus(), 30);
}

function renderChips(){
  const box = document.getElementById("chips-filtro");
  if (!CHIPS.length){ box.innerHTML = ""; return; }
  box.innerHTML = CHIPS.map((c, i) => `
    <span class="chip">
      <span class="chip-cat">${c.rot}</span>
      <span class="chip-val">${c.valor}</span>
      <button class="chip-x" data-i="${i}" aria-label="Remover">&times;</button>
    </span>`).join("") +
    `<button class="chip-limpar" id="chip-limpar">limpar tudo</button>`;

  box.querySelectorAll(".chip-x").forEach(b => {
    b.onclick = () => { CHIPS.splice(+b.dataset.i, 1); renderChips(); renderTabela(); };
  });
  document.getElementById("chip-limpar").onclick = () => {
    CHIPS.length = 0; renderChips(); renderTabela();
  };
}

function filtradas(){
  return LINHAS.filter(l => passaFiltrosBasicos(l) && passaFiltrosColuna(l));
}

function estrelasRO(n){
  if (!n) return '<span class="sem">–</span>';
  return `<span class="estrelas-ro">${"★".repeat(n)}<b>${"☆".repeat(3-n)}</b></span>`;
}
function classeNota(n){
  return n === null ? "" : n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";
}

// ══════════════════════════════════════════════════════════
//  COLUNAS E FILTRO POR CABEÇALHO
//  Cada título da planilha abre um menu com os valores daquela coluna.
//  `valores` devolve uma lista porque há coluna multivalorada (Atenção pode
//  ter mais de um tema na mesma linha) — a linha passa se QUALQUER valor dela
//  estiver marcado.
// ══════════════════════════════════════════════════════════
const COLUNAS = [
  { rot:"Data",             k:"data",     valores: l => [`${l.dia} ${l.data}`.trim()] },
  { rot:"Empresa",          k:"empresa",  valores: l => [l.empresa] },
  { rot:"Turma",            k:"turma",    valores: l => [l.turma] },
  { rot:"Nível",            k:"nivel",    valores: l => [nivelL(l.nivel)] },
  { rot:"Professor",        k:"prof",     valores: l => [l.prof] },
  { rot:"Aula",             k:"aula",     valores: l => [l.aula] },
  { rot:"Aluno",            k:"aluno",    valores: l => [l.aluno] },
  { rot:"Presença",         k:"presenca", valores: l => [l.presenca === "p" ? "Presente"
                                                       : l.presenca === "a" ? "Faltou" : "Não marcada"] },
  { rot:"Engaj.",           k:"eng",      valores: l => [l.eng ? `${l.eng} estrela${l.eng>1?"s":""}` : "Não avaliado"] },
  { rot:"Trilha",           k:"nota",     valores: l => [l.nota === null ? "Sem nota"
                                                       : l.nota >= 80 ? "80% ou mais"
                                                       : l.nota >= 60 ? "60 a 79%" : "Abaixo de 60%"] },
  { rot:"Certos",           k:"acertos",  valores: l => [String(l.acertos)] },
  { rot:"Erros",            k:"erros",    valores: l => [String(l.erros)] },
  { rot:"Atenção",          k:"atencao",  valores: l => l.atencao.length
                                                       ? l.atencao.map(x => x.tema) : ["Sem apontamento"] },
  { rot:"Anotação interna", k:"anot",     valores: l => [l.anot ? "Com anotação" : "Sem anotação"] }
];

// { chaveDaColuna: Set de valores marcados }  — coluna ausente = sem filtro
// { chaveDaColuna: Set de valores }  ou, para a coluna Data, { de, ate }
const FILTROS_COL = {};

// As datas do mock são "dd/mm" do ano corrente. Vira "aaaa-mm-dd" para o
// <input type=date> e para comparar.
const ANO_BASE = 2026;
function paraISO(ddmm){
  const [dd, mm] = String(ddmm || "").split("/");
  if (!dd || !mm) return "";
  return `${ANO_BASE}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
}
function isoDaLinha(l){ return paraISO(l.data); }

function passaFiltrosColuna(l){
  return COLUNAS.every(c => {
    const sel = FILTROS_COL[c.k];
    if (!sel) return true;
    if (c.k === "data"){
      const iso = isoDaLinha(l);
      if (sel.de && iso < sel.de) return false;
      if (sel.ate && iso > sel.ate) return false;
      return true;
    }
    if (!sel.size) return true;
    return c.valores(l).some(v => sel.has(v));
  });
}

// Valores possíveis de uma coluna, considerando os OUTROS filtros já aplicados
// (é o comportamento de planilha: a lista encolhe conforme você filtra).
function valoresDaColuna(c){
  const guarda = FILTROS_COL[c.k];
  delete FILTROS_COL[c.k];
  const base = LINHAS.filter(l => passaFiltrosBasicos(l) && passaFiltrosColuna(l));
  if (guarda) FILTROS_COL[c.k] = guarda;
  const set = new Set();
  base.forEach(l => c.valores(l).forEach(v => set.add(v)));
  return [...set].sort((a,b) => a.localeCompare(b, "pt-BR", { numeric:true }));
}

function abrirMenuColuna(c, th){
  fecharMenuColuna();
  const menu = document.createElement("div");
  menu.className = "menu-col";

  // ── Coluna Data: calendário de/até, com atalhos ──
  if (c.k === "data"){
    const f = FILTROS_COL.data || {};
    const todas = LINHAS.map(isoDaLinha).filter(Boolean).sort();
    const min = todas[0] || "", max = todas[todas.length-1] || "";
    menu.innerHTML = `
      <div class="mc-cab">Período</div>
      <div class="mc-datas">
        <label>De<input type="date" id="mc-de" min="${min}" max="${max}" value="${f.de || ""}"></label>
        <label>Até<input type="date" id="mc-ate" min="${min}" max="${max}" value="${f.ate || ""}"></label>
      </div>
      <div class="mc-atalhos">
        <button data-dias="7">7 dias</button>
        <button data-dias="30">30 dias</button>
        <button data-dias="0">Tudo</button>
      </div>
      <div class="mc-pe">
        <button class="mc-limpar" data-limpar>Limpar</button>
        <button class="mc-ok" data-aplicar>Aplicar</button>
      </div>`;
    th.appendChild(menu);

    const de = menu.querySelector("#mc-de"), ate = menu.querySelector("#mc-ate");
    menu.querySelectorAll("[data-dias]").forEach(b => {
      b.onclick = ev => {
        ev.stopPropagation();
        const dias = +b.dataset.dias;
        if (!dias){ de.value = ""; ate.value = ""; return; }
        const fim = new Date(max || Date.now());
        const ini = new Date(fim);
        ini.setDate(ini.getDate() - dias);
        de.value = ini.toISOString().slice(0,10);
        ate.value = fim.toISOString().slice(0,10);
      };
    });
    menu.querySelector("[data-limpar]").onclick = ev => {
      ev.stopPropagation();
      delete FILTROS_COL.data;
      fecharMenuColuna();
      renderTabela();
    };
    menu.querySelector("[data-aplicar]").onclick = ev => {
      ev.stopPropagation();
      if (!de.value && !ate.value) delete FILTROS_COL.data;
      else FILTROS_COL.data = { de: de.value, ate: ate.value };
      fecharMenuColuna();
      renderTabela();
    };
    menu.onclick = e => e.stopPropagation();
    return;
  }

  // ── Demais colunas: lista com marcação imediata ──
  const sel = FILTROS_COL[c.k];
  const vals = valoresDaColuna(c);
  const marcado = v => !sel || !sel.size || sel.has(v);

  menu.innerHTML = `
    <div class="mc-cab">${c.rot}</div>
    ${vals.length > 7 ? `<div class="mc-topo">
      <input class="mc-busca" type="search" placeholder="Buscar…"></div>` : ""}
    <div class="mc-lista">
      ${vals.map(v => `
        <button class="mc-item ${marcado(v) ? "on" : ""}" data-v="${v.replace(/"/g,'&quot;')}">
          <span class="mc-check"></span>
          <span class="mc-val">${v}</span>
        </button>`).join("") || '<div class="mc-vazio">Nada para filtrar</div>'}
    </div>
    <div class="mc-pe">
      <button class="mc-limpar" data-limpar>Mostrar tudo</button>
      <button class="mc-so" data-so>Só os marcados</button>
    </div>`;
  th.appendChild(menu);

  const busca = menu.querySelector(".mc-busca");
  if (busca){
    busca.oninput = () => {
      const q = busca.value.trim().toLowerCase();
      menu.querySelectorAll(".mc-item").forEach(it => {
        it.style.display = it.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    };
    setTimeout(() => busca.focus(), 30);
  }

  // clicar num valor aplica na hora — sem botão de confirmar
  menu.querySelectorAll(".mc-item").forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const atual = FILTROS_COL[c.k] ? new Set(FILTROS_COL[c.k]) : new Set(vals);
      const v = b.dataset.v;
      if (atual.has(v)) atual.delete(v); else atual.add(v);
      if (!atual.size || atual.size === vals.length) delete FILTROS_COL[c.k];
      else FILTROS_COL[c.k] = atual;
      b.classList.toggle("on");
      renderTabela();
      const novoTh = document.querySelector(`.th-btn[data-col="${c.k}"]`);
      if (novoTh) abrirMenuColuna(c, novoTh.parentElement);
    };
  });

  menu.querySelector("[data-limpar]").onclick = ev => {
    ev.stopPropagation();
    delete FILTROS_COL[c.k];
    fecharMenuColuna();
    renderTabela();
  };
  menu.querySelector("[data-so]").onclick = ev => {
    ev.stopPropagation();
    const visiveis = [...menu.querySelectorAll(".mc-item")]
      .filter(i => i.style.display !== "none").map(i => i.dataset.v);
    FILTROS_COL[c.k] = new Set(visiveis);
    fecharMenuColuna();
    renderTabela();
  };
  menu.onclick = e => e.stopPropagation();
}

function fecharMenuColuna(){
  document.querySelectorAll(".menu-col").forEach(m => m.remove());
}
document.addEventListener("click", fecharMenuColuna);
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharMenuColuna(); });

function htmlAtencao(lista){
  if (!lista.length) return '<span class="sem">—</span>';
  return `<span class="ats-cel">${lista.map(x => {
    if (x.tipo === "pend") return `<span class="tag-at pend">${x.tema}</span>`;
    const cls = x.tipo === "recorrente" ? "recorrente" : "isolado";
    const nota = x.vezes >= 2 ? ` <b>${x.vezes}×</b>` : "";
    return `<span class="tag-at ${cls}">${x.tema}${nota}</span>`;
  }).join("")}</span>`;
}

function renderTabela(){
  const dados = filtradas();
  const tb = document.getElementById("tabela");
  tb.innerHTML =
    `<thead><tr>${COLUNAS.map(c => {
      const f = FILTROS_COL[c.k];
      const ativo = f && (c.k === "data" ? (f.de || f.ate) : f.size);
      return `<th class="${ativo ? "filtrado" : ""}">
        <button class="th-btn" data-col="${c.k}">${c.rot}<i class="funil"></i></button>
      </th>`;
    }).join("")}</tr></thead>` +
    `<tbody>${dados.map(l => {
      const risco = l.presenca === "a" || (l.nota !== null && l.nota < 60) || (l.eng && l.eng <= 1);
      return `<tr class="${risco ? "alerta" : ""}">
        <td><button class="cel-link" data-aula="${l.aulaId}" data-turma="${l.turmaId}">${l.dia} ${l.data}</button></td>
        <td>${l.empresa}</td>
        <td><button class="cel-link" data-turma-pop="${l.turmaId}">${l.turma}</button></td>
        <td>${nivelL(l.nivel)}</td>
        <td>${l.prof}</td>
        <td><button class="cel-link" data-aula="${l.aulaId}" data-turma="${l.turmaId}">${l.aula}</button></td>
        <td class="col-aluno">${l.aluno}</td>
        <td>${l.presenca === "p" ? '<span class="tag-p">presente</span>'
             : l.presenca === "a" ? '<span class="tag-f">faltou</span>'
             : '<span class="tag-x">—</span>'}</td>
        <td>${estrelasRO(l.eng)}</td>
        <td class="col-nota nota ${classeNota(l.nota)}">${l.nota === null ? "–" : l.nota + "%"}</td>
        <td>${l.acertos}</td>
        <td>${l.erros}</td>
        <td class="cel-at">${htmlAtencao(l.atencao)}</td>
        <td class="cel-anot">${l.anot || '<span class="sem">—</span>'}</td>
      </tr>`;
    }).join("")}</tbody>`;

  document.getElementById("cont-linhas").textContent =
    `${dados.length} de ${LINHAS.length} linhas`;
  const tg = document.getElementById("titulo-geral");
  if (tg) tg.textContent = `Geral · ${dados.length}`;
  renderKPIs(dados);
  renderMedias(dados);
  ligarCelulas();

  document.querySelectorAll(".th-btn").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const c = COLUNAS.find(x => x.k === b.dataset.col);
      const jaAberto = b.parentElement.querySelector(".menu-col");
      if (jaAberto){ fecharMenuColuna(); return; }
      abrirMenuColuna(c, b.parentElement);
    };
  });

  const nFiltros = Object.keys(FILTROS_COL).length;
  const lim = document.getElementById("limpar-col");
  if (lim){
    lim.style.display = nFiltros ? "inline-flex" : "none";
    lim.textContent = `Limpar ${nFiltros} filtro${nFiltros!==1?"s":""} de coluna`;
  }
}

// ── Células clicáveis da planilha ──
function ligarCelulas(){
  document.querySelectorAll("[data-aluno-pop]").forEach(b => {
    b.onclick = () => {
      const t = TURMAS.find(x => x.id === b.dataset.turma);
      const a = t && t.alunos.find(x => x.id === b.dataset.alunoPop);
      if (t && a) abrirAluno(t, a);
    };
  });
  document.querySelectorAll("[data-turma-pop]").forEach(b => {
    b.onclick = () => abrirTurma(TURMAS.find(t => t.id === b.dataset.turmaPop));
  });
  document.querySelectorAll("[data-aula]").forEach(b => {
    b.onclick = () => {
      const t = TURMAS.find(x => x.id === b.dataset.turma);
      const h = (t.historico || []).find(x => x.id === b.dataset.aula);
      if (t && h) abrirAula(t, h);
    };
  });
}

// Ficha do aluno: números consolidados, aula a aula e as anotações internas.
function abrirAluno(t, a){
  const p  = partesIdent(t);
  const ls = LINHAS.filter(l => l.turmaId === t.id && l.alunoId === a.id);
  const comPres = ls.filter(l => l.presenca);
  const pctPres = comPres.length
    ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;
  const comEng = ls.filter(l => l.eng);
  const medEng = comEng.length
    ? (comEng.reduce((n,l) => n + l.eng, 0) / comEng.length).toFixed(1) : null;
  const comNota = ls.filter(l => l.nota !== null);
  const medNota = comNota.length
    ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;

  const alertas = alertasDoAluno(a, t);

  abrirModal(`${p.empresa} · ${p.turma} · ${nivelL(t.nivel)}`, a.nome, `
    <div class="nums">
      <div class="num"><span class="nv ${classeNota(pctPres)}">${pctPres===null?"–":pctPres+"%"}</span><span class="nr">Presença</span></div>
      <div class="num"><span class="nv">${medEng===null?"–":medEng+"★"}</span><span class="nr">Engajamento</span></div>
      <div class="num"><span class="nv ${classeNota(medNota)}">${medNota===null?"–":medNota+"%"}</span><span class="nr">Trilhas</span></div>
    </div>
    ${alertas.length ? `
    <div class="bloco">
      <div class="bt">Precisa ser tratado · ${alertas.length}</div>
      ${alertas.map(x => {
        const r = ROT[x.tipo] || { r:x.tipo, c:"lavanda" };
        return `<div class="item-trat"><span class="tag-al ${r.c}">${r.r}</span>
          <span class="it-txt">${x.texto}</span></div>`;

function abrirTurma(t){

  const comPres = linhasT.filter(l => l.presenca);

    ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;

  const medNota = comNota.length
    ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;

        <div class="mini linha-acao"><b>${tema}</b>

    </div>` : ""}
    <div class="bloco">
      <div class="bt">Aluno a aluno</div>

          <div class="linha-acao" style="display:flex;justify-content:space-between;align-items:center;">

            <span>${l.presenca === "p" ? '<span class="tag-p">presente</span>'

          </div>

// ══════════════════════════════════════════════════════════
//  MÉDIA
//  Um bloco só, com um seletor que decide o eixo do agrupamento:
//  empresa, turma, aluno ou professor. No desktop é planilha; no celular,
//  carrossel de cards. Sempre calcula sobre o que está filtrado acima.
// ══════════════════════════════════════════════════════════
const EIXOS = {
  empresa: {
    rot: "Empresa",
    chave:  l => l.empresa,
    titulo: ls => ls[0].empresa,
    sub:    ls => {
      const turmas = new Set(ls.map(l => l.turmaId)).size;
      const alunos = new Set(ls.map(l => l.turmaId + l.alunoId)).size;
      return `${turmas} turma${turmas!==1?"s":""} · ${alunos} aluno${alunos!==1?"s":""}`;
    },
    ctx: ls => [...new Set(ls.map(l => l.prof))].join(", ")
  },
  aluno: {
    rot: "Aluno",
    chave:  l => l.turmaId + "|" + l.alunoId,
    titulo: ls => ls[0].aluno,
    sub:    ls => `${ls[0].empresa} · ${ls[0].turma} · ${nivelL(ls[0].nivel)}`,
    ctx: ls => ls[0].prof
  },
  professor: {
    rot: "Professor",
    chave:  l => l.prof,
    titulo: ls => ls[0].prof,
    sub:    ls => {
      const turmas = new Set(ls.map(l => l.turmaId)).size;
      const alunos = new Set(ls.map(l => l.turmaId + l.alunoId)).size;
      return `${turmas} turma${turmas!==1?"s":""} · ${alunos} aluno${alunos!==1?"s":""}`;
    },
    ctx: ls => [...new Set(ls.map(l => l.empresa))].join(", ")
  }
};

let eixoAtual = "empresa";

function agrupar(dados, eixo){
  const e = EIXOS[eixo];
  const mapa = new Map();
  dados.forEach(l => {
    const k = e.chave(l);
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(l);
  });

  return [...mapa.values()].map(ls => {
    const comPres = ls.filter(l => l.presenca);
    const pctPres = comPres.length
      ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;
    const faltas  = ls.filter(l => l.presenca === "a").length;

    const comEng = ls.filter(l => l.eng);
    const medEng = comEng.length ? comEng.reduce((n,l) => n + l.eng, 0) / comEng.length : null;

    const comNota = ls.filter(l => l.nota !== null);
    const medNota = comNota.length
      ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;

    const temas = {};
    ls.forEach(l => l.atencao.forEach(x => {
      if (x.tipo === "pend") return;
      temas[x.tema] = (temas[x.tema] || 0) + 1;
    }));
    const pior = Object.entries(temas).sort((a,b) => b[1]-a[1])[0];

    return {
      titulo: e.titulo(ls), sub: e.sub(ls), ctx: e.ctx(ls),
      pctPres, faltas, medEng, medNota, pior,
      acertos: ls.reduce((n,l) => n + l.acertos, 0),
      erros:   ls.reduce((n,l) => n + l.erros, 0),
      turmaId: ls[0].turmaId, alunoId: ls[0].alunoId, linhas: ls
    };
  }).sort((a,b) => (a.medNota ?? 999) - (b.medNota ?? 999));   // pior primeiro
}

function renderMedias(dados){
  const box = document.getElementById("resumo-medias");
  const e = EIXOS[eixoAtual];
  const grupos = agrupar(dados, eixoAtual);

  if (!grupos.length){ box.innerHTML = ""; return; }

  const cel = x => ({
    pres: `<span class="nota ${classeNota(x.pctPres)}">${x.pctPres===null?"–":x.pctPres+"%"}</span>${
            x.faltas ? `<span class="rt-falta">${x.faltas}</span>` : ""}`,
    eng:  x.medEng === null ? '<span class="sem">–</span>'
          : `<span class="rt-eng ${x.medEng <= 1.5 ? "baixo" : ""}">${x.medEng.toFixed(1)}★</span>`,
    nota: `<span class="nota ${classeNota(x.medNota)}">${x.medNota===null?"–":x.medNota+"%"}</span>`,
    pior: x.pior
          ? `<span class="tag-at ${x.pior[1] >= 2 ? "recorrente" : "isolado"}">${x.pior[0]} <b>${x.pior[1]}×</b></span>`
          : '<span class="sem">—</span>'
  });

  // link para a ficha, quando o eixo aponta para algo que tem ficha
  const linkTitulo = x => {
    if (eixoAtual === "aluno")
      return `<button class="cel-link" data-aluno-pop="${x.alunoId}" data-turma="${x.turmaId}">${x.titulo}</button>`;
    return `<span class="md-titulo">${x.titulo}</span>`;
  };

  const ctxRot = { empresa:"Professores", aluno:"Professor", professor:"Empresas" }[eixoAtual];

  const tabela = `
    <div class="ra-wrap">
      <table class="ra-tabela">
        <thead><tr>
          <th>${e.rot}</th><th>${ctxRot}</th>
          <th class="col-num">Presença</th><th class="col-num">Engaj.</th><th class="col-num">Trilhas</th>
          <th class="col-num">Certos</th><th class="col-num">Erros</th><th>Onde mais erra</th>
        </tr></thead>
        <tbody>
          ${grupos.map(x => { const c = cel(x); return `
            <tr>
              <td>${linkTitulo(x)}<span class="ra-sub">${x.sub}</span></td>
              <td class="rt-prof">${x.ctx}</td>
              <td class="col-num">${c.pres}</td><td class="col-num">${c.eng}</td><td class="col-num">${c.nota}</td>
              <td class="col-num">${x.acertos}</td><td class="col-num">${x.erros}</td><td>${c.pior}</td>
            </tr>`; }).join("")}
        </tbody>
      </table>
    </div>`;

  const cards = grupos.map(x => { const c = cel(x); return `
    <article class="rt-card">
      <header>
        ${linkTitulo(x)}
        <span class="rt-sub">${x.sub}</span>
      </header>
      <div class="rt-linha"><span class="rt-rot">${ctxRot}</span><span class="rt-prof">${x.ctx}</span></div>
      <div class="rt-linha"><span class="rt-rot">Presença</span><span>${c.pres}</span></div>
      <div class="rt-linha"><span class="rt-rot">Engajamento</span><span>${c.eng}</span></div>
      <div class="rt-linha"><span class="rt-rot">Trilhas</span><span>${c.nota}</span></div>
      <div class="rt-linha"><span class="rt-rot">Certos / erros</span><span><b>${x.acertos}</b> / ${x.erros}</span></div>
      <div class="rt-linha"><span class="rt-rot">Onde mais erra</span><span>${c.pior}</span></div>
    </article>`; }).join("");

  box.innerHTML = `
    <div class="rt-titulo">
      Média · ${grupos.length}
      <select class="md-eixo" id="md-eixo">
        ${Object.entries(EIXOS).map(([k,v]) =>
          `<option value="${k}" ${k===eixoAtual?"selected":""}>por ${v.rot.toLowerCase()}</option>`).join("")}
      </select>
      <span class="rt-nav md-nav">
        <button class="rt-seta" data-ir="-1" aria-label="Anterior">&lsaquo;</button>
        <span class="rt-pos" id="md-pos"></span>
        <button class="rt-seta" data-ir="1" aria-label="Próximos">&rsaquo;</button>
      </span>
    </div>
    ${tabela}
    <div class="rt-viewport md-viewport">
      <div class="rt-trilho" id="md-trilho">${cards}</div>
    </div>`;

  document.getElementById("md-eixo").onchange = ev => {
    eixoAtual = ev.target.value;
    renderTabela();
  };

  // carrossel (celular): um card por vez
  const trilho   = box.querySelector("#md-trilho");
  const viewport = box.querySelector(".md-viewport");
  const VAO = 12;
  const paginas = grupos.length;
  let pag = 0;
  function irPara(n){
    pag = Math.max(0, Math.min(n, paginas - 1));
    trilho.style.transform = `translateX(-${pag * (viewport.clientWidth + VAO)}px)`;
    box.querySelector("#md-pos").textContent = `${pag + 1}/${paginas}`;
    box.querySelectorAll(".md-nav .rt-seta").forEach(b => {
      const dir = +b.dataset.ir;
      b.disabled = (dir < 0 && pag === 0) || (dir > 0 && pag === paginas - 1);
    });
  }
  box.querySelectorAll(".md-nav .rt-seta").forEach(b => {
    b.onclick = () => irPara(pag + (+b.dataset.ir));
  });
  let x0 = null;
  viewport.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive:true });
  viewport.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) irPara(pag + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive:true });
  window.addEventListener("resize", () => irPara(pag));
  irPara(0);
}

// ══════════════════════════════════════════════════════════
//  USUÁRIOS
//  Quem tem login e com que papel. O papel é editável direto na planilha —
//  é a operação mais comum aqui (aluno vira aluno-e-gestor, professor sai).
// ══════════════════════════════════════════════════════════
// Os usuários vêm do Supabase (tabela `usuarios`), não mais derivados do
// dados-mock.js. USUARIOS_SB é a lista viva; enquanto não carrega, fica
// vazia e a aba mostra "Carregando...".
let USUARIOS_SB = [];
let usuariosCarregados = false;

function empresaNomeDe(id){
  const e = (EMPRESAS_SB || []).find(x => x.id === id);
  return e ? e.nome : "—";
}
function turmaNomeDe(id){
  const t = (TURMAS_SB || []).find(x => x.id === id);
  return t ? t.nome : "—";
}

const CAT_U = [
  { k:"papel",   rot:"Papel",   campo: u => (PAPEIS.find(p => p.k === u.papel) || {}).rot || u.papel },
  { k:"empresa", rot:"Empresa", campo: u => empresaNomeDe(u.empresa_cliente_id) },
  { k:"turma",   rot:"Turma",   campo: u => turmaNomeDe(u.turma_id) }
];
const CHIPS_U = [];

function passaU(u){
  return CAT_U.every(c => {
    const doTipo = CHIPS_U.filter(ch => ch.k === c.k);
    if (!doTipo.length) return true;
    return doTipo.some(ch => c.campo(u) === ch.valor);
  });
}

function usuariosFiltrados(){ return USUARIOS_SB.filter(passaU); }

function vinculoDe(u){
  const t = (TURMAS_SB || []).find(x => x.id === u.turma_id);
  return t ? `${t.nome} · ${t.nivel || ""}`.trim() : "—";
}

// Salva um campo do usuário direto no Supabase. Chamado a cada blur/change
// de célula editável — não tem botão "salvar", a edição é na própria linha.
// Campos que existem em `alunos` e `usuarios` ao mesmo tempo — quando a
// pessoa é aluno-e-usuário (usuarios.aluno_id preenchido), editar um dos
// dois sem sincronizar o outro faria nome/cargo/e-mail divergirem entre as
// duas telas pra quem é, na prática, a mesma conta.
const CAMPOS_COMPARTILHADOS_ALUNO_USUARIO = ["nome", "cargo", "email"];

// Grava o campo na tabela ligada, direto por filtro — não depende da outra
// aba já ter carregado os dados em memória (Alunos e Usuários carregam sob
// demanda, cada uma só quando a pessoa abre a aba). Erro aqui não trava o
// save do campo principal: o registro-fonte já salvou; o vínculo fica pra
// a próxima edição ou recarregamento resolver.
async function sincronizarCampoLigado(tabela, filtroCampo, filtroValor, campo, novo){
  if (!filtroValor) return;
  try{
    await fetch(`${SB_URL}/rest/v1/${tabela}?${filtroCampo}=eq.${filtroValor}`, {
      method: "PATCH", headers: SB_H, body: JSON.stringify({ [campo]: novo })
    });
  } catch(err){ console.error("sincronizarCampoLigado:", err); }
}

async function salvarCampoUsuario(id, campo, valor, elFeedback){
  const u = USUARIOS_SB.find(x => x.id === id);
  if (!u) return;
  const antes = u[campo];
  const novo = valor === "" ? null : valor;
  if (antes === novo) return;
  u[campo] = novo;
  if (elFeedback) elFeedback.textContent = "…";
  try{
    const res = await fetch(`${SB_URL}/rest/v1/usuarios?id=eq.${id}`, {
      method: "PATCH", headers: SB_H, body: JSON.stringify({ [campo]: novo })
    });
    if (!res.ok) throw new Error(await res.text());
    if (u.aluno_id && CAMPOS_COMPARTILHADOS_ALUNO_USUARIO.includes(campo)){
      await sincronizarCampoLigado("alunos", "id", u.aluno_id, campo, novo);
      const a = (ALUNOS_SB || []).find(x => x.id === u.aluno_id);
      if (a) a[campo] = novo;
    }
    if (elFeedback){ elFeedback.textContent = "✓"; setTimeout(() => elFeedback.textContent = "", 1600); }
  } catch(err){
    u[campo] = antes;   // desfaz na memória pra tela não mentir
    alert("Erro ao salvar: " + err.message);
    renderUsuarios();
  }
}

async function excluirUsuario(id){
  const u = USUARIOS_SB.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`Excluir ${u.nome}? Isso remove o acesso dessa pessoa, mas não apaga o registro de aluno nem o histórico de aulas.`)) return;
  try{
    const res = await fetch(`${SB_URL}/rest/v1/usuarios?id=eq.${id}`, { method: "DELETE", headers: SB_H });
    if (!res.ok) throw new Error(await res.text());
    USUARIOS_SB = USUARIOS_SB.filter(x => x.id !== id);
    renderUsuarios();
  } catch(err){ alert("Erro ao excluir: " + err.message); }
}

              </td>

        </tbody>
      </table>
    </div>

    <div class="u-cards">
      ${dados.map(u => `
        <article class="card u-card">
          <div class="ident">
            <span class="id-emp">${empresaNomeDe(u.empresa_cliente_id)}</span>
            ${u.turma_id ? `<span class="id-turma">${turmaNomeDe(u.turma_id)}</span>` : ""}

          <h2>${u.nome}</h2>

          <div class="rt-linha"><span class="rt-rot">E-mail</span>

async function novoUsuario(){
  const nome = prompt("Nome do novo usuário:");
  if (!nome || !nome.trim()) return;
  try{
    const res = await fetch(`${SB_URL}/rest/v1/usuarios`, {
      method: "POST", headers: { ...SB_H, "Prefer": "return=representation" },
      body: JSON.stringify({ nome: nome.trim(), papel: "aluno" })
    });
    if (!res.ok) throw new Error(await res.text());
    const criado = (await res.json())[0];
    USUARIOS_SB.push(criado);
    renderUsuarios();
  } catch(err){ alert("Erro ao criar usuário: " + err.message); }
}

// A aba Usuários precisa das empresas e turmas pra montar os seletores de
// vínculo — reaproveita o mesmo carregamento das abas Empresas e Alunos.
async function abrirAbaUsuarios(){
  if (usuariosCarregados){ renderUsuarios(); return; }
  document.getElementById("usuarios-wrap").innerHTML = `<div class="turmas-vazio">Carregando...</div>`;
  try{
    if (!turmasCarregadas){
      await carregarTurmasSupabase();
      turmasCarregadas = true;
      opcoesEmpTurmas();
    }
    const res = await fetch(`${SB_URL}/rest/v1/usuarios?select=*&order=nome`, { headers: SB_H });
    if (!res.ok) throw new Error(await res.text());
    USUARIOS_SB = await res.json();
    usuariosCarregados = true;
    renderChipsU();
    renderUsuarios();
  } catch(err){
    document.getElementById("usuarios-wrap").innerHTML = `<div class="turmas-vazio">Erro ao carregar usuários: ${err.message}</div>`;

function renderChipsU(){
  const box = document.getElementById("chips-u");
  if (!CHIPS_U.length){ box.innerHTML = ""; return; }
  box.innerHTML = CHIPS_U.map((c,i) => `
    <span class="chip"><span class="chip-cat">${c.rot}</span>
      <span class="chip-val">${c.valor}</span>
      <button class="chip-x" data-i="${i}">&times;</button></span>`).join("");
  box.querySelectorAll(".chip-x").forEach(b => {
    b.onclick = () => { CHIPS_U.splice(+b.dataset.i,1); renderChipsU(); renderUsuarios(); };

let catU = null;
function pintarPainelU(){
  const p = document.getElementById("af-painel-u");
  if (!catU){
    p.innerHTML = `<div class="af-tit">Filtrar por</div>` +
      CAT_U.map(c => {
        const total = new Set(USUARIOS_SB.map(u => c.campo(u))).size;
        const usados = CHIPS_U.filter(ch => ch.k === c.k).length;
        return `<button class="af-cat" data-k="${c.k}">
          <span class="af-rot">${c.rot}</span>
          <span class="af-n">${usados ? `${usados} de ${total}` : total}</span>
          <span class="af-seta"></span></button>`;
      }).join("");
    p.querySelectorAll(".af-cat").forEach(b => {
      b.onclick = e => { e.stopPropagation(); catU = b.dataset.k; pintarPainelU(); };
    });
    return;
  }
  const c = CAT_U.find(x => x.k === catU);
  const marcados = new Set(CHIPS_U.filter(ch => ch.k === c.k).map(ch => ch.valor));
  const vals = [...new Set(USUARIOS_SB.map(u => c.campo(u)))].sort((a,b) => a.localeCompare(b,"pt-BR"))
    .map(v => ({ v, n: USUARIOS_SB.filter(u => c.campo(u) === v).length }));

  p.innerHTML = `
    <div class="af-topo"><button class="af-voltar" data-voltar>&lsaquo;</button>
      <span class="af-tit">${c.rot}</span></div>
    <div class="af-lista">
      ${vals.map(x => `<label class="af-item">
        <input type="checkbox" value="${x.v.replace(/"/g,'&quot;')}" ${marcados.has(x.v)?"checked":""}>
        <span class="af-val">${x.v}</span><span class="af-n">${x.n}</span></label>`).join("")}
    </div>
    <div class="af-rodape"><button class="af-ok" data-aplicar>Aplicar</button></div>`;

  p.querySelector("[data-voltar]").onclick = e => { e.stopPropagation(); catU = null; pintarPainelU(); };
  p.querySelector("[data-aplicar]").onclick = e => {
    e.stopPropagation();
    const esc = [...p.querySelectorAll(".af-item input")].filter(i => i.checked).map(i => i.value);
    for (let i = CHIPS_U.length-1; i >= 0; i--) if (CHIPS_U[i].k === c.k) CHIPS_U.splice(i,1);
    esc.forEach(v => CHIPS_U.push({ k:c.k, rot:c.rot, valor:v }));
    p.classList.remove("on");
    catU = null;
    renderChipsU(); renderUsuarios();
  };
}

document.getElementById("btn-add-u").onclick = e => {
  e.stopPropagation();

      valor: v("nd-valor"), status: v("nd-status"), obs: v("nd-obs")

    if (arquivoEscolhido){
      campos.url = arquivoEscolhido.url;
      campos.arquivo = arquivoEscolhido.nome;
    }
    if (doc) Object.assign(doc, campos);
    else DOCS.push({ id: "d" + Date.now(), url: "", arquivo: "", ...campos });

//  ALERTAS — mesma lógica da plataforma do professor, mas de todos
// ══════════════════════════════════════════════════════════
function alertasDoAluno(a, t){
  const out = [];
  let totalLic = 0, totalErr = 0;
  (t.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    if (!st.length) return;
    totalLic += st.length;
    totalErr += st.filter(x => x === "err").length;
    const erros = st.filter(x => x === "err").length;
    if (erros / st.length >= 0.40){
      out.push({ tipo:"trilha", texto:`Errou ${erros} de ${st.length} em <b>${h.titulo}</b>.` });
    }
  });

  const porTema = {};
  (t.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    (h.temas || []).forEach((tema, i) => {
      if (!st[i]) return;
      const d = porTema[tema] = porTema[tema] || { total:0, erros:0 };
      d.total++;
      if (st[i] === "err") d.erros++;
    });
  });
  const temas = Object.entries(porTema)
    .filter(([, d]) => d.total >= 2 && d.erros / d.total >= 0.40)
    .map(([tema, d]) => `<b>${tema}</b> (${d.erros}/${d.total})`);
  if (temas.length) out.push({ tipo:"tema", texto:`Trava em ${temas.join(", ")}.` });

  const notas = (t.historico || []).map(h => (ENGAJAMENTO[h.id] || {})[a.id]).filter(Boolean);
  if (notas.length){
    const m = notas.reduce((x,y) => x+y, 0) / notas.length;
    if (m <= 1.5) out.push({ tipo:"eng", texto:`Engajamento médio ${m.toFixed(1)} de 3.` });
  }

  const faltas = (t.historico || []).filter(h => (PRESENCA[h.id] || {})[a.id] === "a").length;
  if (faltas >= 2) out.push({ tipo:"falta", texto:`${faltas} faltas registradas.` });

  (a.historico || []).filter(h => !h.tratado).forEach(h => {
    const de = { rh:"RH do cliente", gestao:"Gestão Bupp", aluno:"O próprio aluno", prof:"Professor" }[h.tipo] || h.tipo;
    out.push({ tipo:"msg", texto:`<b>${de}</b> deixou recado em ${h.data}, não tratado.` });
  });
  return out;
}

const ROT = {
  trilha:{ r:"Errou muito",     c:"vermelho" },
  tema:  { r:"Trava num tema",  c:"vermelho" },
  eng:   { r:"Engajamento",     c:"ambar"    },
  falta: { r:"Faltas",          c:"ambar"    },
  msg:   { r:"Recado pendente", c:"lavanda"  }
};

  // com o registro da tabela `usuarios`). O fallback abaixo lê a sessão
  // antiga do crm.html e só existe pra não travar quem abrir a página
  // antes do login estar em uso; sai quando o login virar obrigatório.
  if (window.USUARIO_LOGADO && window.USUARIO_LOGADO.nome) return window.USUARIO_LOGADO.nome;
  try{
    const sessao = JSON.parse(localStorage.getItem("tasks_std_auth_session") || "null");
    const usuarios = JSON.parse(localStorage.getItem("tasks_std_users") || "null") || [];
    if (sessao && usuarios.length){
      const u = usuarios.find(x => x.username === sessao.username);
      if (u) return u.name || u.login || u.username;
    }
  } catch(e){ /* localStorage inacessível ou corrompido — trata como deslogado */ }
  return null;
}


// Histórico com a gestão desde a época em que a empresa era lead — mesmo
// registro de comentários (`e.cm`) que a aba Leads usa. Vira "cliente" não
// zera a conversa: continua no mesmo lugar, só muda o status do lead.
async function abrirHistoricoEmpresa(empresa){
  if (!empresa) return;
  abrirModal("Empresas", empresa.nome, `<div class="turmas-vazio">Carregando histórico...</div>`);
  try{
    const res = await fetch(`${SB_URL}/rest/v1/bupp_dashboard_data?section=eq.leads&select=data,revision`, { headers: SB_H });
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    const row = rows[0];
    const leads = (row && row.data) || [];
    const chaveLead = empresa.lead_origem_id || empresa.nome;
    const lead = leads.find(l => l.n === chaveLead);
    renderHistoricoEmpresa(empresa, leads, lead, row ? (row.revision || 0) : 0);
  } catch(err){
    document.getElementById("modal-corpo").innerHTML = `<div class="turmas-vazio">Erro ao carregar histórico: ${err.message}</div>`;
  }
}

function renderHistoricoEmpresa(empresa, leads, lead, revision){
  const cm = (lead && lead.cm) || [];
  const corpo = `
    ${lead ? "" : `<div class="mini alerta-turma"><b>Sem lead de origem</b><span>Essa empresa não veio do funil de Leads (foi cadastrada direto por "+ Nova Empresa"), então não tem histórico anterior — só o que for escrito daqui pra frente.</span></div>`}
    <div class="rt-titulo">Histórico com a gestão (${cm.length})</div>
    <div class="cm-lista">
      ${cm.length ? cm.slice().reverse().map(m => `
        <div class="cm-item">
          <div class="cm-meta">${m.quem || "—"} · ${m.dt}</div>
          <p>${m.t}</p>
        </div>`).join("") : `<p class="lead-meta">Nenhum comentário ainda.</p>`}
    </div>
    <div class="form-modal" style="margin-top:10px;">
      <textarea id="hist-emp-txt" rows="2" placeholder="o que aconteceu com essa empresa…"></textarea>
      <button type="button" class="btn-salvar" id="hist-emp-salvar" style="margin-top:8px;">Adicionar</button>
      <div id="hist-emp-msg" style="font-size:12px;font-weight:700;margin-top:6px;"></div>
    </div>
  `;
  abrirModal("Empresas", empresa.nome, corpo);
  document.getElementById("hist-emp-salvar").onclick = async () => {
    const txt = document.getElementById("hist-emp-txt").value.trim();
    const msg = document.getElementById("hist-emp-msg");
    if (!txt){ msg.textContent = "Escreva algo antes de adicionar."; msg.style.color = "var(--erro)"; return; }
    if (!lead){ msg.textContent = "Sem lead de origem — não tem onde gravar esse comentário."; msg.style.color = "var(--erro)"; return; }
    document.getElementById("hist-emp-salvar").disabled = true;
    msg.textContent = "Salvando...";
    try{
      lead.cm = [...(lead.cm || []), { t: txt, dt: hojeCurto(), quem: "Gestão Bupp" }];
      const res = await fetch(`${SB_URL}/rest/v1/bupp_dashboard_data?section=eq.leads`, {
        method: "PATCH", headers: SB_H,
        body: JSON.stringify({ data: leads, revision: (revision || 0) + 1, updated_at: new Date().toISOString() })
      });
      if (!res.ok) throw new Error(await res.text());
      renderHistoricoEmpresa(empresa, leads, lead, (revision || 0) + 1);
    } catch(err){
      msg.textContent = "Erro ao salvar: " + err.message; msg.style.color = "var(--erro)";
      document.getElementById("hist-emp-salvar").disabled = false;
    }
  };
}

const ROTULO_FORMATO = { live: "Live", online: "Online" };

// dias_semana é array de {dia, hora} (ex.: [{dia:"Seg",hora:"08:00"}]) desde
// 25/08 — antes era só array de strings. diaTexto cobre os dois formatos
// pra não quebrar turma antiga migrada sem passar de novo pelo form.
function diaTexto(d){
  return typeof d === "string" ? d : `${d.dia} ${d.hora || ""}`.trim();
}

function turmaLinhaHtml(t){
  const meta = [t.nivel, ROTULO_FORMATO[t.formato] || t.formato, (t.dias_semana || []).length ? t.dias_semana.map(diaTexto).join(" · ") : null]
    .filter(Boolean).join(" · ");
  return `
    <div class="turma-linha">
      <div class="tl-info tl-clicavel" data-turma-detalhe="${t.id}">
        <h4>${t.nome}</h4>
        <div class="tl-meta">${meta}</div>
        <div class="tl-obj">${t.objetivo_1 || ""}</div>
      </div>
      <div class="tl-prof">
        <label>Professor</label>
        <select data-turma="${t.id}">
          <option value="">Sem professor atribuído</option>
          ${PROFESSORES_SB.map(p => `<option value="${p.id}" ${p.id === t.professor_id ? "selected" : ""}>${p.nome}</option>`).join("")}
        </select>
        <div class="tl-salvo"></div>
      </div>
    </div>`;
}

async function abrirDetalheAluno(aluno, turmasDaEmpresa){

const ROTULO_TIPO_ANOTACAO = { prof: "Professor", rh: "RH", aluno: "Aluno", gestao: "Gestão Bupp" };

// do tipo (que por sua vez vem da dash de onde a pessoa escreveu, nunca
// de uma escolha manual) — mesma convenção de idioma dos selos de papel
// do resto do produto (teacher/student/manager), só que "adm" no lugar
// de "internal" aqui, por pedido da Karina.
const ROTULO_TIPO_CURTO = { prof: "teacher", rh: "manager", aluno: "student", gestao: "adm" };

function renderDetalheAluno(aluno, turmasDaEmpresa, anotacoes){
  const autorLogado = usuarioLogadoInterno();

    ${turmasDaEmpresa ? `
      <div class="rt-titulo" style="margin-top:16px;">Alocar numa turma</div>
      <div class="form-modal">
        <div class="campo">
          <select id="aloc-turma">
            <option value="">Selecione uma turma</option>
            ${turmasDaEmpresa.map(t => `<option value="${t.id}">${t.nome}</option>`).join("")}
          </select>
        </div>
        <button type="button" class="btn-salvar" id="aloc-confirmar" ${turmasDaEmpresa.length ? "" : "disabled"}>Alocar</button>
        <div id="aloc-msg" style="font-size:12px;font-weight:700;margin-top:8px;"></div>
      </div>
      ${turmasDaEmpresa.length ? "" : `<div class="sem-turmas" style="margin-top:8px;">Essa empresa ainda não tem turma — crie uma com "+ Turma" antes de alocar.</div>`}
    ` : ""}

    <div class="rt-titulo" style="margin-top:16px;">Anotações (${anotacoes.length})</div>
    <div class="cm-lista">
      ${anotacoes.length ? anotacoes.map(a => `
        <div class="cm-item">
          <div class="cm-meta">${a.autor} - ${ROTULO_TIPO_CURTO[a.tipo] || a.tipo} · ${new Date(a.criado_em).toLocaleDateString("pt-BR")}</div>
          <p>${a.texto}</p>
        </div>`).join("") : `<p class="lead-meta">Nenhuma anotação ainda.</p>`}
    </div>
    <div class="form-modal" style="margin-top:10px;">
      ${autorLogado
        ? `<div class="anot-autor-fixo">Você escreve como <b>${autorLogado} - adm</b></div>`
        : `<div class="mini obj alerta-turma"><b>Sem login detectado</b><span>Abra a aba Tasks ou Leads e entre com seu usuário antes de escrever uma anotação — é de lá que o nome vem, ninguém digita nome aqui.</span></div>`}
      <textarea id="anot-txt" rows="2" placeholder="anotação sobre esse aluno…"></textarea>
      <button type="button" class="btn-salvar" id="anot-salvar" style="margin-top:8px;" ${autorLogado ? "" : "disabled"}>Adicionar</button>
      <div id="anot-msg" style="font-size:12px;font-weight:700;margin-top:6px;"></div>
    </div>
  `;
  abrirModal("Aluno", aluno.nome, corpo);

  document.querySelectorAll("#modal-corpo .cel-u[data-al]").forEach(inp => {
    inp.onblur = () => salvarCampoAluno(inp.dataset.al, inp.dataset.campo, inp.value.trim());
    inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
  });

  const btnAloc = document.getElementById("aloc-confirmar");
  if (btnAloc) btnAloc.onclick = async () => {
    const turmaId = document.getElementById("aloc-turma").value;
    const msg = document.getElementById("aloc-msg");
    if (!turmaId){ msg.textContent = "Selecione uma turma."; msg.style.color = "var(--erro)"; return; }
    btnAloc.disabled = true; msg.textContent = "Alocando...";
    try{
      const res = await fetch(`${SB_URL}/rest/v1/turma_alunos`, {
        method: "POST", headers: SB_H, body: JSON.stringify({ turma_id: turmaId, aluno_id: aluno.id })
      });

      aluno.turma_alunos = [{ turma_id: turmaId }];
      fecharModal();
      // A ficha abre tanto da aba Empresas quanto da aba Alunos — atualiza
      // a que estiver ativa, senão a outra fica com dado velho na tela.
      if (document.getElementById("pane-alunos").classList.contains("active")) renderAlunosTabela();

      });
      if (!res.ok) throw new Error(await res.text());
      const nova = (await res.json())[0];
      renderDetalheAluno(aluno, turmasDaEmpresa, [nova, ...anotacoes]);
    } catch(err){
      msg.textContent = "Erro ao salvar: " + err.message; msg.style.color = "var(--erro)";
      document.getElementById("anot-salvar").disabled = false;
    }
  };
}

// Empresas sem nenhuma turma ainda (cadastradas por "+ Nova Empresa" mas sem
// "+ Turma" clicado) também precisam aparecer — senão o botão fica
// escondido justamente em quem mais precisa dele. Toda turma é de uma
// empresa (não existe mais bucket "Particular" — Karina decidiu em 25/08).
function renderTurmas(){
  const fEmp = document.getElementById("tu-emp").value;

  const porEmpresaId = new Map();
  EMPRESAS_SB.forEach(e => porEmpresaId.set(e.id, { empresa: e, turmas: [] }));
  TURMAS_SB.forEach(t => {
    if (t.empresa_cliente_id && porEmpresaId.has(t.empresa_cliente_id)){
      porEmpresaId.get(t.empresa_cliente_id).turmas.push(t);
    }
  });

  let grupos = [...porEmpresaId.values()].sort((a,b) => a.empresa.nome.localeCompare(b.empresa.nome,"pt-BR"));
  if (fEmp) grupos = grupos.filter(g => g.empresa.nome === fEmp);

  document.getElementById("tu-limpar").style.display = fEmp ? "inline-flex" : "none";
  const totalTurmas = TURMAS_SB.length;
  document.getElementById("tu-cont").textContent =
    `${grupos.length} empresa(s) · ${totalTurmas} turma(s) no total`;

  const wrap = document.getElementById("turmas-wrap");
  if (!grupos.length){
    wrap.innerHTML = `<div class="turmas-vazio">Nenhuma empresa ainda. Use "+ Nova Empresa" pra criar a primeira.</div>`;
    return;
  }

  const html = grupos.map(g => {
    const e = g.empresa;
    const meta = [e.setor, e.contexto_ingles].filter(Boolean).join(" · ");
    return `
      <div class="empresa-card">
        <div class="ec-cab">
          <div>
            <h3 class="ec-clicavel" data-empresa-historico="${e.id}">${e.nome}</h3>
            ${meta ? `<div class="ec-meta">${meta}</div>` : ""}
          </div>
          <div class="ec-btns">
            <a class="btn-mini" href="nova-turma.html?empresa_id=${e.id}&empresa_nome=${encodeURIComponent(e.nome)}" target="_blank" rel="noopener">+ Turma</a>
            <a class="btn-mini" href="nivel-test.html?empresa_id=${e.id}&empresa_nome=${encodeURIComponent(e.nome)}" target="_blank" rel="noopener">+ Aluno</a>
          </div>
        </div>
        <div class="ec-turmas">
          ${g.turmas.length ? g.turmas.map(turmaLinhaHtml).join("") : `<div class="sem-turmas">Nenhuma turma cadastrada ainda pra esta empresa.</div>`}
        </div>
      </div>`;
  }).join("");

  wrap.innerHTML = html;
  wrap.querySelectorAll("select[data-turma]").forEach(sel => {
    sel.onchange = () => atribuirProfessor(sel.dataset.turma, sel.value, sel.parentElement.querySelector(".tl-salvo"));
  });
  wrap.querySelectorAll("[data-turma-detalhe]").forEach(el => {
    el.onclick = () => abrirDetalheTurma(TURMAS_SB.find(t => t.id === el.dataset.turmaDetalhe));
  });
  wrap.querySelectorAll("[data-empresa-historico]").forEach(el => {
    el.onclick = () => abrirHistoricoEmpresa(EMPRESAS_SB.find(e => e.id === el.dataset.empresaHistorico));
  });
}
