<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --border: #e5e2d9;
    --border-strong: #d3cfc2;
    --text: #2c2c2a;
    --text-muted: #77766f;
    --accent: #1a1a18;
    --land-default: #f1efe8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Campos de formulário não herdam a fonte do body por padrão. */
  input, select, textarea, button { font-family: inherit; }
  .hidden { display: none !important; }

  /* --- Login gate --- */
  #login-gate-backdrop { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; align-items: center; justify-content: center; }
  #login-gate-backdrop.hidden { display: none; }
  #login-gate-box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 30px; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
  #login-gate-box h2 { margin: 0 0 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-align: center; color: var(--text); }
  .login-gate-field { margin-bottom: 14px; }
  .login-gate-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .login-gate-field input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; font-family: inherit;
  }
  #login-gate-error, #login-gate-pw-error { color: #a3312a; font-size: 12.5px; min-height: 16px; margin: 2px 0 12px; }
  #login-gate-submit, #login-gate-pw-submit {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  #login-gate-submit:hover, #login-gate-pw-submit:hover { background: #000000; }
  #login-gate-pw-fields.hidden { display: none; }
  #login-gate-pw-intro { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin: 0 0 16px; }

  /* --- App shell --- */
  #app { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }
  #app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  #app-title { font-size: 19px; font-weight: 700; margin: 0; }
  #app-header-actions { display: flex; align-items: center; gap: 10px; }
  #cloud-status { font-size: 11.5px; color: var(--text-muted); }
  .header-btn {
    border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .header-btn:hover { background: var(--land-default); }

  #tasks-subnav { display: flex; gap: 6px; margin-bottom: 12px; }
  #projects-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px; }
  .project-tab {
    border: 1px solid var(--border); background: #fff; color: var(--text-muted); border-radius: 999px;
    padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .project-tab:hover { background: var(--land-default); color: var(--text); }
  .project-tab.active { background: var(--text); border-color: var(--text); color: #fff; }
  .project-tab-add { border-style: dashed; }
  .project-actions { display: flex; gap: 2px; margin-left: 4px; }
  .project-actions button { border: none; background: transparent; cursor: pointer; font-size: 12px; padding: 5px 7px; border-radius: 6px; color: var(--text-muted); }
  .project-actions button:hover { background: var(--land-default); color: var(--text); }
  #tasks-empty { padding: 22px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .tasks-subnav-btn {
    border: 1px solid var(--border); background: #fff; color: var(--text-muted); border-radius: 7px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .tasks-subnav-btn:hover { background: var(--land-default); color: var(--text); }
  .tasks-subnav-btn.active { background: var(--text); border-color: var(--text); color: #fff; }

  /* --- Tasks table --- */
  #tasks-table { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
  .tasks-col-name, .tasks-col-status, .tasks-col-date, .tasks-col-assignee { position: relative; }
  .tasks-fill-handle {
    display: none;
    position: absolute;
    right: 3px;
    bottom: 4px;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border: 1px solid #ffffff;
    box-shadow: 0 0 0 1px var(--accent);
    border-radius: 2px;
    cursor: crosshair;
    z-index: 5;
  }
  .tasks-name-input:focus ~ .tasks-fill-handle,
  .tasks-status-select:focus ~ .tasks-fill-handle,
  .tasks-date-input:focus ~ .tasks-fill-handle,
  .tasks-assignee-toggle:focus ~ .tasks-fill-handle,
  .tasks-fill-handle.dragging {
    display: block;
  }
  .tasks-fill-target { box-shadow: inset 0 0 0 2px var(--accent); background: rgba(90,53,194,0.08); }
  body.tasks-fill-active { user-select: none; }

  /* --- Arrastar linhas para reordenar --- */
  .tasks-drag-handle {
    flex-shrink: 0; display: inline-flex; align-items: center; color: var(--border-strong);
    cursor: grab; padding: 2px 0; opacity: 0; transition: opacity 0.12s;
  }
  .tasks-row:hover .tasks-drag-handle { opacity: 1; }
  .tasks-drag-handle:hover { color: var(--text-muted); }
  .tasks-drag-handle:active { cursor: grabbing; }
  .tasks-drag-handle svg { width: 10px; height: 16px; display: block; }
  .tasks-row.tasks-dragging { opacity: 0.4; }
  .tasks-row.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .tasks-row.drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .tasks-row.drop-inside { background: #eef2fb; box-shadow: inset 0 0 0 2px var(--accent); }

  .tasks-header-row, .tasks-row {
    display: grid;
    grid-template-columns: minmax(240px, 2.4fr) 100px 130px 130px 130px 140px 90px;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent;
  }
  .tasks-header-row { background: var(--land-default); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; border-radius: 11px 11px 0 0; }
  #tasks-table-body .tasks-row:last-child { border-radius: 0 0 11px 11px; }
  .tasks-row:last-child { border-bottom: none; }
  .tasks-row:hover { background: #fbfaf7; }

  .tasks-col-name { display: flex; align-items: center; gap: 6px; overflow: hidden; padding-left: calc(var(--depth, 0) * 22px); }
  .tasks-toggle { border: none; background: none; cursor: pointer; font-size: 10px; color: var(--text-muted); width: 16px; flex-shrink: 0; }
  .tasks-toggle.empty { visibility: hidden; }
  .tasks-row-icon { flex-shrink: 0; display: inline-flex; align-items: center; color: var(--text-muted); }
  .row-type-icon { width: 15px; height: 15px; display: block; }
  .tasks-name-input {
    border: none; background: transparent; font-size: 13.5px; color: inherit; flex: 1 1 0; min-width: 0; padding: 4px 4px; border-radius: 4px;
  }
  .tasks-name-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tasks-name-multiline { resize: none; overflow: hidden; line-height: 1.35; }
  .tasks-name-expand {
    display: none; border: none; background: transparent; color: inherit; cursor: pointer;
    padding: 3px 4px; border-radius: 5px; flex-shrink: 0; opacity: 0.45; line-height: 0;
  }
  .tasks-name-expand.visible { display: inline-flex; align-items: center; }
  .tasks-name-expand:hover { opacity: 1; background: rgba(0,0,0,0.06); }
  .tasks-name-expand svg { width: 12px; height: 12px; display: block; transition: transform 0.12s; }
  .tasks-name-expand.open svg { transform: rotate(180deg); }
  .tasks-comments-btn {
    position: relative; border: none; background: transparent; cursor: pointer; font-size: 12px; line-height: 1; padding: 4px 5px; border-radius: 6px; flex-shrink: 0; opacity: 0.28;
  }
  .tasks-comments-btn:hover { opacity: 0.75; background: var(--land-default); }
  .tasks-comments-btn.has-comments { opacity: 1; background: #eef2fb; }
  .tasks-comments-count {
    position: absolute; top: -4px; right: -4px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; border-radius: 8px; min-width: 13px; height: 13px; line-height: 13px; text-align: center; padding: 0 2px;
  }

  .tasks-status-select { border: none; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; }
  .tasks-date-input { border: none; background: transparent; font-size: 12.5px; color: var(--text); width: 100%; padding: 6px 4px; border-radius: 4px; }
  .tasks-date-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tasks-assignee-dropdown { position: relative; width: 100%; }
  .tasks-assignee-toggle {
    border: none; background: transparent; font-size: 12.5px; color: var(--text); width: 100%; text-align: left; padding: 6px 4px; border-radius: 4px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tasks-assignee-toggle:hover, .tasks-assignee-toggle:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tasks-assignee-menu {
    display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: #fff; border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); z-index: 20; min-width: 180px; max-height: 220px; overflow-y: auto; padding: 6px;
  }
  .tasks-assignee-menu.open { display: block; }
  .tasks-assignee-option { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .tasks-assignee-option:hover { background: var(--land-default); }
  .tasks-assignee-option input { accent-color: var(--accent); }
  .tasks-assignee-empty { font-size: 12px; color: var(--text-muted); padding: 6px 8px; }
  .tasks-rowtype-select { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 5px 6px; font-size: 11.5px; width: 100%; }
  .tasks-row-actions { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .tasks-row-actions button { border: none; background: transparent; cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 5px; color: var(--text-muted); }
  .tasks-row-actions button:hover { background: var(--land-default); color: var(--text); }
  .tasks-row-actions .tasks-delete-btn:hover { background: #fcebeb; color: #a3312a; }
  /* Só aparecem no celular, onde arrastar não funciona. */
  .tasks-move-btn { display: none; }
  /* Resumo e lápis são exclusivos do celular. */
  .tasks-mobile-summary { display: none; }
  .tasks-mobile-edit {
    display: none; border: none; background: transparent; color: inherit; cursor: pointer;
    padding: 4px 5px; border-radius: 5px; flex-shrink: 0; opacity: 0.5; line-height: 0;
  }
  .tasks-mobile-edit svg { width: 14px; height: 14px; display: block; }
  .tasks-mobile-edit.open { opacity: 1; background: rgba(0,0,0,0.07); }
  .tasks-move-btn svg { width: 13px; height: 13px; display: block; }
  .tasks-move-btn:disabled { opacity: 0.3; cursor: default; }
  .tasks-row input[type="checkbox"].tasks-select-checkbox { margin-right: 8px; accent-color: var(--accent); }

  #tasks-footer { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
  #tasks-add-btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  #tasks-add-btn:hover { background: var(--land-default); }
  #tasks-bulk-bar { display: none; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); }
  #tasks-bulk-bar.visible { display: flex; }
  #tasks-bulk-delete { border: 1px solid #a3312a; background: #fff; color: #a3312a; border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  #tasks-bulk-delete:hover { background: #fcebeb; }

  #tasks-late-list { display: flex; flex-direction: column; gap: 8px; }
  .tasks-late-row {
    display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; font-size: 13px; border-left: 3px solid #a3312a;
  }
  .tasks-late-info { flex: 1 1 0; min-width: 0; }
  .tasks-late-parent { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .tasks-late-name { color: var(--text); }
  .tasks-late-meta { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
  #tasks-late-empty { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }

  /* --- Task comments modal --- */
  #task-comments-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #task-comments-modal-backdrop.hidden { display: none; }
  #task-comments-modal { background: #fff; border-radius: 12px; width: 560px; max-width: 92vw; max-height: 84vh; min-height: 380px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  #task-comments-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); gap: 12px; }
  #task-comments-modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #task-comments-modal-close { background: transparent; border: none; font-size: 15px; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; }
  #task-comments-modal-close:hover { background: var(--land-default); color: var(--text); }
  #task-comments-modal-body { padding: 16px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 220px; max-height: 50vh; display: flex; flex-direction: column; gap: 12px; }
  .tc-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .tc-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tc-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .tc-block-meta { font-size: 11px; color: var(--text-muted); }
  .tc-block-delete { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
  .tc-block-delete:hover { background: #fcebeb; color: #a3312a; }
  .tc-text-body { font-size: 13.5px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .tc-checklist-title-input { width: 100%; border: none; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--text); padding: 4px 2px; margin-bottom: 8px; border-radius: 4px; }
  .tc-checklist-title-input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .tc-checklist-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .tc-checklist-item input[type="checkbox"] { flex-shrink: 0; accent-color: var(--accent); width: 15px; height: 15px; }
  .tc-checklist-item-text { font-size: 13px; color: var(--text); flex: 1 1 0; }
  .tc-checklist-item.done .tc-checklist-item-text { color: var(--text-muted); text-decoration: line-through; }
  .tc-checklist-item-delete { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; opacity: 0.5; }
  .tc-checklist-item-delete:hover { opacity: 1; background: #fcebeb; color: #a3312a; }
  .tc-checklist-add-row { display: flex; gap: 6px; margin-top: 6px; }
  .tc-checklist-add-row input { flex: 1 1 0; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; font-family: inherit; }
  .tc-checklist-add-row button { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 6px 11px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .tc-checklist-add-row button:hover { background: var(--land-default); }
  #task-comments-composer { border-top: 1px solid var(--border); padding: 14px 18px 16px; flex-shrink: 0; }
  #tc-text-input { width: 100%; min-height: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; font-family: inherit; resize: vertical; margin-bottom: 8px; }
  #task-comments-composer-actions { display: flex; gap: 8px; }
  #tc-add-text-btn, #tc-add-checklist-btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  #tc-add-text-btn:hover, #tc-add-checklist-btn:hover { background: var(--land-default); }

  #email-preview-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #email-preview-modal-backdrop.hidden { display: none; }
  #email-preview-modal { background: #fff; border-radius: 12px; width: 520px; max-width: 92vw; max-height: 82vh; min-height: 320px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  #email-preview-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); gap: 12px; }
  #email-preview-modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #email-preview-modal-close { background: transparent; border: none; font-size: 15px; color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; }
  #email-preview-modal-close:hover { background: var(--land-default); color: var(--text); }
  #email-preview-modal-body { padding: 16px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 160px; max-height: 50vh; }
  .ep-hint { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .ep-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 14px 0 6px; }
  .ep-group-title:first-child { margin-top: 0; }
  .ep-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
  .ep-row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ep-row-parent { font-size: 11px; color: var(--text-muted); }
  .ep-row-date { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
  #email-preview-modal-footer { border-top: 1px solid var(--border); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  #email-preview-modal-msg { font-size: 12px; color: var(--text-muted); flex: 1 1 0; }
  #email-preview-modal-actions { display: flex; gap: 8px; flex-shrink: 0; }
  #email-preview-cancel-btn, #email-preview-send-btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  #email-preview-cancel-btn:hover { background: var(--land-default); }
  #email-preview-send-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
  #email-preview-send-btn:hover { background: #000000; }
  #email-preview-send-btn:disabled { opacity: 0.6; cursor: default; }

  /* --- Settings (login/password only) --- */
  #settings-panel { max-width: 100%; }
  .settings-field { margin-bottom: 12px; }
  .settings-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .settings-field input, .settings-field select { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .settings-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .settings-btn:hover { background: var(--land-default); }
  .settings-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .settings-btn.primary:hover { background: #000000; }

  #settings-users-section-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
  #settings-users-table { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); margin-bottom: 14px; }
  .settings-header-row, .settings-user-row {
    display: grid;
    grid-template-columns: minmax(160px, 1.3fr) minmax(130px, 1fr) minmax(200px, 1.6fr) 190px 44px;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  .settings-header-row { background: var(--land-default); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; border-radius: 11px 11px 0 0; }
  #settings-users-table .settings-user-row:last-child { border-radius: 0 0 11px 11px; }
  .settings-user-row:last-child { border-bottom: none; }
  .settings-user-row:hover { background: #fbfaf7; }
  .settings-user-cell { min-width: 0; }
  .settings-user-row input {
    border: none; background: transparent; font-size: 13px; color: var(--text); width: 100%; padding: 6px 4px; border-radius: 4px;
  }
  .settings-user-row input:focus { background: var(--bg); outline: 1px solid var(--border-strong); }
  .settings-user-actions { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .settings-user-actions button { border: none; background: transparent; cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 5px; color: var(--text-muted); }
  .settings-user-actions button:hover { background: var(--land-default); color: var(--text); }
  .settings-user-actions .settings-user-delete:hover { background: #fcebeb; color: #a3312a; }

  .settings-email-dropdown { position: relative; }
  .settings-email-btn {
    border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; width: 100%; justify-content: center;
  }
  .settings-email-btn:hover { background: var(--land-default); }
  .settings-email-menu {
    display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: #fff; border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); z-index: 20; min-width: 170px; overflow: hidden;
  }
  .settings-email-menu.open { display: block; }
  .settings-email-menu button {
    display: block; width: 100%; text-align: left; border: none; background: #fff; color: var(--text); padding: 8px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .settings-email-menu button:hover { background: var(--land-default); }
  #settings-msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  /* --- Celular: a grade não cabe em tela estreita, então cada linha vira
     um cartão empilhado com o rótulo de cada campo em cima. --- */
  @media (max-width: 720px) {
    #app { padding: 16px 12px 40px; }
    #app-header { flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    #app-title { font-size: 17px; }
    #app-header-actions { gap: 8px; }
    #cloud-status { font-size: 11px; }
    #tasks-subnav { flex-wrap: wrap; }
    #login-gate-box { width: auto; max-width: 92vw; }

    .tasks-header-row { display: none; }
    /* Os campos fluem lado a lado e quebram sozinhos conforme a largura:
       2 por fileira num celular, 3 ou 4 numa janela estreita de desktop. */
    .tasks-row { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px; }
    .tasks-col-name { flex: 1 1 100%; padding-left: calc(var(--depth, 0) * 10px); flex-wrap: wrap; overflow: visible; }
    .tasks-name-input { font-size: 16px; }
    .tasks-name-multiline { width: 100%; }
    /* Arrastar e o autofill dependem do mouse; no toque não respondem. */
    .tasks-drag-handle, .tasks-fill-handle { display: none !important; }

    .tasks-mobile-edit { display: inline-flex; align-items: center; margin-left: auto; }
    .tasks-mobile-summary {
      display: block; flex: 1 1 100%; font-size: 12px; opacity: 0.75;
      padding-left: calc(var(--depth, 0) * 10px); margin-top: -2px;
    }
    /* Os campos só aparecem quando o lápis abre o cartão. */
    .tasks-row > div[data-label] { display: none; flex: 1 1 150px; min-width: 140px; }
    .tasks-row.tasks-mobile-open > div[data-label] { display: block; }
    .tasks-row > div[data-label]::before {
      content: attr(data-label);
      display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
      opacity: 0.6; margin-bottom: 2px;

    /* 16px é proposital: abaixo disso o iPhone dá zoom ao focar o campo. */

    .tasks-date-input { font-size: 16px; border: 1px solid var(--border); background: #fff; padding: 6px 8px; }

    .tasks-row.tasks-mobile-open .tasks-row-actions { display: flex; }
    .tasks-row-actions button { font-size: 14px; padding: 6px 11px; border: 1px solid var(--border); background: #fff; }
    .tasks-move-btn { display: inline-flex; align-items: center; }
    #tasks-footer { flex-direction: column; align-items: stretch; gap: 10px; }
    #tasks-add-btn { padding: 11px 14px; font-size: 14px; }
    #tasks-bulk-bar.visible { flex-wrap: wrap; }

    .tasks-late-row { flex-wrap: wrap; gap: 6px 10px; }

    #task-comments-modal, #email-preview-modal { max-height: 90vh; width: 94vw; }
    #tc-text-input, .tc-checklist-add-row input { font-size: 16px; }
    #email-preview-modal-footer { flex-wrap: wrap; gap: 8px; }

    .settings-header-row { display: none; }
    .settings-user-row { display: block; padding: 12px; }
    .settings-user-cell + .settings-user-cell, .settings-email-dropdown { margin-top: 10px; }
    .settings-user-cell::before {
      content: attr(data-label);
      display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-muted); margin-bottom: 3px;
    }
    .settings-user-row input { font-size: 16px; border: 1px solid var(--border); background: #fff; padding: 9px 10px; }
    .settings-email-btn { padding: 9px 12px; font-size: 13px; }
    .settings-email-menu { left: auto; right: 0; }

  }
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════
// SUPABASE — fill these in with YOUR new project's values
// (Settings → API in your Supabase dashboard)
// ══════════════════════════════════════════════════════════
const SUPABASE_URL = "https://ersknlnoeixddjczqlki.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyc2tubG5vZWl4ZGRqY3pxbGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODk5OTcsImV4cCI6MjEwMTk2NTk5N30.2n72bIMTpYpe49MJsclYEWB6njEwg0z0zP_CFkl2jtI";
const SUPABASE_TABLE_URL = `${SUPABASE_URL}/rest/v1/wpf_dashboard_data`;
const SUPABASE_HEADERS = {
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
  "Content-Type": "application/json"
};
const CLOUD_SECTIONS = ["tasks", "users"];

const TASKS_STORAGE_KEY = "tasks_std_data";
const PROJECTS_STORAGE_KEY = "tasks_std_projects";
const DEFAULT_PASSWORD = "nossaempresa"; // provisional password for every new account and every password reset
const USERS_STORAGE_KEY = "tasks_std_users";
const REVISION_KEY = "tasks_std_revision";

const TASK_STATUS_OPTIONS = ["Not Started", "In Progress", "Late", "Done", "On Hold", "Cancelled"];
const TASK_STATUS_COLORS = {
  "Not Started": { bg: "#f1efe8", text: "#444441", bar: "#b4b2a9" },
  "In Progress": { bg: "#e6f1fb", text: "#0c447c", bar: "#185fa5" },
  "Late":        { bg: "#fcebeb", text: "#791f1f", bar: "#a32d2d" },
  "Done":        { bg: "#eaf3de", text: "#173404", bar: "#3b6d11" },
  "On Hold":     { bg: "#fdf3d6", text: "#7a5b06", bar: "#854f0b" },
  "Cancelled":   { bg: "#efefec", text: "#6b6a63", bar: "#b4b2a9" }
};
// Ícones SVG desenhados inline (sem biblioteca externa). Herdam a cor do
// texto via currentColor e são dimensionados pelo CSS (.row-type-icon).
const ROW_TYPE_ICONS = {
  goal: `<svg class="row-type-icon" viewBox="-17 -17 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="15"/><circle cx="0" cy="0" r="8"/><circle cx="0" cy="0" r="2.4" fill="currentColor" stroke="none"/></svg>`,
  milestone: `<svg class="row-type-icon" viewBox="-17 -17 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 17 L-9 -16"/><path d="M-9 -16 L14 -16 L6 -5 L14 6 L-9 6 Z"/><path d="M-4 -6 L-1 -3 L7 -13"/></svg>`,
  task: `<svg class="row-type-icon" viewBox="-17 -17 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-14" width="28" height="28" rx="7"/><path d="M-6 0 L-1 5 L7 -5"/></svg>`
};
const ROW_TYPE_LABELS = { goal: "Goal", milestone: "Milestone", task: "Task" };

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}/${m}/${y}`;
}

// --- Seed data ---
const TASKS_SEED = [
  { id: "t-1", name: "Exemplo de Goal", rowType: "goal", status: "In Progress", startDate: "", endDate: "", assignees: [], comments: [], subtasks: [
    { id: "t-1-1", name: "Exemplo de Milestone", rowType: "milestone", status: "In Progress", startDate: "", endDate: "", assignees: [], comments: [], subtasks: [
      { id: "t-1-1-1", name: "Exemplo de Task", rowType: "task", status: "Not Started", startDate: "", endDate: todayISO(), assignees: [], comments: [], subtasks: [] }
    ]}
  ]}
];
const USERS_SEED = [
  { username: "karina", login: "karina", name: "Karina", email: "", password: DEFAULT_PASSWORD, role: "adm", mustChangePassword: true }
];

function ensureTaskDefaults(t, depth) {
  depth = depth || 0;
  t.id = t.id || ("t-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7));
  t.name = t.name || "";
  if (t.rowType !== "goal" && t.rowType !== "milestone" && t.rowType !== "task") {
    t.rowType = depth > 0 ? "task" : "milestone";
  }
  if (!TASK_STATUS_OPTIONS.includes(t.status)) t.status = "Not Started";
  if (t.startDate === undefined) t.startDate = "";
  if (t.endDate === undefined) t.endDate = "";
  if (!Array.isArray(t.assignees)) t.assignees = [];
  if (!Array.isArray(t.comments)) t.comments = [];
  if (!Array.isArray(t.subtasks)) t.subtasks = [];
  if (t.projectId === undefined) t.projectId = null; // só vale para item de topo
  t.subtasks.forEach(sub => ensureTaskDefaults(sub, depth + 1));
  return t;
}

let tasksData = [];
try {
  const stored = JSON.parse(localStorage.getItem(TASKS_STORAGE_KEY) || "null");
  tasksData = (Array.isArray(stored) && stored.length) ? stored : TASKS_SEED.map(t => JSON.parse(JSON.stringify(t)));
} catch (e) {
  tasksData = TASKS_SEED.map(t => JSON.parse(JSON.stringify(t)));
}
tasksData = tasksData.map(t => ensureTaskDefaults(t, 0));

let projectsList = [];
try {
  const stored = JSON.parse(localStorage.getItem(PROJECTS_STORAGE_KEY) || "null");
  projectsList = Array.isArray(stored) ? stored : [];
} catch (e) {
  projectsList = [];
}
// null = aba "Todos". Não é persistido: recarregar volta para Todos.
let projetoAtivo = null;

function ensureUserDefaults(u) {
  return { ...u, login: u.login || u.username, name: u.name || u.login || u.username, email: u.email || "", mustChangePassword: !!u.mustChangePassword };
}
let usersList = [];
try {
  const stored = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || "null");
  usersList = (Array.isArray(stored) && stored.length) ? stored : USERS_SEED.map(u => ({ ...u }));
} catch (e) {
  usersList = USERS_SEED.map(u => ({ ...u }));
}
usersList = usersList.map(ensureUserDefaults);

let currentUser = null;
function isAdm() { return !!currentUser && currentUser.role === "adm"; }

// --- Session persistence: keeps you logged in across refreshes for a
// while, instead of every reload dumping you back to the login screen. ---
const AUTH_SESSION_KEY = "tasks_std_auth_session";
const SESSION_MAX_AGE_MS = 12 * 60 * 60 * 1000; // 12 hours
function saveSession(user) {
  localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ username: user.username, role: user.role, savedAt: Date.now() }));
}
function clearSession() {
  localStorage.removeItem(AUTH_SESSION_KEY);
}
function tryRestoreSession() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(AUTH_SESSION_KEY) || "null"); } catch (e) { return null; }
  if (!raw || !raw.username) return null;
  if (Date.now() - raw.savedAt > SESSION_MAX_AGE_MS) { clearSession(); return null; }
  const u = usersList.find(x => x.username === raw.username);
  if (!u) { clearSession(); return null; } // account was deleted since — don't restore a session for it
  return { username: u.username, role: u.role };
}

let localRevision = parseInt(localStorage.getItem(REVISION_KEY) || "0", 10) || 0;
function bumpLocalRevision() { localRevision++; localStorage.setItem(REVISION_KEY, String(localRevision)); return localRevision; }

function saveTasksData() {
  localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasksData));
  bumpLocalRevision();
  scheduleCloudSave();
}
function saveProjectsList() {
  localStorage.setItem(PROJECTS_STORAGE_KEY, JSON.stringify(projectsList));
  bumpLocalRevision();
  scheduleCloudSave();
}
function saveUsersList() {
  localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(usersList));
  bumpLocalRevision();
  scheduleCloudSave();
}

// --- Cloud sync (Supabase) ---
let cloudSyncTimer = null;
let cloudUsersLoaded = false;
let initialCloudLoadPromise = null;

function setCloudStatus(state) {
  const el = document.getElementById("cloud-status");
  if (!el) return;
  const labels = { loading: "☁️ Carregando…", saving: "☁️ Salvando…", synced: "☁️ Sincronizado", error: "⚠️ Só salvo neste navegador" };
  const colors = { loading: "#77766f", saving: "#8a6d1f", synced: "#0f6e56", error: "#a3312a" };
  el.textContent = labels[state] || "";
  el.style.color = colors[state] || "";
}

function scheduleCloudSave() {
  clearTimeout(cloudSyncTimer);
  setCloudStatus("saving");
  cloudSyncTimer = setTimeout(() => {
    pushAllSectionsToCloud().then(() => setCloudStatus("synced")).catch(err => {
      console.warn("Cloud save failed:", err);
      setCloudStatus("error");
    });
  }, 800);
}

async function pushAllSectionsToCloud() {
  const rows = [
    { section: "tasks", data: tasksData, revision: localRevision, updated_at: new Date().toISOString() },
    { section: "users", data: usersList, revision: localRevision, updated_at: new Date().toISOString() },
    { section: "projects", data: projectsList, revision: localRevision, updated_at: new Date().toISOString() }
  ];
  const res = await fetch(SUPABASE_TABLE_URL, {
    method: "POST",
    headers: { ...SUPABASE_HEADERS, "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(rows)
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    throw new Error(`HTTP ${res.status}${detail ? " — " + detail.slice(0, 200) : ""}`);
  }
}

async function loadFromCloud() {
  setCloudStatus("loading");
  try {
    const res = await fetch(`${SUPABASE_TABLE_URL}?section=in.(tasks,users,projects)&select=*`, { headers: SUPABASE_HEADERS });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    const cloudRevision = rows.reduce((max, r) => Math.max(max, r.revision || 0), 0);
    if (cloudRevision > localRevision) {
      rows.forEach(r => {
        if (r.section === "tasks" && Array.isArray(r.data)) tasksData = r.data.map(t => ensureTaskDefaults(t, 0));
        if (r.section === "users" && Array.isArray(r.data) && r.data.length) usersList = r.data.map(ensureUserDefaults);
        if (r.section === "projects" && Array.isArray(r.data)) projectsList = r.data;
      });
      localRevision = cloudRevision;
      localStorage.setItem(REVISION_KEY, String(localRevision));
      localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasksData));
      localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(usersList));
      localStorage.setItem(PROJECTS_STORAGE_KEY, JSON.stringify(projectsList));
    } else if (localRevision > cloudRevision) {
      await pushAllSectionsToCloud();
    }
    setCloudStatus("synced");
  } catch (err) {
    console.warn("Cloud load failed, using local data:", err);
    setCloudStatus("error");
  }
  limparResponsavelPlaceholder();
  migrarResponsaveisParaUsername();
  cloudUsersLoaded = true;
  if (typeof renderProjectTabs === "function") renderProjectTabs();
  if (typeof renderTasksTable === "function") renderTasksTable();
  if (typeof renderSettingsUsersList === "function") renderSettingsUsersList();
  // Cloud data just landed — usersList may have changed, so re-check the
  // session against the freshest list before it's too late to bounce a
  // now-invalid one back to the login screen.
  if (currentUser) {
    const restored = tryRestoreSession();
    if (!restored) {
      currentUser = null;
      document.getElementById("app").classList.add("hidden");
      document.getElementById("login-gate-backdrop").classList.remove("hidden");
    }
  }
}
// Os responsáveis são gravados pelo username (que nunca muda) e traduzidos
// para o nome só na hora de exibir. Valor que não bate com nenhum usuário é
// mostrado como está, para nunca sumir da tela sem aviso.
function nomeDoResponsavel(valor) {
  const u = usersList.find(x => x.username === valor);
  return u ? (u.name || u.login || u.username) : valor;
}
function nomesDosResponsaveis(lista) {
  return (lista || []).map(nomeDoResponsavel);
}

// Migração única: antes o responsável era gravado pelo NOME, então renomear
// alguém em Settings órfãos todas as tasks dele. Converte o que der para
// username e deixa intacto o que não bater com ninguém.
function migrarResponsaveisParaUsername() {
  if (!usersList.length) return;
  let mudou = false;
  walkAllTasks(tasksData, t => {
    if (!Array.isArray(t.assignees)) return;
    const novo = t.assignees.map(valor => {
      if (usersList.some(u => u.username === valor)) return valor;
      const u = usersList.find(x => (x.name || "") === valor || (x.login || "") === valor);
      return u ? u.username : valor;
    });
    if (novo.some((v, i) => v !== t.assignees[i])) { t.assignees = novo; mudou = true; }
  });
  if (mudou) saveTasksData();
}

// Limpeza única: "Você" era um texto que vinha na task de exemplo, não um
// usuário de verdade. Como não existe ninguém com esse nome, ele não aparece
// no menu de responsáveis e não dá para desmarcar pela interface. Se um dia
// existir alguém chamado "Você", esta limpeza não mexe em nada.
function limparResponsavelPlaceholder() {
  if (usersList.some(u => (u.name || u.login || u.username) === "Você")) return;
  let mudou = false;
  walkAllTasks(tasksData, t => {
    if (Array.isArray(t.assignees) && t.assignees.includes("Você")) {
      t.assignees = t.assignees.filter(a => a !== "Você");
      mudou = true;
    }
  });
  if (mudou) saveTasksData();
}

// --- Login ---
function hideLoginGate() {
  document.getElementById("login-gate-backdrop").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}
let pendingPasswordChangeUsername = null;

async function attemptLogin() {
  const login = document.getElementById("login-gate-username").value.trim();
  const password = document.getElementById("login-gate-password").value;
  if (!cloudUsersLoaded) {
    document.getElementById("login-gate-error").textContent = "Carregando dados… um instante.";
    await initialCloudLoadPromise.catch(() => {});
  }
  const match = usersList.find(u => (u.login || u.username || "").toLowerCase() === login.toLowerCase() && u.password === password);
  if (!match) {
    document.getElementById("login-gate-error").textContent = "Usuário ou senha incorretos.";
    return;
  }
  if (match.mustChangePassword) {
    pendingPasswordChangeUsername = match.username;
    document.getElementById("login-gate-login-fields").classList.add("hidden");
    document.getElementById("login-gate-pw-fields").classList.remove("hidden");
    document.getElementById("login-gate-pw-error").textContent = "";
    document.getElementById("login-gate-new-password").value = "";
    document.getElementById("login-gate-new-password-confirm").value = "";
    document.getElementById("login-gate-new-password").focus();
    return;
  }
  currentUser = { username: match.username, role: match.role };
  saveSession(currentUser);
  hideLoginGate();
  afterLogin();
}

function submitPasswordChange() {
  const pw1 = document.getElementById("login-gate-new-password").value;
  const pw2 = document.getElementById("login-gate-new-password-confirm").value;
  const errEl = document.getElementById("login-gate-pw-error");
  if (!pw1 || pw1.length < 4) { errEl.textContent = "A senha precisa ter pelo menos 4 caracteres."; return; }
  if (pw1 !== pw2) { errEl.textContent = "As senhas não coincidem."; return; }
  const u = usersList.find(x => x.username === pendingPasswordChangeUsername);
  if (!u) { errEl.textContent = "Sessão expirada — tenta entrar de novo."; return; }
  u.password = pw1;
  u.mustChangePassword = false;
  saveUsersList();
  currentUser = { username: u.username, role: u.role };
  saveSession(currentUser);
  hideLoginGate();
  afterLogin();
}

document.getElementById("login-gate-submit").addEventListener("click", attemptLogin);
document.getElementById("login-gate-password").addEventListener("keydown", e => { if (e.key === "Enter") attemptLogin(); });
document.getElementById("login-gate-pw-submit").addEventListener("click", submitPasswordChange);
document.getElementById("login-gate-new-password-confirm").addEventListener("keydown", e => { if (e.key === "Enter") submitPasswordChange(); });

document.getElementById("logout-btn").addEventListener("click", () => {
  currentUser = null;
  clearSession();
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login-gate-backdrop").classList.remove("hidden");
  document.getElementById("login-gate-login-fields").classList.remove("hidden");
  document.getElementById("login-gate-pw-fields").classList.add("hidden");
  document.getElementById("login-gate-username").value = "";
  document.getElementById("login-gate-password").value = "";
  document.getElementById("login-gate-error").textContent = "";
});

  document.getElementById("settings-admin-section").classList.toggle("hidden", !isAdm());

// --- Tasks: find/walk helpers ---
function findTaskById(list, id) {
  for (const t of list) {
    if (t.id === id) return t;
    const found = findTaskById(t.subtasks, id);
    if (found) return found;
  }
  return null;
}
function findParentTaskName(id) {
  function search(list, parentName) {
    for (const t of list) {
      if (t.id === id) return parentName;
      const found = search(t.subtasks, t.name);
      if (found !== undefined) return found;
    }
    return undefined;
  }
  return search(tasksData, null) || null;
}
function removeTaskById(list, id) {
  const idx = list.findIndex(t => t.id === id);
  if (idx !== -1) { list.splice(idx, 1); return true; }
  for (const t of list) {
    if (removeTaskById(t.subtasks, id)) return true;
  }
  return false;
}
function walkAllTasks(list, fn) {
  list.forEach(t => { fn(t); walkAllTasks(t.subtasks, fn); });
}

// Overdue = not Done/Cancelled, has an end date in the past. Auto-flips
// status to "Late" (mirrors the big dashboard's behavior) unless it's
// already Done/Cancelled/On Hold.
function autoSyncLateStatuses() {
  const today = todayISO();
  let changed = false;
  walkAllTasks(tasksData, t => {
    const overdue = t.endDate && t.endDate < today && t.status !== "Done" && t.status !== "Cancelled" && t.status !== "On Hold";
    if (overdue && t.status !== "Late") { t.status = "Late"; changed = true; }
  });
  if (changed) { localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasksData)); }
}

// --- Projetos: uma camada acima dos goals. Só item de topo pertence a um
// projeto; as subtasks acompanham o pai. Excluir um projeto não apaga nada,
// os itens dele voltam para "sem projeto". ---
function itensDoProjetoAtivo() {
  return projetoAtivo === null ? tasksData : tasksData.filter(t => t.projectId === projetoAtivo);
}
function renderProjectTabs() {
  const el = document.getElementById("projects-bar");
  if (!el) return;
  const abas = [`<button class="project-tab ${projetoAtivo === null ? "active" : ""}" data-id="" type="button">Todos</button>`]
    .concat(projectsList.map(p => `<button class="project-tab ${projetoAtivo === p.id ? "active" : ""}" data-id="${escAttr(p.id)}" type="button">${esc(p.name)}</button>`));
  const projeto = projectsList.find(p => p.id === projetoAtivo);
  el.innerHTML = abas.join("")
    + `<button class="project-tab project-tab-add" id="project-add-btn" type="button">+ Projeto</button>`
    + (projeto ? `<span class="project-actions"><button id="project-rename-btn" type="button" title="Renomear projeto">✎</button><button id="project-delete-btn" type="button" title="Excluir projeto">🗑</button></span>` : "");

  el.querySelectorAll(".project-tab[data-id]").forEach(btn => {
    btn.addEventListener("click", () => {
      projetoAtivo = btn.dataset.id || null;
      renderProjectTabs();
      renderTasksTable();
      if (tasksViewMode === "late") renderTasksLateView();
    });
  });
  const btnAdd = document.getElementById("project-add-btn");
  if (btnAdd) btnAdd.addEventListener("click", () => {
    const nome = prompt("Nome do projeto:");
    if (!nome || !nome.trim()) return;
    const id = "proj-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
    projectsList.push({ id, name: nome.trim() });
    projetoAtivo = id;
    saveProjectsList();
    renderProjectTabs();
    renderTasksTable();
  });
  const btnRename = document.getElementById("project-rename-btn");
  if (btnRename) btnRename.addEventListener("click", () => {
    const nome = prompt("Novo nome do projeto:", projeto.name);
    if (!nome || !nome.trim()) return;
    projeto.name = nome.trim();
    saveProjectsList();
    renderProjectTabs();
  });
  const btnDelete = document.getElementById("project-delete-btn");
  if (btnDelete) btnDelete.addEventListener("click", () => {
    const quantos = tasksData.filter(t => t.projectId === projeto.id).length;
    if (!confirm(`Excluir o projeto "${projeto.name}"? ${quantos ? `Os ${quantos} item(ns) dele voltam para "sem projeto" — nada é apagado.` : ""}`)) return;
    tasksData.forEach(t => { if (t.projectId === projeto.id) t.projectId = null; });
    projectsList = projectsList.filter(p => p.id !== projeto.id);
    projetoAtivo = null;
    saveProjectsList();
    saveTasksData();
    renderProjectTabs();
    renderTasksTable();
  });
}

// --- Task tree rendering ---
let tasksExpanded = new Set();
let tasksSelected = new Set();
// Nomes mostrados em várias linhas. Só vale para a sessão aberta — não vai
// para o localStorage nem para a nuvem, é preferência de visualização.
let tasksNameExpanded = new Set();
// Cartões abertos para edição no celular. Também vale só para a sessão.
let tasksMobileOpen = new Set();
let tasksViewMode = "list";

function taskStatusOptionsMarkup(selected) {
  return TASK_STATUS_OPTIONS.map(s => `<option value="${s}" ${s === selected ? "selected" : ""}>${s}</option>`).join("");
}
function rowTypeOptionsMarkup(selected) {
  return ["goal", "milestone", "task"].map(rt => `<option value="${rt}" ${rt === selected ? "selected" : ""}>${ROW_TYPE_LABELS[rt]}</option>`).join("");
}

function renderTaskRow(t, depth) {
  const hasChildren = t.subtasks.length > 0;
  const expanded = tasksExpanded.has(t.id);
  const colors = TASK_STATUS_COLORS[t.status] || TASK_STATUS_COLORS["Not Started"];
  const icon = ROW_TYPE_ICONS[t.rowType] || "";
  // Task pinta a linha inteira com a cor do status; goal e milestone só
  // ganham a barra lateral e o texto na cor, pra não virar um arco-íris.
  const nameOpen = tasksNameExpanded.has(t.id);
  const cardOpen = tasksMobileOpen.has(t.id);
  // Resumo do celular: só o essencial. Sem data nem responsável, nem aparece.
  const resumo = [];
  if (t.endDate) resumo.push("Vence " + formatDate(t.endDate));
  if (t.assignees && t.assignees.length) resumo.push(esc(nomesDosResponsaveis(t.assignees).join(", ")));
  const resumoHtml = resumo.length ? `<div class="tasks-mobile-summary">${resumo.join(" · ")}</div>` : "";
  const nameField = nameOpen
    ? `<textarea class="tasks-name-input tasks-name-multiline" data-id="${t.id}" data-field="name" rows="1">${esc(t.name)}</textarea>`
    : `<input class="tasks-name-input" data-id="${t.id}" data-field="name" value="${escAttr(t.name)}">`;
  const rowStyle = t.rowType === "task"
    ? `background:${colors.bg};color:${colors.text};--depth:${depth}`
    : `border-left-color:${colors.bar};color:${colors.text};--depth:${depth}`;
  const rows = [];
  rows.push(`
    <div class="tasks-row ${cardOpen ? "tasks-mobile-open" : ""}" data-id="${t.id}" style="${rowStyle}">
      <div class="tasks-col-name">
        <span class="tasks-drag-handle" data-id="${t.id}" title="Arraste para mover"><svg viewBox="0 0 10 16" fill="currentColor"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="7" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="7" cy="13" r="1.3"/></svg></span>
        <input type="checkbox" class="tasks-select-checkbox" data-id="${t.id}" ${tasksSelected.has(t.id) ? "checked" : ""}>
        <button class="tasks-toggle ${hasChildren ? "" : "empty"}" data-id="${t.id}" type="button">${expanded ? "▼" : "▶"}</button>
        <span class="tasks-row-icon" title="${ROW_TYPE_LABELS[t.rowType]}">${icon}</span>
        ${nameField}
        <button class="tasks-name-expand ${nameOpen ? "open visible" : ""}" data-id="${t.id}" type="button" title="${nameOpen ? "Recolher o texto" : "Mostrar o texto inteiro"}"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 L6 8 L9.5 4.5"/></svg></button>
        <button class="tasks-comments-btn ${t.comments.length ? "has-comments" : ""}" data-id="${t.id}" type="button" title="${t.comments.length ? t.comments.length + " comentário(s)" : "Adicionar comentário"}">💬${t.comments.length ? `<span class="tasks-comments-count">${t.comments.length}</span>` : ""}</button>
        <span class="tasks-fill-handle" data-id="${t.id}" data-field="name" title="Arraste para copiar o nome para as linhas abaixo"></span>
        <button class="tasks-mobile-edit ${cardOpen ? "open" : ""}" data-id="${t.id}" type="button" title="${cardOpen ? "Fechar" : "Editar"}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.2 2.3 L13.7 4.8 L5.5 13 L2.5 13.5 L3 10.5 Z"/><path d="M10 3.5 L12.5 6"/></svg></button>
      </div>
      ${resumoHtml}
      <div data-label="Tipo"><select class="tasks-rowtype-select" data-id="${t.id}">${rowTypeOptionsMarkup(t.rowType)}</select></div>
      <div class="tasks-col-status" data-label="Status">
        <select class="tasks-status-select" data-id="${t.id}" style="background:${colors.bg};color:${colors.text}">${taskStatusOptionsMarkup(t.status)}</select>
        <span class="tasks-fill-handle" data-id="${t.id}" data-field="status" title="Arraste para copiar o status para as linhas abaixo"></span>
      </div>
      <div class="tasks-col-date" data-label="Início">
        <input type="date" class="tasks-date-input" data-id="${t.id}" data-field="startDate" value="${t.startDate || ""}">
        <span class="tasks-fill-handle" data-id="${t.id}" data-field="startDate" title="Arraste para copiar a data para as linhas abaixo"></span>
      </div>
      <div class="tasks-col-date" data-label="Fim">
        <input type="date" class="tasks-date-input" data-id="${t.id}" data-field="endDate" value="${t.endDate || ""}">
        <span class="tasks-fill-handle" data-id="${t.id}" data-field="endDate" title="Arraste para copiar a data para as linhas abaixo"></span>
      </div>
      <div class="tasks-col-assignee" data-label="Responsáveis">
        <div class="tasks-assignee-dropdown" data-id="${t.id}">
          <button class="tasks-assignee-toggle" type="button">${(t.assignees && t.assignees.length) ? esc(nomesDosResponsaveis(t.assignees).join(", ")) : "+ Responsável"}</button>
          <div class="tasks-assignee-menu">
            ${usersList.length
              ? usersList.map(u => `<label class="tasks-assignee-option"><input type="checkbox" value="${escAttr(u.username)}" ${(t.assignees || []).includes(u.username) ? "checked" : ""}> ${esc(u.name || u.login)}</label>`).join("")
              : `<div class="tasks-assignee-empty">Nenhum usuário em Settings ainda.</div>`}
          </div>
        </div>
        <span class="tasks-fill-handle" data-id="${t.id}" data-field="assignees" title="Arraste para copiar os responsáveis para as linhas abaixo"></span>
      </div>
      <div class="tasks-row-actions">
        <button class="tasks-move-btn tasks-move-up" data-id="${t.id}" data-dir="-1" title="Mover para cima" type="button"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5 L6 4 L9.5 7.5"/></svg></button>
        <button class="tasks-move-btn tasks-move-down" data-id="${t.id}" data-dir="1" title="Mover para baixo" type="button"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 L6 8 L9.5 4.5"/></svg></button>
        <button class="tasks-add-sub-btn" data-id="${t.id}" title="Adicionar subtask" type="button">+</button>
        <button class="tasks-delete-btn" data-id="${t.id}" title="Excluir" type="button">🗑</button>
      </div>
    </div>
  `);
  if (hasChildren && expanded) {
    t.subtasks.forEach(sub => rows.push(renderTaskRow(sub, depth + 1)));
  }
  return rows.join("");
}

function renderTasksTable() {
  autoSyncLateStatuses();
  const body = document.getElementById("tasks-table-body");
  const raiz = itensDoProjetoAtivo();
  body.innerHTML = raiz.length
    ? raiz.map(t => renderTaskRow(t, 0)).join("")
    : `<div id="tasks-empty">Nenhum item neste projeto ainda.</div>`;

  body.querySelectorAll(".tasks-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      if (tasksExpanded.has(id)) tasksExpanded.delete(id); else tasksExpanded.add(id);
      renderTasksTable();
    });
  });
  body.querySelectorAll(".tasks-select-checkbox").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) tasksSelected.add(cb.dataset.id); else tasksSelected.delete(cb.dataset.id);
      updateTasksBulkBar();
    });
  });
  body.querySelectorAll(".tasks-name-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const t = findTaskById(tasksData, inp.dataset.id);
      if (t) { t.name = inp.value; saveTasksData(); }
    });
    inp.addEventListener("input", updateNameOverflowFlags);
  });
  body.querySelectorAll(".tasks-name-multiline").forEach(area => {
    autoGrowNameField(area);
    area.addEventListener("input", () => autoGrowNameField(area));
  });
  body.querySelectorAll(".tasks-name-expand").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      if (tasksNameExpanded.has(id)) tasksNameExpanded.delete(id); else tasksNameExpanded.add(id);
      renderTasksTable();
    });
  });
  body.querySelectorAll(".tasks-rowtype-select").forEach(sel => {
    sel.addEventListener("change", () => {
      const t = findTaskById(tasksData, sel.dataset.id);
      if (t) { t.rowType = sel.value; saveTasksData(); renderTasksTable(); }
    });
  });
  body.querySelectorAll(".tasks-status-select").forEach(sel => {
    sel.addEventListener("change", () => {
      const t = findTaskById(tasksData, sel.dataset.id);
      if (t) { t.status = sel.value; saveTasksData(); renderTasksTable(); }
    });
  });
  body.querySelectorAll(".tasks-date-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const t = findTaskById(tasksData, inp.dataset.id);
      if (t) { t[inp.dataset.field] = inp.value; saveTasksData(); }
    });
  });
  body.querySelectorAll(".tasks-assignee-dropdown").forEach(dropdown => {
    const id = dropdown.dataset.id;
    const toggle = dropdown.querySelector(".tasks-assignee-toggle");
    const menu = dropdown.querySelector(".tasks-assignee-menu");
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasOpen = menu.classList.contains("open");
      document.querySelectorAll(".tasks-assignee-menu.open").forEach(m => m.classList.remove("open"));
      if (!wasOpen) menu.classList.add("open");
    });
    menu.querySelectorAll("input[type='checkbox']").forEach(cb => {
      cb.addEventListener("change", () => {
        const t = findTaskById(tasksData, id);
        if (!t) return;
        if (!Array.isArray(t.assignees)) t.assignees = [];
        if (cb.checked) {
          if (!t.assignees.includes(cb.value)) t.assignees.push(cb.value);
        } else {
          t.assignees = t.assignees.filter(name => name !== cb.value);
        }
        saveTasksData();
        // Update the toggle's label live instead of a full re-render, so
        // the menu stays open while picking several people in one go.
        toggle.textContent = t.assignees.length ? nomesDosResponsaveis(t.assignees).join(", ") : "+ Responsável";
      });
    });
  });
  body.querySelectorAll(".tasks-mobile-edit").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      if (tasksMobileOpen.has(id)) tasksMobileOpen.delete(id); else tasksMobileOpen.add(id);
      renderTasksTable();
    });
  });
  body.querySelectorAll(".tasks-move-btn").forEach(btn => {
    const found = findTaskContainer(tasksData, btn.dataset.id);
    const dir = parseInt(btn.dataset.dir, 10);
    // Já está na ponta da lista de irmãos: não tem para onde ir.
    if (!found || found.index + dir < 0 || found.index + dir >= found.list.length) btn.disabled = true;
    btn.addEventListener("click", () => {
      if (moveTaskAmongSiblings(btn.dataset.id, dir)) { saveTasksData(); renderTasksTable(); }
    });
  });
  body.querySelectorAll(".tasks-add-sub-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const parent = findTaskById(tasksData, btn.dataset.id);
      if (!parent) return;
      const newId = "t-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
      parent.subtasks.push({ id: newId, name: "Nova task", rowType: "task", status: "Not Started", startDate: "", endDate: "", assignees: [], comments: [], subtasks: [] });
      tasksExpanded.add(parent.id);
      saveTasksData();
      renderTasksTable();
    });
  });
  body.querySelectorAll(".tasks-delete-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm("Excluir esta task e todas as subtasks dela?")) return;
      removeTaskById(tasksData, btn.dataset.id);
      tasksSelected.delete(btn.dataset.id);
      saveTasksData();
      renderTasksTable();
      updateTasksBulkBar();
    });
  });
  body.querySelectorAll(".tasks-comments-btn").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); openTaskCommentsModal(btn.dataset.id); });
  });
  wireFillHandles(body);
  wireDragAndDrop(body);
  updateNameOverflowFlags();
}

// Cresce o campo multi-linha até caber o texto inteiro, sem barra de rolagem.
function autoGrowNameField(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
// O botão de expandir só aparece quando o texto realmente não cabe na
// largura disponível — em nome curto ele não polui a linha.
function updateNameOverflowFlags() {
  document.querySelectorAll("#tasks-table-body .tasks-row").forEach(row => {
    const field = row.querySelector(".tasks-name-input");
    const btn = row.querySelector(".tasks-name-expand");
    if (!field || !btn) return;
    if (tasksNameExpanded.has(row.dataset.id)) { btn.classList.add("visible"); return; }
    btn.classList.toggle("visible", field.scrollWidth > field.clientWidth + 1);
  });
}
// Redimensionar a janela muda o que cabe; a fonte só chega depois do
// primeiro desenho e muda a medida também.
window.addEventListener("resize", updateNameOverflowFlags);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNameOverflowFlags);

// --- Fill handle: click a cell (name/status/dates/assignees) to select it,
// then drag the little square at its corner up or down to copy that one
// value onto every row the drag passes over — like a spreadsheet's autofill.
let tasksFill = null; // { field, value, startIndex, ids } while a drag is in progress

function tasksFlatRowIds() {
  return [...document.querySelectorAll("#tasks-table-body .tasks-row")].map(el => el.dataset.id);
}
function tasksClearFillPreview() {
  document.querySelectorAll(".tasks-fill-target").forEach(el => el.classList.remove("tasks-fill-target"));
}
function tasksFindFieldCell(rowEl, field) {
  const input = rowEl.querySelector(`[data-field="${field}"]`);
  return input ? input.closest(".tasks-row > div") : null;
}
function wireFillHandles(body) {
  body.querySelectorAll(".tasks-fill-handle").forEach(handle => {
    handle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const ids = tasksFlatRowIds();
      const startIndex = ids.indexOf(handle.dataset.id);
      const t = findTaskById(tasksData, handle.dataset.id);
      if (startIndex === -1 || !t) return;
      const raw = t[handle.dataset.field];
      tasksFill = { field: handle.dataset.field, value: Array.isArray(raw) ? [...raw] : raw, startIndex, ids };
      handle.classList.add("dragging");
      document.body.classList.add("tasks-fill-active");
    });
  });
}
document.addEventListener("mousemove", (e) => {
  if (!tasksFill) return;
  tasksClearFillPreview();
  const rowEl = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tasks-row");
  if (!rowEl) return;
  const targetIndex = tasksFill.ids.indexOf(rowEl.dataset.id);
  if (targetIndex === -1) return;
  const [from, to] = targetIndex > tasksFill.startIndex
    ? [tasksFill.startIndex + 1, targetIndex]
    : [targetIndex, tasksFill.startIndex - 1];
  if (from > to) return;
  const rows = [...document.querySelectorAll("#tasks-table-body .tasks-row")];
  for (let i = from; i <= to; i++) {
    const cell = tasksFindFieldCell(rows[i], tasksFill.field);
    if (cell) cell.classList.add("tasks-fill-target");
  }
});
document.addEventListener("mouseup", (e) => {
  if (!tasksFill) return;
  const { field, value, startIndex, ids } = tasksFill;
  const rowEl = document.elementFromPoint(e.clientX, e.clientY)?.closest(".tasks-row");
  tasksClearFillPreview();
  document.querySelectorAll(".tasks-fill-handle.dragging").forEach(h => h.classList.remove("dragging"));
  document.body.classList.remove("tasks-fill-active");
  tasksFill = null;
  if (!rowEl) return;
  const targetIndex = ids.indexOf(rowEl.dataset.id);
  if (targetIndex === -1 || targetIndex === startIndex) return;
  const [from, to] = targetIndex > startIndex ? [startIndex + 1, targetIndex] : [targetIndex, startIndex - 1];
  if (from > to) return;
  for (let i = from; i <= to; i++) {
    const t = findTaskById(tasksData, ids[i]);
    if (t) t[field] = Array.isArray(value) ? [...value] : value;
  }
  saveTasksData();
  renderTasksTable();
});

// --- Arrastar e soltar: reordena as linhas movendo o item (com todas as
// subtasks dele junto). Soltar no topo/rodapé de uma linha põe o item como
// irmão dela; soltar no meio põe como filho. Só a alça inicia o arraste,
// pra não atrapalhar quem está editando os campos da linha. ---
let tasksDrag = null;       // { id } enquanto uma linha está sendo arrastada
let tasksDropTarget = null; // { id, position } última posição válida sob o cursor

function findTaskContainer(list, id) {
  const idx = list.findIndex(t => t.id === id);
  if (idx !== -1) return { list, index: idx };
  for (const t of list) {
    const found = findTaskContainer(t.subtasks, id);
    if (found) return found;
  }
  return null;
}
// Impede soltar um item dentro dele mesmo ou de um descendente — isso
// arrancaria o galho da árvore e perderia as tasks.
function isSelfOrDescendant(ancestorId, id) {
  if (ancestorId === id) return true;
  const ancestor = findTaskById(tasksData, ancestorId);
  if (!ancestor) return false;
  let found = false;
  walkAllTasks(ancestor.subtasks, t => { if (t.id === id) found = true; });
  return found;
}
function moveTask(dragId, targetId, position) {
  if (!dragId || !targetId || isSelfOrDescendant(dragId, targetId)) return false;
  const src = findTaskContainer(tasksData, dragId);
  if (!src) return false;
  const [moved] = src.list.splice(src.index, 1);
  if (position === "inside") {
    const target = findTaskById(tasksData, targetId);
    if (!target) { src.list.splice(src.index, 0, moved); return false; }
    target.subtasks.push(moved);
    tasksExpanded.add(targetId);
  } else {
    const dst = findTaskContainer(tasksData, targetId);
    if (!dst) { src.list.splice(src.index, 0, moved); return false; }
    dst.list.splice(dst.index + (position === "after" ? 1 : 0), 0, moved);
  }
  return true;
}
// Sobe ou desce um item uma posição entre os irmãos dele. Não muda o pai —
// para reaninhar, é o arraste (que só funciona no computador).
function moveTaskAmongSiblings(id, dir) {
  const found = findTaskContainer(tasksData, id);
  if (!found) return false;
  const alvo = found.index + dir;
  if (alvo < 0 || alvo >= found.list.length) return false;
  const [item] = found.list.splice(found.index, 1);
  found.list.splice(alvo, 0, item);
  return true;
}
function clearDropMarks() {
  document.querySelectorAll(".drop-before, .drop-after, .drop-inside")
    .forEach(el => el.classList.remove("drop-before", "drop-after", "drop-inside"));
}
function wireDragAndDrop(body) {
  body.querySelectorAll(".tasks-drag-handle").forEach(handle => {
    const row = handle.closest(".tasks-row");
    if (!row) return;
    handle.addEventListener("mousedown", () => { row.setAttribute("draggable", "true"); });
    // Clique sem arrastar: devolve a linha ao estado normal.
    handle.addEventListener("mouseup", () => { row.removeAttribute("draggable"); });
  });
  body.querySelectorAll(".tasks-row").forEach(row => {
    row.addEventListener("dragstart", e => {
      if (tasksFill) { e.preventDefault(); return; } // autofill em andamento tem prioridade
      tasksDrag = { id: row.dataset.id };
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", row.dataset.id); } catch (err) {}
      row.classList.add("tasks-dragging");
    });
    row.addEventListener("dragend", () => {
      row.removeAttribute("draggable");
      row.classList.remove("tasks-dragging");
      clearDropMarks();
      tasksDrag = null;
      tasksDropTarget = null;
    });
    row.addEventListener("dragover", e => {
      if (!tasksDrag) return;
      const id = row.dataset.id;
      if (isSelfOrDescendant(tasksDrag.id, id)) { clearDropMarks(); tasksDropTarget = null; return; }
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rect = row.getBoundingClientRect();
      const rel = (e.clientY - rect.top) / rect.height;
      const position = rel < 0.25 ? "before" : (rel > 0.75 ? "after" : "inside");
      clearDropMarks();
      row.classList.add("drop-" + position);
      tasksDropTarget = { id, position };
    });
    row.addEventListener("drop", e => {
      e.preventDefault();
      if (!tasksDrag || !tasksDropTarget) return;
      const moved = moveTask(tasksDrag.id, tasksDropTarget.id, tasksDropTarget.position);
      clearDropMarks();
      tasksDrag = null;
      tasksDropTarget = null;
      if (moved) { saveTasksData(); renderTasksTable(); }
    });
  });
}

function getAllOverdueTasks() {
  const today = todayISO();
  const list = [];
  function isOverdue(t) { return t.status !== "Done" && t.status !== "Cancelled" && t.endDate && t.endDate < today; }
  function walk(items) {
    items.forEach(t => {
      if (t.rowType === "task" && isOverdue(t)) list.push(t);
      walk(t.subtasks);
    });
  }
  walk(itensDoProjetoAtivo());
  return list.sort((a, b) => (a.endDate < b.endDate ? -1 : 1));
}
function renderTasksLateView() {
  const items = getAllOverdueTasks();
  const el = document.getElementById("tasks-late-list");

}

    return `<div class="tc-block" data-cid="${comment.id}">

      <span class="tc-block-meta">${esc(who)} · ${esc(when)} · ${doneCount}/${comment.items.length}</span>

// --- Email digest (reuses the SAME Apps Script Web App the big WPF
// dashboard already has deployed — this only adds the client side that
// calls it, no new backend needed). O casamento com t.assignees é feito
// pelo username, então renomear a pessoa não quebra o envio. ---
const EMAIL_DIGEST_ORDER = ["Late", "Not Started", "In Progress"];
const DONE_LIKE_STATUSES = ["Done", "Cancelled"];
function tomorrowISODash() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}
function buildDigestForPerson(username) {
  const today = todayISO();
  const grouped = { "Late": [], "Not Started": [], "In Progress": [] };
  function walk(items, parentName) {
    items.forEach(t => {
      if (t.rowType === "task" && grouped[t.status] && (t.assignees || []).includes(username) && t.startDate && t.startDate <= today) {
        grouped[t.status].push({ id: t.id, name: t.name, status: t.status, parent: parentName, startDate: t.startDate, endDate: t.endDate });
      }
      walk(t.subtasks, t.name);
    });
  }
  walk(tasksData, null);
  return grouped;
}
function buildDueTomorrowForPerson(username) {
  const tomorrow = tomorrowISODash();
  const out = [];
  function walk(items, parentName) {
    items.forEach(t => {
      if (t.rowType === "task" && (t.assignees || []).includes(username) && t.endDate === tomorrow && !DONE_LIKE_STATUSES.includes(t.status)) {
        out.push({ id: t.id, name: t.name, status: t.status, parent: parentName, startDate: t.startDate, endDate: t.endDate });
      }
      walk(t.subtasks, t.name);
    });
  }
  walk(tasksData, null);
  return out;
}

function epRowHtml(t, type) {
  const dateLabel = type === "due_tomorrow" ? `Vence ${formatDate(t.endDate)}` : (t.status === "Late" ? `Venceu ${formatDate(t.endDate)}` : (t.endDate ? formatDate(t.endDate) : ""));

function openEmailPreview(username, type, btn) {
  const url = getEmailWebhookUrl();
  const person = usersList.find(u => u.username === username);
  if (!person) return;
  const personName = person.name || person.login || person.username;
  if (!url || url === "PASTE_YOUR_APPS_SCRIPT_URL_HERE") { settingsMsg("A URL do Apps Script ainda não foi configurada no código — pede pra alguém preencher a constante EMAIL_WEBHOOK_URL.", true); return; }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
    settingsMsg("Essa URL não parece uma URL de Apps Script válida — precisa começar com \"https://script.google.com/macros/s/\" e terminar em \"/exec\".", true);
    return;
  }
  const email = (person.email || "").trim();
  if (!email) { settingsMsg(`${personName} não tem email cadastrado — preenche o campo de email dela na linha acima primeiro.`, true); return; }

  let tasks, title, body;
  if (type === "due_tomorrow") {
    tasks = buildDueTomorrowForPerson(username);
    if (!tasks.length) { settingsMsg(`${personName} não tem nenhuma tarefa vencendo amanhã — nada foi enviado.`, true); return; }
    title = `Vence amanhã — ${personName}`;
    body = `<p class="ep-hint">Pré-visualização — nada foi enviado ainda.</p>` + tasks.map(t => epRowHtml(t, type)).join("");
  } else {
    const grouped = buildDigestForPerson(username);
    tasks = EMAIL_DIGEST_ORDER.flatMap(status => grouped[status]);
    if (!tasks.length) { settingsMsg(`${personName} não tem tarefas pendentes hoje — nada foi enviado.`, true); return; }
    title = `Digest de hoje — ${personName}`;
    body = `<p class="ep-hint">Pré-visualização — nada foi enviado ainda.</p>` + EMAIL_DIGEST_ORDER.filter(s => grouped[s].length).map(status =>
      `<div class="ep-group-title">${status}</div>` + grouped[status].map(t => epRowHtml(t, type)).join("")
    ).join("");
  }

  pendingEmailSend = { personName, type, email, tasks, btn };
  document.getElementById("email-preview-modal-title").textContent = title;
  document.getElementById("email-preview-modal-body").innerHTML = body;
  document.getElementById("email-preview-modal-msg").textContent = `Enviar para ${email}`;
  document.getElementById("email-preview-send-btn").disabled = false;
  document.getElementById("email-preview-send-btn").textContent = "Enviar agora";
  document.getElementById("email-preview-modal-backdrop").classList.remove("hidden");

  if (!pendingEmailSend) return;
  const { personName, type, email, tasks, btn } = pendingEmailSend;
