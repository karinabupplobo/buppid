<!DOCTYPE html>
<!--
  DASH INTERNA DA BUPP
  ====================
  Mesma linguagem visual da plataforma do professor (plataforma.html), mesmo
  arquivo de dados (dados-mock.js). A diferença é o QUE se vê:

    · o professor vê as turmas dele;
    · a dash interna vê TODOS os professores, TODAS as turmas, TODAS as aulas,
      e as ANOTAÇÕES INTERNAS por aluno — que nem o aluno nem o RH do cliente
      têm acesso.

  A tela central é uma PLANILHA: uma linha por aluno por aula, com presença,
  engajamento, desempenho na trilha e a anotação do professor. Filtros por
  professor, empresa e busca livre, mais exportação em CSV.

  Selo de papel: "internal" (ver regra de idioma em docs/plataforma.md).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp — Interna</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* COMB 2 — MARROM #54402F + AZUL-BEBÊ #A8D5F2 + branco.
       Comb 1 (limão + cinza): git checkout comb-1-limao-cinza
       Comb 3 (cinza + azul):  git checkout comb-3-cinza-azul

       Azul-bebê é acento de PREENCHIMENTO: sobre branco tem 1,56:1, nunca
       é texto. Texto sobre azul é sempre o marrom (6,3:1).
       O fundo da página é levemente quente, para acompanhar o marrom. */
    --teal-escuro: #54402F;         /* cor escura: marrom */
    --amarelo-neon: #A8D5F2;        /* acento: azul-bebê */
    --limao-claro: #E4F1FA;         /* azul lavado, para fundos suaves */
    --bg-dash: #F7F5F2;             /* fundo levemente quente */
    --azul-intermediario: #8A7767;  /* apoio: marrom claro */
    --branco: #FFFFFF;
    --texto: #54402F;
    --cinza-texto: #8A7F76;
    --borda: #E7E1DA;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: rgba(60,110,120,0.45); }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-dash);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Topo ===== */
  /* Faixa do logo em teal — devolve ao logo a aplicação padrão do manual
     (limão sobre teal escuro), sem perder a sidebar branca. */
  /* Faixa de topo: largura total, logo ao centro, aplicação padrão do
     manual — limão sobre teal escuro. */
  /* O PNG foi recortado nas margens brancas, então a borda esquerda da imagem
     é a borda esquerda do "b" — alinha com o nome do professor abaixo. */
  .logo{ display: block; width: 118px; height: auto; flex-shrink: 0; }

  /* Sidebar inteira em marrom: logo, usuário e abas sobre fundo escuro.
     Voltar ao topo marrom com abas claras:
     git checkout v-20260821-1415-ANTES-sidebar-toda-marrom */
  .topo-sidebar{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,.14);
  }

  /* Nome do usuário. REGRA DE IDIOMA (21/08): a plataforma inteira é em
     português — abas, botões, rótulos — para os quatro papéis. As únicas
     exceções são a saudação "Hi, Nome" e o selo de papel, que ficam em inglês
     como aceno ao produto. Todo o resto: português.

     Selos por papel:
       professor      -> teacher
       aluno          -> student
       RH do cliente  -> manager
       equipe Bupp    -> internal                                             */
  .whoami{
    font-size: 11.5px; color: rgba(255,255,255,.7); font-weight: 500;
    line-height: 1.3; text-align: right; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  }
  .whoami strong{
    color: #fff; display: block; font-weight: 700; font-size: 13px;
    letter-spacing: -0.01em;
  }
  .whoami span{
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--teal-escuro);
    background: var(--amarelo-neon); padding: 2px 7px; border-radius: 999px;
  }

  /* Link pequeno "N turmas", logo abaixo do selo do usuário */
  .link-turmas{
    background: none; border: none; padding: 2px 0 0; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--azul-intermediario); white-space: nowrap;
  }
  .link-turmas{ color: rgba(255,255,255,.72); }
  .link-turmas b{ font-weight: 800; color: #fff; }
  .link-turmas:hover{ color: #fff; text-decoration: underline; }

  /* item de turma no pop-up */
  .turma-item{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #fafbf7; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: background .13s, border-color .13s;
  }
  .turma-item:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .ti-esq{ display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ti-nome{ font-size: 13.5px; font-weight: 700; color: var(--texto); }
  .ti-meta{ font-size: 11.5px; color: var(--cinza-texto); }
  .ti-dir{ display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ti-grade{ font-size: 11.5px; font-weight: 700; color: var(--azul-intermediario); white-space: nowrap; }

  /* ===== Abas: sobre a sidebar escura ===== */
  .tabs{
    display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.08); border: 1px solid transparent;
    color: rgba(255,255,255,.78);
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 10px 14px; border-radius: 9px;
    transition: background .14s, color .14s;
  }
  .tab:hover{ background: rgba(255,255,255,.16); color: #fff; }
  .tab.active{
    background: var(--amarelo-neon); border-color: var(--amarelo-neon);
    color: var(--teal-escuro);
    box-shadow: none;
  }

  /* ===== Conteúdo ===== */
  main{ padding: 18px 18px 60px; }
  .pane{ display: none; }
  .pane.active{ display: block; }

  .card{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 14px; padding: 18px;
    margin-bottom: 14px; color: var(--texto);
  }
  .card-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--azul-intermediario); margin-bottom: 8px;
  }
  .card h2{ margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card p{ margin: 0; font-size: 13.5px; color: var(--cinza-texto); line-height: 1.5; }

  .btn{
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; margin-top: 14px; border: none; border-radius: 10px;
    background: var(--teal-escuro); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .btn:hover{ background: var(--azul-intermediario); color: #fff; }
  .btn.lime{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .btn.ghost{
    background: transparent; color: var(--azul-intermediario);
    border: 1.5px solid var(--borda); font-weight: 600;
  }

  .pill{
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .section-title{
    color: var(--teal-escuro); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; margin: 4px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before{
    content: ""; width: 14px; height: 3px; border-radius: 2px;
    background: var(--amarelo-neon); flex-shrink: 0;
  }

  /* ===== Trilha & performance ===== */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #5a635f; padding: 9px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .switch button.active{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .switch button:hover:not(.active){ color: var(--teal-escuro); }

  .grid-wrap{ overflow-x: auto; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 4px; }
  table{ border-collapse: collapse; width: 100%; font-size: 12.5px; color: var(--texto); }
  th, td{ padding: 10px 8px; text-align: center; white-space: nowrap; }
  th{
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--azul-intermediario);
    border-bottom: 1.5px solid var(--borda);
  }
  td.aluno-nome, th.aluno-nome{
    text-align: left; position: sticky; left: 0; background: var(--branco);
    font-weight: 600; padding-left: 12px;
  }
  tbody tr{ border-bottom: 1px solid #f2f4f0; cursor: pointer; }
  tbody tr:last-child{ border-bottom: none; }
  tbody tr:hover td{ background: #fafbf7; }
  tbody tr:hover td.aluno-nome{ background: #fafbf7; }

  .st{ display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; }
  .st.ok{ background: #dff0d8; color: #3f6b45; }
  .st.err{ background: #fbe0de; color: #a3312a; }
  .st.pend{ background: #eef0ec; color: #9aa39f; }
  .nota{ font-weight: 800; }
  .nota.alta{ color: #3f6b45; }
  .nota.media{ color: #8a6d1f; }
  .nota.baixa{ color: #a3312a; }

  /* Perfil do aluno */
  .aluno-lista .card{ display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .aluno-lista .card:hover{ outline: 2px solid var(--amarelo-neon); }
  .aluno-lista h3{ margin: 0; font-size: 15.5px; font-weight: 700; }
  .aluno-lista .sub{ font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }
  .barra{ height: 6px; border-radius: 3px; background: #eef0ec; overflow: hidden; margin-top: 9px; }
  .barra i{ display: block; height: 100%; background: var(--azul-intermediario); }

  .voltar{
    background: none; border: none; color: var(--azul-intermediario); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 0 12px;
  }
  .kv{ display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f4f0; font-size: 13.5px; }
  .kv:last-child{ border-bottom: none; }
  .kv span:first-child{ color: var(--cinza-texto); }
  .kv span:last-child{ font-weight: 700; }

  /* ===== Linhas expansíveis do resumo ===== */
  .exp{ border-bottom: 1px solid #f2f4f0; }
  .exp:last-child{ border-bottom: none; }
  .exp-cab{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 11px 0; text-align: left; transition: color .13s;
  }
  .exp-rot{ font-size: 13.5px; color: var(--cinza-texto); }
  .exp-cab:hover .exp-rot{ color: var(--texto); }
  .exp-val{
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .seta{
    width: 7px; height: 7px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario);
    transform: rotate(45deg) translate(-1px,-1px); transition: transform .18s;
  }
  .exp.aberta .seta{ transform: rotate(-135deg) translate(-2px,-2px); }
  .exp-corpo{ display: none; padding: 2px 0 12px; }
  .exp.aberta .exp-corpo{ display: block; }

  .mini{
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; background: #fafbf7; border-radius: 8px; margin-bottom: 6px;
  }
  .mini:last-child{ margin-bottom: 0; }
  .mini b{ font-size: 13px; font-weight: 700; color: var(--texto); }
  .mini span{ font-size: 12px; color: var(--cinza-texto); line-height: 1.45; }
  .mini.obj{ flex-direction: row; gap: 8px; align-items: flex-start; }
  .mini.obj b{ color: var(--azul-intermediario); flex-shrink: 0; }

  .mini.linha-acao{ flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .trilha-linha .tl-topo{ display: flex; align-items: center; justify-content: space-between; }
  .trilha-linha .tl-bolas{ display: flex; gap: 4px; margin: 6px 0 3px; flex-wrap: wrap; }
  .trilha-linha .tl-sub{ font-size: 11px; }

  .estrelas{ display: flex; gap: 2px; }
  .estrela{
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 17px; line-height: 1; color: #d8dcd2; transition: color .12s, transform .12s;
  }
  .estrela:hover{ transform: scale(1.15); }
  .estrela.on{ color: var(--amarelo-neon); text-shadow: 0 0 1px var(--azul-intermediario); }

  /* Aula e pontos de atenção num card só: retângulo horizontal no desktop,
     vertical no celular. */
  .par{ margin-bottom: 16px; }
  .card.unico{ padding: 0; overflow: hidden; margin-bottom: 0; }
  .lado-aula{ padding: 18px; }
  .lado-pontos{ padding: 18px; border-top: 1px solid var(--borda); background: #fcfcfa; }

  /* aula do dia / histórico */
  .aula-topo{
    display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
    flex-wrap: wrap; min-width: 0;
  }
  .aula-topo .pill{ white-space: nowrap; margin-bottom: 0; flex-shrink: 0; }
  .aula-topo .ident{ margin-bottom: 0; }

  /* ===== Chip do resumo da turma ===== */

  /* ===== Vocabulário e alertas ===== */
  .vocs{ display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
  .tagv{
    font-size: 12.5px; font-weight: 600; color: var(--teal-escuro);
    background: var(--limao-claro); padding: 5px 10px; border-radius: 7px;
  }

  .aluno-alerta{
    width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-alerta:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .aluno-alerta .an{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--texto);
  }
  .seta-r{
    width: 5px; height: 5px; border-right: 2px solid var(--azul-intermediario);
    border-top: 2px solid var(--azul-intermediario); transform: rotate(45deg);
  }
  .ats{ display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-al{
    font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
  }
  .tag-al.vermelho{ background: #fbe0de; color: #a3312a; }
  .tag-al.ambar{ background: #fbf0d8; color: #8a6d1f; }
  .tag-al.lavanda{ background: #ece9f0; color: var(--azul-intermediario); }

  /* ===== Pop-up ===== */
  .modal{
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(24,16,26,0.5);
  }
  .modal.on{ display: flex; }
  .modal-cx{
    background: var(--branco); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(24,16,26,0.3);
  }
  .modal-topo{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 20px 20px 14px; border-bottom: 1px solid var(--borda);
  }
  .modal-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 3px;
  }
  .modal-topo h3{ margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--texto); }
  .modal-x{
    background: none; border: none; cursor: pointer; font-size: 24px; line-height: 1;
    color: var(--cinza-texto); padding: 0 2px; flex-shrink: 0;
  }
  .modal-x:hover{ color: var(--texto); }
  .modal-corpo{ padding: 16px 20px 22px; overflow-y: auto; }
  .modal-corpo .bloco{ margin-bottom: 18px; }
  .modal-corpo .bloco:last-child{ margin-bottom: 0; }
  .modal-corpo .bt{
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 8px;
  }

  /* linha do tempo do aluno */
  .ev{
    border-left: 3px solid var(--borda); padding: 0 0 14px 13px; position: relative;
  }
  .ev:last-child{ padding-bottom: 0; }
  .ev.pendente{ border-left-color: var(--amarelo-neon); }
  .ev-topo{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .ev-data{ font-size: 11px; font-weight: 800; color: var(--azul-intermediario); letter-spacing: .04em; }
  .ev-de{ font-size: 11px; font-weight: 700; color: var(--cinza-texto); }
  .ev-txt{ font-size: 13.5px; color: var(--texto); line-height: 1.5; }
  .ev.pendente .ev-txt{
    background: var(--limao-claro); padding: 8px 10px; border-radius: 8px; font-weight: 500;
  }
  .selo-pend{
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    background: var(--amarelo-neon); color: var(--teal-escuro);
    padding: 3px 7px; border-radius: 999px;
  }
  /* botão de aluno no resumo da turma */
  .aluno-link{
    width: 100%; display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 11px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-link:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .al-nome{
    display: flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .al-cargo{ font-size: 12px; color: var(--cinza-texto); }
  .aluno-link .tag-al{ margin-top: 4px; }

  /* números consolidados da ficha */
  .nums{
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px;
  }
  .num{
    background: #fafbf7; border-radius: 10px; padding: 11px 10px;
    display: flex; flex-direction: column; gap: 1px; text-align: center;
  }
  .nv{ font-size: 20px; font-weight: 800; color: var(--texto); letter-spacing: -0.02em; }
  .nv.alta{ color: #3f6b45; } .nv.media{ color: #8a6d1f; } .nv.baixa{ color: #a3312a; }
  .nr{ font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--azul-intermediario); }
  .nd{ font-size: 10.5px; color: var(--cinza-texto); }
  .pres-rot{ font-size: 12px; color: var(--cinza-texto); }

  .voltar-turma{
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--azul-intermediario);
    padding: 0 0 12px;
  }
  .voltar-turma:hover{ color: var(--teal-escuro); }

  /* Identificação da aula: Empresa · Nível · Dia · Horário · [+] */
  .ident{
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    margin-bottom: 9px; font-size: 12px; min-width: 0;
  }
  .id-emp{
    font-weight: 800; color: var(--teal-escuro); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-turma{
    font-weight: 600; color: var(--cinza-texto); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-niv{
    font-size: 10px; font-weight: 800; letter-spacing: .06em; flex-shrink: 0;
    background: var(--limao-claro); color: var(--teal-escuro);
    padding: 2px 7px; border-radius: 999px;
  }
  /* identificação dentro do card de trilha */
  .ident-tr{ margin: 2px 0 1px; font-size: 11.5px; }
  .id-dia, .id-hora{
    font-weight: 700; color: var(--cinza-texto); white-space: nowrap; flex-shrink: 0;
  }
  .id-hora{ color: var(--azul-intermediario); }
  .id-mais{
    flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    border: 1px solid var(--borda); background: var(--branco);
    color: var(--teal-escuro); font-family: inherit; font-size: 16px;
    line-height: 1; cursor: pointer; display: flex; align-items: center;

  .cel-at{ max-width: 230px; white-space: normal; }

  .tag-at.recorrente{ background:#fbe0de; color:#a3312a; font-weight:800; }

  /* Barra de filtros e ações */

  @media (min-width: 900px){ .kpis{ grid-template-columns: repeat(4,1fr); } }

<script src="dados-mock.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  LINHAS DA PLANILHA
//  Uma linha por ALUNO por AULA JÁ DADA. É o menor grão que existe: tudo o
//  que o professor registra acontece nesse cruzamento.
// ══════════════════════════════════════════════════════════
function partesIdent(t){
  const jaTem = t.nome.toLowerCase().startsWith(t.empresa.toLowerCase());
  const resto = jaTem ? t.nome.slice(t.empresa.length).replace(/^\s*[—\-·]\s*/, "") : t.nome;
  return { empresa: t.empresa, turma: resto, nivel: t.nivel };
}

// ── Onde o aluno errou nesta trilha ──
// Cruza o resultado de cada lição com o TEMA daquela lição. Se o mesmo tema
// já tinha sido errado antes, marca como recorrente — é o sinal que separa
// "escorregou" de "não aprendeu".
function analisarErros(a, t, h){
  const st = (h.progresso && h.progresso[a.id]) || [];
  const temas = h.temas || [];
  const errouAgora = [];
  st.forEach((x, i) => {
    if (x === "err" && temas[i] && !errouAgora.includes(temas[i])) errouAgora.push(temas[i]);
  });
  if (!errouAgora.length){
    const naoFez = st.filter(x => x === "pend").length;
    if (naoFez === st.length && st.length) return [{ tema:"Não fez a trilha", vezes:0, tipo:"pend" }];
    return [];
  }

  // quantas vezes o aluno já errou cada tema, em todas as trilhas
  const contagem = {};
  (t.historico || []).forEach(hh => {
    const s2 = (hh.progresso && hh.progresso[a.id]) || [];
    (hh.temas || []).forEach((tema, i) => {
      if (s2[i] === "err") contagem[tema] = (contagem[tema] || 0) + 1;
    });
  });

  return errouAgora.map(tema => ({
    tema, vezes: contagem[tema] || 1,
    tipo: (contagem[tema] || 1) >= 2 ? "recorrente" : "isolado"
  })).sort((x, y) => y.vezes - x.vezes);
}

function montarLinhas(){
  const linhas = [];
  TURMAS.forEach(t => {
    const p = partesIdent(t);
    const prof = professorDe(t);
    (t.historico || []).forEach(h => {
      t.alunos.forEach(a => {
        const st   = (h.progresso && h.progresso[a.id]) || [];
        const feit = st.filter(x => x !== "pend").length;
        const acer = st.filter(x => x === "ok").length;
        const erro = st.filter(x => x === "err").length;
        const nota = st.length ? Math.round(acer / st.length * 100) : null;
        linhas.push({
          data: h.data, dia: h.dia || "", empresa: p.empresa, turma: p.turma,
          nivel: t.nivel, prof: prof.nome, aula: h.titulo,
          aluno: a.nome, cargo: a.cargo,
          presenca: (PRESENCA[h.id] || {})[a.id] || "",
          eng: (ENGAJAMENTO[h.id] || {})[a.id] || 0,
          licoes: st.length, feitas: feit, acertos: acer, erros: erro, nota,
          atencao: analisarErros(a, t, h),
          anot: (NOTAS_ALUNO[h.id] || {})[a.id] || "",
          alunoId: a.id, turmaId: t.id, aulaId: h.id
        });
      });
    });
  });
  const chave = d => { const [dd,mm] = (d||"").split("/"); return (mm||"") + (dd||""); };
  return linhas.sort((x,y) =>
    chave(y.data).localeCompare(chave(x.data)) || x.aluno.localeCompare(y.aluno));
}

const LINHAS = montarLinhas();

// ── Filtros ──
function passaFiltrosBasicos(l){
  const fp = document.getElementById("f-prof").value;
  const fe = document.getElementById("f-emp").value;
  const q  = (document.getElementById("f-busca").value || "").trim().toLowerCase();
  if (fp && l.prof !== fp) return false;
  if (fe && l.empresa !== fe) return false;
  if (q){
    const alvo = `${l.aluno} ${l.aula} ${l.anot} ${l.empresa} ${l.turma}`.toLowerCase();
    if (!alvo.includes(q)) return false;
  }
  return true;
}

function filtradas(){
  return LINHAS.filter(l => passaFiltrosBasicos(l) && passaFiltrosColuna(l));
}

function estrelasRO(n){
  if (!n) return '<span class="sem">–</span>';
  return `<span class="estrelas-ro">${"★".repeat(n)}<b>${"☆".repeat(3-n)}</b></span>`;
}
function classeNota(n){
  return n === null ? "" : n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";
}

// ══════════════════════════════════════════════════════════
//  COLUNAS E FILTRO POR CABEÇALHO
//  Cada título da planilha abre um menu com os valores daquela coluna.
//  `valores` devolve uma lista porque há coluna multivalorada (Atenção pode
//  ter mais de um tema na mesma linha) — a linha passa se QUALQUER valor dela
//  estiver marcado.
// ══════════════════════════════════════════════════════════
const COLUNAS = [
  { rot:"Data",             k:"data",     valores: l => [`${l.dia} ${l.data}`.trim()] },
  { rot:"Empresa",          k:"empresa",  valores: l => [l.empresa] },
  { rot:"Turma",            k:"turma",    valores: l => [l.turma] },
  { rot:"Nível",            k:"nivel",    valores: l => [l.nivel] },
  { rot:"Professor",        k:"prof",     valores: l => [l.prof] },
  { rot:"Aula",             k:"aula",     valores: l => [l.aula] },
  { rot:"Aluno",            k:"aluno",    valores: l => [l.aluno] },
  { rot:"Presença",         k:"presenca", valores: l => [l.presenca === "p" ? "Presente"
                                                       : l.presenca === "a" ? "Faltou" : "Não marcada"] },
  { rot:"Engaj.",           k:"eng",      valores: l => [l.eng ? `${l.eng} estrela${l.eng>1?"s":""}` : "Não avaliado"] },
  { rot:"Trilha",           k:"nota",     valores: l => [l.nota === null ? "Sem nota"
                                                       : l.nota >= 80 ? "80% ou mais"
                                                       : l.nota >= 60 ? "60 a 79%" : "Abaixo de 60%"] },
  { rot:"Certos",           k:"acertos",  valores: l => [String(l.acertos)] },
  { rot:"Erros",            k:"erros",    valores: l => [String(l.erros)] },
  { rot:"Atenção",          k:"atencao",  valores: l => l.atencao.length
                                                       ? l.atencao.map(x => x.tema) : ["Sem apontamento"] },
  { rot:"Anotação interna", k:"anot",     valores: l => [l.anot ? "Com anotação" : "Sem anotação"] }
];

// { chaveDaColuna: Set de valores marcados }  — coluna ausente = sem filtro
const FILTROS_COL = {};

function passaFiltrosColuna(l){
  return COLUNAS.every(c => {
    const sel = FILTROS_COL[c.k];
    if (!sel || !sel.size) return true;
    return c.valores(l).some(v => sel.has(v));
  });
}

// Valores possíveis de uma coluna, considerando os OUTROS filtros já aplicados
// (é o comportamento de planilha: a lista encolhe conforme você filtra).
function valoresDaColuna(c){
  const base = LINHAS.filter(l => {
    const guarda = FILTROS_COL[c.k];
    delete FILTROS_COL[c.k];
    const ok = passaFiltrosBasicos(l) && passaFiltrosColuna(l);
    if (guarda) FILTROS_COL[c.k] = guarda;
    return ok;
  });
  const set = new Set();
  base.forEach(l => c.valores(l).forEach(v => set.add(v)));
  return [...set].sort((a,b) => a.localeCompare(b, "pt-BR", { numeric:true }));
}

function abrirMenuColuna(c, th){
  fecharMenuColuna();
  const sel = FILTROS_COL[c.k] || new Set();
  const vals = valoresDaColuna(c);

  const menu = document.createElement("div");
  menu.className = "menu-col";
  menu.innerHTML = `
    <div class="mc-topo">
      <input class="mc-busca" type="search" placeholder="Filtrar ${c.rot.toLowerCase()}…">
    </div>
    <div class="mc-acoes">
      <button data-todos>Marcar todos</button>
      <button data-nenhum>Limpar</button>
    </div>
    <div class="mc-lista">
      ${vals.map(v => `
        <label class="mc-item">
          <input type="checkbox" value="${v.replace(/"/g,'&quot;')}" ${sel.size===0 || sel.has(v) ? "checked" : ""}>
          <span>${v}</span>
        </label>`).join("") || '<div class="mc-vazio">Nada para filtrar</div>'}
    </div>
    <div class="mc-rodape">
      <button class="mc-ok" data-aplicar>Aplicar</button>
    </div>`;

  th.appendChild(menu);
  const busca = menu.querySelector(".mc-busca");
  busca.oninput = () => {
    const q = busca.value.trim().toLowerCase();
    menu.querySelectorAll(".mc-item").forEach(it => {
      it.style.display = it.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  };
  menu.querySelector("[data-todos]").onclick = () =>
    menu.querySelectorAll(".mc-item:not([style*='none']) input").forEach(i => i.checked = true);
  menu.querySelector("[data-nenhum]").onclick = () =>
    menu.querySelectorAll(".mc-item input").forEach(i => i.checked = false);
  menu.querySelector("[data-aplicar]").onclick = () => {
    const marcados = [...menu.querySelectorAll(".mc-item input")].filter(i => i.checked).map(i => i.value);
    if (marcados.length === vals.length) delete FILTROS_COL[c.k];   // todos = sem filtro
    else FILTROS_COL[c.k] = new Set(marcados);
    fecharMenuColuna();
    renderTabela();
  };
  menu.onclick = e => e.stopPropagation();
  setTimeout(() => busca.focus(), 30);
}

function fecharMenuColuna(){
  document.querySelectorAll(".menu-col").forEach(m => m.remove());
}
document.addEventListener("click", fecharMenuColuna);
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharMenuColuna(); });

function htmlAtencao(lista){
  if (!lista.length) return '<span class="sem">—</span>';
  return `<span class="ats-cel">${lista.map(x => {
    if (x.tipo === "pend") return `<span class="tag-at pend">${x.tema}</span>`;
    const cls = x.tipo === "recorrente" ? "recorrente" : "isolado";
    const nota = x.vezes >= 2 ? ` <b>${x.vezes}×</b>` : "";
    return `<span class="tag-at ${cls}">${x.tema}${nota}</span>`;
  }).join("")}</span>`;
}

function renderTabela(){
  const dados = filtradas();
  const tb = document.getElementById("tabela");
  tb.innerHTML =
    `<thead><tr>${COLUNAS.map(c => {
      const ativo = FILTROS_COL[c.k] && FILTROS_COL[c.k].size;
      return `<th class="${ativo ? "filtrado" : ""}">
        <button class="th-btn" data-col="${c.k}">${c.rot}<i class="funil"></i></button>
      </th>`;
    }).join("")}</tr></thead>` +
    `<tbody>${dados.map(l => {
      const risco = l.presenca === "a" || (l.nota !== null && l.nota < 60) || (l.eng && l.eng <= 1);
      return `<tr class="${risco ? "alerta" : ""}">
        <td><button class="cel-link" data-aula="${l.aulaId}" data-turma="${l.turmaId}">${l.dia} ${l.data}</button></td>
        <td>${l.empresa}</td>
        <td><button class="cel-link" data-turma-pop="${l.turmaId}">${l.turma}</button></td>
        <td>${l.nivel}</td>
        <td>${l.prof}</td>
        <td><button class="cel-link" data-aula="${l.aulaId}" data-turma="${l.turmaId}">${l.aula}</button></td>
        <td class="col-aluno">${l.aluno}</td>
        <td>${l.presenca === "p" ? '<span class="tag-p">presente</span>'
             : l.presenca === "a" ? '<span class="tag-f">faltou</span>'
             : '<span class="tag-x">—</span>'}</td>
        <td>${estrelasRO(l.eng)}</td>
        <td class="col-nota nota ${classeNota(l.nota)}">${l.nota === null ? "–" : l.nota + "%"}</td>
        <td>${l.acertos}</td>
        <td>${l.erros}</td>
        <td class="cel-at">${htmlAtencao(l.atencao)}</td>
        <td class="cel-anot">${l.anot || '<span class="sem">—</span>'}</td>
      </tr>`;
    }).join("")}</tbody>`;

  document.getElementById("cont-linhas").textContent =
    `${dados.length} de ${LINHAS.length} linhas`;
  renderKPIs(dados);
  renderResumoTurmas(dados);
  ligarCelulas();

  document.querySelectorAll(".th-btn").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const c = COLUNAS.find(x => x.k === b.dataset.col);
      const jaAberto = b.parentElement.querySelector(".menu-col");
      if (jaAberto){ fecharMenuColuna(); return; }
      abrirMenuColuna(c, b.parentElement);
    };
  });

  const nFiltros = Object.keys(FILTROS_COL).length;
  const lim = document.getElementById("limpar-col");
  if (lim){
    lim.style.display = nFiltros ? "inline-flex" : "none";
    lim.textContent = `Limpar ${nFiltros} filtro${nFiltros!==1?"s":""} de coluna`;
  }
}

// ── Células clicáveis da planilha ──
function ligarCelulas(){
  document.querySelectorAll("[data-turma-pop]").forEach(b => {
    b.onclick = () => abrirTurma(TURMAS.find(t => t.id === b.dataset.turmaPop));
  });
  document.querySelectorAll("[data-aula]").forEach(b => {
    b.onclick = () => {
      const t = TURMAS.find(x => x.id === b.dataset.turma);
      const h = (t.historico || []).find(x => x.id === b.dataset.aula);
      if (t && h) abrirAula(t, h);
    };
  });
}

function abrirTurma(t){
  if (!t) return;
  const p = partesIdent(t);
  const grade = (t.aulasHoje || []).map(a => `${a.dia || ""} ${a.hora}`).join(" · ");
  const linhasT = LINHAS.filter(l => l.turmaId === t.id);
  const comPres = linhasT.filter(l => l.presenca);
  const pctPres = comPres.length
    ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;
  const comNota = linhasT.filter(l => l.nota !== null);
  const medNota = comNota.length
    ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;
  const comEng = linhasT.filter(l => l.eng);
  const medEng = comEng.length
    ? (comEng.reduce((n,l) => n + l.eng, 0) / comEng.length).toFixed(1) : null;

  abrirModal("Turma", `${p.empresa} · ${p.turma} · ${t.nivel}${grade ? " · " + grade : ""}`, `
    <div class="nums">
      <div class="num"><span class="nv ${classeNota(pctPres)}">${pctPres===null?"–":pctPres+"%"}</span><span class="nr">Presença</span></div>
      <div class="num"><span class="nv">${medEng===null?"–":medEng+"★"}</span><span class="nr">Engajamento</span></div>
      <div class="num"><span class="nv ${classeNota(medNota)}">${medNota===null?"–":medNota+"%"}</span><span class="nr">Trilhas</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Professor</div>
      <div class="mini"><b>${professorDe(t).nome}</b><span>${professorDe(t).email}</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Objetivo da turma</div>
      <div class="mini destaque"><span>${t.objetivoTurma}</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Alunos · ${t.alunos.length}</div>
      ${t.alunos.map(a => {
        const suas = linhasT.filter(l => l.alunoId === a.id);
        const nt = suas.filter(l => l.nota !== null);
        const m = nt.length ? Math.round(nt.reduce((n,l) => n + l.nota, 0) / nt.length) : null;
        const faltas = suas.filter(l => l.presenca === "a").length;
        return `<div class="mini linha-acao">
          <b>${a.nome}</b>
          <span><span class="nota ${classeNota(m)}">${m===null?"–":m+"%"}</span>${
            faltas ? ` · <span style="color:#a3312a;font-weight:700;">${faltas} falta${faltas>1?"s":""}</span>` : ""}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="bloco">
      <div class="bt">Empresa</div>
      <div class="mini"><b>${t.empresa}</b><span>${t.empresaDesc}</span></div>
    </div>
  `);
}

function abrirAula(t, h){
  const p = partesIdent(t);
  const linhasA = LINHAS.filter(l => l.aulaId === h.id);
  const presentes = linhasA.filter(l => l.presenca === "p").length;
  const comPres = linhasA.filter(l => l.presenca).length;
  const comEng = linhasA.filter(l => l.eng);
  const medEng = comEng.length
    ? (comEng.reduce((n,l) => n + l.eng, 0) / comEng.length).toFixed(1) : null;
  const comNota = linhasA.filter(l => l.nota !== null);
  const medNota = comNota.length
    ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;

  // temas que a turma errou nesta aula
  const porTema = {};
  linhasA.forEach(l => l.atencao.forEach(x => {
    if (x.tipo === "pend") return;
    porTema[x.tema] = (porTema[x.tema] || 0) + 1;
  }));
  const temasTurma = Object.entries(porTema).sort((a,b) => b[1]-a[1]);

  abrirModal(`${p.empresa} · ${p.turma} · ${t.nivel}`, `${h.titulo} — ${h.dia || ""} ${h.data}`, `
    <div class="nums">
      <div class="num"><span class="nv">${comPres ? presentes + "/" + comPres : "–"}</span><span class="nr">Presença</span></div>
      <div class="num"><span class="nv">${medEng===null?"–":medEng+"★"}</span><span class="nr">Engajamento</span></div>
      <div class="num"><span class="nv ${classeNota(medNota)}">${medNota===null?"–":medNota+"%"}</span><span class="nr">Trilha</span></div>
    </div>
    ${temasTurma.length ? `
    <div class="bloco">
      <div class="bt">Onde a turma tropeçou</div>
      ${temasTurma.map(([tema, n]) => `
        <div class="mini linha-acao"><b>${tema}</b>
          <span class="tag-at ${n >= Math.ceil(linhasA.length*0.6) ? "recorrente" : "isolado"}">${n} de ${linhasA.length} alunos</span>
        </div>`).join("")}
    </div>` : ""}
    <div class="bloco">
      <div class="bt">Aluno a aluno</div>
      ${linhasA.map(l => `
        <div class="mini">
          <div class="linha-acao" style="display:flex;justify-content:space-between;align-items:center;">
            <b>${l.aluno}</b>
            <span>${l.presenca === "p" ? '<span class="tag-p">presente</span>'
                   : l.presenca === "a" ? '<span class="tag-f">faltou</span>' : '<span class="tag-x">—</span>'}
              ${estrelasRO(l.eng)}
              <span class="nota ${classeNota(l.nota)}">${l.nota===null?"–":l.nota+"%"}</span></span>
          </div>
          ${l.atencao.length ? `<div style="margin-top:6px;">${htmlAtencao(l.atencao)}</div>` : ""}
          ${l.anot ? `<span style="margin-top:6px;font-style:italic;">“${l.anot}”</span>` : ""}
        </div>`).join("")}
    </div>
  `);
}

function renderKPIs(dados){
  const comPres = dados.filter(l => l.presenca);
  const presentes = comPres.filter(l => l.presenca === "p").length;
  const pctPres = comPres.length ? Math.round(presentes / comPres.length * 100) : null;

  const comEng = dados.filter(l => l.eng);
  const medEng = comEng.length
    ? (comEng.reduce((n,l) => n + l.eng, 0) / comEng.length).toFixed(1) : null;

  const comNota = dados.filter(l => l.nota !== null);
  const medNota = comNota.length
    ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;

  const anot = dados.filter(l => l.anot).length;

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="v">${pctPres === null ? "–" : pctPres + "%"}</div>
      <div class="r">Presença</div><div class="d">${presentes} de ${comPres.length} registros</div></div>
    <div class="kpi"><div class="v">${medEng === null ? "–" : medEng + "★"}</div>
      <div class="r">Engajamento</div><div class="d">média de ${comEng.length} avaliações</div></div>
    <div class="kpi"><div class="v">${medNota === null ? "–" : medNota + "%"}</div>
      <div class="r">Trilhas</div><div class="d">média de ${comNota.length} registros</div></div>
    <div class="kpi"><div class="v">${anot}</div>
      <div class="r">Anotações</div><div class="d">escritas pelo professor</div></div>
  `;
}

// ══════════════════════════════════════════════════════════
//  RESUMO POR TURMA
//  Uma linha por turma, com as médias do que está filtrado logo acima. Serve
//  para achar a turma que precisa de atenção antes de descer para a planilha.
// ══════════════════════════════════════════════════════════
function renderResumoTurmas(dados){
  const box = document.getElementById("resumo-turmas");
  const porTurma = new Map();

  dados.forEach(l => {
    if (!porTurma.has(l.turmaId)) porTurma.set(l.turmaId, []);
    porTurma.get(l.turmaId).push(l);
  });

  if (!porTurma.size){ box.innerHTML = ""; return; }

  const linhas = [...porTurma.entries()].map(([id, ls]) => {
    const t = TURMAS.find(x => x.id === id);
    const p = partesIdent(t);

    const comPres  = ls.filter(l => l.presenca);
    const pctPres  = comPres.length
      ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;
    const faltas   = ls.filter(l => l.presenca === "a").length;

    const comEng = ls.filter(l => l.eng);
    const medEng = comEng.length ? comEng.reduce((n,l) => n + l.eng, 0) / comEng.length : null;

    const comNota = ls.filter(l => l.nota !== null);
    const medNota = comNota.length
      ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;

    // tema que mais aparece na coluna Atenção desta turma
    const temas = {};
    ls.forEach(l => l.atencao.forEach(x => {
      if (x.tipo === "pend") return;
      temas[x.tema] = (temas[x.tema] || 0) + 1;
    }));
    const pior = Object.entries(temas).sort((a,b) => b[1]-a[1])[0];

    const aulas = new Set(ls.map(l => l.aulaId)).size;
    const alunos = new Set(ls.map(l => l.alunoId)).size;

    return { t, p, pctPres, faltas, medEng, medNota, pior, aulas, alunos, prof: ls[0].prof };
  }).sort((a,b) => (a.medNota ?? 999) - (b.medNota ?? 999));   // pior primeiro

  // Carrossel: dois cards por vez, setas nas laterais.
  const cards = linhas.map(x => `
    <article class="rt-card">
      <header>
        <button class="cel-link" data-turma-pop="${x.t.id}">${x.p.empresa} · ${x.p.turma}</button>
        <span class="rt-sub">${x.t.nivel} · ${x.alunos} aluno${x.alunos!==1?"s":""} · ${x.aulas} aula${x.aulas!==1?"s":""}</span>
      </header>
      <div class="rt-linha"><span class="rt-rot">Professor</span>
        <span class="rt-prof">${x.prof}</span></div>
      <div class="rt-linha"><span class="rt-rot">Presença</span>
        <span><span class="nota ${classeNota(x.pctPres)}">${x.pctPres===null?"–":x.pctPres+"%"}</span>${
          x.faltas ? `<span class="rt-falta">${x.faltas} falta${x.faltas>1?"s":""}</span>` : ""}</span></div>
      <div class="rt-linha"><span class="rt-rot">Engajamento</span>
        <span>${x.medEng === null ? '<span class="sem">–</span>'
          : `<span class="rt-eng ${x.medEng <= 1.5 ? "baixo" : ""}">${x.medEng.toFixed(1)}★</span>`}</span></div>
      <div class="rt-linha"><span class="rt-rot">Trilhas</span>
        <span class="nota ${classeNota(x.medNota)}">${x.medNota===null?"–":x.medNota+"%"}</span></div>
      <div class="rt-linha"><span class="rt-rot">Onde mais erra</span>
        <span>${x.pior
          ? `<span class="tag-at ${x.pior[1] >= 3 ? "recorrente" : "isolado"}">${x.pior[0]} <b>${x.pior[1]}×</b></span>`
          : '<span class="sem">—</span>'}</span></div>
      <button class="rt-ver" data-turma-filtro="${x.t.id}">ver linhas</button>
    </article>`).join("");

  box.innerHTML = `
    <div class="rt-titulo">
      Por turma · ${linhas.length}
      <span class="rt-nav">
        <button class="rt-seta" data-ir="-1" aria-label="Anterior">‹</button>
        <span class="rt-pos" id="rt-pos"></span>
        <button class="rt-seta" data-ir="1" aria-label="Próximas">›</button>
      </span>
    </div>
    <div class="rt-viewport">
      <div class="rt-trilho" id="rt-trilho">${cards}</div>
    </div>`;

  // ── navegação de duas em duas ──
  const trilho   = box.querySelector("#rt-trilho");
  const viewport = box.querySelector(".rt-viewport");
  const VAO = 12;   // precisa bater com o `gap` do .rt-trilho no CSS

  // dois por vez no desktop, um por vez em tela estreita
  const porVez  = () => (window.innerWidth <= 620 ? 1 : 2);
  let paginas = Math.max(1, Math.ceil(linhas.length / porVez()));
  let pag = 0;

  function irPara(n){
    pag = Math.max(0, Math.min(n, paginas - 1));
    // O deslocamento é em PIXELS, medido pela janela visível. Em porcentagem
    // ele seria relativo à largura do trilho (a soma de todos os cards), o que
    // faz o carrossel pular longe demais e cortar os cards.
    const passo = viewport.clientWidth + VAO;
    trilho.style.transform = `translateX(-${pag * passo}px)`;
    box.querySelector("#rt-pos").textContent = `${pag + 1}/${paginas}`;
    box.querySelectorAll(".rt-seta").forEach(b => {
      const dir = +b.dataset.ir;
      b.disabled = (dir < 0 && pag === 0) || (dir > 0 && pag === paginas - 1);
    });
  }
  box.querySelectorAll(".rt-seta").forEach(b => {
    b.onclick = () => irPara(pag + (+b.dataset.ir));
  });

  // arrastar com o dedo
  let x0 = null;
  box.querySelector(".rt-viewport").addEventListener("touchstart",
    e => { x0 = e.touches[0].clientX; }, { passive:true });
  box.querySelector(".rt-viewport").addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) irPara(pag + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive:true });

  window.addEventListener("resize", () => {
    paginas = Math.max(1, Math.ceil(linhas.length / porVez()));
    irPara(Math.min(pag, paginas - 1));
  });

  irPara(0);

  // "ver linhas" filtra a planilha naquela turma
  box.querySelectorAll("[data-turma-filtro]").forEach(b => {
    b.onclick = () => {
      const t = TURMAS.find(x => x.id === b.dataset.turmaFiltro);
      FILTROS_COL.turma = new Set([partesIdent(t).turma]);
      FILTROS_COL.empresa = new Set([t.empresa]);
      renderTabela();
      const alvo = document.querySelector(".planilha-wrap");
      if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ behavior:"smooth", block:"start" });
    };
  });
}

// ── Exportar CSV ──
function baixarCSV(){
  const dados = filtradas();
  const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const linhas = [COLUNAS.map(c => esc(c.rot)).join(";")].concat(dados.map(l => [
    `${l.dia} ${l.data}`, l.empresa, l.turma, l.nivel, l.prof, l.aula, l.aluno,
    l.presenca === "p" ? "presente" : l.presenca === "a" ? "faltou" : "",
    l.eng || "", l.nota === null ? "" : l.nota + "%", l.acertos, l.erros,
    l.atencao.map(x => x.vezes >= 2 ? `${x.tema} (${x.vezes}x)` : x.tema).join(", "),
    l.anot
  ].map(esc).join(";")));
  // BOM para o Excel abrir acentuação corretamente
  const blob = new Blob(["\uFEFF" + linhas.join("\n")], { type:"text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bupp-acompanhamento.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ══════════════════════════════════════════════════════════
//  ALERTAS — mesma lógica da plataforma do professor, mas de todos
// ══════════════════════════════════════════════════════════
function alertasDoAluno(a, t){
  const out = [];
  let totalLic = 0, totalErr = 0;
  (t.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    if (!st.length) return;
    totalLic += st.length;
    totalErr += st.filter(x => x === "err").length;
    const erros = st.filter(x => x === "err").length;
    if (erros / st.length >= 0.40){
      out.push({ tipo:"trilha", texto:`Errou ${erros} de ${st.length} em <b>${h.titulo}</b>.` });
    }
  });

  const porTema = {};
  (t.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    (h.temas || []).forEach((tema, i) => {
      if (!st[i]) return;
      const d = porTema[tema] = porTema[tema] || { total:0, erros:0 };
      d.total++;
      if (st[i] === "err") d.erros++;
    });
  });
  const temas = Object.entries(porTema)
    .filter(([, d]) => d.total >= 2 && d.erros / d.total >= 0.40)
    .map(([tema, d]) => `<b>${tema}</b> (${d.erros}/${d.total})`);
  if (temas.length) out.push({ tipo:"tema", texto:`Trava em ${temas.join(", ")}.` });

  const notas = (t.historico || []).map(h => (ENGAJAMENTO[h.id] || {})[a.id]).filter(Boolean);
  if (notas.length){
    const m = notas.reduce((x,y) => x+y, 0) / notas.length;
    if (m <= 1.5) out.push({ tipo:"eng", texto:`Engajamento médio ${m.toFixed(1)} de 3.` });
  }

  const faltas = (t.historico || []).filter(h => (PRESENCA[h.id] || {})[a.id] === "a").length;
  if (faltas >= 2) out.push({ tipo:"falta", texto:`${faltas} faltas registradas.` });

  (a.historico || []).filter(h => !h.tratado).forEach(h => {
    const de = { rh:"RH do cliente", gestao:"Gestão Bupp", aluno:"O próprio aluno", prof:"Professor" }[h.tipo] || h.tipo;
    out.push({ tipo:"msg", texto:`<b>${de}</b> deixou recado em ${h.data}, não tratado.` });
  });
  return out;
}

const ROT = {
  trilha:{ r:"Errou muito",     c:"vermelho" },
  tema:  { r:"Trava num tema",  c:"vermelho" },
  eng:   { r:"Engajamento",     c:"ambar"    },
  falta: { r:"Faltas",          c:"ambar"    },
  msg:   { r:"Recado pendente", c:"lavanda"  }
};

// ── Filtros da aba Alertas ──
// Empresa e professor são independentes. Turma só destrava depois que uma
// empresa é escolhida — sem isso a lista misturaria turmas homônimas de
// empresas diferentes e não diria nada.
function opcoesTurma(){
  const emp = document.getElementById("a-emp").value;
  const sel = document.getElementById("a-turma");
  if (!emp){
    sel.disabled = true;
    sel.innerHTML = `<option value="">Turma (escolha a empresa)</option>`;
    return;
  }
  sel.disabled = false;
  const turmas = TURMAS.filter(t => t.empresa === emp);
  sel.innerHTML = `<option value="">Todas as turmas de ${emp}</option>` +
    turmas.map(t => `<option value="${t.id}">${partesIdent(t).turma} · ${t.nivel}</option>`).join("");
}

function renderAlertas(){
  const box = document.getElementById("lista-alertas");
  const fEmp   = document.getElementById("a-emp").value;
  const fTurma = document.getElementById("a-turma").value;
  const fProf  = document.getElementById("a-prof").value;

  const itens = [];
  TURMAS.forEach(t => {
    if (fEmp && t.empresa !== fEmp) return;
    if (fTurma && t.id !== fTurma) return;
    if (fProf && professorDe(t).nome !== fProf) return;
    t.alunos.forEach(a => {
      const al = alertasDoAluno(a, t);
      if (al.length) itens.push({ t, a, al });
    });
  });
  itens.sort((x,y) => y.al.length - x.al.length);

  // total sem filtro, para o contador dizer de quanto se está vendo
  let total = 0;
  TURMAS.forEach(t => t.alunos.forEach(a => { if (alertasDoAluno(a, t).length) total++; }));

  const nFiltros = [fEmp, fTurma, fProf].filter(Boolean).length;
  const lim = document.getElementById("a-limpar");
  lim.style.display = nFiltros ? "inline-flex" : "none";
  document.getElementById("a-cont").textContent =
    nFiltros ? `${itens.length} de ${total} alunos` : `${total} aluno${total!==1?"s":""}`;

  box.innerHTML = `<div class="section-title">${itens.length} aluno${itens.length!==1?"s":""} com ponto de atenção</div>`;
  if (!itens.length){
    box.innerHTML += `<div class="card"><p>${nFiltros
      ? "Nenhum aluno em atenção com esses filtros."
      : "Nenhum aluno em atenção agora."}</p></div>`;
    return;
  }

  itens.forEach(({t, a, al}) => {
    const p = partesIdent(t);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="ident">
        <span class="id-emp">${p.empresa}</span>
        <span class="id-turma">${p.turma}</span>
        <span class="id-niv">${t.nivel}</span>
        <span class="id-hora">${professorDe(t).nome}</span>
      </div>
      <h2>${a.nome}</h2>
      <p>${a.cargo}</p>
      <div style="margin-top:12px;">
        ${al.map(x => {
          const r = ROT[x.tipo] || { r:x.tipo, c:"lavanda" };
          return `<div class="item-trat">
            <span class="tag-al ${r.c}">${r.r}</span>
            <span class="it-txt">${x.texto}</span></div>`;
        }).join("")}
      </div>`;
    box.appendChild(card);
  });
}

aEmp.innerHTML  = `<option value="">Todas as empresas</option>` +
  [...new Set(TURMAS.map(t => t.empresa))].map(e => `<option>${e}</option>`).join("");
aProf.innerHTML = `<option value="">Todos os professores</option>` +
  PROFESSORES.map(p => `<option>${p.nome}</option>`).join("");

aEmp.onchange = () => { opcoesTurma(); renderAlertas(); };
document.getElementById("a-turma").onchange = renderAlertas;
aProf.onchange = renderAlertas;
document.getElementById("a-limpar").onclick = () => {
  aEmp.value = ""; aProf.value = "";
  opcoesTurma();
  renderAlertas();
};

fProf.onchange = renderTabela;
fEmp.onchange  = renderTabela;
document.getElementById("f-busca").oninput = renderTabela;
document.getElementById("btn-csv").onclick = baixarCSV;
document.getElementById("limpar-col").onclick = () => {
  Object.keys(FILTROS_COL).forEach(k => delete FILTROS_COL[k]);
  renderTabela();
};

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    document.querySelectorAll(".pane").forEach(p =>
      p.classList.toggle("active", p.id === "pane-" + t.dataset.pane));
    window.scrollTo(0, 0);
  };
});

renderTabela();
opcoesTurma();
renderAlertas();
</script>
</body>
</html>
