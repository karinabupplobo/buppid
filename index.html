// The actual network call — only reached after the preview's been shown
// and confirmed. Takes tasks/email already computed so what's sent always
// matches exactly what was previewed.
async function sendEmailNowConfirmed(personName, email, tasks, type, btn) {
  const url = getEmailWebhookUrl();
  const originalHTML = btn ? btn.innerHTML : "";
  try {
    if (btn) { btn.disabled = true; btn.innerHTML = "⏳…"; }
    const payload = { personName, email, tasks, type };
    let confirmed = false;
    let errorMsg = "";
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight Apps Script can't answer
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const text = await res.text().catch(() => "");
        confirmed = true;
        if (/error|erro/i.test(text)) { confirmed = false; errorMsg = text.slice(0, 200); }
      } else {
        errorMsg = `HTTP ${res.status}`;
      }
    } catch (err) {
      try {
        await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        errorMsg = "sent-blind";
      } catch (err2) {
        errorMsg = "Não consegui nem disparar a solicitação — confere se a URL está certa e se o script foi publicado como Web App (Anyone / Qualquer pessoa).";
      }
    }
    if (confirmed) {
      settingsMsg(`✅ Email enviado pra ${personName} agora.`);
      return { ok: true, message: `✅ Enviado pra ${email}.` };
    } else if (errorMsg === "sent-blind") {
      settingsMsg(`📨 Solicitação disparada pra ${personName} — confere a caixa de entrada em instantes.`);
      return { ok: true, message: `📨 Solicitação disparada — o navegador não deixou confirmar, confere a caixa de entrada em instantes.` };
    } else {
      settingsMsg(`⚠️ Falha ao enviar pra ${personName}: ${errorMsg}`, true);
      return { ok: false, message: `⚠️ Falha: ${errorMsg}` };
    }
  } catch (fatalErr) {
    const msg = fatalErr && fatalErr.message ? fatalErr.message : String(fatalErr);
    settingsMsg(`⚠️ Erro inesperado: ${msg}`, true);
    return { ok: false, message: `⚠️ Erro inesperado: ${msg}` };
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = originalHTML; }
  }
}

// --- Settings: users (login/password/email — no permission checkboxes) ---
function renderSettingsUsersList() {
  const el = document.getElementById("settings-users-list");
  if (!el) return;
  el.innerHTML = usersList.map(u => `
    <div class="settings-user-row" data-username="${escAttr(u.username)}">
      <div class="settings-user-cell" data-label="Nome"><input type="text" class="settings-user-name" value="${escAttr(u.name || "")}" placeholder="nome (igual em Responsáveis)"></div>
      <div class="settings-user-cell" data-label="Username"><input type="text" class="settings-user-login" value="${escAttr(u.login || u.username)}" placeholder="username"></div>
      <div class="settings-user-cell" data-label="Email Address"><input type="email" class="settings-user-email" value="${escAttr(u.email || "")}" placeholder="email para avisos"></div>
      <div class="settings-email-dropdown">
        <button class="settings-email-btn settings-email-toggle" type="button">📧 Email ▾</button>
        <div class="settings-email-menu">
          <button class="settings-digest-today-btn" type="button">Digest de hoje</button>
          <button class="settings-digest-tomorrow-btn" type="button">Vence amanhã</button>
        </div>
      </div>
      <div class="settings-user-actions">
        <button class="settings-user-reset-password" title="Redefinir senha para a padrão">🔄</button>
        <button class="settings-user-delete" title="Remover usuário">🗑</button>
      </div>
    </div>
  `).join("");
  el.querySelectorAll(".settings-user-row").forEach(row => {
    const username = row.dataset.username;
    row.querySelector(".settings-user-name").addEventListener("change", e => {
      const u = usersList.find(x => x.username === username);
      if (u) { u.name = e.target.value.trim(); saveUsersList(); }
    });
    row.querySelector(".settings-user-login").addEventListener("change", e => {
      const u = usersList.find(x => x.username === username);
      if (u) { u.login = e.target.value.trim(); saveUsersList(); }
    });
    row.querySelector(".settings-user-email").addEventListener("change", e => {
      const u = usersList.find(x => x.username === username);
      if (u) { u.email = e.target.value.trim(); saveUsersList(); }
    });
    row.querySelector(".settings-user-reset-password").addEventListener("click", () => {
      const u = usersList.find(x => x.username === username);
      if (!u) return;
      if (!confirm(`Redefinir a senha de "${u.name || u.login}" para a senha padrão? A pessoa vai precisar trocar no próximo login.`)) return;
      u.password = DEFAULT_PASSWORD;
      u.mustChangePassword = true;
      saveUsersList();
      settingsMsg(`Senha de "${u.name || u.login}" redefinida para a padrão.`);
    });
    row.querySelector(".settings-user-delete").addEventListener("click", () => {
      if (usersList.length <= 1) { alert("Precisa manter pelo menos um usuário."); return; }
      if (!confirm(`Remover o usuário "${username}"?`)) return;
      usersList = usersList.filter(x => x.username !== username);
      saveUsersList();
      renderSettingsUsersList();
    });
    row.querySelector(".settings-email-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      const menu = row.querySelector(".settings-email-menu");
      const wasOpen = menu.classList.contains("open");
      document.querySelectorAll(".settings-email-menu.open").forEach(m => m.classList.remove("open"));
      if (!wasOpen) menu.classList.add("open");
    });
    row.querySelector(".settings-digest-today-btn").addEventListener("click", (e) => {
      row.querySelector(".settings-email-menu").classList.remove("open");
      const u = usersList.find(x => x.username === username);
      if (u) openEmailPreview(u.username, "digest", e.currentTarget);
    });
    row.querySelector(".settings-digest-tomorrow-btn").addEventListener("click", (e) => {
      row.querySelector(".settings-email-menu").classList.remove("open");
      const u = usersList.find(x => x.username === username);
      if (u) openEmailPreview(u.username, "due_tomorrow", e.currentTarget);
    });
  });
}
document.addEventListener("click", () => {
  document.querySelectorAll(".settings-email-menu.open").forEach(m => m.classList.remove("open"));
  document.querySelectorAll(".tasks-assignee-menu.open").forEach(m => m.classList.remove("open"));
});
document.getElementById("settings-add-user-btn").addEventListener("click", () => {
  const name = prompt("Nome da pessoa (igual ao que vai usar em Responsáveis nas tasks):");
  if (!name) return;
  const login = prompt("Username (pra fazer login):", name.trim().toLowerCase().replace(/\s+/g, ""));
  if (!login) return;
  const username = login.trim().toLowerCase().replace(/\s+/g, "-") + "-" + Date.now().toString(36).slice(-4);
  usersList.push({ username, login: login.trim(), name: name.trim(), email: "", password: DEFAULT_PASSWORD, role: "adm", mustChangePassword: true });
  saveUsersList();
  renderSettingsUsersList();
  settingsMsg(`Usuário criado. Senha provisória: "${DEFAULT_PASSWORD}" (vai pedir pra trocar no primeiro login).`);
});

// Restore a session (if there's a valid one) now that everything it needs
// — render functions, task/UI state — is defined, so a refresh goes
// straight back into the app instead of flashing the login screen.
// Only kicked off now, at the very end of the script, so that even in the
// worst case (fetch throwing synchronously — e.g. a malformed Supabase URL)
// every render function this can call already has everything it needs.
initialCloudLoadPromise = loadFromCloud();

(function restoreSessionOnLoad() {
  const restored = tryRestoreSession();
  if (restored) {
    currentUser = restored;
    hideLoginGate();
    afterLogin();
  }
})();
</script>
