  }
}

// ══════════════════════════════════════════════════════════
//  ABA ALUNOS — planilha de todos os alunos, com quem ainda não tem
//  turma sempre no topo. É daqui que se aloca, sem precisar entrar em
//  cada card de empresa.
// ══════════════════════════════════════════════════════════
function turmaDoAluno(a){
  const ta = (a.turma_alunos || [])[0];
  return ta ? TURMAS_SB.find(t => t.id === ta.turma_id) : null;
}

// Realocar: tira o aluno da turma atual (se houver) e põe na nova. Turma
// vazia = deixar sem turma, que é como ele volta pra fila do topo.
async function salvarCampoAluno(id, campo, valor, elFeedback){
  const a = ALUNOS_SB.find(x => x.id === id);
  if (!a) return;
  const antes = a[campo];
  const novo = valor === "" ? null : valor;
  if (antes === novo) return;
  a[campo] = novo;
  if (elFeedback) elFeedback.textContent = "…";
  try{
    const res = await fetch(`${SB_URL}/rest/v1/alunos?id=eq.${id}`, {
      method: "PATCH", headers: SB_H, body: JSON.stringify({ [campo]: novo })
    });
    if (!res.ok) throw new Error(await res.text());
    if (CAMPOS_COMPARTILHADOS_ALUNO_USUARIO.includes(campo)){
      await sincronizarCampoLigado("usuarios", "aluno_id", id, campo, novo);
      const u = (USUARIOS_SB || []).find(x => x.aluno_id === id);
      if (u) u[campo] = novo;
    }
    if (elFeedback){ elFeedback.textContent = "✓"; setTimeout(() => elFeedback.textContent = "", 1600); }
  } catch(err){
    a[campo] = antes;   // desfaz na memória pra tela não mentir
    alert("Erro ao salvar: " + err.message);
    renderAlunosTabela();
  }
}

async function realocarAluno(alunoId, turmaId){
  const aluno = ALUNOS_SB.find(a => a.id === alunoId);
  if (!aluno) return;
  const antes = aluno.turma_alunos || [];
  try{
    if (antes.length){
      const del = await fetch(`${SB_URL}/rest/v1/turma_alunos?aluno_id=eq.${alunoId}`, { method: "DELETE", headers: SB_H });
      if (!del.ok) throw new Error(await del.text());
    }
    if (turmaId){
      const res = await fetch(`${SB_URL}/rest/v1/turma_alunos`, {
        method: "POST", headers: SB_H,
        body: JSON.stringify({ turma_id: turmaId, aluno_id: alunoId })
      });
      if (!res.ok) throw new Error(await res.text());
    }
    aluno.turma_alunos = turmaId ? [{ turma_id: turmaId }] : [];
    renderAlunosTabela();
  } catch(err){
    aluno.turma_alunos = antes;
    alert("Erro ao realocar: " + err.message);
    renderAlunosTabela();
  }
}

// Desativar em vez de excluir — o histórico do aluno (anotações, nível)
// continua existindo. Desativar também tira ele da turma.
async function alternarAtivoAluno(alunoId){
  const aluno = ALUNOS_SB.find(a => a.id === alunoId);
  if (!aluno) return;
  const desativando = aluno.ativo !== false;
  if (desativando && !confirm(`Desativar ${aluno.nome}? Ele sai da turma e das listas, mas o histórico é preservado. Dá pra reativar depois.`)) return;
  try{
    const res = await fetch(`${SB_URL}/rest/v1/alunos?id=eq.${alunoId}`, {
      method: "PATCH", headers: SB_H, body: JSON.stringify({ ativo: !desativando })
    });
    if (!res.ok) throw new Error(await res.text());
    if (desativando && (aluno.turma_alunos || []).length){
      await fetch(`${SB_URL}/rest/v1/turma_alunos?aluno_id=eq.${alunoId}`, { method: "DELETE", headers: SB_H });
      aluno.turma_alunos = [];
    }
    aluno.ativo = !desativando;
    renderAlunosTabela();
  } catch(err){ alert("Erro: " + err.message); }
}

function renderAlunosTabela(){
  const fEmp = document.getElementById("al-emp").value;
  const fStatus = document.getElementById("al-status").value;

  let lista = ALUNOS_SB.slice();
  if (fEmp) lista = lista.filter(a => a.empresa_cliente_id === fEmp);
  // Desativado só aparece no filtro próprio — em qualquer outra visão ele
  // sairia no meio dos ativos e poluiria a fila de trabalho.
  if (fStatus === "inativo") lista = lista.filter(a => a.ativo === false);
  else lista = lista.filter(a => a.ativo !== false);
  if (fStatus === "sem") lista = lista.filter(a => !(a.turma_alunos || []).length);
  if (fStatus === "com") lista = lista.filter(a => (a.turma_alunos || []).length);

  // Ordem: sem turma no topo (fila de trabalho), desativados no fim.
  const ord = a => a.ativo === false ? 2 : ((a.turma_alunos || []).length ? 1 : 0);
  lista.sort((a,b) => ord(a) - ord(b) || a.nome.localeCompare(b.nome, "pt-BR"));

  const nSem = lista.filter(a => a.ativo !== false && !(a.turma_alunos || []).length).length;
  document.getElementById("al-cont").textContent = `${lista.length} aluno(s) · ${nSem} sem turma`;
  document.getElementById("al-limpar").style.display = (fEmp || fStatus) ? "inline-flex" : "none";

  const empNome = id => {
    const e = EMPRESAS_SB.find(x => x.id === id);
    return e ? e.nome : "—";
  };

  document.getElementById("tabela-alunos").innerHTML = `
    <thead><tr>
      <th>Status</th><th>Nome</th><th>Cargo</th><th>Empresa</th>
      <th>Nível</th><th>Turma</th><th></th>
    </tr></thead>
    <tbody>
      ${lista.length ? lista.map(a => {
        const inativo = a.ativo === false;
        const turmaAtual = (a.turma_alunos || [])[0];
        const semTurma = !turmaAtual;
        const turmasDaEmpresa = TURMAS_SB.filter(t => t.empresa_cliente_id === a.empresa_cliente_id);
        return `<tr class="${inativo ? "linha-inativa" : (semTurma ? "linha-sem-turma" : "")}">
          <td><span class="tag-status ${inativo ? "inativo" : (semTurma ? "sem" : "com")}">${inativo ? "Inativo" : (semTurma ? "Sem turma" : "Alocado")}</span></td>
          <td><button type="button" class="link-aluno" data-aluno-ficha="${a.id}">${a.nome}</button></td>
          <td>${a.cargo || "—"}</td>
          <td>${empNome(a.empresa_cliente_id)}</td>
          <td>${nivelAlunoLabel(a)}</td>
          <td>${inativo ? "—" : `
            <select class="sel-alocar" data-aluno="${a.id}" ${turmasDaEmpresa.length ? "" : "disabled"}>
              <option value="">${turmasDaEmpresa.length ? "Sem turma" : "Empresa sem turma"}</option>
              ${turmasDaEmpresa.map(t => `<option value="${t.id}" ${t.id === (turmaAtual && turmaAtual.turma_id) ? "selected" : ""}>${t.nome}</option>`).join("")}
            </select>`}</td>
          <td class="td-acoes">
            <button type="button" class="btn-ativo" data-ativo="${a.id}">${inativo ? "Reativar" : "Desativar"}</button>
          </td>
        </tr>`;
      }).join("") : `<tr><td colspan="7" class="sem-turmas">Nenhum aluno com esses filtros.</td></tr>`}
    </tbody>`;

  document.querySelectorAll("[data-aluno-ficha]").forEach(b => {
    b.onclick = () => {
      const aluno = ALUNOS_SB.find(a => a.id === b.dataset.alunoFicha);
      const semTurma = !(aluno.turma_alunos || []).length;
      const turmasDaEmpresa = semTurma
        ? TURMAS_SB.filter(t => t.empresa_cliente_id === aluno.empresa_cliente_id)
        : undefined;
      abrirDetalheAluno(aluno, turmasDaEmpresa);
    };
  });
  document.querySelectorAll(".sel-alocar").forEach(sel => {
    sel.onchange = () => realocarAluno(sel.dataset.aluno, sel.value);
  });
  document.querySelectorAll("[data-ativo]").forEach(b => {
    b.onclick = () => alternarAtivoAluno(b.dataset.ativo);
  });
}

function opcoesEmpAlunos(){
  const sel = document.getElementById("al-emp");
  sel.innerHTML = `<option value="">Todas as empresas</option>` +
    EMPRESAS_SB.slice().sort((a,b) => a.nome.localeCompare(b.nome,"pt-BR"))
      .map(e => `<option value="${e.id}">${e.nome}</option>`).join("");
}

async function abrirAbaAlunos(){
  // Reaproveita o mesmo carregamento da aba Empresas — as duas dependem
  // exatamente das mesmas 4 listas.
  if (turmasCarregadas) { opcoesEmpAlunos(); renderAlunosTabela(); return; }
  document.getElementById("tabela-alunos").innerHTML = `<tbody><tr><td class="sem-turmas">Carregando...</td></tr></tbody>`;
  try{
    await carregarTurmasSupabase();
    turmasCarregadas = true;
    opcoesEmpTurmas();
    opcoesEmpAlunos();
    renderAlunosTabela();
  } catch(err){
    document.getElementById("tabela-alunos").innerHTML = `<tbody><tr><td class="sem-turmas">Erro ao carregar alunos: ${err.message}</td></tr></tbody>`;
  }
}

document.getElementById("al-emp").onchange = renderAlunosTabela;
document.getElementById("al-status").onchange = renderAlunosTabela;
document.getElementById("al-limpar").onclick = () => {
  document.getElementById("al-emp").value = "";
  document.getElementById("al-status").value = "";
  renderAlunosTabela();
};

// Qual aba estava aberta sobrevive ao F5 — sem isso, recarregar a página
// sempre jogava de volta pra Dados, mesmo quem estava em Alunos ou Usuários.
const ABA_STORAGE_KEY = "interna_ultima_aba";

function irParaAba(nomePane){
  const tab = document.querySelector(`.tab[data-pane="${nomePane}"]`);
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === tab));
  document.querySelectorAll(".pane").forEach(p =>
    p.classList.toggle("active", p.id === "pane-" + nomePane));

  // As abas Tasks, Leads e Mercado são a própria dash do crm.html embutida.
  // Carrega o iframe só na primeira vez que a aba é aberta — evita puxar a
  // dash inteira (e o login) para quem só quer ver os dados.
  const pane = document.getElementById("pane-" + nomePane);
  const fr = pane && pane.querySelector(".emb-frame");
  if (fr && !fr.src) fr.src = fr.dataset.src;
  if (nomePane === "turmas") abrirAbaTurmas();
  if (nomePane === "alunos") abrirAbaAlunos();
  if (nomePane === "usuarios") abrirAbaUsuarios();

  localStorage.setItem(ABA_STORAGE_KEY, nomePane);
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    irParaAba(t.dataset.pane);
    window.scrollTo(0, 0);
  };
});

renderChips();
renderTabela();
// Usuários carrega do Supabase ao abrir a aba (abrirAbaUsuarios), não aqui —
// no boot ainda não há dado nenhum pra renderizar.
renderChipsU();
renderDocs();
opcoesTurma();
renderAlertas();

const abaSalva = localStorage.getItem(ABA_STORAGE_KEY);
if (abaSalva && abaSalva !== "planilha" && document.querySelector(`.tab[data-pane="${abaSalva}"]`)) irParaAba(abaSalva);
</script>
