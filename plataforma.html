<!DOCTYPE html>
<!--
  PLATAFORMA BUPP — Professor / Aluno / RH
  ========================================
  Versão 1: SOMENTE a tela do Professor, com DADOS FALSOS hardcoded.
  Nenhuma conexão com Supabase ainda — o back é criado depois que a
  visualização for aprovada (decisão da Karina, 20/08/2026).

  Estrutura da tela do Professor (fechada em conversa 20/08):
    1. Botão "N turmas"        — não filtra nada: as telas mostram TODAS as turmas
                                 do professor. O botão abre um pop-up com a lista
                                 completa (empresa, turma, nível, dia, horário)
    2. Hoje                    — pode haver VÁRIAS aulas no mesmo dia. O card traz
                                 só a aula; clicar em "Iniciar" abre o pop-up de
                                 PONTOS DE ATENÇÃO (objetivo, vocabulário, ponto
                                 gramatical, atenção à turma e a alunos) e só de
                                 lá se vai para o material. O "+" ao lado do
                                 horário abre os detalhes da turma.
    3. Fim da aula             — fecha o DIA INTEIRO: todas as aulas de todas as
                                 turmas, com presença, engajamento (1 a 3
                                 estrelas) e anotação interna por aluno
    4. Trilhas                 — liberadas automaticamente, prof só visualiza:
                                 uma linha por trilha com a média da turma, que
                                 abre os acertos e erros de cada aluno
    5. Histórico               — mesma estrutura do Hoje: card com identificação
                                 no topo e botão "ver aula e anotações". O "+"
                                 abre o pop-up com presença, trilhas e
                                 engajamento (1 a 3 estrelas por aluno)

  ANOTAÇÕES: não há mais lousa separada. O professor anota dentro do próprio
  material da aula enquanto dá aula; a anotação fica salva naquela versão da
  aula e aparece no histórico, para professor e alunos.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp — Plataforma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Cor escura da marca: AMEIXA #4A2B4D — fechada em 21/08 depois de testar
       teal #0A1214 e verde-petróleo #2F5C5C. É a cor do logo. */
    --teal-escuro: #4A2B4D;
    --amarelo-neon: #D9E28C;
    --limao-claro: #EDF1D6;
    --bg-dash: #EFEDF3;      /* fundo da dash — o seletor de turma usa o mesmo tom */
    /* Cor intermediária: saiu o azul #3C6E78 (resquício da paleta teal, que
       brigava com a ameixa) e entrou o cinza-lavanda — neutro com um toque de
       roxo, 6,2:1 sobre branco. Usado em kickers, links e texto de apoio. */
    --azul-intermediario: #6B6478;
    --branco: #FFFFFF;
    --texto: #000000;
    --cinza-texto: #6b7472;
    --borda: #e3e6e0;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: rgba(60,110,120,0.45); }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-dash);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Topo ===== */
  /* Faixa do logo em teal — devolve ao logo a aplicação padrão do manual
     (limão sobre teal escuro), sem perder a sidebar branca. */
  /* Faixa de topo: largura total, logo ao centro, aplicação padrão do
     manual — limão sobre teal escuro. */
  /* O PNG foi recortado nas margens brancas, então a borda esquerda da imagem
     é a borda esquerda do "b" — alinha com o nome do professor abaixo. */
  .logo{ display: block; width: 118px; height: auto; flex-shrink: 0; }

  /* Logo à esquerda, identificação do usuário à direita, na mesma linha */
  .topo-sidebar{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--borda);
  }

  /* Nome do usuário. REGRA DE IDIOMA (21/08): a plataforma inteira é em
     português — abas, botões, rótulos — para os quatro papéis. As únicas
     exceções são a saudação "Hi, Nome" e o selo de papel, que ficam em inglês
     como aceno ao produto. Todo o resto: português.

     Selos por papel:
       professor      -> teacher
       aluno          -> student
       RH do cliente  -> manager
       equipe Bupp    -> internal                                             */
  .whoami{
    font-size: 11.5px; color: var(--cinza-texto); font-weight: 500;
    line-height: 1.3; text-align: right; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  }
  .whoami strong{
    color: var(--texto); display: block; font-weight: 700; font-size: 13px;
    letter-spacing: -0.01em;
  }
  .whoami span{
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--teal-escuro);
    background: var(--amarelo-neon); padding: 2px 7px; border-radius: 999px;
  }

  /* Link pequeno "N turmas", logo abaixo do selo do usuário */
  .link-turmas{
    background: none; border: none; padding: 2px 0 0; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--azul-intermediario); white-space: nowrap;
  }
  .link-turmas b{ font-weight: 800; color: var(--teal-escuro); }
  .link-turmas:hover{ color: var(--teal-escuro); text-decoration: underline; }

  /* item de turma no pop-up */
  .turma-item{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #fafbf7; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: background .13s, border-color .13s;
  }
  .turma-item:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .ti-esq{ display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ti-nome{ font-size: 13.5px; font-weight: 700; color: var(--texto); }
  .ti-meta{ font-size: 11.5px; color: var(--cinza-texto); }
  .ti-dir{ display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ti-grade{ font-size: 11.5px; font-weight: 700; color: var(--azul-intermediario); white-space: nowrap; }

  /* ===== Abas: botões limão com texto teal ===== */
  .tabs{
    display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; cursor: pointer; font-family: inherit;
    background: var(--limao-claro); border: 1px solid transparent;
    color: var(--teal-escuro);
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 10px 14px; border-radius: 9px;
    transition: background .14s, border-color .14s;
  }
  .tab:hover{ background: var(--amarelo-neon); }
  .tab.active{
    background: var(--amarelo-neon); border-color: var(--amarelo-neon);
    color: var(--teal-escuro);
    box-shadow: inset 3px 0 0 var(--teal-escuro);
  }

  /* ===== Conteúdo ===== */
  main{ padding: 18px 18px 60px; }
  .pane{ display: none; }
  .pane.active{ display: block; }

  .card{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 14px; padding: 18px;
    margin-bottom: 14px; color: var(--texto);
  }
  .card-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--azul-intermediario); margin-bottom: 8px;
  }
  .card h2{ margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card p{ margin: 0; font-size: 13.5px; color: var(--cinza-texto); line-height: 1.5; }

  .btn{
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; margin-top: 14px; border: none; border-radius: 10px;
    background: var(--teal-escuro); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .btn:hover{ background: var(--azul-intermediario); color: #fff; }
  .btn.lime{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .btn.ghost{
    background: transparent; color: var(--azul-intermediario);
    border: 1.5px solid var(--borda); font-weight: 600;
  }

  .pill{
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .section-title{
    color: var(--teal-escuro); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; margin: 4px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before{
    content: ""; width: 14px; height: 3px; border-radius: 2px;
    background: var(--amarelo-neon); flex-shrink: 0;
  }

  /* ===== Trilha & performance ===== */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #5a635f; padding: 9px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .switch button.active{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .switch button:hover:not(.active){ color: var(--teal-escuro); }

  .grid-wrap{ overflow-x: auto; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 4px; }
  table{ border-collapse: collapse; width: 100%; font-size: 12.5px; color: var(--texto); }
  th, td{ padding: 10px 8px; text-align: center; white-space: nowrap; }
  th{
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--azul-intermediario);
    border-bottom: 1.5px solid var(--borda);
  }
  td.aluno-nome, th.aluno-nome{
    text-align: left; position: sticky; left: 0; background: var(--branco);
    font-weight: 600; padding-left: 12px;
  }
  tbody tr{ border-bottom: 1px solid #f2f4f0; cursor: pointer; }
  tbody tr:last-child{ border-bottom: none; }
  tbody tr:hover td{ background: #fafbf7; }
  tbody tr:hover td.aluno-nome{ background: #fafbf7; }

  .st{ display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; }
  .st.ok{ background: #dff0d8; color: #3f6b45; }
  .st.err{ background: #fbe0de; color: #a3312a; }
  .st.pend{ background: #eef0ec; color: #9aa39f; }
  .nota{ font-weight: 800; }
  .nota.alta{ color: #3f6b45; }
  .nota.media{ color: #8a6d1f; }
  .nota.baixa{ color: #a3312a; }

  /* Perfil do aluno */
  .aluno-lista .card{ display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .aluno-lista .card:hover{ outline: 2px solid var(--amarelo-neon); }
  .aluno-lista h3{ margin: 0; font-size: 15.5px; font-weight: 700; }
  .aluno-lista .sub{ font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }
  .barra{ height: 6px; border-radius: 3px; background: #eef0ec; overflow: hidden; margin-top: 9px; }
  .barra i{ display: block; height: 100%; background: var(--azul-intermediario); }

  .voltar{
    background: none; border: none; color: var(--azul-intermediario); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 0 12px;
  }
  .kv{ display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f4f0; font-size: 13.5px; }
  .kv:last-child{ border-bottom: none; }
  .kv span:first-child{ color: var(--cinza-texto); }
  .kv span:last-child{ font-weight: 700; }

  /* ===== Linhas expansíveis do resumo ===== */
  .exp{ border-bottom: 1px solid #f2f4f0; }
  .exp:last-child{ border-bottom: none; }
  .exp-cab{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 11px 0; text-align: left; transition: color .13s;
  }
  .exp-rot{ font-size: 13.5px; color: var(--cinza-texto); }
  .exp-cab:hover .exp-rot{ color: var(--texto); }
  .exp-val{
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .seta{
    width: 7px; height: 7px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario);
    transform: rotate(45deg) translate(-1px,-1px); transition: transform .18s;
  }
  .exp.aberta .seta{ transform: rotate(-135deg) translate(-2px,-2px); }
  .exp-corpo{ display: none; padding: 2px 0 12px; }
  .exp.aberta .exp-corpo{ display: block; }

  .mini{
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; background: #fafbf7; border-radius: 8px; margin-bottom: 6px;
  }
  .mini:last-child{ margin-bottom: 0; }
  .mini b{ font-size: 13px; font-weight: 700; color: var(--texto); }
  .mini span{ font-size: 12px; color: var(--cinza-texto); line-height: 1.45; }
  .mini.obj{ flex-direction: row; gap: 8px; align-items: flex-start; }
  .mini.obj b{ color: var(--azul-intermediario); flex-shrink: 0; }

  .mini.linha-acao{ flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .trilha-linha .tl-topo{ display: flex; align-items: center; justify-content: space-between; }
  .trilha-linha .tl-bolas{ display: flex; gap: 4px; margin: 6px 0 3px; flex-wrap: wrap; }
  .trilha-linha .tl-sub{ font-size: 11px; }

  .estrelas{ display: flex; gap: 2px; }
  .estrela{
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 17px; line-height: 1; color: #d8dcd2; transition: color .12s, transform .12s;
  }
  .estrela:hover{ transform: scale(1.15); }
  .estrela.on{ color: var(--amarelo-neon); text-shadow: 0 0 1px var(--azul-intermediario); }

  /* Aula e pontos de atenção num card só: retângulo horizontal no desktop,
     vertical no celular. */
  .par{ margin-bottom: 16px; }
  .card.unico{ padding: 0; overflow: hidden; margin-bottom: 0; }
  .lado-aula{ padding: 18px; }
  .lado-pontos{ padding: 18px; border-top: 1px solid var(--borda); background: #fcfcfa; }

  /* aula do dia / histórico */
  .aula-topo{
    display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
    flex-wrap: wrap; min-width: 0;
  }
  .aula-topo .pill{ white-space: nowrap; margin-bottom: 0; flex-shrink: 0; }
  .aula-topo .ident{ margin-bottom: 0; }

  /* ===== Chip do resumo da turma ===== */

  /* ===== Vocabulário e alertas ===== */
  .vocs{ display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
  .tagv{
    font-size: 12.5px; font-weight: 600; color: var(--teal-escuro);
    background: var(--limao-claro); padding: 5px 10px; border-radius: 7px;
  }

  .aluno-alerta{
    width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-alerta:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .aluno-alerta .an{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--texto);
  }
  .seta-r{
    width: 5px; height: 5px; border-right: 2px solid var(--azul-intermediario);
    border-top: 2px solid var(--azul-intermediario); transform: rotate(45deg);
  }
  .ats{ display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-al{
    font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
  }
  .tag-al.vermelho{ background: #fbe0de; color: #a3312a; }
  .tag-al.ambar{ background: #fbf0d8; color: #8a6d1f; }
  .tag-al.lavanda{ background: #ece9f0; color: var(--azul-intermediario); }

  /* ===== Pop-up ===== */
  .modal{
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(24,16,26,0.5);
  }
  .modal.on{ display: flex; }
  .modal-cx{
    background: var(--branco); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(24,16,26,0.3);
  }
  .modal-topo{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 20px 20px 14px; border-bottom: 1px solid var(--borda);
  }
  .modal-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 3px;
  }
  .modal-topo h3{ margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--texto); }
  .modal-x{
    background: none; border: none; cursor: pointer; font-size: 24px; line-height: 1;
    color: var(--cinza-texto); padding: 0 2px; flex-shrink: 0;
  }
  .modal-x:hover{ color: var(--texto); }
  .modal-corpo{ padding: 16px 20px 22px; overflow-y: auto; }
  .modal-corpo .bloco{ margin-bottom: 18px; }
  .modal-corpo .bloco:last-child{ margin-bottom: 0; }
  .modal-corpo .bt{
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 8px;
  }

  /* linha do tempo do aluno */
  .ev{
    border-left: 3px solid var(--borda); padding: 0 0 14px 13px; position: relative;
  }
  .ev:last-child{ padding-bottom: 0; }
  .ev.pendente{ border-left-color: var(--amarelo-neon); }
  .ev-topo{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .ev-data{ font-size: 11px; font-weight: 800; color: var(--azul-intermediario); letter-spacing: .04em; }
  .ev-de{ font-size: 11px; font-weight: 700; color: var(--cinza-texto); }
  .ev-txt{ font-size: 13.5px; color: var(--texto); line-height: 1.5; }
  .ev.pendente .ev-txt{
    background: var(--limao-claro); padding: 8px 10px; border-radius: 8px; font-weight: 500;
  }
  .selo-pend{
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    background: var(--amarelo-neon); color: var(--teal-escuro);
    padding: 3px 7px; border-radius: 999px;
  }
  /* botão de aluno no resumo da turma */
  .aluno-link{
    width: 100%; display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 11px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-link:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .al-nome{
    display: flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .al-cargo{ font-size: 12px; color: var(--cinza-texto); }
  .aluno-link .tag-al{ margin-top: 4px; }

  /* números consolidados da ficha */
  .nums{
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px;
  }
  .num{
    background: #fafbf7; border-radius: 10px; padding: 11px 10px;
    display: flex; flex-direction: column; gap: 1px; text-align: center;
  }
  .nv{ font-size: 20px; font-weight: 800; color: var(--texto); letter-spacing: -0.02em; }
  .nv.alta{ color: #3f6b45; } .nv.media{ color: #8a6d1f; } .nv.baixa{ color: #a3312a; }
  .nr{ font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--azul-intermediario); }
  .nd{ font-size: 10.5px; color: var(--cinza-texto); }
  .pres-rot{ font-size: 12px; color: var(--cinza-texto); }

  .voltar-turma{
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--azul-intermediario);
    padding: 0 0 12px;
  }
  .voltar-turma:hover{ color: var(--teal-escuro); }

  /* Identificação da aula: Empresa · Nível · Dia · Horário · [+] */
  .ident{
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    margin-bottom: 9px; font-size: 12px; min-width: 0;
  }
  .id-emp{
    font-weight: 800; color: var(--teal-escuro); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-niv{
    font-size: 10px; font-weight: 800; letter-spacing: .06em; flex-shrink: 0;
    background: var(--limao-claro); color: var(--teal-escuro);
    padding: 2px 7px; border-radius: 999px;
  }

  return `${tipo} · ${t.nivel} · ${t.modulo} · ${t.alunos.length} aluno${t.alunos.length>1?"s":""}`;

function abrirListaTurmas(){
  // Agrupa por empresa, mas lista turma a turma com nível, dia e horário.
  const porEmp = new Map();
  TURMAS.forEach(t => {
    if (!porEmp.has(t.empresa)) porEmp.set(t.empresa, []);
    porEmp.get(t.empresa).push(t);
  });

  const grade = t => {
    const aulas = (t.aulasHoje || []);
    if (!aulas.length) return "sem aula hoje";
    return aulas.map(a => `${a.dia || ""} ${a.hora}`).join(" · ");
  };

    <div class="bloco">
      <div class="bt">${emp}</div>
      ${lista.map(t => `
        <button class="turma-item" data-turma-pop="${t.id}">
          <span class="ti-esq">
            <span class="ti-nome">${t.nivel} · ${grade(t)}</span>
            <span class="ti-meta">${t.modulo}</span>
          </span>
          <span class="ti-dir">
            <span class="ti-grade">${t.alunos.length} aluno${t.alunos.length>1?"s":""}</span>

        </button>`).join("")}

// Ficha do aluno: histórico de interações e acompanhamento.
// Visível para o PROFESSOR e para a GESTÃO DA BUPP — não para o aluno nem para o RH.
const DE_QUEM = {
  rh:     "RH do cliente",
  gestao: "Gestão Bupp",
  aluno:  "O próprio aluno",
  prof:   "Professor"
};

function abrirFichaAluno(idAluno, veioDaTurma, turma){
  const t = turma || turmaAtual;
  const a = t.alunos.find(x => x.id === idAluno);
  if (!a) return;

  // ---- números consolidados de todas as aulas dadas ----
  const aulas = t.historico || [];
  let presentes = 0, faltas = 0, marcadas = 0;
  aulas.forEach(h => {
    const v = (PRESENCA[h.id] || {})[a.id];
    if (!v) return;
    marcadas++;
    if (v === "p") presentes++; else faltas++;
  });
  const pctPres = marcadas ? Math.round(presentes / marcadas * 100) : null;

  const estrelas = aulas.map(h => (ENGAJAMENTO[h.id] || {})[a.id]).filter(Boolean);
  const medEng = estrelas.length
    ? (estrelas.reduce((x,y) => x+y, 0) / estrelas.length) : null;

  const notasTrilha = aulas.map(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    if (!st.length) return null;
    return Math.round(st.filter(x => x === "ok").length / st.length * 100);
  }).filter(n => n !== null);
  const medNota = notasTrilha.length
    ? Math.round(notasTrilha.reduce((x,y) => x+y, 0) / notasTrilha.length) : null;

  const classe = n => n === null ? "" : n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";

  const numeros = `
    <div class="nums">
      <div class="num">
        <span class="nv ${classe(pctPres)}">${pctPres === null ? "–" : pctPres + "%"}</span>
        <span class="nr">Presença</span>
        <span class="nd">${marcadas ? `${presentes} de ${marcadas} aulas` : "não marcada"}</span>
      </div>
      <div class="num">
        <span class="nv">${medEng === null ? "–" : medEng.toFixed(1) + "★"}</span>
        <span class="nr">Engajamento</span>
        <span class="nd">${estrelas.length ? `média de ${estrelas.length} aula(s)` : "não avaliado"}</span>
      </div>
      <div class="num">
        <span class="nv ${classe(medNota)}">${medNota === null ? "–" : medNota + "%"}</span>
        <span class="nr">Trilhas</span>
        <span class="nd">${notasTrilha.length ? `média de ${notasTrilha.length} trilha(s)` : "sem trilha"}</span>
      </div>
    </div>`;

  // presença aula a aula
  const presLista = aulas.length
    ? aulas.map(h => {
        const v = (PRESENCA[h.id] || {})[a.id];
        const rot = v === "p" ? "Presente" : v === "a" ? "Faltou" : "não marcada";
        const cor = v === "p" ? "ok" : v === "a" ? "err" : "pend";
        return `<div class="mini linha-acao"><b>${h.titulo}</b>
          <span><span class="st ${cor}">${v==="p"?"✓":v==="a"?"✕":"–"}</span>
          <span class="pres-rot">${rot}</span> · ${h.data}</span></div>`;
      }).join("")
    : `<div class="mini"><span>Nenhuma aula dada ainda.</span></div>`;

  const alertas = alertasDoAluno(a, t);
  const recadosPend = (a.historico || [])
    .map((h, idx) => ({ ...h, idx }))
    .filter(h => !h.tratado);

  // Pedagógico: tudo que vem do desempenho, numa linha por causa
  const pedag = alertas.filter(al => al.tipo !== "msg").map(al => {
    const r = ROTULO_ALERTA[al.tipo] || { rot:al.tipo, cor:"lavanda" };
    let detalhe = al.texto;
    if (al.tipo === "tema"){
      detalhe = `Erra em ${al.texto}`;
    }
    return `<div class="item-trat">
      <span class="tag-al ${r.cor}">${r.rot}</span>
      <span class="it-txt">${detalhe}</span>
    </div>`;
  }).join("");

  // Recados: o texto completo aparece AQUI, não repetido no histórico
  const recados = recadosPend.map(h => `
    <div class="item-trat recado">
      <div class="rec-cab">
        <span class="tag-al lavanda">Recado</span>
        <span class="rec-de">${DE_QUEM[h.tipo] || h.tipo} · ${h.autor} · ${h.data}</span>
      </div>
      <div class="it-txt">${h.texto}</div>
      <button class="btn-tratar" data-tratar="${h.idx}">Marcar como tratado</button>
    </div>`).join("");

  const pendentes = (pedag || recados)
    ? pedag + recados
    : `<div class="mini"><span>Nada pendente.</span></div>`;

  // linha do tempo: recado não tratado vem destacado
  // Só o que já foi resolvido. O que está pendente vive em "Precisa ser
  // tratado" acima — quando você marca como tratado, desce para cá.
  const tratados = (a.historico || []).filter(h => h.tratado);
  const eventos = tratados.length
    ? tratados.map(h => `
        <div class="ev">
          <div class="ev-topo">
            <span class="ev-data">${h.data}</span>
            <span class="ev-de">${DE_QUEM[h.tipo] || h.tipo} · ${h.autor}</span>
          </div>
          <div class="ev-txt">${h.texto}</div>
        </div>`).join("")
    : `<div class="mini"><span>${recadosPend.length
        ? "Nada resolvido ainda — os recados abertos estão acima."
        : "Nenhuma interação registrada ainda."}</span></div>`;

  // desempenho nas trilhas já dadas
  const trilhas = (t.historico || []).map(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    if (!st.length) return "";
    const acertos = st.filter(x => x === "ok").length;
    const nota = Math.round(acertos / st.length * 100);
    const bolas = st.map(x => `<span class="st ${x}">${x==="ok"?"✓":x==="err"?"✕":"–"}</span>`).join("");
    return `
      <div class="mini trilha-linha">
        <div class="tl-topo"><b>${h.titulo}</b>
          <span class="nota ${nota>=80?"alta":nota>=60?"media":"baixa"}">${nota}%</span>
        </div>
        <div class="tl-bolas">${bolas}</div>
        <span class="tl-sub">${h.data}</span>
      </div>`;
  }).join("") || `<div class="mini"><span>Sem trilhas registradas.</span></div>`;

  abrirModal(a.cargo, a.nome, `
    ${veioDaTurma ? '<button class="voltar-turma" id="voltar-turma">‹ Voltar para a turma</button>' : ""}
    ${numeros}
    <div class="bloco">
      <div class="bt">Precisa ser tratado · ${alertas.length}</div>
      ${pendentes}
    </div>
    <div class="bloco">
      <div class="bt">Presença aula a aula</div>
      ${presLista}
    </div>
    <div class="bloco">
      <div class="bt">Já resolvido · ${tratados.length}</div>
      ${eventos}
    </div>
    <div class="bloco">
      <div class="bt">Escrever para a gestão</div>
      <div class="responder">
        <textarea id="resp-txt" placeholder="Recado sobre ${a.nome.split(" ")[0]} para a gestão da Bupp…"></textarea>
        <button class="btn lime" id="resp-enviar">Enviar recado</button>
      </div>
    </div>
    <div class="bloco">
      <div class="bt">Desempenho nas trilhas</div>
      ${trilhas}
    </div>
    <div class="aviso-visao">
      Linha direta entre <b>professor</b> e <b>gestão da Bupp</b>: os dois leem e
      escrevem aqui. O aluno e o RH do cliente não têm acesso a esta ficha.
    </div>
  `);

  const volt = document.getElementById("voltar-turma");
  if (volt) volt.onclick = () => abrirResumoTurma(t);

  // marcar recado como tratado
  document.querySelectorAll("[data-tratar]").forEach(b => {
    b.onclick = () => {
      a.historico[+b.dataset.tratar].tratado = true;
      abrirFichaAluno(idAluno, veioDaTurma, t);   // repinta
      renderAula();
    };
  });

  // professor escreve para a gestão
  const env = document.getElementById("resp-enviar");
  if (env) env.onclick = () => {
    const ta = document.getElementById("resp-txt");
    const txt = (ta.value || "").trim();
    if (!txt) return;
    a.historico = a.historico || [];
    a.historico.unshift({
      data: hojeCurto(), tipo:"prof", autor:"Prof. Ana Ribeiro",
      texto: txt, tratado: true    // recado do professor já nasce lido pela gestão
    });
    abrirFichaAluno(idAluno, veioDaTurma, t);
    renderAula();
  };
}

// ══════════════════════════════════════════════════════════
//  MOTOR DE ALERTAS
//  Um aluno entra em "Atenção a alunos" por quatro caminhos:
//    1. erra com frequência nas trilhas (taxa de erro alta)
//    2. zerou uma trilha inteira (não acertou nada de um tema)
//    3. engajamento baixo (média de estrelas <= 1,5)
//    4. existe recado NÃO TRATADO do aluno, do RH ou da gestão Bupp
// ══════════════════════════════════════════════════════════
// Limiares calibrados com a Karina em 21/08:
//   · 40% de erro NA MESMA TRILHA  → o aluno não pegou aquela aula
//   · 40% de erro NO MESMO TEMA    → é o assunto, não a aula
//   · engajamento médio <= 1,5     → desengajamento
//   · recado não tratado           → alguém está esperando resposta
const LIM_ERRO_TRILHA = 0.40;
const LIM_ERRO_TEMA   = 0.40;
const MIN_LICOES_TEMA = 2;     // abaixo disso, um erro isolado viraria alerta
const LIM_ENGAJAMENTO = 1.5;

function alertasDoAluno(a, t){
  t = t || turmaAtual;
  const out = [];

  // ---- erro concentrado numa trilha ----
  (t.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    if (!st.length) return;
    const erros = st.filter(x => x === "err").length;
    if (erros / st.length >= LIM_ERRO_TRILHA){
      out.push({ tipo:"trilha", peso:2,
        texto:`Errou ${erros} de ${st.length} na trilha de <b>${h.titulo}</b> (${h.data}).` });
    }
  });

  // ---- erro concentrado num tema, somando todas as trilhas ----
  const porTema = {};
  (t.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    (h.temas || []).forEach((tema, i) => {
      if (!st[i]) return;
      const d = porTema[tema] = porTema[tema] || { total:0, erros:0 };
      d.total++;
      if (st[i] === "err") d.erros++;
    });
  });
  const temasRuins = Object.entries(porTema)
    .filter(([, d]) => d.total >= MIN_LICOES_TEMA && d.erros / d.total >= LIM_ERRO_TEMA)
    .map(([tema, d]) => ({ tema, ...d }));
  if (temasRuins.length){
    out.push({ tipo:"tema", peso:3, temas: temasRuins,
      texto: temasRuins.map(x => `<b>${x.tema}</b> (${x.erros}/${x.total})`).join(", ") });
  }

  // ---- engajamento ----
  const notas = (t.historico || [])
    .map(h => (ENGAJAMENTO[h.id] || {})[a.id]).filter(Boolean);
  if (notas.length){
    const media = notas.reduce((x,y) => x+y, 0) / notas.length;
    if (media <= LIM_ENGAJAMENTO){
      out.push({ tipo:"engajamento", peso:2,
        texto:`Engajamento baixo: média ${media.toFixed(1)} de 3 nas últimas ${notas.length} aula(s).` });
    }
  }

  // ---- recados não tratados ----
  const pendentes = (a.historico || []).filter(h => !h.tratado);
  if (pendentes.length){
    out.push({ tipo:"msg", peso:4, recados: pendentes,
      texto: pendentes.map(h => DE_QUEM[h.tipo] || h.tipo).join(", ") });
  }

  return out.sort((x,y) => y.peso - x.peso);
}

// ══════════════════════════════════════════════════════════
//  ALERTA DE TURMA — quando o problema não é de um aluno
//  Dispara quando a maior parte da turma erra a MESMA lição ou o
//  MESMO tema. Aí o ponto é da aula, não do aluno.
// ══════════════════════════════════════════════════════════
const LIM_TURMA = 0.60;   // 60% ou mais dos alunos que fizeram

function alertasDaTurma(t){
  t = t || turmaAtual;
  const out = [];

  (t.historico || []).forEach(h => {
    const licoes = h.licoes || [];
    licoes.forEach((lic, i) => {
      let fizeram = 0, erraram = 0;
      t.alunos.forEach(a => {
        const st = (h.progresso && h.progresso[a.id]) || [];
        if (!st[i] || st[i] === "pend") return;
        fizeram++;
        if (st[i] === "err") erraram++;
      });
      if (fizeram >= 2 && erraram / fizeram >= LIM_TURMA){
        const tema = (h.temas || [])[i];
        out.push({ tipo:"licao",
          texto:`<b>${erraram} de ${fizeram}</b> erraram ${lic}${tema ? " — " + tema : ""}, na trilha de <b>${h.titulo}</b>.` });
      }
    });
  });

  // mesmo tema, somando todas as trilhas
  const porTema = {};
  (t.historico || []).forEach(h => {
    (h.temas || []).forEach((tema, i) => {
      t.alunos.forEach(a => {
        const st = (h.progresso && h.progresso[a.id]) || [];
        if (!st[i] || st[i] === "pend") return;
        const d = porTema[tema] = porTema[tema] || { total:0, erros:0 };
        d.total++;
        if (st[i] === "err") d.erros++;
      });
    });
  });
  Object.entries(porTema).forEach(([tema, d]) => {
    if (d.total >= 4 && d.erros / d.total >= LIM_ERRO_TEMA){
      out.push({ tipo:"tema",
        texto:`A turma erra <b>${tema}</b>: ${d.erros} de ${d.total} respostas do tema.` });
    }
  });

  return out;
}

function alunosComAlerta(t){
  t = t || turmaAtual;
  return t.alunos
    .map(a => ({ aluno:a, alertas: alertasDoAluno(a, t) }))
    .filter(x => x.alertas.length)
    .sort((x,y) => y.alertas[0].peso - x.alertas[0].peso);
}

function renderAula(){
  const box = document.getElementById("lista-aulas-hoje");
  const itens = [];
  turmasDaEmpresa().forEach(t => (t.aulasHoje || []).forEach(a => itens.push({ t, a })));
  itens.sort((x,y) => x.a.hora.localeCompare(y.a.hora));

  box.innerHTML = `<div class="section-title">${itens.length} aula${itens.length!==1?"s":""}</div>`;

  if (!itens.length){
    box.innerHTML += `<div class="card"><p>Nenhuma aula marcada para hoje nesta empresa.</p></div>`;
    return;
  }

  itens.forEach(({t, a}) => {
    const par = document.createElement("div");
    par.className = "par";
    par.innerHTML = `
      <div class="card">
        <div class="aula-topo">
          ${CANCELADAS[a.id]
            ? '<span class="pill cancelada">Cancelada</span>'
            : '<span class="pill hoje">Aula de hoje</span>'}
          ${htmlIdent(t, a.dia, a.hora)}
        </div>
        <h2>${a.titulo}</h2>
        <p>${a.resumo}</p>
        ${htmlAcoesAula(a)}
      </div>
    `;
    box.appendChild(par);
    const bm = par.querySelector("[data-resumo-turma]");
    if (bm) bm.onclick = () => abrirResumoTurma(t);
    ligarAcoesAula(par, a, t);
  });
}

// Identificação completa de uma aula: empresa · turma · nível.
// Sem isso, um card de aula solto não diz de quem é — e o nome da turma
// nem sempre contém o nome da empresa (ex.: "Particular — Marcos B.").
function partesIdent(t){
  // O nome da turma às vezes já começa com a empresa ("Sertrading — Comex"),
  // às vezes não ("Particular — Marcos B."). Evita repetir.
  const nome = t.nome;
  const jaTem = nome.toLowerCase().startsWith(t.empresa.toLowerCase());
  const resto = jaTem ? nome.slice(t.empresa.length).replace(/^\s*[—\-·]\s*/, "") : nome;
  return { empresa: t.empresa, turma: resto, nivel: t.nivel };
}

// A turma é identificada por EMPRESA · NÍVEL · DIA · HORÁRIO. O nome interno
// da turma ("Comex", "Diretoria") não aparece em lugar nenhum da interface.
function identTexto(t){
  return `${t.empresa} · ${t.nivel}`;
}

// Linha de identificação: Empresa · Nível · Dia · Horário, e o "+" que abre
// os detalhes da turma. O nome da turma sai daqui — ele está dentro do "+".
function htmlIdent(t, dia, hora, comMais){
  const p = partesIdent(t);
  const mais = comMais === false ? "" :
    `<button class="id-mais" data-resumo-turma title="Detalhes da turma" aria-label="Detalhes da turma">+</button>`;
  return `<div class="ident">
    <span class="id-emp">${p.empresa}</span>
    <span class="id-niv">${p.nivel}</span>
    ${dia  ? `<span class="id-dia">${dia}</span>`   : ""}
    ${hora ? `<span class="id-hora">${hora}</span>` : ""}
    ${mais}
  </div>`;
}

// ══════════════════════════════════════════════════════════
const MOTIVOS_CANCEL = [
  "Cliente cancelou",
  "Professor indisponível",
  "Feriado / ponto facultativo",
  "Sem quórum de alunos",
  "Outro"
];

function htmlAcoesAula(a){
  const c = CANCELADAS[a.id];
  if (c){
    return `
      <div class="cancel-aviso">
        <div class="ct">Aula cancelada</div>
        <div class="cm">${c.motivo}${c.obs ? " — " + c.obs : ""}</div>
      </div>
      <button class="btn ghost" data-reativar>Reativar aula</button>`;
  }
  return `
    <div class="acoes-aula">
      <button class="btn" data-iniciar>Iniciar →</button>
      <button class="btn cancelar" data-cancelar>Cancelar</button>
    </div>`;
}

function ligarAcoesAula(escopo, a, t){
  const bi = escopo.querySelector("[data-iniciar]");
  if (bi) bi.onclick = () => abrirPontosAtencao(a, t);
  const bc = escopo.querySelector("[data-cancelar]");
  if (bc) bc.onclick = () => abrirCancelar(a, t);
  const br = escopo.querySelector("[data-reativar]");
  if (br) br.onclick = () => { delete CANCELADAS[a.id]; renderAula(); renderPresenca(); };
}

// Pontos de atenção deixaram de ficar na tela de Hoje: agora aparecem como
// passo obrigatório entre clicar em "Iniciar" e abrir o material da aula.
// O professor lê o que precisa observar antes de entrar na aula.
function abrirPontosAtencao(a, t){
  t = t || turmaAtual;
  abrirModal("Antes de começar", a.titulo, `
    <div class="ctx-aula">${identTexto(t)} · ${a.dia || ""} ${a.hora}</div>
    <div class="pa-corpo">${htmlPontosAtencao(a, t)}</div>
    <div class="acoes-modal">
      <button class="btn ghost" id="pa-voltar">Voltar</button>
      <a class="btn" id="pa-ir" href="${urlAula('professor', a.titulo, a.data)}" target="_blank">Ir para a aula →</a>
    </div>
  `);
  const corpo = document.getElementById("modal-corpo");
  ligarExp(corpo);
  ligarNomes(corpo, false, t);
  document.getElementById("pa-voltar").onclick = fecharModal;
  document.getElementById("pa-ir").onclick = () => setTimeout(fecharModal, 60);
}

function abrirCancelar(a, t){
  t = t || turmaAtual;
  abrirModal("Cancelar aula", a.titulo, `
    <div class="bloco">
      <div class="bt">${t.empresa} · ${t.nivel} · ${a.dia ? a.dia + " " : ""}${a.hora}</div>
      <div class="mini"><span>A aula fica registrada como cancelada e sai da lista de
      presença do dia. Dá para reativar depois.</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Motivo</div>
      <div class="motivos" id="motivos">
        ${MOTIVOS_CANCEL.map((m,i) =>
          `<button class="mot${i===0?" on":""}" data-m="${m}">${m}</button>`).join("")}
      </div>
    </div>
    <div class="bloco">
      <div class="bt">Observação (opcional)</div>
      <div class="responder">
        <textarea id="cancel-obs" placeholder="Detalhe o que aconteceu, se for útil registrar…"></textarea>
      </div>
    </div>
    <div class="acoes-modal">
      <button class="btn ghost" id="cancel-voltar">Voltar</button>
      <button class="btn cancelar" id="cancel-ok">Marcar como cancelada</button>
    </div>
  `);

  let motivo = MOTIVOS_CANCEL[0];
  document.querySelectorAll("#motivos .mot").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll("#motivos .mot").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      motivo = b.dataset.m;
    };
  });
  document.getElementById("cancel-voltar").onclick = fecharModal;
  document.getElementById("cancel-ok").onclick = () => {
    CANCELADAS[a.id] = {
      motivo,
      obs: (document.getElementById("cancel-obs").value || "").trim(),
      quando: hojeCurto()
    };
    fecharModal();
    renderAula();
    renderPresenca();
  };
}

// Identificação completa de uma aula: empresa · turma · nível.
// Sem isso, um card de aula solto não diz de quem é — e o nome da turma
// nem sempre contém o nome da empresa (ex.: "Particular — Marcos B.").
// Linha de identificação: Empresa · Nível · Dia · Horário, e o "+" que abre
// os detalhes da turma. O nome da turma sai daqui — ele está dentro do "+".

function linhaExp(id, rotulo, valor, conteudo){
  return `
    <div class="exp" data-exp="${id}">
      <button class="exp-cab">
        <span class="exp-rot">${rotulo}</span>
        <span class="exp-val">${valor}<i class="seta"></i></span>
      </button>
      <div class="exp-corpo">${conteudo}</div>
    </div>`;
}

function ligarExp(escopo){
  escopo.querySelectorAll(".exp-cab").forEach(b => {
    b.onclick = () => b.parentElement.classList.toggle("aberta");
  });
}

function ligarNomes(escopo, veioDaTurma, t){
  escopo.querySelectorAll("[data-aluno-pop]").forEach(b => {
    const turma = b.dataset.turma
      ? TURMAS.find(x => x.id === b.dataset.turma)
      : t;
    b.onclick = e => { e.stopPropagation(); abrirFichaAluno(b.dataset.alunoPop, veioDaTurma, turma); };
  });
}

const ROTULO_ALERTA = {
  tema:        { rot:"Trava num tema",  cor:"vermelho" },
  trilha:      { rot:"Errou muito",     cor:"vermelho" },
  erro:        { rot:"Erro recorrente", cor:"vermelho" },
  engajamento: { rot:"Engajamento",     cor:"ambar"    },
  msg:         { rot:"Recado pendente", cor:"lavanda"  }
};

function htmlPontosAtencao(aula, t){
  t = t || turmaAtual;
  const alertados = alunosComAlerta(t);

  const vocab = (aula.vocab || []).map(v => `<span class="tagv">${v}</span>`).join("");

  const alunosHtml = alertados.length
    ? alertados.map(({aluno, alertas}) => {
        const vistos = [];
        const tags = alertas.filter(al => {
          if (vistos.includes(al.tipo)) return false;
          vistos.push(al.tipo); return true;
        }).map(al => {
          const r = ROTULO_ALERTA[al.tipo] || { rot:al.tipo, cor:"lavanda" };
          return `<span class="tag-al ${r.cor}">${r.rot}</span>`;
        }).join("");
        return `
          <button class="aluno-alerta" data-aluno-pop="${aluno.id}" data-turma="${t.id}">
            <span class="an">${aluno.nome}<i class="seta-r"></i></span>
            <span class="ats">${tags}</span>
          </button>`;
      }).join("")
    : `<div class="mini"><span>Nenhum aluno precisa de atenção especial nesta turma agora.</span></div>`;

  const daTurma = alertasDaTurma(t);
  const turmaHtml = daTurma.length
    ? daTurma.map(al => `<div class="mini alerta-turma"><span>${al.texto}</span></div>`).join("")
    : `<div class="mini"><span>Nenhum ponto em que a turma inteira esteja travando.</span></div>`;

  return `
    <div class="card-kicker">Pontos de atenção</div>
    ${linhaExp("obj-"+aula.id,  "Objetivo da aula", "", `<div class="mini"><span>${aula.objetivo || "—"}</span></div>`)}
    ${linhaExp("voc-"+aula.id,  "Vocabulário essencial", (aula.vocab||[]).length, `<div class="vocs">${vocab || "—"}</div>`)}
    ${linhaExp("gram-"+aula.id, "Ponto gramatical", "", `<div class="mini"><span>${aula.gramatica || "—"}</span></div>`)}
    ${linhaExp("turma-"+aula.id, "Atenção à turma", daTurma.length, turmaHtml)}
    ${linhaExp("aten-"+aula.id, "Atenção a alunos", alertados.length, alunosHtml)}
  `;
}

function renderHistorico(){
  const box = document.getElementById("historico-lista");
  const itens = [];
  turmasDaEmpresa().forEach(t => (t.historico || []).forEach(h => itens.push({ t, h })));
  // mais recentes primeiro (data no formato dd/mm)
  const chave = d => { const [dd,mm] = (d||"").split("/"); return (mm||"") + (dd||""); };
  itens.sort((x,y) => chave(y.h.data).localeCompare(chave(x.h.data)));

  box.innerHTML = `<div class="section-title">${itens.length} aula${itens.length!==1?"s":""} anterior${itens.length!==1?"es":""}</div>`;

  if (!itens.length){
    box.innerHTML += `<div class="card"><p>Nenhuma aula anterior nesta empresa.</p></div>`;
    return;
  }

  itens.forEach(({t, h}) => {
    const par = document.createElement("div");
    par.className = "par";
    par.innerHTML = `
      <div class="card">
        <div class="aula-topo">
          <span class="pill dada">Aula dada</span>
          ${htmlIdent(t, h.dia, h.data, false)}
        </div>
        <h2>${h.titulo}</h2>
        <p>${h.resumo}</p>
        <a class="btn" href="${urlAulaT(t, 'leitura', h.titulo, h.data)}" target="_blank">Ver aula e anotações →</a>
      </div>
    `;
    box.appendChild(par);
  });
}

// Presença, trilhas e engajamento de uma aula passada. Ficam dentro do "+"
// do card, não mais num painel ao lado — o card do histórico é igual ao de Hoje.
function abrirPainelAula(h, t){
  // Sem linha de contexto: empresa, nível e data já estão no card que abriu
  // este pop-up, e o cabeçalho do modal repete o nome da aula.
  abrirModal("Aula dada", h.titulo, `
    <div class="pa-corpo" id="painel-aula-corpo"></div>
  `);
  pintarPainelHist(h, document.getElementById("painel-aula-corpo"), t);
}

function pintarPainelHist(h, box, turma){
  if (!box) return;
  const t = turma || turmaAtual;
  const pres = estado(PRESENCA, h.id);
  const eng  = estado(ENGAJAMENTO, h.id);

  const presLinhas = t.alunos.map(a => `
    <div class="mini linha-acao">
      <b>${a.nome}</b>
      <span class="toggle" data-aluno="${a.id}">
        <button class="${pres[a.id]==="p"?"on-p":""}" data-v="p">Presente</button>
        <button class="${pres[a.id]==="a"?"on-a":""}" data-v="a">Faltou</button>
      </span>
    </div>`).join("");
  const nPres = t.alunos.filter(a => pres[a.id]==="p").length;
  const marcados = t.alunos.filter(a => pres[a.id]).length;

  const trilhaLinhas = t.alunos.map(a => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    const feitas  = st.filter(x => x !== "pend").length;
    const acertos = st.filter(x => x === "ok").length;
    const nota = st.length ? Math.round(acertos / st.length * 100) : null;
    const bolas = st.map((x,i) =>
      `<span class="st ${x}" title="${(h.licoes||[])[i]||""}">${x==="ok"?"✓":x==="err"?"✕":"–"}</span>`).join("");
    return `
      <div class="mini trilha-linha">
        <div class="tl-topo"><b>${a.nome}</b>
          <span class="nota ${nota===null?"":nota>=80?"alta":nota>=60?"media":"baixa"}">${nota===null?"–":nota+"%"}</span>
        </div>
        <div class="tl-bolas">${bolas}</div>
        <span class="tl-sub">${feitas} de ${st.length} lições</span>
      </div>`;
  }).join("");
  const concluiram = t.alunos.filter(a => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    return st.length && st.every(x => x !== "pend");
  }).length;

  const engLinhas = t.alunos.map(a => {
    const n = eng[a.id] || 0;
    const estrelas = [1,2,3].map(i =>
      `<button class="estrela ${i<=n?"on":""}" data-aluno="${a.id}" data-n="${i}">★</button>`).join("");
    return `<div class="mini linha-acao"><b>${a.nome}</b><span class="estrelas">${estrelas}</span></div>`;
  }).join("");
  const avaliados = t.alunos.filter(a => eng[a.id]).length;
  const medEng = avaliados
    ? (t.alunos.reduce((s,a) => s + (eng[a.id]||0), 0) / avaliados).toFixed(1) : null;

  const abertas = Array.from(box.querySelectorAll(".exp.aberta")).map(e => e.dataset.exp);

  box.innerHTML = `
    ${linhaExp("pres-"+h.id,    "Presença",    marcados ? `${nPres}/${t.alunos.length}` : "marcar", presLinhas)}
    ${linhaExp("trilhas-"+h.id, "Trilhas",     `${concluiram}/${t.alunos.length}`, trilhaLinhas)}
    ${linhaExp("eng-"+h.id,     "Engajamento", medEng ? medEng + "★" : "avaliar", engLinhas)}
  `;
  ligarExp(box);
  abertas.forEach(id => {
    const el = box.querySelector(`.exp[data-exp="${id}"]`);
    if (el) el.classList.add("aberta");
  });

  box.querySelectorAll(".toggle button").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      pres[b.closest(".toggle").dataset.aluno] = b.dataset.v;
      pintarPainelHist(h, box, t);
    };
  });
  box.querySelectorAll(".estrela").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.aluno, n = +b.dataset.n;
      eng[id] = (eng[id] === n) ? 0 : n;
      pintarPainelHist(h, box, t);
    };
  });
}

// ══════════════════════════════════════════════════════════
//  TRILHAS — uma lista por turma
//  Cada trilha vira uma linha com a média de acerto da turma. Ao clicar,
//  abre a lista de alunos com os acertos e erros de cada um.
// ══════════════════════════════════════════════════════════
function mediaTrilha(h, turma){
  const t = turma || turmaAtual;
  let total = 0, acertos = 0;
  t.alunos.forEach(a => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    st.forEach(x => { if (x !== "pend"){ total++; if (x === "ok") acertos++; } });
  });
  return total ? Math.round(acertos / total * 100) : null;
}

function classeNota(n){
  if (n === null) return "";
  return n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";
}

function renderTrilhaGeral(){
  const box = document.getElementById("lista-trilhas");
  // Um CARD POR TURMA. A identificação (empresa · nível · dia · horário) fica
  // no topo do card, uma vez só — dentro dele, as trilhas daquela turma.
  const comTrilha = TURMAS.filter(t => (t.historico || []).length);
  const total = comTrilha.reduce((n,t) => n + t.historico.length, 0);

  box.innerHTML = `<div class="section-title">${total} trilha${total!==1?"s":""} · ${comTrilha.length} turma${comTrilha.length!==1?"s":""}</div>`;

  if (!total){
    box.innerHTML += `<div class="card"><p>Nenhuma trilha liberada ainda.</p></div>`;
    return;
  }

  const chave = d => { const [dd,mm] = (d||"").split("/"); return (mm||"") + (dd||""); };

  comTrilha.forEach(t => {
    const p = partesIdent(t);
    const grade = (t.aulasHoje || []).map(a => `${a.dia || ""} ${a.hora}`).join(" · ");
    const trilhas = [...t.historico].sort((x,y) => chave(y.data).localeCompare(chave(x.data)));

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="trilha-cab">
        <div class="ident">
          <span class="id-emp">${p.empresa}</span>
          <span class="id-niv">${p.nivel}</span>
          ${grade ? `<span class="id-hora">${grade}</span>` : ""}
        </div>
        <div class="tc-sub">${trilhas.length} trilha${trilhas.length!==1?"s":""} · ${t.alunos.length} aluno${t.alunos.length!==1?"s":""}</div>
      </div>
      ${trilhas.map(h => {
        const m = mediaTrilha(h, t);
        const fizeram = t.alunos.filter(a => {
          const st = (h.progresso && h.progresso[a.id]) || [];
          return st.some(x => x !== "pend");
        }).length;

        const linhas = t.alunos.map(a => {
          const st = (h.progresso && h.progresso[a.id]) || [];
          const acertos = st.filter(x => x === "ok").length;
          const erros   = st.filter(x => x === "err").length;
          const pend    = st.filter(x => x === "pend").length;
          const nota = st.length && (st.length - pend)
            ? Math.round(acertos / st.length * 100) : null;
          const bolas = st.map((x,i) =>
            `<span class="st ${x}" title="${(h.licoes||[])[i]||""}${(h.temas||[])[i] ? " — " + h.temas[i] : ""}">${
              x==="ok"?"✓":x==="err"?"✕":"–"}</span>`).join("");
          return `
            <div class="tr-aluno">
              <button class="tr-nome" data-aluno-pop="${a.id}" data-turma="${t.id}">${a.nome}<i class="seta-r"></i></button>
              <div class="tr-bolas">${bolas}</div>
              <div class="tr-num">
                <span class="ok">${acertos} certo${acertos!==1?"s":""}</span>
                <span class="er">${erros} erro${erros!==1?"s":""}</span>
                ${pend ? `<span class="pe">${pend} não fez</span>` : ""}
                <span class="nota ${classeNota(nota)}">${nota===null?"–":nota+"%"}</span>
              </div>
            </div>`;
        }).join("");

        return `
          <div class="exp trilha-item" data-exp="tr-${h.id}">
            <button class="exp-cab">
              <span class="tr-cab-esq">
                <span class="tr-tit">${h.titulo}</span>
                <span class="tr-sub">${h.dia ? h.dia + " " : ""}${h.data} · ${(h.licoes||[]).length} lições · ${fizeram}/${t.alunos.length} fizeram</span>
              </span>
              <span class="exp-val">
                <span class="nota ${classeNota(m)}">${m===null?"–":m+"%"}</span>
                <i class="seta"></i>
              </span>
            </button>
            <div class="exp-corpo">${linhas}</div>
          </div>`;
      }).join("")}
    `;
    box.appendChild(card);
    ligarExp(card);
    ligarNomes(card);
  });
}

// ══════════════════════════════════════════════════════════
//  FIM DA AULA — fecha o DIA INTEIRO, todas as turmas
//  Decisão de 21/08: o professor não marca presença logo depois de cada
//  aula; ele junta tudo e fecha no fim do expediente. Por isso esta tela
//  ignora a turma selecionada no menu e lista TODAS as aulas de hoje,
//  agrupadas por turma — os alunos nunca se misturam.
// ══════════════════════════════════════════════════════════
function aulasDoDia(){
  const out = [];
  turmasDaEmpresa().forEach(t => (t.aulasHoje || []).forEach(a => out.push({ turma:t, aula:a })));
  return out.sort((x,y) => x.aula.hora.localeCompare(y.aula.hora));
}

function renderPresenca(){
  const box = document.getElementById("presenca-lista");
  const btn = document.getElementById("btn-salvar-presenca");
  document.getElementById("fim-seletor").innerHTML = "";
  const lista = aulasDoDia();
  const tit = document.getElementById("fim-titulo");
  if (tit) tit.textContent = `${lista.length} aula${lista.length!==1?"s":""}`;

  if (!lista.length){
    box.innerHTML = `<div class="card"><p>Nenhuma aula hoje nesta empresa.</p></div>`;
    btn.style.display = "none";
    return;
  }
  btn.style.display = "flex";
  box.innerHTML = "";

  lista.forEach(({turma, aula}) => {
    const cancelada = CANCELADAS[aula.id];
    const pres  = estado(PRESENCA, aula.id);
    const notas = estado(NOTAS_ALUNO, aula.id);
    const marcados = turma.alunos.filter(a => pres[a.id]).length;
    const completo = marcados === turma.alunos.length;

    const bloco = document.createElement("div");
    bloco.className = "bloco-aula" + (cancelada ? " cancelada" : completo ? " ok" : "");
    bloco.innerHTML = `
      <div class="ba-cab">
        <div class="ident">
          <span class="id-emp">${turma.empresa}</span>
          <span class="id-niv">${turma.nivel}</span>
          <span class="id-dia">${aula.dia || ""}</span>
          <span class="id-hora">${aula.hora}</span>
        </div>
        <div class="ba-linha">
          <span class="ba-aula">${aula.titulo}</span>
          <span class="ba-status">${
            cancelada ? "cancelada" : completo ? "fechada" : `${marcados} de ${turma.alunos.length}`
          }</span>
        </div>
      </div>
      ${cancelada
        ? `<div class="ba-cancel">${cancelada.motivo}${cancelada.obs ? " — " + cancelada.obs : ""}</div>`
        : `<div class="ba-alunos"></div>`}`;

    if (cancelada){ box.appendChild(bloco); return; }

    const lst = bloco.querySelector(".ba-alunos");
    turma.alunos.forEach(al => {
      const atual = pres[al.id];
      const nota  = notas[al.id] || "";
      const eng   = estado(ENGAJAMENTO, aula.id);
      const nEng  = eng[al.id] || 0;
      const d = document.createElement("div");
      d.className = "presenca-item";
      d.className = "linha-aluno" + (atual ? " marcado" : "");
      d.innerHTML = `
        <div class="la-linha">
          <span class="la-nome">${al.nome}</span>
          <span class="toggle">
            <button class="${atual === "p" ? "on-p" : ""}" data-v="p">Presente</button>
            <button class="${atual === "a" ? "on-a" : ""}" data-v="a">Faltou</button>
          </span>
          <span class="estrelas${atual === "a" ? " off" : ""}">
            ${[1,2,3].map(i =>
              `<button class="estrela ${i<=nEng?"on":""}" data-eng="${i}" title="${i} de 3">★</button>`).join("")}
          </span>
          <button class="ico-nota${nota ? " tem" : ""}" title="${nota ? "Anotação escrita" : "Anotar sobre este aluno"}"
                  aria-label="Anotação interna sobre ${al.nome}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
        </div>
        <div class="nota-box">
          <textarea placeholder="Como foi a participação, o que travou, o que reforçar na próxima…">${nota}</textarea>
          <div class="hint">Interno — não vai para o aluno nem para o RH</div>
        </div>`;

      d.querySelectorAll(".toggle button").forEach(b => {
        b.onclick = () => { pres[al.id] = b.dataset.v; renderPresenca(); };
      });
      d.querySelectorAll(".estrela").forEach(b => {
        b.onclick = () => {
          const n = +b.dataset.eng;
          eng[al.id] = (eng[al.id] === n) ? 0 : n;   // clicar de novo limpa
          renderPresenca();
        };
      });
      const tgl = d.querySelector(".ico-nota");
      const cx  = d.querySelector(".nota-box");
      const ta  = d.querySelector("textarea");
      tgl.onclick = () => {
        cx.classList.toggle("open");
        tgl.classList.toggle("aberto", cx.classList.contains("open"));
        if (cx.classList.contains("open")) ta.focus();
      };
      ta.oninput = () => { notas[al.id] = ta.value; tgl.classList.toggle("tem", !!ta.value.trim()); };
      if (nota) cx.classList.add("open");

      lst.appendChild(d);
    });
    box.appendChild(bloco);
  });
}

document.getElementById("btn-salvar-presenca").onclick = () => {
  const lista = aulasDoDia();
  let faltando = 0, totalAlunos = 0, comNota = 0;
  let canceladas = 0;
  lista.forEach(({turma, aula}) => {
    if (CANCELADAS[aula.id]){ canceladas++; return; }
    const pres  = estado(PRESENCA, aula.id);
    const notas = estado(NOTAS_ALUNO, aula.id);
    totalAlunos += turma.alunos.length;
    faltando += turma.alunos.filter(a => !pres[a.id]).length;
    comNota  += turma.alunos.filter(a => (notas[a.id]||"").trim()).length;
  });
  if (faltando){
    alert(`Ainda faltam ${faltando} marcação(ões) de presença.`);
    return;
  }
  alert(`Dia fechado.\n${lista.length - canceladas} aula(s) dada(s)${canceladas ? ` · ${canceladas} cancelada(s)` : ""}.\n${totalAlunos} presença(s) · ${comNota} anotação(ões) interna(s).\n\n(Prévia — ainda não grava no banco.)`);
};

// ══════════════════════════════════════════════════════════
//  Navegação por abas
// ══════════════════════════════════════════════════════════
function irPara(pane){
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.pane === pane));
  document.querySelectorAll(".pane").forEach(p =>
    p.classList.toggle("active", p.id === "pane-" + pane));
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => irPara(t.dataset.pane);
});

// ══════════════════════════════════════════════════════════
function renderTudo(){
  renderTurmas();
  renderAula();
  renderTrilhaGeral();
  renderAlunoLista();
  renderPresenca();
  renderHistorico();
  renderResumo();
}

renderTudo();
</script>
