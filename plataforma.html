<!DOCTYPE html>
<!--
  PLATAFORMA BUPP — Professor / Aluno / RH
  ========================================
  Versão 1: SOMENTE a tela do Professor, com DADOS FALSOS hardcoded.
  Nenhuma conexão com Supabase ainda — o back é criado depois que a
  visualização for aprovada (decisão da Karina, 20/08/2026).

  Estrutura da tela do Professor (fechada em conversa 20/08):
    1. Seletor de turma        — só as turmas do professor logado
    2. Today                   — pode haver VÁRIAS aulas no mesmo dia; ao lado,
                                 resumo da turma com linhas que abrem
                                 (alunos, nível, empresa, objetivos)
    3. Trilha & performance    — liberada automaticamente, prof só visualiza
                                 (dois modos: geral da turma / por aluno)
    4. Fim da aula             — presença + anotação interna por aluno
    5. Histórico               — mesma estrutura do Today: lista de aulas dadas
                                 (botão "ver aula e anotações") e, ao lado, o
                                 resumo daquela aula com presença, trilhas e
                                 engajamento (1 a 3 estrelas por aluno)

  ANOTAÇÕES: não há mais lousa separada. O professor anota dentro do próprio
  material da aula enquanto dá aula; a anotação fica salva naquela versão da
  aula e aparece no histórico, para professor e alunos.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp — Plataforma</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Cor escura da marca: AMEIXA #4A2B4D — fechada em 21/08 depois de testar
       teal #0A1214 e verde-petróleo #2F5C5C. É a cor do logo. */
    --teal-escuro: #4A2B4D;
    --amarelo-neon: #D9E28C;
    --limao-claro: #EDF1D6;
    /* Cor intermediária: saiu o azul #3C6E78 (resquício da paleta teal, que
       brigava com a ameixa) e entrou o cinza-lavanda — neutro com um toque de
       roxo, 6,2:1 sobre branco. Usado em kickers, links e texto de apoio. */
    --azul-intermediario: #6B6478;
    --branco: #FFFFFF;
    --texto: #000000;
    --cinza-texto: #6b7472;
    --borda: #e3e6e0;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: rgba(60,110,120,0.45); }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background: #fafaf8;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Topo ===== */
  /* Faixa do logo em teal — devolve ao logo a aplicação padrão do manual
     (limão sobre teal escuro), sem perder a sidebar branca. */
  /* Faixa de topo: largura total, logo ao centro, aplicação padrão do
     manual — limão sobre teal escuro. */
  /* O PNG foi recortado nas margens brancas, então a borda esquerda da imagem
     é a borda esquerda do "b" — alinha com o nome do professor abaixo. */
  .logo{
    display: block; width: 138px; height: auto;
    margin-bottom: 6px;
  }

  /* Nome do usuário. REGRA DE IDIOMA (21/08): a plataforma inteira é em
     português — abas, botões, rótulos — para os quatro papéis. As únicas
     exceções são a saudação "Hi, Nome" e o selo de papel, que ficam em inglês
     como aceno ao produto. Todo o resto: português.

     Selos por papel:
       professor      -> teacher
       aluno          -> student
       RH do cliente  -> manager
       equipe Bupp    -> internal                                             */
  .whoami{
    font-size: 11.5px; color: var(--cinza-texto); font-weight: 500;
    line-height: 1.35; padding-bottom: 16px; border-bottom: 1px solid var(--borda);
  }
  .whoami strong{
    color: var(--texto); display: block; font-weight: 700; font-size: 14.5px;
    letter-spacing: -0.01em; margin-bottom: 2px;
  }
  .whoami span{
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--teal-escuro);
    background: var(--amarelo-neon); padding: 2px 7px; border-radius: 999px;
  }

  /* ===== Seletor de turma (dropdown custom, em superfície branca) ===== */
  .turma-bar{ padding: 0; position: relative; }

  .dd{ position: relative; width: 100%; }
  .dd-trigger{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #f5f6f2;
    border: 1px solid var(--borda); border-radius: 12px;
    color: var(--texto); font-family: inherit; padding: 13px 16px;
    cursor: pointer; text-align: left; transition: border-color .15s, background .15s;
  }
  .dd-trigger:hover{ background: #eef0ea; }
  .dd.open .dd-trigger{ border-color: var(--azul-intermediario); background: #eef0ea; }
  .dd-trigger .nome{ font-size: 15px; font-weight: 700; letter-spacing: -0.01em; display: block; }
  .dd-trigger .sub{ font-size: 11.5px; color: var(--cinza-texto); font-weight: 500; margin-top: 2px; display: block; }
  .dd-caret{
    flex-shrink: 0; width: 11px; height: 11px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario); transform: rotate(45deg) translate(-2px,-2px);
    transition: transform .2s;
  }
  .dd.open .dd-caret{ transform: rotate(-135deg) translate(-3px,-3px); }

  .dd-panel{
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--branco); border: 1px solid var(--border-strong, #d7dad3);
    border-radius: 12px; padding: 6px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(10,18,20,0.16);
    display: none; max-height: 60vh; overflow-y: auto;
  }
  .dd.open .dd-panel{ display: block; }
  .dd-group{
    font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: var(--azul-intermediario); padding: 10px 12px 6px;
  }
  .dd-opt{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; background: none; border: none; cursor: pointer; text-align: left;
    font-family: inherit; color: var(--texto); padding: 10px 12px;
    border-radius: 8px; transition: background .12s;
  }
  .dd-opt:hover{ background: #f2f4ee; }
  /* selecionado = limão com texto escuro (nunca branco sobre limão) */
  .dd-opt.sel{ background: var(--amarelo-neon); color: var(--teal-escuro); font-weight: 700; }
  .dd-opt .t{ font-size: 14px; font-weight: 600; }
  .dd-opt .m{ font-size: 11px; color: var(--cinza-texto); font-weight: 500; flex-shrink: 0; }
  .dd-opt.sel .t{ font-weight: 700; }
  .dd-opt.sel .m{ color: var(--teal-escuro); opacity: .7; }

  /* ===== Abas: botões limão com texto teal ===== */
  .tabs{
    display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; cursor: pointer; font-family: inherit;
    background: var(--limao-claro); border: 1px solid transparent;
    color: var(--teal-escuro);
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 10px 14px; border-radius: 9px;
    transition: background .14s, border-color .14s;
  }
  .tab:hover{ background: var(--amarelo-neon); }
  .tab.active{
    background: var(--amarelo-neon); border-color: var(--amarelo-neon);
    color: var(--teal-escuro);
    box-shadow: inset 3px 0 0 var(--teal-escuro);
  }

  /* ===== Conteúdo ===== */
  main{ padding: 18px 18px 60px; }
  .pane{ display: none; }
  .pane.active{ display: block; }

  .card{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 14px; padding: 18px;
    margin-bottom: 14px; color: var(--texto);
  }
  .card-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--azul-intermediario); margin-bottom: 8px;
  }
  .card h2{ margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card p{ margin: 0; font-size: 13.5px; color: var(--cinza-texto); line-height: 1.5; }

  .btn{
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; margin-top: 14px; border: none; border-radius: 10px;
    background: var(--teal-escuro); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .btn:hover{ background: var(--azul-intermediario); color: #fff; }
  .btn.lime{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .btn.ghost{
    background: transparent; color: var(--azul-intermediario);
    border: 1.5px solid var(--borda); font-weight: 600;
  }

  .pill{
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .section-title{
    color: var(--teal-escuro); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; margin: 4px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before{
    content: ""; width: 14px; height: 3px; border-radius: 2px;
    background: var(--amarelo-neon); flex-shrink: 0;
  }

  /* ===== Trilha & performance ===== */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #5a635f; padding: 9px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .switch button.active{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .switch button:hover:not(.active){ color: var(--teal-escuro); }

  .grid-wrap{ overflow-x: auto; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 4px; }
  table{ border-collapse: collapse; width: 100%; font-size: 12.5px; color: var(--texto); }
  th, td{ padding: 10px 8px; text-align: center; white-space: nowrap; }
  th{
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--azul-intermediario);
    border-bottom: 1.5px solid var(--borda);
  }
  td.aluno-nome, th.aluno-nome{
    text-align: left; position: sticky; left: 0; background: var(--branco);
    font-weight: 600; padding-left: 12px;
  }
  tbody tr{ border-bottom: 1px solid #f2f4f0; cursor: pointer; }
  tbody tr:last-child{ border-bottom: none; }
  tbody tr:hover td{ background: #fafbf7; }
  tbody tr:hover td.aluno-nome{ background: #fafbf7; }

  .st{ display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; }
  .st.ok{ background: #dff0d8; color: #3f6b45; }
  .st.err{ background: #fbe0de; color: #a3312a; }
  .st.pend{ background: #eef0ec; color: #9aa39f; }
  .nota{ font-weight: 800; }
  .nota.alta{ color: #3f6b45; }
  .nota.media{ color: #8a6d1f; }
  .nota.baixa{ color: #a3312a; }

  /* Perfil do aluno */
  .aluno-lista .card{ display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .aluno-lista .card:hover{ outline: 2px solid var(--amarelo-neon); }
  .aluno-lista h3{ margin: 0; font-size: 15.5px; font-weight: 700; }
  .aluno-lista .sub{ font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }
  .barra{ height: 6px; border-radius: 3px; background: #eef0ec; overflow: hidden; margin-top: 9px; }
  .barra i{ display: block; height: 100%; background: var(--azul-intermediario); }

  .voltar{
    background: none; border: none; color: var(--azul-intermediario); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 0 12px;
  }
  .kv{ display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f4f0; font-size: 13.5px; }
  .kv:last-child{ border-bottom: none; }
  .kv span:first-child{ color: var(--cinza-texto); }
  .kv span:last-child{ font-weight: 700; }

  /* ===== Linhas expansíveis do resumo ===== */
  .exp{ border-bottom: 1px solid #f2f4f0; }
  .exp:last-child{ border-bottom: none; }
  .exp-cab{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 11px 0; text-align: left; transition: color .13s;
  }
  .exp-rot{ font-size: 13.5px; color: var(--cinza-texto); }
  .exp-cab:hover .exp-rot{ color: var(--texto); }
  .exp-val{
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .seta{
    width: 7px; height: 7px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario);
    transform: rotate(45deg) translate(-1px,-1px); transition: transform .18s;
  }
  .exp.aberta .seta{ transform: rotate(-135deg) translate(-2px,-2px); }
  .exp-corpo{ display: none; padding: 2px 0 12px; }
  .exp.aberta .exp-corpo{ display: block; }

  .mini{
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; background: #fafbf7; border-radius: 8px; margin-bottom: 6px;
  }
  .mini:last-child{ margin-bottom: 0; }
  .mini b{ font-size: 13px; font-weight: 700; color: var(--texto); }
  .mini span{ font-size: 12px; color: var(--cinza-texto); line-height: 1.45; }
  .mini.obj{ flex-direction: row; gap: 8px; align-items: flex-start; }
  .mini.obj b{ color: var(--azul-intermediario); flex-shrink: 0; }

  .mini.linha-acao{ flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .trilha-linha .tl-topo{ display: flex; align-items: center; justify-content: space-between; }
  .trilha-linha .tl-bolas{ display: flex; gap: 4px; margin: 6px 0 3px; flex-wrap: wrap; }
  .trilha-linha .tl-sub{ font-size: 11px; }

  .estrelas{ display: flex; gap: 2px; }
  .estrela{
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 17px; line-height: 1; color: #d8dcd2; transition: color .12s, transform .12s;
  }
  .estrela:hover{ transform: scale(1.15); }
  .estrela.on{ color: var(--amarelo-neon); text-shadow: 0 0 1px var(--azul-intermediario); }

  /* aula do dia / histórico */
  .aula-topo{ display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .aula-topo .hora{
    font-size: 12px; font-weight: 800; letter-spacing: .06em;
    color: var(--azul-intermediario);
  }
  .card.sel{ border-color: var(--amarelo-neon); box-shadow: inset 3px 0 0 var(--teal-escuro); }
  #historico-lista .card{ cursor: pointer; }

  /* ===== Presença + anotações ===== */
  .privado{
    background: var(--limao-claro); border: 1px solid rgba(60,110,120,0.25);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 14px;
    font-size: 12px; line-height: 1.5; color: #2a3330; font-weight: 500;
  }
  .privado b{ display: block; color: var(--azul-intermediario); font-weight: 800; margin-bottom: 2px; }

  .presenca-item{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 9px;
  }
  .presenca-topo{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .presenca-item .nome{ font-size: 14.5px; font-weight: 600; color: var(--texto); }
  .toggle{ display: flex; gap: 6px; }
  .toggle button{
    border: 1.5px solid var(--borda); background: transparent; border-radius: 8px;
    padding: 7px 13px; font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; color: var(--cinza-texto); transition: all .13s;
  }
  .toggle button.on-p{ background: #dff0d8; border-color: #b6d7ac; color: #3f6b45; }
  .toggle button.on-a{ background: #fbe0de; border-color: #eab5b1; color: #a3312a; }

  .nota-toggle{
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: 700; color: var(--azul-intermediario);
    padding: 9px 0 0; display: flex; align-items: center; gap: 5px;
  }
  .nota-toggle .dot-nota{
    width: 6px; height: 6px; border-radius: 50%; background: var(--azul-intermediario);
    display: none;
  }
  .nota-toggle.tem .dot-nota{ display: block; }
  .nota-box{ display: none; margin-top: 9px; }
  .nota-box.open{ display: block; }
  .nota-box textarea{
    width: 100%; border: 1.5px solid var(--borda); border-radius: 9px;
    padding: 11px 12px; font-family: inherit; font-size: 13.5px; color: var(--texto);
    resize: vertical; min-height: 74px; outline: none; line-height: 1.45;
  }
  .nota-box textarea:focus{ border-color: var(--azul-intermediario); }
  .nota-box .hint{ font-size: 10.5px; color: #9aa39f; margin-top: 5px; font-weight: 600; }

  /* ===== Histórico ===== */
  .hist-item{
    background: var(--branco); border: 1px solid var(--borda);
    border-left: 4px solid var(--amarelo-neon);
    border-radius: 0 12px 12px 0; padding: 15px 16px; margin-bottom: 10px;
  }
  .hist-item .data{ font-size: 11px; font-weight: 700; color: var(--azul-intermediario); letter-spacing: .05em; }
  .hist-item .titulo{ font-size: 15px; font-weight: 700; margin: 3px 0 5px; color: var(--texto); }
  .hist-item .resumo{ font-size: 12.5px; color: var(--cinza-texto); line-height: 1.45; }
  .hist-tags{ display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .htag{ font-size: 10.5px; font-weight: 700; background: #eef0ec; color: var(--cinza-texto); padding: 4px 8px; border-radius: 6px; }

  /* ===== Desktop: sidebar fixa + conteúdo largo ===== */
  @media (min-width: 900px){
    body{ display: grid; grid-template-columns: 282px 1fr; align-items: start; }

    /* Sidebar ocupa o lado inteiro, do topo ao rodapé */
    .sidebar{
      grid-column: 1;
      background: var(--branco);
      border-right: 1px solid var(--borda);
      margin: 0; border-radius: 0;
      padding: 26px 20px 24px;
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; gap: 16px;
    }

    .tabs{
      flex-direction: column; gap: 5px; padding: 0; overflow: visible;
      border-top: none; padding-top: 2px;
    }
    .tab{
      width: 100%; text-align: left; padding: 12px 14px;
      letter-spacing: .04em; font-size: 12.5px;
    }

    main{
      grid-column: 2;
      padding: 30px 34px 60px; max-width: 1180px; width: 100%;
    }

    .cols{ display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; align-items: start; }
    .cols > .card{ margin-bottom: 0; }

    .aluno-lista, #presenca-lista{
      display: grid; grid-template-columns: repeat(2,1fr); gap: 12px;
    }
    .aluno-lista .card, .presenca-item{ margin-bottom: 0; }
    /* Today e Histórico: coluna de aulas + painel de resumo ao lado */
    #card-resumo, #card-hist-resumo{ position: sticky; top: 30px; }

    .switch{ max-width: 380px; }
    table{ font-size: 13.5px; }
    th, td{ padding: 13px 12px; }

    #trilha-detalhe .det-cols{
      display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start;
    }
    #trilha-detalhe .det-cols .card{ margin-bottom: 0; }
  }

  @media (min-width: 1280px){
    main{ padding: 30px 44px 70px 26px; }
  }

  /* Mobile: mantém empilhado */
  @media (max-width: 899px){
    .sidebar{
      background: var(--branco); border-bottom: 1px solid var(--borda);
      border-radius: 0; margin: 0; padding: 18px 18px 14px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .logo{ width: 122px; }
    main{ padding-top: 18px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <img class="logo" src="assets/logo-bupp-idiomas-v2.png" alt="bupp idiomas">

  <div class="whoami">
    <strong>Hi, Ana Ribeiro</strong>
    <span>teacher</span>
  </div>

  <div class="turma-bar">
    <div class="dd" id="dd-turma">
      <button class="dd-trigger" id="dd-trigger">
        <span>
          <span class="nome" id="dd-nome"></span>
          <span class="sub" id="dd-sub"></span>
        </span>
        <span class="dd-caret"></span>
      </button>
      <div class="dd-panel" id="dd-panel"></div>
    </div>
  </div>

  <div class="tabs">
  <button class="tab active" data-pane="aula">Today</button>
  <button class="tab" data-pane="trilha">Trilha</button>
  <button class="tab" data-pane="presenca">Fim da aula</button>
    <button class="tab" data-pane="historico">Histórico</button>
  </div>
</aside>

<main>
  <!-- ============ AULA DO DIA ============ -->
  <section class="pane active" id="pane-aula">
    <div class="cols">
      <div id="lista-aulas-hoje"></div>

// Estados por AULA (não por turma) — a mesma turma tem várias aulas.
const PRESENCA     = {};   // { aulaId: { alunoId: "p"|"a" } }
const ENGAJAMENTO  = {};   // { aulaId: { alunoId: 1|2|3 } }
const NOTAS_ALUNO  = {};   // { aulaId: { alunoId: "texto" } }  — INTERNO
function estado(store, aulaId){ return (store[aulaId] = store[aulaId] || {}); }

let aulaHistSel = null;   // aula do histórico atualmente aberta

let turmaAtual = TURMAS[0];

// ══════════════════════════════════════════════════════════
//  Seletor de turma
// ══════════════════════════════════════════════════════════
function metaTurma(t){
  const tipo = t.tipo === "particular" ? "Particular" : "Corporativa";
  return `${tipo} · ${t.nivel} · ${t.modulo} · ${t.alunos.length} aluno${t.alunos.length>1?"s":""}`;
}

function renderTurmas(){
  document.getElementById("dd-nome").textContent = turmaAtual.nome;
  document.getElementById("dd-sub").textContent  = metaTurma(turmaAtual);

  const panel = document.getElementById("dd-panel");
  panel.innerHTML = "";

  const grupos = [
    ["Turmas",             TURMAS.filter(t => t.tipo === "corporativa")],
    ["Alunos particulares", TURMAS.filter(t => t.tipo === "particular")]
  ];

  grupos.forEach(([label, lista]) => {
    if (!lista.length) return;
    const g = document.createElement("div");
    g.className = "dd-group";
    g.textContent = label;
    panel.appendChild(g);

    lista.forEach(t => {
      const b = document.createElement("button");
      b.className = "dd-opt" + (t.id === turmaAtual.id ? " sel" : "");
      b.innerHTML = `<span class="t">${t.nome}</span><span class="m">${t.nivel} · ${t.alunos.length}</span>`;
      b.onclick = () => {
        turmaAtual = t;
        document.getElementById("dd-turma").classList.remove("open");
        renderTudo();
      };
      panel.appendChild(b);
    });
  });
}

document.getElementById("dd-trigger").onclick = e => {
  e.stopPropagation();
  document.getElementById("dd-turma").classList.toggle("open");
};
document.addEventListener("click", () =>
  document.getElementById("dd-turma").classList.remove("open"));
document.getElementById("dd-panel").onclick = e => e.stopPropagation();
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("dd-turma").classList.remove("open");

// ══════════════════════════════════════════════════════════
//  Aula do dia
// ══════════════════════════════════════════════════════════
// Uma versão da aula = turma + aula + data. A mesma aula dada para duas
// turmas gera dois conjuntos de anotações independentes.
function urlAula(modo, titulo, data){
  return `templateaula.html?modo=${modo}`
       + `&turma=${encodeURIComponent(turmaAtual.nome)}`
       + `&aula=${encodeURIComponent(titulo)}`
       + `&data=${encodeURIComponent(data)}`;
}

  const box = document.getElementById("lista-aulas-hoje");

// ══════════════════════════════════════════════════════════
//  Resumo da turma — linhas que abrem
// ══════════════════════════════════════════════════════════
function linhaExp(id, rotulo, valor, conteudo){
  return `
    <div class="exp" data-exp="${id}">
      <button class="exp-cab">
        <span class="exp-rot">${rotulo}</span>
        <span class="exp-val">${valor}<i class="seta"></i></span>
      </button>
      <div class="exp-corpo">${conteudo}</div>
    </div>`;
}

function ligarExp(escopo){
  escopo.querySelectorAll(".exp-cab").forEach(b => {
    b.onclick = () => b.parentElement.classList.toggle("aberta");
  });
}

function renderResumo(){
  const box = document.getElementById("card-resumo");
  if (!box) return;
  const t = turmaAtual;

  const alunos = t.alunos.map(a =>
    `<div class="mini"><b>${a.nome}</b><span>${a.cargo}</span></div>`).join("");

  const objetivos = t.objetivos.map((o, i) =>
    `<div class="mini obj"><b>${i+1}.</b><span>${o}</span></div>`).join("");

  box.innerHTML = `
    <div class="card-kicker">Resumo da turma</div>
    ${linhaExp("alunos",  "Alunos",    t.alunos.length, alunos)}
    ${linhaExp("nivel",   "Nível",     t.nivel, `<div class="mini"><span>${t.nivelDesc}</span></div>`)}
    ${linhaExp("empresa", "Empresa",   t.empresa, `<div class="mini"><span>${t.empresaDesc}</span></div>`)}
    ${linhaExp("obj",     "Objetivos", t.objetivos.length, objetivos)}
  `;
  ligarExp(box);
}

//  HISTÓRICO — mesma estrutura do Today
// ══════════════════════════════════════════════════════════
function renderHistorico(){
  const box = document.getElementById("historico-lista");
  const lista = turmaAtual.historico || [];
  box.innerHTML = `<div class="section-title">Aulas anteriores</div>`;

  if (!aulaHistSel || !lista.some(h => h.id === aulaHistSel)){
    aulaHistSel = lista.length ? lista[0].id : null;
  }

  lista.forEach(h => {
    const d = document.createElement("div");
    d.className = "card" + (h.id === aulaHistSel ? " sel" : "");
    d.innerHTML = `
      <div class="aula-topo">
        <span class="hora">${h.data}</span>
        <span class="pill dada">Aula dada</span>
      </div>
      <h2>${h.titulo}</h2>
      <p>${h.resumo}</p>
      <a class="btn" href="${urlAula('leitura', h.titulo, h.data)}" target="_blank">Ver aula e anotações →</a>
    `;
    d.onclick = e => {
      if (e.target.closest("a")) return;
      aulaHistSel = h.id;
      renderHistorico();
    };
    box.appendChild(d);
  });

  if (!lista.length) box.innerHTML += `<div class="card"><p>Nenhuma aula anterior nesta turma.</p></div>`;
  renderHistResumo();
}

function renderHistResumo(){
  const box = document.getElementById("card-hist-resumo");
  if (!box) return;
  const t = turmaAtual;
  const h = (t.historico || []).find(x => x.id === aulaHistSel);
  if (!h){ box.innerHTML = ""; return; }

  const pres = estado(PRESENCA, h.id);
  const eng  = estado(ENGAJAMENTO, h.id);

  // ---- Presença ----
  const presLinhas = t.alunos.map(a => `
    <div class="mini linha-acao">
      <b>${a.nome}</b>
      <span class="toggle" data-aluno="${a.id}">
        <button class="${pres[a.id]==="p"?"on-p":""}" data-v="p">Presente</button>
        <button class="${pres[a.id]==="a"?"on-a":""}" data-v="a">Faltou</button>
      </span>
    </div>`).join("");
  const nPres = t.alunos.filter(a => pres[a.id]==="p").length;
  const marcados = t.alunos.filter(a => pres[a.id]).length;
  const valPres = marcados ? `${nPres}/${t.alunos.length}` : "marcar";

  // ---- Trilhas ----
  const trilhaLinhas = t.alunos.map(a => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    const feitas = st.filter(x => x !== "pend").length;
    const acertos = st.filter(x => x === "ok").length;
    const nota = st.length ? Math.round(acertos / st.length * 100) : null;
    const bolas = st.map((x,i) =>
      `<span class="st ${x}" title="${(h.licoes||[])[i]||""}">${x==="ok"?"✓":x==="err"?"✕":"–"}</span>`).join("");
    return `
      <div class="mini trilha-linha">
        <div class="tl-topo"><b>${a.nome}</b>
          <span class="nota ${nota===null?"":nota>=80?"alta":nota>=60?"media":"baixa"}">${nota===null?"–":nota+"%"}</span>
        </div>
        <div class="tl-bolas">${bolas}</div>
        <span class="tl-sub">${feitas} de ${st.length} lições</span>
      </div>`;
  }).join("");
  const feitasTodas = t.alunos.filter(a => {
    const st = (h.progresso && h.progresso[a.id]) || [];
    return st.length && st.every(x => x !== "pend");
  }).length;

  // ---- Engajamento ----
  const engLinhas = t.alunos.map(a => {
    const n = eng[a.id] || 0;
    const estrelas = [1,2,3].map(i =>
      `<button class="estrela ${i<=n?"on":""}" data-aluno="${a.id}" data-n="${i}" title="${i} de 3">★</button>`).join("");
    return `<div class="mini linha-acao"><b>${a.nome}</b><span class="estrelas">${estrelas}</span></div>`;
  }).join("");
  const avaliados = t.alunos.filter(a => eng[a.id]).length;
  const medEng = avaliados
    ? (t.alunos.reduce((s,a) => s + (eng[a.id]||0), 0) / avaliados).toFixed(1)
    : null;

  box.innerHTML = `
    <div class="card-kicker">${h.titulo} · ${h.data}</div>
    ${linhaExp("pres",    "Presença",    valPres, presLinhas)}
    ${linhaExp("trilhas", "Trilhas",     `${feitasTodas}/${t.alunos.length}`, trilhaLinhas)}
    ${linhaExp("eng",     "Engajamento", medEng ? medEng + "★" : "avaliar", engLinhas)}
  `;
  ligarExp(box);

  // presença
  box.querySelectorAll(".toggle button").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const id = b.closest(".toggle").dataset.aluno;
      pres[id] = b.dataset.v;
      renderHistResumo();
      abrir(box, "pres");
    };
  });
  // engajamento
  box.querySelectorAll(".estrela").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.aluno, n = +b.dataset.n;
      eng[id] = (eng[id] === n) ? 0 : n;   // clicar de novo na mesma limpa
      renderHistResumo();
      abrir(box, "eng");
    };
  });
}

function abrir(box, id){
  const el = box.querySelector(`.exp[data-exp="${id}"]`);
  if (el) el.classList.add("aberta");
}

// ══════════════════════════════════════════════════════════
//  Trilha & performance
// ══════════════════════════════════════════════════════════
function notaDe(status){
  const feitas = status.filter(s => s !== "pend");
  if (!feitas.length) return null;
  const acertos = status.filter(s => s === "ok").length;
  return Math.round((acertos / status.length) * 100);
}
function classeNota(n){
  if (n === null) return "";
  return n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";
}

function renderTrilhaGeral(){
  const t = turmaAtual;
  const tb = document.getElementById("tabela-trilha");
  let head = `<thead><tr><th class="aluno-nome">Aluno</th>`;
  t.licoes.forEach(l => head += `<th>${l}</th>`);
  head += `<th>Nota</th></tr></thead>`;

  let body = "<tbody>";
  t.alunos.forEach(a => {
    const st = t.progresso[a.id] || [];
    const n = notaDe(st);
    body += `<tr onclick="verAluno('${a.id}')"><td class="aluno-nome">${a.nome}</td>`;
    st.forEach(s => {
      const txt = s === "ok" ? "✓" : s === "err" ? "✕" : "–";
      body += `<td><span class="st ${s}">${txt}</span></td>`;
    });
    body += `<td class="nota ${classeNota(n)}">${n === null ? "–" : n + "%"}</td></tr>`;
  });
  body += "</tbody>";
  tb.innerHTML = head + body;
}

function renderAlunoLista(){
  const box = document.getElementById("aluno-lista");
  box.innerHTML = "";
  turmaAtual.alunos.forEach(a => {
    const st = turmaAtual.progresso[a.id] || [];
    const feitas = st.filter(s => s !== "pend").length;
    const pct = Math.round((feitas / st.length) * 100);
    const n = notaDe(st);
    const d = document.createElement("div");
    d.className = "card";
    d.style.display = "block";
    d.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <h3>${a.nome}</h3>
          <div class="sub">${a.cargo}</div>
        </div>
        <div class="nota ${classeNota(n)}" style="font-size:18px;">${n === null ? "–" : n + "%"}</div>
      </div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <div class="sub" style="margin-top:6px;">${feitas} de ${st.length} lições feitas</div>
    `;
    d.onclick = () => verAluno(a.id);
    box.appendChild(d);
  });
}

function verAluno(id){
  const t = turmaAtual;
  const a = t.alunos.find(x => x.id === id);
  const st = t.progresso[id] || [];
  const acertos = st.filter(s => s === "ok").length;
  const erros = st.filter(s => s === "err").length;
  const pend = st.filter(s => s === "pend").length;
  const n = notaDe(st);

  document.getElementById("trilha-geral").style.display = "none";
  document.getElementById("trilha-aluno").style.display = "none";
  document.getElementById("trilha-detalhe").style.display = "block";
  document.querySelector(".switch").style.display = "none";

  let licoes = "";
  st.forEach((s, i) => {
    const txt = s === "ok" ? "Acertou" : s === "err" ? "Errou" : "Não fez";
    licoes += `<div class="kv">
        <span>${t.licoes[i]}</span>
        <span><span class="st ${s}" style="margin-right:6px;">${s==="ok"?"✓":s==="err"?"✕":"–"}</span>${txt}</span>
      </div>`;
  });

  // 1 aula = 1 trilha = N lições. O gabarito é da trilha inteira, não de
  // uma lição isolada — por isso um botão só.
  const urlTrilha = `templatetrilha.html?modo=gabarito`
    + `&aluno=${encodeURIComponent(a.nome)}`
    + `&turma=${encodeURIComponent(t.nome)}`
    + `&aula=${encodeURIComponent(t.aula.titulo)}`
    + `&nota=${n === null ? "" : n}`;

  document.getElementById("detalhe-conteudo").innerHTML = `
    <div class="det-cols">
    <div class="card">
      <div class="card-kicker">${a.cargo}</div>
      <h2>${a.nome}</h2>
      <div style="margin-top:14px;">
        <div class="kv"><span>Nota da trilha</span><span class="nota ${classeNota(n)}">${n === null ? "–" : n + "%"}</span></div>
        <div class="kv"><span>Acertos</span><span>${acertos}</span></div>
        <div class="kv"><span>Erros</span><span>${erros}</span></div>
        <div class="kv"><span>Pendentes</span><span>${pend}</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-kicker">Lição a lição</div>
      ${licoes}
      <a class="btn" href="${urlTrilha}" target="_blank">Ver trilha completa →</a>
    </div>
    </div>
  `;
}

document.getElementById("btn-voltar-aluno").onclick = () => {
  document.getElementById("trilha-detalhe").style.display = "none";
  document.querySelector(".switch").style.display = "flex";
  const modo = document.querySelector(".switch button.active").dataset.modo;
  document.getElementById("trilha-geral").style.display = modo === "geral" ? "block" : "none";
  document.getElementById("trilha-aluno").style.display = modo === "aluno" ? "block" : "none";
};

document.querySelectorAll(".switch button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".switch button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("trilha-detalhe").style.display = "none";
    document.getElementById("trilha-geral").style.display = b.dataset.modo === "geral" ? "block" : "none";
    document.getElementById("trilha-aluno").style.display = b.dataset.modo === "aluno" ? "block" : "none";
  };
});

// ══════════════════════════════════════════════════════════
//  Presença
// ══════════════════════════════════════════════════════════
let aulaFimSel = null;

function renderPresenca(){
  const t = turmaAtual;
  const aulas = t.aulasHoje || [];
  const sel = document.getElementById("fim-seletor");
  const box = document.getElementById("presenca-lista");
  const btn = document.getElementById("btn-salvar-presenca");

  if (!aulas.length){
    sel.innerHTML = "";
    box.innerHTML = `<div class="card"><p>Nenhuma aula hoje nesta turma.</p></div>`;
    btn.style.display = "none";
    return;
  }
  btn.style.display = "flex";

  if (!aulaFimSel || !aulas.some(a => a.id === aulaFimSel)) aulaFimSel = aulas[0].id;

  // Se houver mais de uma aula hoje, escolher de qual é a presença
  sel.innerHTML = aulas.length > 1
    ? `<div class="switch">${aulas.map(a =>
        `<button class="${a.id===aulaFimSel?"active":""}" data-aula="${a.id}">${a.hora} · ${a.titulo}</button>`
      ).join("")}</div>`
    : "";
  sel.querySelectorAll("button").forEach(b => {
    b.onclick = () => { aulaFimSel = b.dataset.aula; renderPresenca(); };
  });

  const pres  = estado(PRESENCA, aulaFimSel);
  const notas = estado(NOTAS_ALUNO, aulaFimSel);

  box.innerHTML = "";
  t.alunos.forEach(a => {
    const atual = pres[a.id];
    const nota  = notas[a.id] || "";
    const d = document.createElement("div");
    d.className = "presenca-item";
    d.innerHTML = `
      <div class="presenca-topo">
        <span class="nome">${a.nome}</span>
        <span class="toggle">
          <button class="${atual === "p" ? "on-p" : ""}" data-v="p">Presente</button>
          <button class="${atual === "a" ? "on-a" : ""}" data-v="a">Faltou</button>
        </span>
      </div>
      <button class="nota-toggle${nota ? " tem" : ""}">
        <span class="dot-nota"></span>
        ${nota ? "Anotação escrita" : "Anotar sobre este aluno"} ›
      </button>
      <div class="nota-box">
        <textarea placeholder="Como foi a participação, o que travou, o que reforçar na próxima…">${nota}</textarea>
        <div class="hint">Interno — não vai para o aluno nem para o RH</div>
      </div>`;

    d.querySelectorAll(".toggle button").forEach(b => {
      b.onclick = () => { pres[a.id] = b.dataset.v; renderPresenca(); };
    });

    const tgl = d.querySelector(".nota-toggle");
    const cx  = d.querySelector(".nota-box");
    const ta  = d.querySelector("textarea");
    tgl.onclick = () => { cx.classList.toggle("open"); if (cx.classList.contains("open")) ta.focus(); };
    ta.oninput = () => { notas[a.id] = ta.value; tgl.classList.toggle("tem", !!ta.value.trim()); };
    if (nota) cx.classList.add("open");

    box.appendChild(d);
  });
}

document.getElementById("btn-salvar-presenca").onclick = () => {
  const t = turmaAtual;
  const pres  = estado(PRESENCA, aulaFimSel);
  const notas = estado(NOTAS_ALUNO, aulaFimSel);
  const marcados = t.alunos.filter(a => pres[a.id]).length;
  if (marcados < t.alunos.length){
    alert(`Faltam ${t.alunos.length - marcados} aluno(s) sem marcação.`);
    return;
  }
  const comNota = t.alunos.filter(a => (notas[a.id]||"").trim()).length;
  alert(`Aula fechada.\nPresença: ${t.alunos.length} aluno(s).\nAnotações internas: ${comNota}.\n\n(Prévia — ainda não grava no banco.)`);
};

// ══════════════════════════════════════════════════════════
//  Navegação por abas
// ══════════════════════════════════════════════════════════
function irPara(pane){
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.pane === pane));
  document.querySelectorAll(".pane").forEach(p =>
    p.classList.toggle("active", p.id === "pane-" + pane));
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => irPara(t.dataset.pane);
});

// ══════════════════════════════════════════════════════════
function renderTudo(){
  renderTurmas();
  renderAula();
  renderTrilhaGeral();
  renderAlunoLista();
  renderPresenca();
  renderHistorico();
  renderResumo();
  document.getElementById("trilha-detalhe").style.display = "none";
  document.querySelector(".switch").style.display = "flex";
}

renderTudo();
</script>
</body>
