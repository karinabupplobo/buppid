<!DOCTYPE html>
<!--
  DASH DO ALUNO
  =============
  Mesma linguagem visual das outras três, mesmo dados-mock.js. A regra aqui é
  a mais estrita de todas: o aluno vê APENAS o que é dele.

    · nunca vê outro aluno — nem nome, nem nota, nem presença;
    · nunca vê as anotações internas que o professor escreve sobre ele;
    · nunca vê os alertas pedagógicos automáticos nem os recados entre
      professor e gestão;
    · vê a aula que terá, o assunto, e as trilhas que já fez.

  Quatro abas:
    Home    — como ele está: nível, presença, engajamento, trilhas, objetivo
    Hoje    — a aula do dia e a trilha correspondente
    Trilhas — as que já fez e as que virão (filtro)
    Aulas   — todas as aulas, passadas e futuras (filtro)

  Selo de papel: "student" (ver regra de idioma em docs/plataforma.md).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp — Aluno</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* COMB 2 — MARROM #54402F + AZUL-BEBÊ #A8D5F2 + branco.
       Comb 1 (limão + cinza): git checkout comb-1-limao-cinza
       Comb 3 (cinza + azul):  git checkout comb-3-cinza-azul

       Azul-bebê é acento de PREENCHIMENTO: sobre branco tem 1,56:1, nunca
       é texto. Texto sobre azul é sempre o marrom (6,3:1).
       O fundo da página é levemente quente, para acompanhar o marrom. */
    --teal-escuro: #54402F;         /* cor escura: marrom */
    --amarelo-neon: #A8D5F2;        /* acento: azul-bebê */
    --limao-claro: #E4F1FA;         /* azul lavado, para fundos suaves */
    --bg-dash: #F7F5F2;             /* fundo levemente quente */
    --azul-intermediario: #8A7767;  /* apoio: marrom claro */
    --branco: #FFFFFF;
    --texto: #54402F;
    --cinza-texto: #8A7F76;
    --borda: #E7E1DA;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: rgba(60,110,120,0.45); }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-dash);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Topo ===== */
  /* Faixa do logo em teal — devolve ao logo a aplicação padrão do manual
     (limão sobre teal escuro), sem perder a sidebar branca. */
  /* Faixa de topo: largura total, logo ao centro, aplicação padrão do
     manual — limão sobre teal escuro. */
  /* O PNG foi recortado nas margens brancas, então a borda esquerda da imagem
     é a borda esquerda do "b" — alinha com o nome do professor abaixo. */
  .logo{ display: block; width: 118px; height: auto; flex-shrink: 0; }

  /* Sidebar inteira em marrom: logo, usuário e abas sobre fundo escuro.
     Voltar ao topo marrom com abas claras:
     git checkout v-20260821-1415-ANTES-sidebar-toda-marrom */
  .topo-sidebar{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,.14);
  }

  /* Nome do usuário. REGRA DE IDIOMA (21/08): a plataforma inteira é em
     português — abas, botões, rótulos — para os quatro papéis. As únicas
     exceções são a saudação "Hi, Nome" e o selo de papel, que ficam em inglês
     como aceno ao produto. Todo o resto: português.

     Selos por papel:
       professor      -> teacher
       aluno          -> student
       RH do cliente  -> manager
       equipe Bupp    -> internal                                             */
  .whoami{
    font-size: 11.5px; color: rgba(255,255,255,.7); font-weight: 500;
    line-height: 1.3; text-align: right; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  }
  .whoami strong{
    color: #fff; display: block; font-weight: 700; font-size: 13px;
    letter-spacing: -0.01em;
  }
  .whoami span{
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--teal-escuro);
    background: var(--amarelo-neon); padding: 2px 7px; border-radius: 999px;
  }

  /* Link pequeno "N turmas", logo abaixo do selo do usuário */
  .link-turmas{
    background: none; border: none; padding: 2px 0 0; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--azul-intermediario); white-space: nowrap;
  }
  .link-turmas{ color: rgba(255,255,255,.72); }
  .link-turmas b{ font-weight: 800; color: #fff; }
  .link-turmas:hover{ color: #fff; text-decoration: underline; }

  /* item de turma no pop-up */
  .turma-item{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #fafbf7; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: background .13s, border-color .13s;
  }
  .turma-item:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .ti-esq{ display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ti-nome{ font-size: 13.5px; font-weight: 700; color: var(--texto); }
  .ti-meta{ font-size: 11.5px; color: var(--cinza-texto); }
  .ti-dir{ display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ti-grade{ font-size: 11.5px; font-weight: 700; color: var(--azul-intermediario); white-space: nowrap; }

  /* ===== Abas: sobre a sidebar escura ===== */
  .tabs{
    display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.08); border: 1px solid transparent;
    color: rgba(255,255,255,.78);
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 10px 14px; border-radius: 9px;
    transition: background .14s, color .14s;
  }
  .tab:hover{ background: rgba(255,255,255,.16); color: #fff; }
  .tab.active{
    background: var(--amarelo-neon); border-color: var(--amarelo-neon);
    color: var(--teal-escuro);
    box-shadow: none;
  }

  /* ===== Conteúdo ===== */
  main{ padding: 18px 18px 60px; }
  .pane{ display: none; }
  .pane.active{ display: block; }

  .card{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 14px; padding: 18px;
    margin-bottom: 14px; color: var(--texto);
  }
  .card-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--azul-intermediario); margin-bottom: 8px;
  }
  .card h2{ margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card p{ margin: 0; font-size: 13.5px; color: var(--cinza-texto); line-height: 1.5; }

  .btn{
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; margin-top: 14px; border: none; border-radius: 10px;
    background: var(--teal-escuro); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .btn:hover{ background: var(--azul-intermediario); color: #fff; }
  .btn.lime{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .btn.ghost{
    background: transparent; color: var(--azul-intermediario);
    border: 1.5px solid var(--borda); font-weight: 600;
  }

  .pill{
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .section-title{
    color: var(--teal-escuro); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; margin: 4px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before{
    content: ""; width: 14px; height: 3px; border-radius: 2px;
    background: var(--amarelo-neon); flex-shrink: 0;
  }

  /* ===== Trilha & performance ===== */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #5a635f; padding: 9px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .switch button.active{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .switch button:hover:not(.active){ color: var(--teal-escuro); }

  .grid-wrap{ overflow-x: auto; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 4px; }
  table{ border-collapse: collapse; width: 100%; font-size: 12.5px; color: var(--texto); }
  th, td{ padding: 10px 8px; text-align: center; white-space: nowrap; }
  th{
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--azul-intermediario);
    border-bottom: 1.5px solid var(--borda);
  }
  td.aluno-nome, th.aluno-nome{
    text-align: left; position: sticky; left: 0; background: var(--branco);
    font-weight: 600; padding-left: 12px;
  }
  tbody tr{ border-bottom: 1px solid #f2f4f0; cursor: pointer; }
  tbody tr:last-child{ border-bottom: none; }
  tbody tr:hover td{ background: #fafbf7; }
  tbody tr:hover td.aluno-nome{ background: #fafbf7; }

  .st{ display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; }
  .st.ok{ background: #dff0d8; color: #3f6b45; }
  .st.err{ background: #fbe0de; color: #a3312a; }
  .st.pend{ background: #eef0ec; color: #9aa39f; }
  .nota{ font-weight: 800; }
  .nota.alta{ color: #3f6b45; }
  .nota.media{ color: #8a6d1f; }
  .nota.baixa{ color: #a3312a; }

  /* Perfil do aluno */
  .aluno-lista .card{ display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .aluno-lista .card:hover{ outline: 2px solid var(--amarelo-neon); }
  .aluno-lista h3{ margin: 0; font-size: 15.5px; font-weight: 700; }
  .aluno-lista .sub{ font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }
  .barra{ height: 6px; border-radius: 3px; background: #eef0ec; overflow: hidden; margin-top: 9px; }
  .barra i{ display: block; height: 100%; background: var(--azul-intermediario); }

  .voltar{
    background: none; border: none; color: var(--azul-intermediario); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 0 12px;
  }
  .kv{ display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f4f0; font-size: 13.5px; }
  .kv:last-child{ border-bottom: none; }
  .kv span:first-child{ color: var(--cinza-texto); }
  .kv span:last-child{ font-weight: 700; }

  /* ===== Linhas expansíveis do resumo ===== */
  .exp{ border-bottom: 1px solid #f2f4f0; }
  .exp:last-child{ border-bottom: none; }
  .exp-cab{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 11px 0; text-align: left; transition: color .13s;
  }
  .exp-rot{ font-size: 13.5px; color: var(--cinza-texto); }
  .exp-cab:hover .exp-rot{ color: var(--texto); }
  .exp-val{
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .seta{
    width: 7px; height: 7px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario);
    transform: rotate(45deg) translate(-1px,-1px); transition: transform .18s;
  }
  .exp.aberta .seta{ transform: rotate(-135deg) translate(-2px,-2px); }
  .exp-corpo{ display: none; padding: 2px 0 12px; }
  .exp.aberta .exp-corpo{ display: block; }

  .mini{
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; background: #fafbf7; border-radius: 8px; margin-bottom: 6px;
  }
  .mini:last-child{ margin-bottom: 0; }
  .mini b{ font-size: 13px; font-weight: 700; color: var(--texto); }
  .mini span{ font-size: 12px; color: var(--cinza-texto); line-height: 1.45; }
  .mini.obj{ flex-direction: row; gap: 8px; align-items: flex-start; }
  .mini.obj b{ color: var(--azul-intermediario); flex-shrink: 0; }

  .mini.linha-acao{ flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .trilha-linha .tl-topo{ display: flex; align-items: center; justify-content: space-between; }
  .trilha-linha .tl-bolas{ display: flex; gap: 4px; margin: 6px 0 3px; flex-wrap: wrap; }
  .trilha-linha .tl-sub{ font-size: 11px; }

  .estrelas{ display: flex; gap: 2px; }
  .estrela{
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 17px; line-height: 1; color: #d8dcd2; transition: color .12s, transform .12s;
  }
  .estrela:hover{ transform: scale(1.15); }
  .estrela.on{ color: var(--amarelo-neon); text-shadow: 0 0 1px var(--azul-intermediario); }

  /* Aula e pontos de atenção num card só: retângulo horizontal no desktop,
     vertical no celular. */
  .par{ margin-bottom: 16px; }
  .card.unico{ padding: 0; overflow: hidden; margin-bottom: 0; }
  .lado-aula{ padding: 18px; }
  .lado-pontos{ padding: 18px; border-top: 1px solid var(--borda); background: #fcfcfa; }

  /* aula do dia / histórico */
  .aula-topo{
    display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
    flex-wrap: wrap; min-width: 0;
  }
  .aula-topo .pill{ white-space: nowrap; margin-bottom: 0; flex-shrink: 0; }
  .aula-topo .ident{ margin-bottom: 0; }

  /* ===== Chip do resumo da turma ===== */

  /* ===== Vocabulário e alertas ===== */
  .vocs{ display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
  .tagv{
    font-size: 12.5px; font-weight: 600; color: var(--teal-escuro);
    background: var(--limao-claro); padding: 5px 10px; border-radius: 7px;
  }

  .aluno-alerta{
    width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-alerta:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .aluno-alerta .an{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--texto);
  }
  .seta-r{
    width: 5px; height: 5px; border-right: 2px solid var(--azul-intermediario);
    border-top: 2px solid var(--azul-intermediario); transform: rotate(45deg);
  }
  .ats{ display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-al{
    font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
  }
  .tag-al.vermelho{ background: #fbe0de; color: #a3312a; }
  .tag-al.ambar{ background: #fbf0d8; color: #8a6d1f; }
  .tag-al.lavanda{ background: #ece9f0; color: var(--azul-intermediario); }

  /* ===== Pop-up ===== */
  .modal{
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(24,16,26,0.5);
  }
  .modal.on{ display: flex; }
  .modal-cx{
    background: var(--branco); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(24,16,26,0.3);
  }
  .modal-topo{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 20px 20px 14px; border-bottom: 1px solid var(--borda);
  }
  .modal-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 3px;
  }
  .modal-topo h3{ margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--texto); }
  .modal-x{
    background: none; border: none; cursor: pointer; font-size: 24px; line-height: 1;
    color: var(--cinza-texto); padding: 0 2px; flex-shrink: 0;
  }
  .modal-x:hover{ color: var(--texto); }
  .modal-corpo{ padding: 16px 20px 22px; overflow-y: auto; }
  .modal-corpo .bloco{ margin-bottom: 18px; }
  .modal-corpo .bloco:last-child{ margin-bottom: 0; }
  .modal-corpo .bt{
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 8px;
  }

  /* linha do tempo do aluno */
  .ev{
    border-left: 3px solid var(--borda); padding: 0 0 14px 13px; position: relative;
  }
  .ev:last-child{ padding-bottom: 0; }
  .ev.pendente{ border-left-color: var(--amarelo-neon); }
  .ev-topo{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .ev-data{ font-size: 11px; font-weight: 800; color: var(--azul-intermediario); letter-spacing: .04em; }
  .ev-de{ font-size: 11px; font-weight: 700; color: var(--cinza-texto); }
  .ev-txt{ font-size: 13.5px; color: var(--texto); line-height: 1.5; }
  .ev.pendente .ev-txt{
    background: var(--limao-claro); padding: 8px 10px; border-radius: 8px; font-weight: 500;
  }
  .selo-pend{
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    background: var(--amarelo-neon); color: var(--teal-escuro);
    padding: 3px 7px; border-radius: 999px;
  }
  /* botão de aluno no resumo da turma */
  .aluno-link{
    width: 100%; display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 11px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-link:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .al-nome{
    display: flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .al-cargo{ font-size: 12px; color: var(--cinza-texto); }
  .aluno-link .tag-al{ margin-top: 4px; }

  /* números consolidados da ficha */
  .nums{
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px;
  }
  .num{
    background: #fafbf7; border-radius: 10px; padding: 11px 10px;
    display: flex; flex-direction: column; gap: 1px; text-align: center;
  }
  .nv{ font-size: 20px; font-weight: 800; color: var(--texto); letter-spacing: -0.02em; }
  .nv.alta{ color: #3f6b45; } .nv.media{ color: #8a6d1f; } .nv.baixa{ color: #a3312a; }
  .nr{ font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--azul-intermediario); }
  .nd{ font-size: 10.5px; color: var(--cinza-texto); }
  .pres-rot{ font-size: 12px; color: var(--cinza-texto); }

  .voltar-turma{
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--azul-intermediario);
    padding: 0 0 12px;
  }
  .voltar-turma:hover{ color: var(--teal-escuro); }

  /* Identificação da aula: Empresa · Nível · Dia · Horário · [+] */
  .ident{
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    margin-bottom: 9px; font-size: 12px; min-width: 0;
  }
  .id-emp{
    font-weight: 800; color: var(--teal-escuro); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-turma{
    font-weight: 600; color: var(--cinza-texto); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-niv{
    font-size: 10px; font-weight: 800; letter-spacing: .06em; flex-shrink: 0;
    background: var(--limao-claro); color: var(--teal-escuro);
    padding: 2px 7px; border-radius: 999px;
  }
  /* identificação dentro do card de trilha */
  .ident-tr{ margin: 2px 0 1px; font-size: 11.5px; }
  .id-dia, .id-hora{
    font-weight: 700; color: var(--cinza-texto); white-space: nowrap; flex-shrink: 0;
  }
  .id-hora{ color: var(--azul-intermediario); }
  .id-mais{
    flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    border: 1px solid var(--borda); background: var(--branco);

  .pm-topo{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .pm-rot{ font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--amarelo-neon); }
  .pm-n{ font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); }
  .pm-barra{ height: 8px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
  .pm-preenchida{ height: 100%; background: var(--amarelo-neon); border-radius: 999px; }

  /* Cards de aula e de trilha */
  .card-aula{ margin-bottom: 12px; }
  .card-aula .pill.futura{ background: var(--limao-claro); color: var(--teal-escuro); }
  .card-aula .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .card-aula .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .bloco-conteudo{
    background: #fafbf7; border-radius: 10px; padding: 12px 14px; margin-top: 12px;
  }
  .bc-rot{
    font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 6px;
  }
  .bc-txt{ font-size: 13.5px; line-height: 1.5; color: var(--texto); }
  .bloco-conteudo .btn{ margin-top: 10px; }
  .bc-vocab{ display: flex; flex-wrap: wrap; gap: 6px; }
  .tagv{
    font-size: 12.5px; font-weight: 600; color: var(--teal-escuro);
    background: var(--limao-claro); padding: 5px 10px; border-radius: 7px;
  }

  /* Trilha */
  .trilha-estado{
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 12px;
  }
  .te-bolas{ display: flex; gap: 4px; flex-wrap: wrap; }
  .te-num{ font-size: 12px; font-weight: 700; }
  .te-num .ok{ color: #3f6b45; }
  .te-num .er{ color: #a3312a; }
  .te-nota{ margin-left: auto; }
  .pill.pendente{ background: #fbf2d8; color: #8a6d1f; }
  .pill.bloqueada{ background: #f0eeec; color: #8d8781; }

  .tema-lista{ display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tema-tag{
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
    background: #f2f0ee; color: var(--cinza-texto);
  }
  .tema-tag.errou{ background: #fbe0de; color: #a3312a; font-weight: 800; }
  .tema-tag.acertou{ background: #e8efe3; color: #3f6b45; }

  /* Filtro passado / futuro */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    padding: 4px; border-radius: 11px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 12.5px; font-weight: 700; color: var(--azul-intermediario);
    padding: 9px 12px; border-radius: 8px; transition: background .13s, color .13s;
  }
  .switch button.active{ background: var(--branco); color: var(--teal-escuro); box-shadow: 0 1px 3px rgba(0,0,0,.07); }

  .vazio-msg{
    background: var(--branco); border: 1px solid var(--borda); border-radius: 14px;
    padding: 22px; text-align: center; font-size: 13.5px; color: var(--cinza-texto);
  }
</style>

</head>
<body>

<aside class="sidebar">
  <div class="topo-sidebar">
    <img class="logo" src="assets/logo-bupp-marrom-azul-claro.png" alt="bupp idiomas">
    <div class="whoami">
      <strong id="al-nome"></strong>
      <span>student</span>
      <button class="link-turmas" id="btn-turma"><b id="bt-nivel"></b> · minha turma ›</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-pane="home">Home</button>
    <button class="tab" data-pane="hoje">Hoje</button>
    <button class="tab" data-pane="trilhas">Trilhas</button>
    <button class="tab" data-pane="aulas">Aulas</button>
  </div>
</aside>

<div class="modal" id="modal">
  <div class="modal-cx" role="dialog" aria-modal="true">
    <div class="modal-topo">
      <div>
        <div class="modal-kicker" id="modal-kicker"></div>
        <h3 id="modal-titulo"></h3>
      </div>
      <button class="modal-x" id="modal-x" aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-corpo" id="modal-corpo"></div>
  </div>
</div>

<main>
  <section class="pane active" id="pane-home">
    <div id="home-nivel"></div>
    <div class="kpis" id="kpis"></div>
    <div class="rt-titulo">Onde prestar atenção</div>
    <div id="home-temas"></div>
  </section>

  <section class="pane" id="pane-hoje">
    <div id="lista-hoje"></div>
  </section>

  <section class="pane" id="pane-trilhas">
    <div class="switch" id="sw-trilhas">
      <button class="active" data-q="feitas">Já fiz</button>
      <button data-q="futuras">Vão chegar</button>
    </div>
    <div id="lista-trilhas"></div>
  </section>

  <section class="pane" id="pane-aulas">
    <div class="switch" id="sw-aulas">
      <button class="active" data-q="passadas">Já tive</button>
      <button data-q="futuras">Vão acontecer</button>
    </div>
    <div id="lista-aulas"></div>
  </section>
</main>

<script src="dados-mock.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  QUEM ESTÁ LOGADO
//  Numa versão real vem da sessão. Aqui, o primeiro usuário com papel de
//  aluno — a turma dele define tudo o que esta dash mostra.
// ══════════════════════════════════════════════════════════
const USUARIO = USUARIOS.find(u => u.papel === "aluno" || u.papel === "aluno_gestor");
const TURMA   = TURMAS.find(t => t.id === USUARIO.turmaId);
const EU      = TURMA.alunos.find(a => a.id === USUARIO.alunoId);

document.getElementById("al-nome").textContent = "Hi, " + EU.nome.split(" ")[0];
document.getElementById("bt-nivel").textContent = TURMA.nivel;

function classeNota(n){
  return n === null ? "" : n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";
}
function estrelas(n){
  if (!n) return '<span class="sem">–</span>';
  return `<span class="estrelas-ro">${"★".repeat(n)}<b>${"☆".repeat(3-n)}</b></span>`;
}
function partesIdent(t){
  const jaTem = t.nome.toLowerCase().startsWith(t.empresa.toLowerCase());
  return jaTem ? t.nome.slice(t.empresa.length).replace(/^\s*[—\-·]\s*/, "") : t.nome;
}

// ── Meus números, só meus ──
function meusNumeros(){
  const aulas = TURMA.historico || [];
  let presentes = 0, marcadas = 0;
  aulas.forEach(h => {
    const v = (PRESENCA[h.id] || {})[EU.id];
    if (!v) return;
    marcadas++;
    if (v === "p") presentes++;
  });
  const estrelasDadas = aulas.map(h => (ENGAJAMENTO[h.id] || {})[EU.id]).filter(Boolean);
  const trilhas = aulas.map(h => trilhaDoAluno(TURMA, h, EU.id)).filter(Boolean);
  const comNota = trilhas.filter(t => t.nota !== null);

  return {
    presentes, marcadas,
    pctPres: marcadas ? Math.round(presentes / marcadas * 100) : null,
    medEng: estrelasDadas.length
      ? estrelasDadas.reduce((a,b) => a+b, 0) / estrelasDadas.length : null,
    medNota: comNota.length
      ? Math.round(comNota.reduce((a,t) => a + t.nota, 0) / comNota.length) : null,
    trilhasFeitas: trilhas.filter(t => t.feita).length,
    trilhasTotal: trilhas.length,
    aulasDadas: aulas.length
  };
}

// ── Onde eu erro mais ──
function meusTemas(){
  const mapa = {};
  (TURMA.historico || []).forEach(h => {
    const st = (h.progresso && h.progresso[EU.id]) || [];
    (h.temas || []).forEach((tema, i) => {
      if (!st[i] || st[i] === "pend") return;
      const d = mapa[tema] = mapa[tema] || { total:0, erros:0 };
      d.total++;
      if (st[i] === "err") d.erros++;
    });
  });
  return Object.entries(mapa)
    .map(([tema, d]) => ({ tema, ...d, pct: Math.round(d.erros / d.total * 100) }))
    .sort((a,b) => b.pct - a.pct || b.total - a.total);
}

// ══════════════════════════════════════════════════════════
//  HOME
// ══════════════════════════════════════════════════════════
function renderHome(){
  const n = meusNumeros();

  document.getElementById("home-nivel").innerHTML = `
    <div class="meu-nivel">
      <div class="mn-topo">
        <span class="mn-nivel">${TURMA.nivel}</span>
        <span class="mn-turma">${TURMA.empresa} · ${partesIdent(TURMA)} · ${TURMA.modulo}</span>
      </div>
      <div class="mn-desc">${TURMA.nivelDesc}</div>
      <div class="progresso-mod">
        <div class="pm-topo">
          <span class="pm-rot">Trilhas concluídas</span>
          <span class="pm-n">${n.trilhasFeitas} de ${n.trilhasTotal}</span>
        </div>
        <div class="pm-barra">
          <div class="pm-preenchida" style="width:${n.trilhasTotal ? (n.trilhasFeitas/n.trilhasTotal*100) : 0}%"></div>
        </div>
      </div>
      <div class="mn-obj">
        <div class="rot">Onde a turma quer chegar</div>
        <p>${TURMA.objetivoTurma}</p>
      </div>
    </div>`;

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="v ${classeNota(n.pctPres)}">${n.pctPres===null?"–":n.pctPres+"%"}</div>
      <div class="r">Presença</div><div class="d">${n.presentes} de ${n.marcadas} aulas</div></div>
    <div class="kpi"><div class="v">${n.medEng===null?"–":n.medEng.toFixed(1)+"★"}</div>
      <div class="r">Engajamento</div><div class="d">avaliação do professor</div></div>
    <div class="kpi"><div class="v ${classeNota(n.medNota)}">${n.medNota===null?"–":n.medNota+"%"}</div>
      <div class="r">Trilhas</div><div class="d">média de acerto</div></div>
    <div class="kpi"><div class="v">${n.aulasDadas}</div>
      <div class="r">Aulas</div><div class="d">já realizadas</div></div>`;

  const temas = meusTemas();
  const box = document.getElementById("home-temas");
  if (!temas.length){
    box.innerHTML = `<div class="vazio-msg">Ainda não há trilha suficiente para dizer onde você tropeça.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="card">
      ${temas.map(t => `
        <div class="mini linha-acao">
          <b>${t.tema}</b>
          <span>
            ${t.erros
              ? `<span class="tema-tag errou">${t.erros} erro${t.erros>1?"s":""} em ${t.total}</span>`
              : `<span class="tema-tag acertou">${t.total} de ${t.total} certos</span>`}
          </span>
        </div>`).join("")}
    </div>`;
}

// ══════════════════════════════════════════════════════════
//  HOJE — a aula do dia e a trilha que vem dela
// ══════════════════════════════════════════════════════════
function htmlConteudoAula(a){
  return `
    ${a.objetivo ? `<div class="bloco-conteudo">
      <div class="bc-rot">O que você vai conseguir fazer</div>
      <div class="bc-txt">${a.objetivo}</div></div>` : ""}
    ${(a.vocab || []).length ? `<div class="bloco-conteudo">
      <div class="bc-rot">Vocabulário da aula</div>
      <div class="bc-vocab">${a.vocab.map(v => `<span class="tagv">${v}</span>`).join("")}</div></div>` : ""}
    ${a.gramatica ? `<div class="bloco-conteudo">
      <div class="bc-rot">Ponto gramatical</div>
      <div class="bc-txt">${a.gramatica}</div></div>` : ""}`;
}

function renderHoje(){
  const box = document.getElementById("lista-hoje");
  const aulas = TURMA.aulasHoje || [];

  box.innerHTML = `<div class="section-title">Hoje · ${aulas.length} aula${aulas.length!==1?"s":""}</div>`;

  if (!aulas.length){
    box.innerHTML += `<div class="vazio-msg">Você não tem aula hoje. Aproveite para fechar as trilhas pendentes.</div>`;
    return;
  }

  aulas.forEach(a => {
    const d = document.createElement("div");
    d.className = "card card-aula";
    d.innerHTML = `
      <div class="aula-topo">
        ${aulaTerminou(a.id)
          ? '<span class="pill dada">Aula concluída</span>'
          : '<span class="pill hoje">Aula de hoje</span>'}
        <div class="ident">
          <span class="id-niv">${TURMA.nivel}</span>
          <span class="id-dia">${a.dia || ""}</span>
          <span class="id-hora">${a.hora}</span>
        </div>
      </div>
      <h2>${a.titulo}</h2>
      <p>${a.resumo}</p>
      ${htmlConteudoAula(a)}
      <div class="bloco-conteudo">
        <div class="bc-rot">Trilha desta aula</div>
        ${aulaTerminou(a.id)
          ? `<div class="bc-txt">Liberada. Faça enquanto a aula está fresca.</div>
             <a class="btn" href="templatetrilha.html?modo=aluno&aula=${encodeURIComponent(a.titulo)}"
                target="_blank">Fazer a trilha →</a>`
          : `<div class="bc-txt">A trilha é liberada quando a aula terminar.</div>`}
      </div>`;
    box.appendChild(d);
  });
}

// ══════════════════════════════════════════════════════════
//  TRILHAS
// ══════════════════════════════════════════════════════════
let filtroTrilha = "feitas";

function renderTrilhas(){
  const box = document.getElementById("lista-trilhas");

  if (filtroTrilha === "feitas"){
    const itens = (TURMA.historico || [])
      .map(h => ({ h, t: trilhaDoAluno(TURMA, h, EU.id) }))
      .filter(x => x.t);

    box.innerHTML = `<div class="section-title">${itens.length} trilha${itens.length!==1?"s":""} liberada${itens.length!==1?"s":""}</div>`;
    if (!itens.length){
      box.innerHTML += `<div class="vazio-msg">Nenhuma trilha liberada ainda.</div>`;
      return;
    }

    itens.forEach(({h, t}) => {
      const bolas = t.estado.map((x,i) =>
        `<span class="st ${x}" title="${(t.licoes[i]||"")}${t.temas[i] ? " — " + t.temas[i] : ""}">${
          x==="ok"?"✓":x==="err"?"✕":"–"}</span>`).join("");
      const temas = [...new Set(t.temas)].map(tema => {
        const idx = t.temas.map((x,i) => x === tema ? i : -1).filter(i => i >= 0);
        const errou = idx.some(i => t.estado[i] === "err");
        return `<span class="tema-tag ${errou ? "errou" : "acertou"}">${tema}</span>`;
      }).join("");

      const d = document.createElement("div");
      d.className = "card card-aula";
      d.innerHTML = `
        <div class="aula-topo">
          ${t.feita ? '<span class="pill dada">Concluída</span>'
                    : `<span class="pill pendente">${t.pend} lição${t.pend>1?"ões":""} a fazer</span>`}
          <div class="ident">
            <span class="id-niv">${TURMA.nivel}</span>
            <span class="id-dia">${h.dia || ""}</span>
            <span class="id-hora">${h.data}</span>
          </div>
        </div>
        <h2>${h.titulo}</h2>
        <p>${h.resumo}</p>
        <div class="trilha-estado">
          <div class="te-bolas">${bolas}</div>
          <span class="te-num">
            <span class="ok">${t.acertos} certo${t.acertos!==1?"s":""}</span> ·
            <span class="er">${t.erros} erro${t.erros!==1?"s":""}</span>
          </span>
          <span class="nota te-nota ${classeNota(t.nota)}">${t.nota===null?"–":t.nota+"%"}</span>
        </div>
        <div class="tema-lista">${temas}</div>
        <a class="btn" href="templatetrilha.html?modo=gabarito&aula=${encodeURIComponent(h.titulo)}"
           target="_blank">${t.feita ? "Rever a trilha →" : "Continuar a trilha →"}</a>`;
      box.appendChild(d);
    });
    return;
  }

  // ── vão chegar ──
  const futuras = TURMA.futuras || [];
  box.innerHTML = `<div class="section-title">${futuras.length} trilha${futuras.length!==1?"s":""} a caminho</div>`;
  if (!futuras.length){
    box.innerHTML += `<div class="vazio-msg">Nada agendado por enquanto.</div>`;
    return;
  }
  futuras.forEach(f => {
    const d = document.createElement("div");
    d.className = "card card-aula";
    d.innerHTML = `
      <div class="aula-topo">
        <span class="pill bloqueada">Libera depois da aula</span>
        <div class="ident">
          <span class="id-niv">${TURMA.nivel}</span>
          <span class="id-dia">${f.dia}</span>
          <span class="id-hora">${f.data}</span>
        </div>
      </div>
      <h2>${f.titulo}</h2>
      <p>${f.resumo}</p>
      <div class="tema-lista">${(f.temas || []).map(t => `<span class="tema-tag">${t}</span>`).join("")}</div>`;
    box.appendChild(d);
  });
}

// ══════════════════════════════════════════════════════════
//  AULAS
// ══════════════════════════════════════════════════════════
let filtroAula = "passadas";

function renderAulas(){
  const box = document.getElementById("lista-aulas");

  if (filtroAula === "passadas"){
    const itens = TURMA.historico || [];
    box.innerHTML = `<div class="section-title">${itens.length} aula${itens.length!==1?"s":""} realizada${itens.length!==1?"s":""}</div>`;
    if (!itens.length){
      box.innerHTML += `<div class="vazio-msg">Nenhuma aula ainda.</div>`;
      return;
    }
    itens.forEach(h => {
      const pres = (PRESENCA[h.id] || {})[EU.id];
      const eng  = (ENGAJAMENTO[h.id] || {})[EU.id];
      const d = document.createElement("div");
      d.className = "card card-aula";
      d.innerHTML = `
        <div class="aula-topo">
          <span class="pill dada">Aula dada</span>
          <div class="ident">
            <span class="id-niv">${TURMA.nivel}</span>
            <span class="id-dia">${h.dia || ""}</span>
            <span class="id-hora">${h.data}</span>
          </div>
        </div>
        <h2>${h.titulo}</h2>
        <p>${h.resumo}</p>
        <div class="trilha-estado">
          <span>${pres === "p" ? '<span class="tag-p">presente</span>'
                 : pres === "a" ? '<span class="tag-f">faltou</span>'
                 : '<span class="tag-x">—</span>'}</span>
          <span>${estrelas(eng)}</span>
        </div>
        <a class="btn ghost" href="templateaula.html?modo=leitura&aula=${encodeURIComponent(h.titulo)}"
           target="_blank">Rever o material →</a>`;
      box.appendChild(d);
    });
    return;
  }

  const futuras = TURMA.futuras || [];
  box.innerHTML = `<div class="section-title">${futuras.length} aula${futuras.length!==1?"s":""} agendada${futuras.length!==1?"s":""}</div>`;
  if (!futuras.length){
    box.innerHTML += `<div class="vazio-msg">Nada agendado por enquanto.</div>`;
    return;
  }
  futuras.forEach(f => {
    const d = document.createElement("div");
    d.className = "card card-aula";
    d.innerHTML = `
      <div class="aula-topo">
        <span class="pill futura">Agendada</span>
        <div class="ident">
          <span class="id-niv">${TURMA.nivel}</span>
          <span class="id-dia">${f.dia}</span>
          <span class="id-hora">${f.hora} · ${f.data}</span>
        </div>
      </div>
      <h2>${f.titulo}</h2>
      <p>${f.resumo}</p>
      <div class="tema-lista">${(f.temas || []).map(t => `<span class="tema-tag">${t}</span>`).join("")}</div>`;
    box.appendChild(d);
  });
}

// ── Pop-up da turma ──
function abrirModal(kicker, titulo, html){
  document.getElementById("modal-kicker").textContent = kicker;
  document.getElementById("modal-titulo").textContent = titulo;
  document.getElementById("modal-corpo").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function fecharModal(){ document.getElementById("modal").classList.remove("on"); }
document.getElementById("modal-x").onclick = fecharModal;
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") fecharModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });

document.getElementById("btn-turma").onclick = () => {
  const grade = (TURMA.aulasHoje || []).map(a => `${a.dia || ""} ${a.hora}`).join(" · ");
  // Sem lista de colegas: o aluno não vê os outros alunos.
  abrirModal(TURMA.empresa, `${partesIdent(TURMA)} · ${TURMA.nivel}`, `
    <div class="bloco">
      <div class="bt">Horário</div>
      <div class="mini"><b>${grade || "sem aula hoje"}</b><span>${TURMA.modulo}</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Seu nível</div>
      <div class="mini"><span>${TURMA.nivelDesc}</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Onde a turma quer chegar</div>
      <div class="mini destaque"><span>${TURMA.objetivoTurma}</span></div>
    </div>
    <div class="bloco">
      <div class="bt">Professor</div>
      <div class="mini"><b>${professorDe(TURMA).nome}</b><span>${professorDe(TURMA).email}</span></div>
    </div>
  `);
};

// ── Filtros ──
document.querySelectorAll("#sw-trilhas button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#sw-trilhas button").forEach(x => x.classList.toggle("active", x === b));
    filtroTrilha = b.dataset.q;
    renderTrilhas();
  };
});
document.querySelectorAll("#sw-aulas button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#sw-aulas button").forEach(x => x.classList.toggle("active", x === b));
    filtroAula = b.dataset.q;
    renderAulas();
  };
});

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    document.querySelectorAll(".pane").forEach(p =>
      p.classList.toggle("active", p.id === "pane-" + t.dataset.pane));
    window.scrollTo(0, 0);
  };
});

renderHome();
renderHoje();
renderTrilhas();
renderAulas();
</script>
</body>
</html>
