<!DOCTYPE html>
<!--
  DASH DO RH (manager)
  ====================
  Mesma linguagem visual da plataforma do professor e da dash interna, mesmo
  arquivo de dados (dados-mock.js). O que muda é o ALCANCE e, principalmente,
  o que fica de fora:

    · só a EMPRESA do gestor logado — nunca outras empresas;
    · Dados sem as ANOTAÇÕES INTERNAS por aluno. Elas existem no banco e
      aparecem na dash interna, mas o RH do cliente nunca as vê: são
      observações da Bupp sobre pessoas identificadas do time dele;
    · Alertas mostra apenas os AVISOS que a gestão da Bupp escreveu para ele.
      Os alertas pedagógicos automáticos (trilha zerada, engajamento baixo,
      recado pendente) são de uso interno e do professor.

  Selo de papel: "manager" (ver regra de idioma em docs/plataforma.md).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bupp — RH</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* COMB 2 — MARROM #54402F + AZUL-BEBÊ #A8D5F2 + branco.
       Comb 1 (limão + cinza): git checkout comb-1-limao-cinza
       Comb 3 (cinza + azul):  git checkout comb-3-cinza-azul

       Azul-bebê é acento de PREENCHIMENTO: sobre branco tem 1,56:1, nunca
       é texto. Texto sobre azul é sempre o marrom (6,3:1).
       O fundo da página é levemente quente, para acompanhar o marrom. */
    --teal-escuro: #54402F;         /* cor escura: marrom */
    --amarelo-neon: #A8D5F2;        /* acento: azul-bebê */
    --limao-claro: #E4F1FA;         /* azul lavado, para fundos suaves */
    --bg-dash: #F7F5F2;             /* fundo levemente quente */
    --azul-intermediario: #8A7767;  /* apoio: marrom claro */
    --branco: #FFFFFF;
    --texto: #54402F;
    --cinza-texto: #8A7F76;
    --borda: #E7E1DA;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: rgba(60,110,120,0.45); }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-dash);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== Topo ===== */
  /* Faixa do logo em teal — devolve ao logo a aplicação padrão do manual
     (limão sobre teal escuro), sem perder a sidebar branca. */
  /* Faixa de topo: largura total, logo ao centro, aplicação padrão do
     manual — limão sobre teal escuro. */
  /* O PNG foi recortado nas margens brancas, então a borda esquerda da imagem
     é a borda esquerda do "b" — alinha com o nome do professor abaixo. */
  .logo{ display: block; width: 118px; height: auto; flex-shrink: 0; }

  /* Sidebar inteira em marrom: logo, usuário e abas sobre fundo escuro.
     Voltar ao topo marrom com abas claras:
     git checkout v-20260821-1415-ANTES-sidebar-toda-marrom */
  .topo-sidebar{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,.14);
  }

  /* Nome do usuário. REGRA DE IDIOMA (21/08): a plataforma inteira é em
     português — abas, botões, rótulos — para os quatro papéis. As únicas
     exceções são a saudação "Hi, Nome" e o selo de papel, que ficam em inglês
     como aceno ao produto. Todo o resto: português.

     Selos por papel:
       professor      -> teacher
       aluno          -> student
       RH do cliente  -> manager
       equipe Bupp    -> internal                                             */
  .whoami{
    font-size: 11.5px; color: rgba(255,255,255,.7); font-weight: 500;
    line-height: 1.3; text-align: right; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
  }
  .whoami strong{
    color: #fff; display: block; font-weight: 700; font-size: 13px;
    letter-spacing: -0.01em;
  }
  .whoami span{
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--teal-escuro);
    background: var(--amarelo-neon); padding: 2px 7px; border-radius: 999px;
  }
  /* Volta para a visão de aluno — só aparece para quem é aluno_gestor. */
  .whoami span.trocavel{
    border: none; font-family: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .whoami span.trocavel::after{ content: "⇄"; font-size: 11px; }
  .whoami span.trocavel:hover{ background: #fff; }

  /* Link pequeno "N turmas", logo abaixo do selo do usuário */
  .link-turmas{
    background: none; border: none; padding: 2px 0 0; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--azul-intermediario); white-space: nowrap;
  }
  .link-turmas{ color: rgba(255,255,255,.72); }
  .link-turmas b{ font-weight: 800; color: #fff; }
  .link-turmas:hover{ color: #fff; text-decoration: underline; }

  /* item de turma no pop-up */
  .turma-item{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: #fafbf7; border: 1px solid transparent; border-radius: 9px;
    padding: 11px 12px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: background .13s, border-color .13s;
  }
  .turma-item:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .ti-esq{ display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ti-nome{ font-size: 13.5px; font-weight: 700; color: var(--texto); }
  .ti-meta{ font-size: 11.5px; color: var(--cinza-texto); }
  .ti-dir{ display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .ti-grade{ font-size: 11.5px; font-weight: 700; color: var(--azul-intermediario); white-space: nowrap; }

  /* ===== Abas: sobre a sidebar escura ===== */
  .tabs{
    display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex-shrink: 0; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.08); border: 1px solid transparent;
    color: rgba(255,255,255,.78);
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 10px 14px; border-radius: 9px;
    transition: background .14s, color .14s;
  }
  .tab:hover{ background: rgba(255,255,255,.16); color: #fff; }
  .tab.active{
    background: var(--amarelo-neon); border-color: var(--amarelo-neon);
    color: var(--teal-escuro);
    box-shadow: none;
  }

  /* ===== Conteúdo ===== */
  main{ padding: 18px 18px 60px; }
  .pane{ display: none; }
  .pane.active{ display: block; }

  .card{
    background: var(--branco); border: 1px solid var(--borda);
    border-radius: 14px; padding: 18px;
    margin-bottom: 14px; color: var(--texto);
  }
  .card-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--azul-intermediario); margin-bottom: 8px;
  }
  .card h2{ margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card p{ margin: 0; font-size: 13.5px; color: var(--cinza-texto); line-height: 1.5; }

  .btn{
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    width: 100%; margin-top: 14px; border: none; border-radius: 10px;
    background: var(--teal-escuro); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 13px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .btn:hover{ background: var(--azul-intermediario); color: #fff; }
  .btn.lime{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .btn.ghost{
    background: transparent; color: var(--azul-intermediario);
    border: 1.5px solid var(--borda); font-weight: 600;
  }

  .pill{
    display: inline-block; font-size: 10.5px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin-bottom: 10px;
  }
  .pill.hoje{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .pill.dada{ background: #e8efe3; color: #3f6b45; }

  .section-title{
    color: var(--teal-escuro); font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.13em; text-transform: uppercase; margin: 4px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before{
    content: ""; width: 14px; height: 3px; border-radius: 2px;
    background: var(--amarelo-neon); flex-shrink: 0;
  }

  /* ===== Trilha & performance ===== */
  .switch{
    display: flex; gap: 4px; background: var(--limao-claro);
    border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .switch button{
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #5a635f; padding: 9px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .switch button.active{ background: var(--amarelo-neon); color: var(--teal-escuro); }
  .switch button:hover:not(.active){ color: var(--teal-escuro); }

  .grid-wrap{ overflow-x: auto; background: var(--branco); border: 1px solid var(--borda); border-radius: 14px; padding: 4px; }
  table{ border-collapse: collapse; width: 100%; font-size: 12.5px; color: var(--texto); }
  th, td{ padding: 10px 8px; text-align: center; white-space: nowrap; }
  th{
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--azul-intermediario);
    border-bottom: 1.5px solid var(--borda);
  }
  td.aluno-nome, th.aluno-nome{
    text-align: left; position: sticky; left: 0; background: var(--branco);
    font-weight: 600; padding-left: 12px;
  }
  tbody tr{ border-bottom: 1px solid #f2f4f0; cursor: pointer; }
  tbody tr:last-child{ border-bottom: none; }
  tbody tr:hover td{ background: #fafbf7; }
  tbody tr:hover td.aluno-nome{ background: #fafbf7; }

  .st{ display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; }
  .st.ok{ background: #dff0d8; color: #3f6b45; }
  .st.err{ background: #fbe0de; color: #a3312a; }
  .st.pend{ background: #eef0ec; color: #9aa39f; }
  .nota{ font-weight: 800; }
  .nota.alta{ color: #3f6b45; }
  .nota.media{ color: #8a6d1f; }
  .nota.baixa{ color: #a3312a; }

  /* Perfil do aluno */
  .aluno-lista .card{ display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .aluno-lista .card:hover{ outline: 2px solid var(--amarelo-neon); }
  .aluno-lista h3{ margin: 0; font-size: 15.5px; font-weight: 700; }
  .aluno-lista .sub{ font-size: 12px; color: var(--cinza-texto); margin-top: 2px; }
  .barra{ height: 6px; border-radius: 3px; background: #eef0ec; overflow: hidden; margin-top: 9px; }
  .barra i{ display: block; height: 100%; background: var(--azul-intermediario); }

  .voltar{
    background: none; border: none; color: var(--azul-intermediario); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 0 12px;
  }
  .kv{ display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f4f0; font-size: 13.5px; }
  .kv:last-child{ border-bottom: none; }
  .kv span:first-child{ color: var(--cinza-texto); }
  .kv span:last-child{ font-weight: 700; }

  /* ===== Linhas expansíveis do resumo ===== */
  .exp{ border-bottom: 1px solid #f2f4f0; }
  .exp:last-child{ border-bottom: none; }
  .exp-cab{
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 11px 0; text-align: left; transition: color .13s;
  }
  .exp-rot{ font-size: 13.5px; color: var(--cinza-texto); }
  .exp-cab:hover .exp-rot{ color: var(--texto); }
  .exp-val{
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .seta{
    width: 7px; height: 7px; border-right: 2px solid var(--azul-intermediario);
    border-bottom: 2px solid var(--azul-intermediario);
    transform: rotate(45deg) translate(-1px,-1px); transition: transform .18s;
  }
  .exp.aberta .seta{ transform: rotate(-135deg) translate(-2px,-2px); }
  .exp-corpo{ display: none; padding: 2px 0 12px; }
  .exp.aberta .exp-corpo{ display: block; }

  .mini{
    display: flex; flex-direction: column; gap: 1px;
    padding: 8px 10px; background: #fafbf7; border-radius: 8px; margin-bottom: 6px;
  }
  .mini:last-child{ margin-bottom: 0; }
  .mini b{ font-size: 13px; font-weight: 700; color: var(--texto); }
  .mini span{ font-size: 12px; color: var(--cinza-texto); line-height: 1.45; }
  .mini.obj{ flex-direction: row; gap: 8px; align-items: flex-start; }
  .mini.obj b{ color: var(--azul-intermediario); flex-shrink: 0; }

  .mini.linha-acao{ flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .trilha-linha .tl-topo{ display: flex; align-items: center; justify-content: space-between; }
  .trilha-linha .tl-bolas{ display: flex; gap: 4px; margin: 6px 0 3px; flex-wrap: wrap; }
  .trilha-linha .tl-sub{ font-size: 11px; }

  .estrelas{ display: flex; gap: 2px; }
  .estrela{
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 17px; line-height: 1; color: #d8dcd2; transition: color .12s, transform .12s;
  }
  .estrela:hover{ transform: scale(1.15); }
  .estrela.on{ color: var(--amarelo-neon); text-shadow: 0 0 1px var(--azul-intermediario); }

  /* Aula e pontos de atenção num card só: retângulo horizontal no desktop,
     vertical no celular. */
  .par{ margin-bottom: 16px; }
  .card.unico{ padding: 0; overflow: hidden; margin-bottom: 0; }
  .lado-aula{ padding: 18px; }
  .lado-pontos{ padding: 18px; border-top: 1px solid var(--borda); background: #fcfcfa; }

  /* aula do dia / histórico */
  .aula-topo{
    display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
    flex-wrap: wrap; min-width: 0;
  }
  .aula-topo .pill{ white-space: nowrap; margin-bottom: 0; flex-shrink: 0; }
  .aula-topo .ident{ margin-bottom: 0; }

  /* ===== Chip do resumo da turma ===== */

  /* ===== Vocabulário e alertas ===== */
  .vocs{ display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
  .tagv{
    font-size: 12.5px; font-weight: 600; color: var(--teal-escuro);
    background: var(--limao-claro); padding: 5px 10px; border-radius: 7px;
  }

  .aluno-alerta{
    width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-alerta:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .aluno-alerta .an{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--texto);
  }
  .seta-r{
    width: 5px; height: 5px; border-right: 2px solid var(--azul-intermediario);
    border-top: 2px solid var(--azul-intermediario); transform: rotate(45deg);
  }
  .ats{ display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-al{
    font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
  }
  .tag-al.vermelho{ background: #fbe0de; color: #a3312a; }
  .tag-al.ambar{ background: #fbf0d8; color: #8a6d1f; }
  .tag-al.lavanda{ background: #ece9f0; color: var(--azul-intermediario); }

  /* ===== Pop-up ===== */
  .modal{
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(24,16,26,0.5);
  }
  .modal.on{ display: flex; }
  .modal-cx{
    background: var(--branco); border-radius: 16px; width: 100%; max-width: 560px;
    max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(24,16,26,0.3);
  }
  .modal-topo{
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    padding: 20px 20px 14px; border-bottom: 1px solid var(--borda);
  }
  .modal-kicker{
    font-size: 10.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 3px;
  }
  .modal-topo h3{ margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--texto); }
  .modal-x{
    background: none; border: none; cursor: pointer; font-size: 24px; line-height: 1;
    color: var(--cinza-texto); padding: 0 2px; flex-shrink: 0;
  }
  .modal-x:hover{ color: var(--texto); }
  .modal-corpo{ padding: 16px 20px 22px; overflow-y: auto; }
  .modal-corpo .bloco{ margin-bottom: 18px; }
  .modal-corpo .bloco:last-child{ margin-bottom: 0; }
  .modal-corpo .bt{
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--azul-intermediario); margin-bottom: 8px;
  }

  /* linha do tempo do aluno */
  .ev{
    border-left: 3px solid var(--borda); padding: 0 0 14px 13px; position: relative;
  }
  .ev:last-child{ padding-bottom: 0; }
  .ev.pendente{ border-left-color: var(--amarelo-neon); }
  .ev-topo{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .ev-data{ font-size: 11px; font-weight: 800; color: var(--azul-intermediario); letter-spacing: .04em; }
  .ev-de{ font-size: 11px; font-weight: 700; color: var(--cinza-texto); }
  .ev-txt{ font-size: 13.5px; color: var(--texto); line-height: 1.5; }
  .ev.pendente .ev-txt{
    background: var(--limao-claro); padding: 8px 10px; border-radius: 8px; font-weight: 500;
  }
  .selo-pend{
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    background: var(--amarelo-neon); color: var(--teal-escuro);
    padding: 3px 7px; border-radius: 999px;
  }
  /* botão de aluno no resumo da turma */
  .aluno-link{
    width: 100%; display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
    background: #fafbf7; border: 1px solid transparent; border-radius: 8px;
    padding: 10px 11px; margin-bottom: 6px; cursor: pointer; font-family: inherit;
    text-align: left; transition: border-color .13s, background .13s;
  }
  .aluno-link:hover{ background: #fff; border-color: var(--amarelo-neon); }
  .al-nome{
    display: flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--texto);
  }
  .al-cargo{ font-size: 12px; color: var(--cinza-texto); }
  .aluno-link .tag-al{ margin-top: 4px; }

  /* números consolidados da ficha */
  .nums{
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px;
  }
  .num{
    background: #fafbf7; border-radius: 10px; padding: 11px 10px;
    display: flex; flex-direction: column; gap: 1px; text-align: center;
  }
  .nv{ font-size: 20px; font-weight: 800; color: var(--texto); letter-spacing: -0.02em; }
  .nv.alta{ color: #3f6b45; } .nv.media{ color: #8a6d1f; } .nv.baixa{ color: #a3312a; }
  .nr{ font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--azul-intermediario); }
  .nd{ font-size: 10.5px; color: var(--cinza-texto); }
  .pres-rot{ font-size: 12px; color: var(--cinza-texto); }

  .voltar-turma{
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--azul-intermediario);
    padding: 0 0 12px;
  }
  .voltar-turma:hover{ color: var(--teal-escuro); }

  /* Identificação da aula: Empresa · Nível · Dia · Horário · [+] */
  .ident{
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    margin-bottom: 9px; font-size: 12px; min-width: 0;
  }
  .id-emp{
    font-weight: 800; color: var(--teal-escuro); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-turma{
    font-weight: 600; color: var(--cinza-texto); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .id-niv{
    font-size: 10px; font-weight: 800; letter-spacing: .06em; flex-shrink: 0;
    background: var(--limao-claro); color: var(--teal-escuro);
    padding: 2px 7px; border-radius: 999px;
  }
  /* identificação dentro do card de trilha */
  .ident-tr{ margin: 2px 0 1px; font-size: 11.5px; }
  .id-dia, .id-hora{

    background: none; border: none; cursor: pointer; font-family: inherit;
    padding: 8px 6px; border-radius: 8px; text-align: left;
    font-size: 13px; color: var(--cinza-texto); transition: background .12s, color .12s;
  }
  .mc-item:hover{ background: #faf9f7; }
  .mc-check{
    width: 16px; height: 16px; border-radius: 5px; flex-shrink: 0;
    border: 1.5px solid var(--borda); background: var(--branco);
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, border-color .12s;
  }
  .mc-item.on{ color: var(--texto); font-weight: 600; }
  .mc-item.on .mc-check{ background: var(--teal-escuro); border-color: var(--teal-escuro); }
  .mc-item.on .mc-check::after{
    content: ""; width: 4px; height: 8px; margin-top: -2px;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(45deg);
  }
  .mc-val{ flex: 1; min-width: 0; }
  .mc-vazio{ font-size: 12.5px; color: var(--cinza-texto); padding: 6px; }

  .mc-pe{
    display: flex; gap: 6px; padding: 9px 10px;
    border-top: 1px solid var(--borda); background: #fafbf7;
  }
  .mc-limpar, .mc-so, .mc-ok{
    flex: 1; border-radius: 8px; padding: 8px; cursor: pointer;
    font-family: inherit; font-size: 11.5px; font-weight: 700;
  }
  .mc-limpar, .mc-so{
    border: 1px solid var(--borda); background: var(--branco); color: var(--azul-intermediario);
  }
  .mc-limpar:hover, .mc-so:hover{ border-color: var(--teal-escuro); color: var(--teal-escuro); }
  .mc-ok{ border: none; background: var(--teal-escuro); color: #fff; }
  .mc-ok:hover{ background: var(--azul-intermediario); }

  /* filtro de período: calendário em vez de lista de datas */
  .mc-datas{ display: flex; flex-direction: column; gap: 8px; padding: 0 12px 10px; }
  .mc-datas label{
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--azul-intermediario);
  }
  .mc-datas input{
    flex: 1; border: 1px solid var(--borda); border-radius: 8px; padding: 8px 10px;
    font-family: inherit; font-size: 13px; color: var(--texto); outline: none;
    background: var(--branco); letter-spacing: 0; text-transform: none;
  }
  .mc-datas input:focus{ border-color: var(--teal-escuro); }
  .mc-atalhos{ display: flex; gap: 6px; padding: 0 12px 10px; }
  .mc-atalhos button{
    flex: 1; border: 1px solid var(--borda); background: var(--branco); border-radius: 999px;
    padding: 6px; font-family: inherit; font-size: 11px; font-weight: 700;
    color: var(--azul-intermediario); cursor: pointer;
  }
  .mc-atalhos button:hover{ background: var(--limao-claro); border-color: var(--amarelo-neon); color: var(--teal-escuro); }

  /* cabeçalho clicável */
  table.planilha th{ position: sticky; top: 0; z-index: 3; padding: 0; }
  .th-btn{
    width: 100%; display: flex; align-items: center; gap: 6px; justify-content: space-between;
    background: none; border: none; cursor: pointer; font-family: inherit;
    color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; padding: 11px 12px; white-space: nowrap;
    transition: background .12s;
  }
  .th-btn:hover{ background: rgba(255,255,255,.12); }
  .funil{
    width: 9px; height: 9px; flex-shrink: 0; opacity: .45;
    clip-path: polygon(0 0, 100% 0, 62% 45%, 62% 100%, 38% 82%, 38% 45%);
    background: #fff;
  }
  th.filtrado{ background: var(--azul-intermediario) !important; }
  th.filtrado .funil{ opacity: 1; background: var(--amarelo-neon); }

  /* ── Área de upload ── */
  .area-upload{
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1.5px dashed var(--azul-intermediario); border-radius: 11px;
    padding: 20px 16px; cursor: pointer; text-align: center;
    background: #fafbf7; transition: background .13s, border-color .13s;
  }
  .area-upload:hover{ background: var(--limao-claro); border-color: var(--amarelo-neon); }
  .area-upload svg{ width: 24px; height: 24px; color: var(--azul-intermediario); margin-bottom: 3px; }
  .au-tit{ font-size: 13.5px; font-weight: 700; color: var(--teal-escuro); }
  .au-sub{ font-size: 11.5px; color: var(--cinza-texto); }
  .area-upload input[type=file]{
    position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
  .au-escolhido:empty{ display: none; }
  .au-escolhido{ margin-top: 9px; }
  .au-chip{
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--limao-claro); border: 1px solid var(--amarelo-neon);
    border-radius: 999px; padding: 6px 7px 6px 12px;
    font-size: 12.5px; font-weight: 700; color: var(--teal-escuro);
    max-width: 100%; overflow: hidden;
  }
  .au-chip b{ font-weight: 600; color: var(--cinza-texto); font-size: 11px; }
  .au-chip button{
    width: 18px; height: 18px; border-radius: 50%; border: none; padding: 0;
    background: rgba(84,64,47,.15); color: var(--teal-escuro);
    font-size: 13px; line-height: 1; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .au-chip button:hover{ background: var(--teal-escuro); color: #fff; }

  @media (max-width: 760px){
    .resumo-medias .ra-wrap{ display: none; }
    .resumo-medias .md-nav{ display: flex; }
    .resumo-medias .md-viewport{ display: block; }
    .doc-wrap .ra-wrap{ display: none; }
    .doc-cards{ display: block; }
  }

  /* O bloco de docs herda a tipografia das planilhas da dash; sem isto os
     cards do celular saíam com o tamanho de fonte padrão do navegador. */
  .doc-card h3{ font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; color: var(--texto); }
  .doc-card .rt-linha{ font-size: 12.5px; }
  .doc-card .doc-sub{ margin-bottom: 4px; }
  .doc-wrap .ra-sub{ white-space: normal; }
</style>

</head>

<script src="dados-mock.js?v=4"></script>
<script>
// ══════════════════════════════════════════════════════════
//  QUEM ESTÁ LOGADO
//  Numa versão real isto vem da sessão. Aqui, o primeiro usuário com papel de
//  gestor — a empresa dele define TUDO o que esta dash mostra.
// ══════════════════════════════════════════════════════════
const GESTOR = USUARIOS.find(u => u.papel === "gestor") || USUARIOS[0];
const EMPRESA = GESTOR.empresa;
const MINHAS_TURMAS = TURMAS.filter(t => t.empresa === EMPRESA);

document.getElementById("rh-nome").textContent = "Hi, " + GESTOR.nome.split(" ")[0];

// Caminho de volta para quem é RH e também faz aula: o selo "manager"
// leva de volta à tela de aluno. Ver aluno.html para o caminho de ida.
(function seloTrocaVisao(){
  const selo = document.getElementById("selo-papel");
  if (!GESTOR || GESTOR.papel !== "aluno_gestor") return;
  selo.classList.add("trocavel");
  selo.title = "Ver a tela de student";
  selo.onclick = () => { location.href = "aluno.html"; };
})();
document.getElementById("bt-turmas-n").textContent = MINHAS_TURMAS.length;

function partesIdent(t){
  const jaTem = t.nome.toLowerCase().startsWith(t.empresa.toLowerCase());
  const resto = jaTem ? t.nome.slice(t.empresa.length).replace(/^\s*[—\-·]\s*/, "") : t.nome;
  return { empresa: t.empresa, turma: resto, nivel: t.nivel };
}
function classeNota(n){
  return n === null ? "" : n >= 80 ? "alta" : n >= 60 ? "media" : "baixa";
}
function estrelasRO(n){
  if (!n) return '<span class="sem">–</span>';
  return `<span class="estrelas-ro">${"★".repeat(n)}<b>${"☆".repeat(3-n)}</b></span>`;
}

// ══════════════════════════════════════════════════════════
//  LINHAS — uma por aluno por aula dada, SEM a anotação interna
// ══════════════════════════════════════════════════════════
function montarLinhas(){
  const linhas = [];
  MINHAS_TURMAS.forEach(t => {
    const p = partesIdent(t);
    (t.historico || []).forEach(h => {
      t.alunos.forEach(a => {
        const st   = (h.progresso && h.progresso[a.id]) || [];
        const acer = st.filter(x => x === "ok").length;
        const erro = st.filter(x => x === "err").length;
        const nota = st.length ? Math.round(acer / st.length * 100) : null;
        linhas.push({
          data: h.data, dia: h.dia || "", turma: p.turma, nivel: t.nivel,
          aula: h.titulo, aluno: a.nome, cargo: a.cargo,
          presenca: (PRESENCA[h.id] || {})[a.id] || "",
          eng: (ENGAJAMENTO[h.id] || {})[a.id] || 0,
          acertos: acer, erros: erro, nota,
          alunoId: a.id, turmaId: t.id, aulaId: h.id
        });
      });
    });
  });
  const chave = d => { const [dd,mm] = (d||"").split("/"); return (mm||"") + (dd||""); };
  return linhas.sort((x,y) =>
    chave(y.data).localeCompare(chave(x.data)) || x.aluno.localeCompare(y.aluno));
}
const LINHAS = montarLinhas();

// Cada coluna sabe extrair o próprio valor — é o que o filtro do cabeçalho usa.
const COLUNAS = [
  { rot:"Data",     k:"data",     valores: l => [`${l.dia} ${l.data}`.trim()] },
  { rot:"Turma",    k:"turma",    valores: l => [l.turma] },
  { rot:"Nível",    k:"nivel",    valores: l => [nivelL(l.nivel)] },
  { rot:"Aula",     k:"aula",     valores: l => [l.aula] },
  { rot:"Aluno",    k:"aluno",    valores: l => [l.aluno] },
  { rot:"Presença", k:"presenca", valores: l => [l.presenca === "p" ? "Presente"
                                               : l.presenca === "a" ? "Faltou" : "Não marcada"] },
  { rot:"Engaj.",   k:"eng",      valores: l => [l.eng ? `${l.eng} estrela${l.eng>1?"s":""}` : "Não avaliado"] },
  { rot:"Trilha",   k:"nota",     valores: l => [l.nota === null ? "Sem nota"
                                               : l.nota >= 80 ? "80% ou mais"
                                               : l.nota >= 60 ? "60 a 79%" : "Abaixo de 60%"] },
  { rot:"Certos",   k:"acertos",  valores: l => [String(l.acertos)] },
  { rot:"Erros",    k:"erros",    valores: l => [String(l.erros)] }
];
const FILTROS_COL = {};

// As datas do mock são "dd/mm" do ano corrente. Vira "aaaa-mm-dd" para o
// <input type=date> e para comparar.
const ANO_BASE = 2026;
function paraISO(ddmm){
  const [dd, mm] = String(ddmm || "").split("/");
  if (!dd || !mm) return "";
  return `${ANO_BASE}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
}
function isoDaLinha(l){ return paraISO(l.data); }

function passaFiltrosColuna(l){
  return COLUNAS.every(c => {
    const sel = FILTROS_COL[c.k];
    if (!sel) return true;
    if (c.k === "data"){
      const iso = isoDaLinha(l);
      if (sel.de && iso < sel.de) return false;
      if (sel.ate && iso > sel.ate) return false;
      return true;
    }
    if (!sel.size) return true;
    return c.valores(l).some(v => sel.has(v));
  });
}

// Valores possíveis de uma coluna, considerando os OUTROS filtros já aplicados
// (é o comportamento de planilha: a lista encolhe conforme você filtra).
function valoresDaColuna(c){
  const guarda = FILTROS_COL[c.k];
  delete FILTROS_COL[c.k];
  const base = LINHAS.filter(l => passaFiltrosBasicos(l) && passaFiltrosColuna(l));
  if (guarda) FILTROS_COL[c.k] = guarda;
  const set = new Set();
  base.forEach(l => c.valores(l).forEach(v => set.add(v)));
  return [...set].sort((a,b) => a.localeCompare(b, "pt-BR", { numeric:true }));
}

function abrirMenuColuna(c, th){
  fecharMenuColuna();
  const menu = document.createElement("div");
  menu.className = "menu-col";

  // ── Coluna Data: calendário de/até, com atalhos ──
  if (c.k === "data"){
    const f = FILTROS_COL.data || {};
    const todas = LINHAS.map(isoDaLinha).filter(Boolean).sort();
    const min = todas[0] || "", max = todas[todas.length-1] || "";
    menu.innerHTML = `
      <div class="mc-cab">Período</div>
      <div class="mc-datas">
        <label>De<input type="date" id="mc-de" min="${min}" max="${max}" value="${f.de || ""}"></label>
        <label>Até<input type="date" id="mc-ate" min="${min}" max="${max}" value="${f.ate || ""}"></label>
      </div>
      <div class="mc-atalhos">
        <button data-dias="7">7 dias</button>
        <button data-dias="30">30 dias</button>
        <button data-dias="0">Tudo</button>
      </div>
      <div class="mc-pe">
        <button class="mc-limpar" data-limpar>Limpar</button>
        <button class="mc-ok" data-aplicar>Aplicar</button>
      </div>`;
    th.appendChild(menu);

    const de = menu.querySelector("#mc-de"), ate = menu.querySelector("#mc-ate");
    menu.querySelectorAll("[data-dias]").forEach(b => {
      b.onclick = ev => {
        ev.stopPropagation();
        const dias = +b.dataset.dias;
        if (!dias){ de.value = ""; ate.value = ""; return; }
        const fim = new Date(max || Date.now());
        const ini = new Date(fim);
        ini.setDate(ini.getDate() - dias);
        de.value = ini.toISOString().slice(0,10);
        ate.value = fim.toISOString().slice(0,10);
      };
    });
    menu.querySelector("[data-limpar]").onclick = ev => {
      ev.stopPropagation();
      delete FILTROS_COL.data;
      fecharMenuColuna();
      renderTabela();
    };
    menu.querySelector("[data-aplicar]").onclick = ev => {
      ev.stopPropagation();
      if (!de.value && !ate.value) delete FILTROS_COL.data;
      else FILTROS_COL.data = { de: de.value, ate: ate.value };
      fecharMenuColuna();
      renderTabela();
    };
    menu.onclick = e => e.stopPropagation();
    return;
  }

  // ── Demais colunas: lista com marcação imediata ──
  const sel = FILTROS_COL[c.k];
  const vals = valoresDaColuna(c);
  const marcado = v => !sel || !sel.size || sel.has(v);

  menu.innerHTML = `
    <div class="mc-cab">${c.rot}</div>
    ${vals.length > 7 ? `<div class="mc-topo">
      <input class="mc-busca" type="search" placeholder="Buscar…"></div>` : ""}
    <div class="mc-lista">
      ${vals.map(v => `
        <button class="mc-item ${marcado(v) ? "on" : ""}" data-v="${v.replace(/"/g,'&quot;')}">
          <span class="mc-check"></span>
          <span class="mc-val">${v}</span>
        </button>`).join("") || '<div class="mc-vazio">Nada para filtrar</div>'}
    </div>
    <div class="mc-pe">
      <button class="mc-limpar" data-limpar>Mostrar tudo</button>
      <button class="mc-so" data-so>Só os marcados</button>
    </div>`;
  th.appendChild(menu);

  const busca = menu.querySelector(".mc-busca");
  if (busca){
    busca.oninput = () => {
      const q = busca.value.trim().toLowerCase();
      menu.querySelectorAll(".mc-item").forEach(it => {
        it.style.display = it.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    };
    setTimeout(() => busca.focus(), 30);
  }

  // clicar num valor aplica na hora — sem botão de confirmar
  menu.querySelectorAll(".mc-item").forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const atual = FILTROS_COL[c.k] ? new Set(FILTROS_COL[c.k]) : new Set(vals);
      const v = b.dataset.v;
      if (atual.has(v)) atual.delete(v); else atual.add(v);
      if (!atual.size || atual.size === vals.length) delete FILTROS_COL[c.k];
      else FILTROS_COL[c.k] = atual;
      b.classList.toggle("on");
      renderTabela();
      const novoTh = document.querySelector(`.th-btn[data-col="${c.k}"]`);
      if (novoTh) abrirMenuColuna(c, novoTh.parentElement);
    };
  });

  menu.querySelector("[data-limpar]").onclick = ev => {
    ev.stopPropagation();
    delete FILTROS_COL[c.k];
    fecharMenuColuna();
    renderTabela();
  };
  menu.querySelector("[data-so]").onclick = ev => {
    ev.stopPropagation();
    const visiveis = [...menu.querySelectorAll(".mc-item")]
      .filter(i => i.style.display !== "none").map(i => i.dataset.v);
    FILTROS_COL[c.k] = new Set(visiveis);
    fecharMenuColuna();
    renderTabela();
  };
  menu.onclick = e => e.stopPropagation();
}


function fecharMenuColuna(){
  document.querySelectorAll(".menu-col").forEach(m => m.remove());
}
document.addEventListener("click", fecharMenuColuna);
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharMenuColuna(); });

function passaFiltrosBasicos(){ return true; }   // esta dash não tem filtro no topo
function valoresDaColuna(c){
  const guarda = FILTROS_COL[c.k];
  delete FILTROS_COL[c.k];
  const base = LINHAS.filter(l => passaFiltrosColuna(l));
  if (guarda) FILTROS_COL[c.k] = guarda;
  const set = new Set();
  base.forEach(l => c.valores(l).forEach(v => set.add(v)));
  return [...set].sort((a,b) => a.localeCompare(b, "pt-BR", { numeric:true }));
}
function filtradas(){ return LINHAS.filter(passaFiltrosColuna); }

function renderTabela(){
  const tb = document.getElementById("tabela");
  const dados = filtradas();
  tb.innerHTML =
    `<thead><tr>${COLUNAS.map(c => {
      const f = FILTROS_COL[c.k];
      const ativo = f && (c.k === "data" ? (f.de || f.ate) : f.size);
      return `<th class="${ativo ? "filtrado" : ""}">
        <button class="th-btn" data-col="${c.k}">${c.rot}<i class="funil"></i></button>
      </th>`;
    }).join("")}</tr></thead>` +
    `<tbody>${dados.map(l => `
      <tr class="${l.presenca === "a" || (l.nota !== null && l.nota < 60) ? "alerta" : ""}">
        <td>${l.dia} ${l.data}</td>
        <td>${l.turma}</td>
        <td>${nivelL(l.nivel)}</td>
        <td>${l.aula}</td>
        <td class="col-aluno">${l.aluno}</td>
        <td>${l.presenca === "p" ? '<span class="tag-p">presente</span>'
             : l.presenca === "a" ? '<span class="tag-f">faltou</span>'
             : '<span class="tag-x">—</span>'}</td>
        <td>${estrelasRO(l.eng)}</td>
        <td class="col-nota nota ${classeNota(l.nota)}">${l.nota === null ? "–" : l.nota + "%"}</td>
        <td>${l.acertos}</td>
        <td>${l.erros}</td>
      </tr>`).join("")}</tbody>`;

  document.getElementById("titulo-geral").textContent =
    dados.length === LINHAS.length ? `Geral · ${LINHAS.length}`
                                   : `Geral · ${dados.length} de ${LINHAS.length}`;

  document.querySelectorAll(".th-btn").forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const c = COLUNAS.find(x => x.k === b.dataset.col);
      if (b.parentElement.querySelector(".menu-col")){ fecharMenuColuna(); return; }
      abrirMenuColuna(c, b.parentElement);
    };
  });

  renderKPIs(dados);
  renderMedias(dados);
}

function renderKPIs(dados){
  dados = dados || LINHAS;
  const comPres = dados.filter(l => l.presenca);
  const pctPres = comPres.length
    ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;
  const comEng = dados.filter(l => l.eng);
  const medEng = comEng.length ? (comEng.reduce((n,l) => n + l.eng, 0) / comEng.length).toFixed(1) : null;
  const comNota = dados.filter(l => l.nota !== null);
  const medNota = comNota.length ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;
  const alunos = new Set(dados.map(l => l.turmaId + l.alunoId)).size;

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="v">${alunos}</div><div class="r">Alunos</div>
      <div class="d">em ${MINHAS_TURMAS.length} turma${MINHAS_TURMAS.length!==1?"s":""}</div></div>
    <div class="kpi"><div class="v">${pctPres===null?"–":pctPres+"%"}</div><div class="r">Presença</div>
      <div class="d">${comPres.length} registros</div></div>
    <div class="kpi"><div class="v">${medEng===null?"–":medEng+"★"}</div><div class="r">Engajamento</div>
      <div class="d">média das aulas</div></div>
    <div class="kpi"><div class="v">${medNota===null?"–":medNota+"%"}</div><div class="r">Trilhas</div>
      <div class="d">média de acerto</div></div>`;
}

// ── Média por turma ou por aluno ──
const EIXOS = {
  turma: { rot:"Turma", chave: l => l.turmaId,
    titulo: ls => ls[0].turma, sub: ls => {
      const al = new Set(ls.map(l => l.alunoId)).size;
      const au = new Set(ls.map(l => l.aulaId)).size;
      return `${nivelL(ls[0].nivel)} · ${al} aluno${al!==1?"s":""} · ${au} aula${au!==1?"s":""}`;
    } },
  aluno: { rot:"Aluno", chave: l => l.turmaId + "|" + l.alunoId,
    titulo: ls => ls[0].aluno, sub: ls => `${ls[0].cargo} · ${ls[0].turma} · ${nivelL(ls[0].nivel)}` }
};
let eixoAtual = "turma";

function renderMedias(dados){
  dados = dados || filtradas();
  const box = document.getElementById("resumo-medias");
  const e = EIXOS[eixoAtual];
  const mapa = new Map();
  dados.forEach(l => {
    const k = e.chave(l);
    if (!mapa.has(k)) mapa.set(k, []);
    mapa.get(k).push(l);
  });

  const grupos = [...mapa.values()].map(ls => {
    const comPres = ls.filter(l => l.presenca);
    const pctPres = comPres.length
      ? Math.round(comPres.filter(l => l.presenca === "p").length / comPres.length * 100) : null;
    const faltas = ls.filter(l => l.presenca === "a").length;
    const comEng = ls.filter(l => l.eng);
    const medEng = comEng.length ? comEng.reduce((n,l) => n + l.eng, 0) / comEng.length : null;
    const comNota = ls.filter(l => l.nota !== null);
    const medNota = comNota.length ? Math.round(comNota.reduce((n,l) => n + l.nota, 0) / comNota.length) : null;
    return { titulo: e.titulo(ls), sub: e.sub(ls), pctPres, faltas, medEng, medNota,
             acertos: ls.reduce((n,l) => n + l.acertos, 0), erros: ls.reduce((n,l) => n + l.erros, 0) };
  }).sort((a,b) => (a.medNota ?? 999) - (b.medNota ?? 999));

  const cel = x => ({
    pres: `<span class="nota ${classeNota(x.pctPres)}">${x.pctPres===null?"–":x.pctPres+"%"}</span>${
            x.faltas ? `<span class="rt-falta">${x.faltas}</span>` : ""}`,
    eng:  x.medEng === null ? '<span class="sem">–</span>'
          : `<span class="rt-eng ${x.medEng <= 1.5 ? "baixo" : ""}">${x.medEng.toFixed(1)}★</span>`,
    nota: `<span class="nota ${classeNota(x.medNota)}">${x.medNota===null?"–":x.medNota+"%"}</span>`
  });

  box.innerHTML = `
    <div class="rt-titulo">
      Média · ${grupos.length}
      <select class="md-eixo" id="md-eixo">
        ${Object.entries(EIXOS).map(([k,v]) =>
          `<option value="${k}" ${k===eixoAtual?"selected":""}>por ${v.rot.toLowerCase()}</option>`).join("")}
      </select>
      <span class="rt-nav md-nav">
        <button class="rt-seta" data-ir="-1">&lsaquo;</button>
        <span class="rt-pos" id="md-pos"></span>
        <button class="rt-seta" data-ir="1">&rsaquo;</button>
      </span>
    </div>
    <div class="ra-wrap">
      <table class="ra-tabela">
        <thead><tr><th>${e.rot}</th><th class="col-num">Presença</th><th class="col-num">Engaj.</th>
          <th class="col-num">Trilhas</th><th class="col-num">Certos</th><th class="col-num">Erros</th></tr></thead>
        <tbody>${grupos.map(x => { const c = cel(x); return `
          <tr><td><span class="md-titulo">${x.titulo}</span><span class="ra-sub">${x.sub}</span></td>
            <td class="col-num">${c.pres}</td><td class="col-num">${c.eng}</td><td class="col-num">${c.nota}</td>
            <td class="col-num">${x.acertos}</td><td class="col-num">${x.erros}</td></tr>`; }).join("")}</tbody>
      </table>
    </div>
    <div class="rt-viewport md-viewport">
      <div class="rt-trilho" id="md-trilho">
        ${grupos.map(x => { const c = cel(x); return `
          <article class="rt-card">
            <header><span class="md-titulo">${x.titulo}</span><span class="rt-sub">${x.sub}</span></header>
            <div class="rt-linha"><span class="rt-rot">Presença</span><span>${c.pres}</span></div>
            <div class="rt-linha"><span class="rt-rot">Engajamento</span><span>${c.eng}</span></div>
            <div class="rt-linha"><span class="rt-rot">Trilhas</span><span>${c.nota}</span></div>
            <div class="rt-linha"><span class="rt-rot">Certos / erros</span><span><b>${x.acertos}</b> / ${x.erros}</span></div>
          </article>`; }).join("")}
      </div>
    </div>`;

  document.getElementById("md-eixo").onchange = ev => { eixoAtual = ev.target.value; renderMedias(dados); };

  const trilho = box.querySelector("#md-trilho");
  const vp = box.querySelector(".md-viewport");
  let pag = 0;
  const paginas = grupos.length;
  function irPara(n){
    pag = Math.max(0, Math.min(n, paginas - 1));
    trilho.style.transform = `translateX(-${pag * (vp.clientWidth + 12)}px)`;
    box.querySelector("#md-pos").textContent = `${pag + 1}/${paginas}`;
    box.querySelectorAll(".md-nav .rt-seta").forEach(b => {
      const dir = +b.dataset.ir;
      b.disabled = (dir < 0 && pag === 0) || (dir > 0 && pag === paginas - 1);
    });
  }
  box.querySelectorAll(".md-nav .rt-seta").forEach(b => b.onclick = () => irPara(pag + (+b.dataset.ir)));
  window.addEventListener("resize", () => irPara(pag));
  irPara(0);
}

// ══════════════════════════════════════════════════════════
//  AVISOS DA BUPP — o único conteúdo da aba Alertas
// ══════════════════════════════════════════════════════════
const ROT_AVISO = { info:"Informativo", atencao:"Atenção", risco:"Risco" };

function renderAvisos(){
  const box = document.getElementById("lista-avisos");
  const meus = AVISOS_RH.filter(a => a.empresa === EMPRESA);
  const novos = meus.filter(a => !a.lido).length;

  document.getElementById("titulo-avisos").textContent =
    `Avisos da Bupp · ${meus.length}${novos ? ` · ${novos} não lido${novos>1?"s":""}` : ""}`;

  if (!meus.length){
    box.innerHTML = `<div class="card"><p>Nenhum aviso da Bupp por enquanto.</p></div>`;
    return;
  }

  box.innerHTML = meus.map(a => `
    <article class="aviso-card ${a.lido ? "lido" : ""}" data-aviso="${a.id}">
      <div class="aviso-cab">
        <span class="av-tipo ${a.tipo}">${ROT_AVISO[a.tipo] || a.tipo}</span>
        <span class="av-data">${a.data}</span>
        <span class="av-de">${a.autor} · Bupp Idiomas</span>
        ${a.lido ? "" : '<span class="av-novo">novo</span>'}
      </div>
      <h2>${a.assunto}</h2>
      <p>${a.texto}</p>
      ${a.lido ? "" : `<button class="btn-tratar" data-lido="${a.id}">Marcar como lido</button>`}
    </article>`).join("");

  box.querySelectorAll("[data-lido]").forEach(b => {
    b.onclick = () => {
      const a = AVISOS_RH.find(x => x.id === b.dataset.lido);
      if (a){ a.lido = true; renderAvisos(); }
    };
  });
}

// ══════════════════════════════════════════════════════════
//  DOCUMENTOS — contratos, aditivos e notas fiscais
// ══════════════════════════════════════════════════════════
function rotTipoDoc(k){ return (TIPOS_DOC.find(t => t.k === k) || {}).rot || k; }
function classeStatus(s){ return s.replace(/\s+/g, "-"); }

function renderDocs(){
  const box = document.getElementById("doc-wrap");
  const meus = DOCS.filter(d => d.empresa === EMPRESA);

  document.getElementById("titulo-docs").textContent = `Documentos · ${meus.length}`;
  document.getElementById("cont-docs").textContent =
    `${meus.length} documento${meus.length!==1?"s":""}`;

  box.innerHTML = `
    <div class="ra-wrap">
      <table class="ra-tabela">
        <thead><tr>
          <th>Tipo</th><th>Documento</th><th>Número</th><th>Emissão</th>
          <th>Vencimento</th><th>Valor</th><th>Status</th><th>Arquivo</th>
        </tr></thead>
        <tbody>
          ${meus.map(d => `
            <tr>
              <td><span class="doc-tipo ${d.tipo}">${rotTipoDoc(d.tipo)}</span></td>
              <td><b>${d.titulo}</b>${d.obs ? `<span class="ra-sub">${d.obs}</span>` : ""}</td>
              <td>${d.numero || "—"}</td>
              <td>${d.emissao || "—"}</td>
              <td>${d.vencimento || "—"}</td>
              <td class="doc-valor">${d.valor || "—"}</td>
              <td><span class="doc-status ${classeStatus(d.status)}">${d.status}</span></td>
              <td>${d.url
                ? `<a class="u-link" href="${d.url}" target="_blank" rel="noopener">${d.arquivo || "abrir"} ↗</a>`
                : '<span class="sem">sem anexo</span>'}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>

    <div class="doc-cards">
      ${meus.map(d => `
        <article class="doc-card">
          <div class="dc-cab">
            <span class="doc-tipo ${d.tipo}">${rotTipoDoc(d.tipo)}</span>
            <span class="doc-status ${classeStatus(d.status)}">${d.status}</span>
          </div>
          <h3>${d.titulo}</h3>
          <div class="doc-sub">${d.numero || "—"}</div>
          <div class="rt-linha"><span class="rt-rot">Emissão</span><span>${d.emissao || "—"}</span></div>
          <div class="rt-linha"><span class="rt-rot">Vencimento</span><span>${d.vencimento || "—"}</span></div>
          <div class="rt-linha"><span class="rt-rot">Valor</span><span class="doc-valor">${d.valor || "—"}</span></div>
          <div class="rt-linha"><span class="rt-rot">Arquivo</span>
            ${d.url ? `<a class="u-link" href="${d.url}" target="_blank" rel="noopener">${d.arquivo || "abrir"} ↗</a>`
                    : '<span class="sem">sem anexo</span>'}</div>
        </article>`).join("")}
    </div>`;
}

function abrirModal(kicker, titulo, html){
  document.getElementById("modal-kicker").textContent = kicker;
  document.getElementById("modal-titulo").textContent = titulo;
  document.getElementById("modal-corpo").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function fecharModal(){ document.getElementById("modal").classList.remove("on"); }
document.getElementById("modal-x").onclick = fecharModal;
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") fecharModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });

document.getElementById("btn-novo-doc").onclick = () => {
  abrirModal("Documentos", "Novo documento", `
    <div class="form-linha">
      <label for="nd-tipo">Tipo</label>
      <select id="nd-tipo">${TIPOS_DOC.map(t => `<option value="${t.k}">${t.rot}</option>`).join("")}</select>
    </div>
    <div class="form-linha">
      <label for="nd-titulo">Título</label>
      <input id="nd-titulo" placeholder="Ex.: NF-e outubro/2026">
    </div>
    <div class="form-duplo">
      <div class="form-linha"><label for="nd-numero">Número</label><input id="nd-numero" placeholder="NF 1090"></div>
      <div class="form-linha"><label for="nd-valor">Valor</label><input id="nd-valor" placeholder="R$ 14.000,00"></div>
    </div>
    <div class="form-duplo">
      <div class="form-linha"><label for="nd-emissao">Emissão</label><input id="nd-emissao" placeholder="05/10"></div>
      <div class="form-linha"><label for="nd-venc">Vencimento</label><input id="nd-venc" placeholder="15/10"></div>
    </div>
    <div class="form-linha">
      <label for="nd-status">Status</label>
      <select id="nd-status">${STATUS_DOC.map(s => `<option>${s}</option>`).join("")}</select>
    </div>
    <div class="form-linha">
      <label>Arquivo</label>
      <label class="area-upload" for="nd-arquivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5-5 5 5"/><path d="M12 5v12"/></svg>
        <span class="au-tit">Escolher arquivo</span>
        <span class="au-sub">PDF, imagem ou documento</span>
        <input type="file" id="nd-arquivo" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xml">
      </label>
      <div class="au-escolhido" id="nd-arquivo-nome"></div>
    </div>
    <div class="form-linha">
      <label for="nd-obs">Observação</label>
      <textarea id="nd-obs" placeholder="Prazo, condição especial, o que for útil lembrar…"></textarea>
    </div>
    <div class="acoes-modal">
      <button class="btn ghost" id="nd-cancelar">Cancelar</button>
      <button class="btn lime" id="nd-salvar">Adicionar</button>
    </div>
  `);
  // O arquivo escolhido vira uma URL de sessão. ATENÇÃO: sem servidor de
  // arquivos, ele existe só enquanto a aba estiver aberta — ao recarregar, o
  // registro continua e o anexo some. Upload de verdade depende do Supabase
  // Storage (item no NEXT_STEPS).
  let arquivoEscolhido = null;
  const inputArq = document.getElementById("nd-arquivo");
  inputArq.onchange = () => {
    const f = inputArq.files && inputArq.files[0];
    const cx = document.getElementById("nd-arquivo-nome");
    if (!f){ arquivoEscolhido = null; cx.innerHTML = ""; return; }
    arquivoEscolhido = { nome: f.name, tamanho: f.size, url: URL.createObjectURL(f) };
    cx.innerHTML = `<span class="au-chip">${f.name}
      <b>${(f.size/1024).toFixed(0)} KB</b>
      <button type="button" id="nd-tirar" aria-label="Remover">&times;</button></span>`;
    document.getElementById("nd-tirar").onclick = () => {
      arquivoEscolhido = null; inputArq.value = ""; cx.innerHTML = "";
    };
  };

  document.getElementById("nd-cancelar").onclick = fecharModal;
  document.getElementById("nd-salvar").onclick = () => {
    const v = id => (document.getElementById(id).value || "").trim();
    if (!v("nd-titulo")){ document.getElementById("nd-titulo").focus(); return; }
    DOCS.push({
      id: "d" + Date.now(), empresa: EMPRESA,
      tipo: v("nd-tipo"), titulo: v("nd-titulo"), numero: v("nd-numero"),
      emissao: v("nd-emissao"), vencimento: v("nd-venc"), valor: v("nd-valor"),
      status: v("nd-status"), obs: v("nd-obs"),
      url: arquivoEscolhido ? arquivoEscolhido.url : "",
      arquivo: arquivoEscolhido ? arquivoEscolhido.nome : ""
    });
    fecharModal();
    renderDocs();
  };
};

document.getElementById("btn-csv-docs").onclick = () => {
  const esc = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const cols = ["Tipo","Documento","Número","Emissão","Vencimento","Valor","Status","Arquivo","Observação"];
  const linhas = [cols.map(esc).join(";")].concat(
    DOCS.filter(d => d.empresa === EMPRESA).map(d =>
      [rotTipoDoc(d.tipo), d.titulo, d.numero, d.emissao, d.vencimento,
       d.valor, d.status, d.arquivo || "", d.obs].map(esc).join(";")));
  const blob = new Blob(["\uFEFF" + linhas.join("\n")], { type:"text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bupp-documentos.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};

// ── Pop-up de turmas ──
document.getElementById("btn-turmas-rh").onclick = () => {
  const corpo = MINHAS_TURMAS.map(t => {
    const p = partesIdent(t);
    const grade = (t.aulasHoje || []).map(a => `${a.dia || ""} ${a.hora}`).join(" · ");
    return `
      <div class="bloco">
        <div class="bt">${p.turma} · ${nivelL(t.nivel)}</div>
        <div class="mini"><b>${grade || "sem aula hoje"}</b><span>${t.modulo}</span></div>
        <div class="mini destaque"><span>${t.objetivoTurma}</span></div>
        ${t.alunos.map(a => `<div class="mini"><b>${a.nome}</b><span>${a.cargo}</span></div>`).join("")}
      </div>`;
  }).join("");
  abrirModal(EMPRESA, `${MINHAS_TURMAS.length} turma${MINHAS_TURMAS.length!==1?"s":""}`, corpo);
};

// ── Navegação ──
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    document.querySelectorAll(".pane").forEach(p =>
      p.classList.toggle("active", p.id === "pane-" + t.dataset.pane));
    window.scrollTo(0, 0);
  };
});

renderTabela();
renderAvisos();
renderDocs();
</script>
</body>
